", "tema": "Registros", "p": "Posso anexar mais de uma foto? E se ela sair torta ou escura?", "r": "Pode anexar várias fotos da nota ou do recibo, tirando na hora ou escolhendo da galeria. Antes de anexar, o <strong>editor de foto</strong> permite girar, cortar as bordas e ajustar brilho e contraste, para que o contador consiga ler tudo."}, {"lado": "motorista", "tema": "Registros", "p": "Apareceu um aviso de <strong>possível duplicidade</strong> ao salvar. O que faço?", "r": "O aviso surge quando já existe um registro com <strong>mesmo valor, data e categoria</strong> ou com a <strong>mesma foto</strong>. Se for outra despesa de verdade (por exemplo, dois abastecimentos iguais no mesmo dia), pode salvar mesmo assim: o contador será avisado e vai conferir. Se você lançou duas vezes sem querer, cancele e não salve."}, {"lado": "motorista", "tema": "Registros", "p": "Digitei o valor errado. Consigo corrigir?", "r": "Sim, enquanto o registro estiver <strong>Aguardando</strong>: abra o registro e toque em <strong>Editar</strong>. Depois que ele for aprovado ou rejeitado, só o contador pode alterar, então peça a correção pela conversa do próprio registro. Toda edição fica gravada no histórico."}, {"lado": "motorista", "tema": "Status e descontos", "p": "O que significam Aguardando, Aprovado e Rejeitado?", "r": "<strong>Aguardando</strong>: o contador ainda não analisou. <strong>Aprovado</strong>: a despesa foi aceita. <strong>Rejeitado</strong>: não foi aceita e o motivo fica registrado. Você acompanha tudo em <strong>Meus registros</strong> e recebe um aviso a cada mudança."}, {"lado": "motorista", "tema": "Status e descontos", "p": "Meu registro foi rejeitado. Como descubro o motivo?", "r": "O motivo aparece na coluna <strong>Observação</strong> de Meus registros, no detalhe do registro e na notificação que você recebe. Se ficou alguma dúvida, escreva na <strong>conversa do registro</strong> para combinar o próximo passo com o contador."}, {"lado": "motorista", "tema": "Status e descontos", "p": "O que é o card <strong>Valor para desconto</strong>?", "r": "É a soma dos descontos que o contador definiu nos seus registros, sempre com uma justificativa. Esse valor serve para <strong>conferência</strong>: o sistema não aplica nenhum desconto automaticamente em folha."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "Posso tirar uma dúvida sobre um registro sem ele ser rejeitado?", "r": "Pode. Abra o registro e use a seção <strong>Conversa</strong>. O contador recebe um aviso, e a resposta dele chega para você como notificação. Enter envia a mensagem e Shift+Enter quebra a linha."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "Como falo diretamente com o contador?", "r": "Na tela de <strong>Início</strong> há o card <strong>Fale com o contador</strong>, com atalhos de WhatsApp e e-mail quando ele tiver preenchido esses dados no perfil."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "Como mudo meu telefone, minha foto ou ativo o tema escuro?", "r": "Toque no seu <strong>avatar</strong> (iniciais ou foto) no topo da tela para abrir o perfil. Lá você ajusta telefone com DDD, e-mail, foto e escolhe entre tema <strong>Claro</strong> e <strong>Escuro</strong>. Manter o telefone atualizado ajuda o contador a falar com você."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "Como encontro um registro ou uma viagem antiga?", "r": "Use a <strong>busca</strong> no topo. Ela encontra seus registros por categoria, descrição, cidade, local, placa, valor ou data, e também suas viagens por origem, destino ou número."}, {"lado": "contador", "tema": "Viagens", "p": "Qual a diferença entre iniciar e agendar uma viagem?", "r": "Em <strong>Iniciar viagem</strong>, se a data de saída for hoje a viagem começa na hora. Se for uma data futura, ela fica <strong>agendada</strong>: apenas reserva motorista e caminhão naquele período e começa sozinha na data de saída (o botão muda para <strong>Agendar viagem</strong>)."}, {"lado": "contador", "tema": "Viagens", "p": "O motorista ou o caminhão aparece bloqueado com \"em rota\" ou \"reservado\". Por quê?", "r": "Porque já existe uma viagem ativa que ocupa aquele recurso no período escolhido. Uma viagem <strong>em andamento sem previsão de retorno</strong> ocupa o motorista e o caminhão por tempo indeterminado, então preencher a <strong>previsão de retorno</strong> libera as datas futuras para novos agendamentos."}, {"lado": "contador", "tema": "Viagens", "p": "O botão de salvar a viagem está travado. O que fazer?", "r": "A mensagem em vermelho informa que não há motorista ou caminhão disponível no período. Altere as datas ou <strong>encerre ou cancele</strong> uma viagem que esteja ocupando o recurso."}, {"lado": "contador", "tema": "Viagens", "p": "Como antecipo ou cancelo uma viagem agendada?", "r": "Em <strong>Viagens</strong>, abra a viagem agendada. <strong>Iniciar agora</strong> começa a viagem hoje, desde que motorista e caminhão estejam livres. <strong>Cancelar reserva</strong> libera os dois e avisa o motorista."}, {"lado": "contador", "tema": "Viagens", "p": "Como encerro uma viagem e o que o sistema calcula?", "r": "Em <strong>Viagens</strong>, abra a viagem em andamento e use <strong>Encerrar viagem</strong>. O sistema mostra quantos registros e qual total você está fechando e pede a quilometragem final (opcional, e precisa ser maior que a inicial). Com ela ele calcula km rodado, custo por km e consumo médio. Registros rejeitados não entram no custo."}, {"lado": "contador", "tema": "Registros", "p": "Como aprovo, rejeito ou defino desconto em um registro?", "r": "Em <strong>Registros</strong>: <strong>Aprovar</strong> aceita a despesa. <strong>Rejeitar</strong> exige um motivo, que é enviado ao motorista. <strong>Desconto</strong> pede o valor a descontar (não pode passar do valor informado; use 0 para nenhum) e uma justificativa obrigatória."}, {"lado": "contador", "tema": "Registros", "p": "O desconto é aplicado na folha do motorista?", "r": "Não. O desconto fica apenas <strong>registrado para conferência</strong>, com a justificativa, e o motorista é notificado. Nenhum valor é descontado automaticamente em folha."}, {"lado": "contador", "tema": "Registros", "p": "Como aprovo vários registros de uma vez?", "r": "Marque as caixas dos registros <strong>Aguardando</strong> (ou a caixa do cabeçalho para selecionar todos os pendentes da página). A barra mostra quantos estão selecionados e o total em reais. Toque em <strong>Aprovar selecionados</strong>. Se algum tiver possível duplicidade, o sistema avisa antes de confirmar."}, {"lado": "contador", "tema": "Registros", "p": "Como o sistema identifica uma possível duplicidade?", "r": "Ele compara cada registro com os demais (ignorando os rejeitados) e alerta quando há <strong>mesmo valor, data e categoria</strong> ou a <strong>mesma foto</strong>. Você vê o alerta no registro, no card <strong>Possíveis duplicidades</strong> do painel e no filtro da lista. É um aviso para conferir, não uma prova: duas despesas legítimas iguais também disparam o alerta."}, {"lado": "contador", "tema": "Registros", "p": "Posso corrigir um registro lançado pelo motorista?", "r": "Pode, a qualquer momento: abra <strong>Detalhes</strong> e toque em <strong>Editar</strong>. Cada mudança é gravada como \"antes → depois\" no histórico do registro e na Auditoria, e o motorista recebe um aviso."}, {"lado": "contador", "tema": "Registros", "p": "Devo rejeitar ou conversar com o motorista?", "r": "Se faltou algo simples, como uma foto mais legível, use a <strong>Conversa</strong> do registro para pedir o ajuste sem rejeitar. Rejeite quando a despesa não for aceita: o motivo é obrigatório e fica visível para o motorista."}, {"lado": "contador", "tema": "Registros", "p": "Preciso ligar para o motorista. Onde está o contato?", "r": "Nos detalhes do registro, nos detalhes da viagem e na lista <strong>Motoristas</strong> aparecem atalhos de WhatsApp e e-mail. Se mostrar \"Contato não informado\", o motorista ainda não preencheu o perfil."}, {"lado": "contador", "tema": "Análises", "p": "Como funciona o Comparativo de viagens?", "r": "Ele agrupa as viagens <strong>finalizadas</strong> pela mesma origem e destino e compara o custo de cada uma com a média da rota. Você escolhe o limite de alerta (+10%, +20%, +30% ou +50%) e o sistema destaca as viagens acima dele e a categoria que mais pesou. Rotas com apenas uma viagem ainda não entram na comparação, e registros rejeitados não contam."}, {"lado": "contador", "tema": "Análises", "p": "Como gero um relatório para fechar as contas?", "r": "Em <strong>Relatórios</strong>, filtre por motorista, caminhão, viagem, categoria, status e período, escolha se quer agrupar (por motorista, caminhão, viagem, categoria...) e use <strong>Exportar Excel</strong> ou <strong>Exportar PDF</strong>."}, {"lado": "contador", "tema": "Análises", "p": "Como sei quem fez o quê no sistema?", "r": "Na <strong>Auditoria</strong> ficam registradas todas as ações, com data e hora, usuário, perfil e detalhe. Dá para filtrar por usuário e por período."}, {"lado": "motorista", "tema": "Viagens", "p": "Posso estar em duas viagens ao mesmo tempo?", "r": "Não. O sistema não deixa o contador abrir ou agendar uma viagem se você ou o caminhão já estiverem em outra viagem no mesmo período. Uma viagem <strong>em andamento sem retorno previsto</strong> ocupa você e o caminhão até ser encerrada."}, {"lado": "motorista", "tema": "Viagens", "p": "O que significam Agendada, Em andamento, Finalizada e Cancelada?", "r": "<strong>Agendada</strong>: reservada para uma data futura e ainda sem registros. <strong>Em andamento</strong>: é a viagem atual, onde você lança despesas. <strong>Finalizada</strong>: encerrada pelo contador. <strong>Cancelada</strong>: a reserva foi cancelada pelo contador e você é avisado."}, {"lado": "motorista", "tema": "Viagens", "p": "Troquei de caminhão no meio da viagem. Como eu lanço as despesas?", "r": "Os registros usam o caminhão da viagem aberta. Antes de lançar, fale com o contador pelo card <strong>Fale com o contador</strong>: ele pode encerrar a viagem atual e abrir outra com o caminhão correto, para que as despesas fiquem na placa certa."}, {"lado": "motorista", "tema": "Registros", "p": "Qual categoria devo escolher?", "r": "As categorias são: Hospedagem, Alimentação, Combustível, Manutenção mecânica, Pneus, Peças e acessórios, Pedágios, Estacionamento, Lavagem, Serviços de terceiros e Outros. Se nenhuma servir direito, escolha <strong>Outros</strong> e explique bem na descrição."}, {"lado": "motorista", "tema": "Registros", "p": "Posso lançar uma despesa de ontem? E de uma data futura?", "r": "Pode lançar de dias anteriores, basta escolher a data real da despesa. <strong>Datas futuras não são aceitas</strong>, porque a despesa precisa já ter acontecido."}, {"lado": "motorista", "tema": "Registros", "p": "Esqueci de anexar a foto ou quero trocar uma foto. E agora?", "r": "A edição de um registro já salvo altera os dados, mas <strong>não troca as fotos</strong>. Escreva na <strong>Conversa</strong> do registro avisando o contador, ou fale com ele pelo card Fale com o contador. Para os próximos lançamentos, anexe as fotos antes de salvar."}, {"lado": "motorista", "tema": "Registros", "p": "Lancei a mesma despesa duas vezes sem querer. Posso excluir?", "r": "O motorista não exclui registros. Avise o contador pela <strong>Conversa</strong> do registro repetido para que ele o rejeite com o motivo. Assim fica tudo documentado no histórico."}, {"lado": "motorista", "tema": "Status e descontos", "p": "Não concordo com um desconto. O que faço?", "r": "Abra o registro e escreva na <strong>Conversa</strong> explicando o que aconteceu, anexando informações que ajudem. Cada desconto tem uma justificativa registrada pelo contador, e vocês podem acertar a decisão por ali."}, {"lado": "motorista", "tema": "Status e descontos", "p": "Quanto tempo leva para o contador aprovar?", "r": "O sistema não define prazo: depende da análise do contador. Quando ele aprovar, rejeitar, editar ou definir desconto, você recebe um aviso e o registro muda de status em <strong>Meus registros</strong>."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "O que são o \"!\" no menu e o sino no topo?", "r": "São os <strong>avisos</strong>. O \"!\" marca a aba onde há novidade (por exemplo, Meus registros depois de uma edição do contador) e o sino soma tudo que ainda não foi visto. Ao abrir a aba, o \"!\" some."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "Posso usar o sistema no celular?", "r": "Sim. O sistema se adapta à tela do celular: as tabelas viram cartões e o botão <strong>Tirar foto</strong> abre a câmera para fotografar a nota na hora."}, {"lado": "motorista", "tema": "Conversa e conta", "p": "Como saio do sistema?", "r": "Use o botão <strong>Sair</strong> no topo da tela. Em aparelho compartilhado, saia sempre que terminar para que ninguém veja seus registros."}, {"lado": "contador", "tema": "Viagens", "p": "Como vejo quais motoristas e caminhões estão livres?", "r": "Em <strong>Motoristas</strong> e <strong>Caminhões</strong> cada item aparece como <strong>Em rota</strong> (com a viagem) ou <strong>Disponível</strong>, e as reservas futuras aparecem logo abaixo. Ao criar uma viagem, quem estiver ocupado no período aparece bloqueado no seletor."}, {"lado": "contador", "tema": "Viagens", "p": "O motorista trocou de caminhão no meio da viagem. Como ajusto?", "r": "Nesta versão não há edição de viagem. O caminho é <strong>encerrar</strong> a viagem atual e abrir outra com o caminhão correto, informando o km final da primeira e o km inicial da segunda."}, {"lado": "contador", "tema": "Viagens", "p": "A viagem agendada não começou sozinha. Por quê?", "r": "Ela começa quando chega a data de saída, desde que o motorista e o caminhão não estejam em outra viagem em andamento. Se algum deles ainda estiver ocupado, encerre a outra viagem e use <strong>Iniciar agora</strong> nos detalhes da agendada."}, {"lado": "contador", "tema": "Registros", "p": "Como filtro e ordeno a lista de registros?", "r": "Em <strong>Registros</strong> você busca por motorista, placa ou descrição e filtra por status, categoria, período e somente possíveis duplicidades. Clique no título de uma coluna para ordenar. A lista mostra 15 registros por página."}, {"lado": "contador", "tema": "Registros", "p": "Aprovei um registro por engano. Dá para desfazer?", "r": "Nesta versão não existe botão para desfazer uma aprovação. Por isso confira bem antes de aprovar, principalmente quando houver alerta de duplicidade. Para ajustar valores, use <strong>Editar</strong> ou <strong>Desconto</strong>, que ficam registrados no histórico e na Auditoria."}, {"lado": "contador", "tema": "Registros", "p": "Como os registros rejeitados entram nos totais?", "r": "O <strong>Total informado</strong> soma tudo que foi lançado, e o <strong>Rejeitado</strong> aparece separado. Já o custo da viagem, o custo por km, o consumo, o comparativo e o desempenho por caminhão <strong>desconsideram os rejeitados</strong>."}, {"lado": "contador", "tema": "Registros", "p": "O que é o card \"Definido para desconto\" no painel?", "r": "É a soma dos descontos que você definiu nos registros do período filtrado no painel. É um valor de conferência e não é aplicado automaticamente em folha."}, {"lado": "contador", "tema": "Registros", "p": "Como confiro as fotos da nota?", "r": "Nos <strong>Detalhes</strong> do registro há a galeria de fotos. Clique em uma foto para ampliar. Fotos iguais em registros diferentes disparam o alerta de <strong>possível duplicidade</strong>."}, {"lado": "contador", "tema": "Análises", "p": "Como filtro o painel por período?", "r": "No topo do <strong>Painel</strong> há os campos de data inicial e final. Eles atualizam os cards de valores e os gráficos por mês, categoria, motorista e caminhão. Os contadores de viagens mostram sempre a situação atual."}, {"lado": "contador", "tema": "Análises", "p": "O que mostra o \"Desempenho por caminhão\"?", "r": "Está no <strong>Comparativo</strong> e lista, para cada caminhão com viagens finalizadas, a quantidade de viagens, km rodado, custo total, custo por km, litros e consumo médio (km/L). Rejeitados não entram, e km e consumo só aparecem quando foram informados."}, {"lado": "contador", "tema": "Análises", "p": "Como encontro rápido um motorista, uma placa ou um registro?", "r": "Use a <strong>busca</strong> no topo: ela procura motoristas, caminhões, viagens e registros ao mesmo tempo (a partir de 2 letras). Ao clicar no resultado, o sistema leva direto para o item."}, {"lado": "contador", "tema": "Análises", "p": "O PDF ou o Excel do relatório não abre. O que fazer?", "r": "O PDF abre em uma nova janela, então <strong>permita pop-ups</strong> no navegador. O Excel e os gráficos dependem de bibliotecas carregadas pela internet: se a conexão estiver ruim, aparece um aviso. Também é preciso ter ao menos um registro no filtro para exportar."}, {"lado": "contador", "tema": "Conta e avisos", "p": "O que são o \"!\" no menu e o sino no topo?", "r": "São os <strong>avisos</strong>. O \"!\" marca a aba com novidade (por exemplo, Registros quando um motorista lança ou comenta algo) e o sino soma o que ainda não foi visto. Ao abrir a aba, o aviso some."}, {"lado": "contador", "tema": "Conta e avisos", "p": "Como o motorista consegue falar comigo?", "r": "Na tela de Início dele existe o card <strong>Fale com o contador</strong>, com WhatsApp e e-mail. Para aparecer, preencha seu telefone e e-mail no perfil (clique no seu avatar no topo)."}, {"lado": "contador", "tema": "Viagens", "p": "Como informo o adiantamento entregue ao motorista?", "r": "Ao iniciar a viagem, no campo <strong>Adiantamento</strong>, ou depois: em <strong>Viagens</strong>, abra a viagem e clique em <strong>Informar adiantamento</strong>. O motorista não vê esse valor."}, {"lado": "contador", "tema": "Viagens", "p": "Como o saldo da viagem é calculado?", "r": "Saldo = adiantamento − despesas <strong>aprovadas</strong>. Se der positivo, o motorista devolve à empresa; se der negativo, a empresa reembolsa. Registros aguardando análise ficam fora até serem aprovados, e rejeitados não entram. O desconto definido não altera o saldo."}, {"lado": "contador", "tema": "Viagens", "p": "Como gero o fechamento da viagem em PDF?", "r": "Em <strong>Viagens</strong>, abra a viagem e clique em <strong>Fechamento em PDF</strong>. Na janela de impressão, escolha <strong>Salvar como PDF</strong>. O documento traz resumo, saldo do adiantamento, categorias, registros, fotos das notas e linhas de assinatura. Em viagem em andamento, o botão gera uma prévia."}, {"lado": "contador", "tema": "Combustível", "p": "Como confiro o cartão de combustível?", "r": "Abra <strong>Combustível</strong> no menu e envie o relatório do cartão (Excel ou CSV). O sistema sugere as colunas de data, placa, valor, litros e posto; confira e veja o resultado: conferidos, divergentes, declarados sem cartão e cartão sem registro."}, {"lado": "contador", "tema": "Combustível", "p": "Como o sistema decide que dois abastecimentos são o mesmo?", "r": "Mesma placa, data dentro da tolerância e valor dentro da tolerância (padrão: 1 dia e R$ 1,00). Se placa e data batem, mas o valor ou os litros diferem, o abastecimento vira <strong>divergente</strong>. Você pode ajustar as tolerâncias na própria tela."}, {"lado": "contador", "tema": "Combustível", "p": "O que significa Cartão sem registro?", "r": "O cartão mostra um abastecimento que nenhum motorista lançou. Se o caminhão estava em viagem na data, aparece em vermelho com o número da viagem. Sem viagem na data, aparece em cinza como <strong>Cartão sem viagem</strong>, em geral abastecimento de base."}];

  const chat = document.getElementById('dv-chat');
  const rolar = () => { chat.scrollTop = chat.scrollHeight; };
  const bot = html => `<div class="dv-linha bot"><span class="dv-av"><img src="${AVATAR_URL}" alt=""></span><div class="dv-bolha"><span class="dv-quem">Assistente ROFE</span>${html}</div></div>`;
  const usu = html => `<div class="dv-linha usuario"><div class="dv-bolha">${html}</div></div>`;
  const desenharChat = () => {
    chat.innerHTML = bot(`Olá, ${primeiro}! Escolha uma das dúvidas abaixo e eu respondo.`)
      + est.historico.map(h => usu(h.p) + bot(h.r)).join('');
    rolar();
  };
  const desenharOpcoes = () => {
    document.getElementById('dv-temas').innerHTML = temas.map(t =>
      `<button type="button" class="dv-tema ${t === est.tema ? 'ativo' : ''}" data-dv-tema="${esc(t)}">${esc(t)}</button>`).join('');
    document.getElementById('dv-lista').innerHTML = lista.map((d, i) => ({ d, i })).filter(x => x.d.tema === est.tema).map(({ d, i }) =>
      `<button type="button" class="dv-perg ${est.vistas.has(i) ? 'vista' : ''}" data-dv-perg="${i}"><span>${d.p}</span><span class="dv-vista">${icon('check')}</span></button>`).join('');
    c.querySelectorAll('[data-dv-tema]').forEach(b => b.addEventListener('click', () => { est.tema = b.dataset.dvTema; desenharOpcoes(); }));
    c.querySelectorAll('[data-dv-perg]').forEach(b => b.addEventListener('click', () => responder(+b.dataset.dvPerg)));
  };
  let ocupado = false, terminar = null;
  const reduzido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const status = (txt, falando) => {
    const s = document.getElementById('dv-status'); if(s) s.textContent = txt;
    const av = document.getElementById('dv-assist-av'); if(av) av.classList.toggle('falando', !!falando);
  };
  const fonema = ch => {
    ch = ch.toLowerCase();
    if(' .,;:!?-\n'.includes(ch)) return 0.08;
    if('aáàâãä'.includes(ch)) return 1;
    if('oóôõ'.includes(ch)) return 0.75;
    if('uú'.includes(ch)) return 0.55;
    if('eéêèíi'.includes(ch)) return 0.5;
    if('mbp'.includes(ch)) return 0;
    return 0.28;
  };
  // mostra o texto aos poucos enquanto o assistente "fala" (boca acompanha as letras)
  const falar = linha => {
    const bolha = linha.querySelector('.dv-bolha');
    const nos = [];
    const w = document.createTreeWalker(bolha, NodeFilter.SHOW_TEXT);
    let n;
    while((n = w.nextNode())){
      if(n.parentElement && n.parentElement.closest('.dv-quem')) continue;
      nos.push({ n, t: n.nodeValue });
    }
    const texto = nos.map(o => o.t).join('');
    const total = texto.length;
    if(reduzido || !total) return;
    nos.forEach(o => { o.n.nodeValue = ''; });
    const dur = Math.min(4200, Math.max(1400, total * 16));
    const ini = performance.now();
    let feito = 0, ativo = true;
    AvatarRofe.estado('falando'); status('Respondendo…', true);
    const fim = () => {
      if(!ativo) return;
      ativo = false; terminar = null;
      nos.forEach(o => { o.n.nodeValue = o.t; });
      AvatarRofe.estado('ocioso'); status('Pronto para ajudar', false);
      if(document.body.contains(chat)) rolar();
    };
    terminar = fim;
    const passo = agora => {
      if(!ativo) return;
      if(!document.body.contains(chat)){ ativo = false; terminar = null; AvatarRofe.estado('ocioso'); return; }
      const alvoN = Math.min(total, Math.round(total * Math.min(1, (agora - ini) / dur)));
      if(alvoN > feito){
        let pos = 0;
        nos.forEach(o => { o.n.nodeValue = o.t.slice(0, Math.max(0, Math.min(o.t.length, alvoN - pos))); pos += o.t.length; });
        let soma = 0;
        for(let k = feito; k < alvoN; k++) soma += fonema(texto[k]);
        AvatarRofe.abrir(soma / (alvoN - feito));
        feito = alvoN; rolar();
      }
      if(alvoN >= total){ setTimeout(fim, 220); return; }
      requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  };
  const responder = i => {
    if(ocupado) return;
    if(terminar) terminar();
    const d = lista[i];
    ocupado = true;
    c.querySelectorAll('[data-dv-perg]').forEach(b => b.disabled = true);
    chat.insertAdjacentHTML('beforeend', usu(d.p));
    chat.insertAdjacentHTML('beforeend', `<div class="dv-linha bot dv-pensando"><span class="dv-av"><img src="${AVATAR_URL}" alt=""></span><div class="dv-bolha"><span class="dv-digitando"><i></i><i></i><i></i></span></div></div>`);
    rolar();
    AvatarRofe.estado('pensando'); status('Pensando…', false);
    setTimeout(() => {
      ocupado = false;
      est.vistas.add(i);
      const resp = d.r + '<div class="mini" style="margin-top:8px;opacity:.85">Posso ajudar com mais alguma coisa? Escolha outra opção abaixo.</div>';
      est.historico.push({ p: d.p, r: resp });
      if(!document.body.contains(chat)){ AvatarRofe.estado('ocioso'); return; }
      const pens = chat.querySelector('.dv-pensando'); if(pens) pens.remove();
      chat.insertAdjacentHTML('beforeend', bot(resp));
      desenharOpcoes();
      AvatarRofe.estado('ocioso'); status('Pronto para ajudar', false);
      falar(chat.lastElementChild);
      rolar();
    }, reduzido ? 0 : 900);
  };
  document.getElementById('dv-limpar').addEventListener('click', () => {
    if(ocupado) return;
    if(terminar) terminar();
    est.historico = []; est.vistas = new Set(); desenharChat(); desenharOpcoes();
  });
  AvatarRofe.ligar(c);
  desenharChat();
  desenharOpcoes();
  if(!est.historico.length && !est.saudou){ est.saudou = true; falar(chat.firstElementChild); }
}

}

function avisar(usuarioId, aba){

  const k = usuarioId + ':' + aba;
  avisos[k] = (avisos[k] || 0) + 1;

function contarAvisos(usuarioId){
  return Object.keys(avisos)
    .filter(k => k.startsWith(usuarioId + ':'))
    .reduce((soma, k) => soma + (avisos[k] || 0), 0);

function atualizarMenuAvisos(){

function atualizarAvatar(){

  if(!av || !usuarioAtual) return;

/* Reduz a foto de perfil (mantém o documento do Firestore pequeno) */
function reduzirFoto(src, max){
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => falha(new Error('foto inválida'));
    img.src = src;
  });
}

        <button type="submit" class="btn btn-primario btn-pequeno">Salvar</button>
      </div>
    </form></div>`;

  const previa = () => {
    ov.querySelector('[data-previa-foto]').innerHTML = novaFoto ? `<img src="${novaFoto}" alt="Foto de perfil">` : iniciais(u.nome);
  };
  previa();
  let temaEscolhido = u.tema || 'claro';
  const marcarTema = () => ov.querySelectorAll('[data-tema-opcao]').forEach(b => b.classList.toggle('ativo', b.dataset.temaOpcao === temaEscolhido));
  marcarTema();
  ov.querySelectorAll('[data-tema-opcao]').forEach(b => b.addEventListener('click', () => {
    temaEscolhido = b.dataset.temaOpcao;
    aplicarTema(temaEscolhido);

  ov.querySelector('[data-fechar]')?.addEventListener('click', () => { aplicarTema(u.tema || 'claro'); ov.remove(); });
  ov.querySelector('[data-pular]')?.addEventListener('click', () => { aplicarTema(u.tema || 'claro'); ov.remove(); });
  ov.querySelector('[data-cam]').addEventListener('click', () => ov.querySelector('[data-input-cam]').click());
  ov.querySelector('[data-galeria]').addEventListener('click', () => ov.querySelector('[data-input-galeria]').click());
  ov.querySelector('[data-remover-foto]').addEventListener('click', () => { novaFoto = ''; previa(); });

  }));
  ov.querySelector('#form-perfil').addEventListener('submit', async e => {

      </div>

function gerarImagem(img, st, maxLado){
  const girado = st.rot % 180 !== 0;
  const base = document.createElement('canvas');
  base.width = girado ? img.height : img.width;
  base.height = girado ? img.width : img.height;
  const bc = base.getContext('2d');
  bc.translate(base.width / 2, base.height / 2);
  bc.rotate(st.rot * Math.PI / 180);
  bc.drawImage(img, -img.width / 2, -img.height / 2);

  const W = base.width, H = base.height;
  const sx = Math.round(W * st.left / 100), sy = Math.round(H * st.top / 100);
  const sw = Math.max(1, Math.round(W * (100 - st.left - st.right) / 100));
  const sh = Math.max(1, Math.round(H * (100 - st.top - st.bottom) / 100));
  const escala = Math.min(1, maxLado / Math.max(sw, sh));

  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(sw * escala));
  out.height = Math.max(1, Math.round(sh * escala));
  const oc = out.getContext('2d');
  oc.drawImage(base, sx, sy, sw, sh, 0, 0, out.width, out.height);

  if(st.bri !== 100 || st.con !== 100){
    const dados = oc.getImageData(0, 0, out.width, out.height);
    const d = dados.data;
    const b = st.bri / 100, c = st.con / 100;
    for(let i = 0; i < d.length; i += 4){
      for(let k = 0; k < 3; k++){
        let v = d[i+k] * b;
        v = (v - 128) * c + 128;
        d[i+k] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
    }
    oc.putImageData(dados, 0, 0);
  }
  return out;
}

/* ===== v28: datas, reservas, quilometragem, duplicidade, conversa e busca ===== */
const hojeIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const norm = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const fmtNum = (n, c = 1) => (n == null || isNaN(n)) ? '—' : n.toLocaleString('pt-BR', { minimumFractionDigits:c, maximumFractionDigits:c });
const viagemAtiva = v => v.status === 'em andamento' || v.status === 'agendada';
const rotuloViagem = v => ({ 'em andamento':'Em andamento', agendada:'Agendada', cancelada:'Cancelada', finalizada:'Finalizada' })[v.status] || v.status;

/* Período que a viagem ocupa. Em andamento sem retorno previsto ocupa o recurso por tempo indeterminado. */
function periodoViagem(v){
  const ini = v.saida || hojeIso();
  let fim;
  if(v.status === 'em andamento' && (!v.previsaoRetorno || v.previsaoRetorno < hojeIso())) fim = '9999-12-31';
  else fim = v.previsaoRetorno || ini;
  return [ini, fim < ini ? ini : fim];
}
function conflitoViagem(campo, valor, ini, fim, ignorarId){
  return viagens.find(v => v.id !== ignorarId && viagemAtiva(v) && v[campo] === valor && (() => {
    const [a, b] = periodoViagem(v);
    return a <= fim && ini <= b;
  })()) || null;
}
function reservasDe(campo, valor){
  return viagens.filter(v => v.status === 'agendada' && v[campo] === valor).sort((a,b) => a.saida.localeCompare(b.saida));
}
function textoReservas(campo, valor){
  return reservasDe(campo, valor).map(v => {
    const [a, b] = periodoViagem(v);
    return `<div class="mini reserva">${icon('clock')}<span>Reservado ${fmtData(a)}${b !== a ? ' a ' + fmtData(b) : ''} · #${v.id}</span></div>`;
  }).join('');
}
function promoverAgendadas(){
  const hoje = hojeIso();
  viagens.filter(v => v.status === 'agendada' && v.saida <= hoje).forEach(v => {
    if(viagens.some(o => o.id !== v.id && o.status === 'em andamento' && (o.motoristaId === v.motoristaId || o.placa === v.placa))) return;
    v.status = 'em andamento';
    auditar('Viagem #' + v.id + ' iniciada automaticamente', v.origem + ' → ' + v.destino);
    notificar(v.motoristaId, 'Sua viagem #' + v.id + ' (' + v.origem + ' → ' + v.destino + ') foi iniciada.');
  });
}
function tagViagem(v){
  if(v.status === 'em andamento') return tagEmRota('Em andamento');
  if(v.status === 'agendada') return `<span class="tag agendada">${icon('clock')}<span>Agendada</span></span>`;
  if(v.status === 'cancelada') return '<span class="tag rejeitado">Cancelada</span>';
  return '<span class="tag aprovado">Finalizada</span>';
}

/* Quilometragem: km rodado, custo por km e consumo médio */
function metricasViagem(v){
  const regs = despesas.filter(d => d.viagemId === v.id);
  const validos = regs.filter(d => d.status !== 'rejeitado');
  const custo = validos.reduce((s,d) => s + d.valor, 0);
  const litros = validos.reduce((s,d) => s + (d.litros || 0), 0);
  const ki = parseFloat(v.kmInicial), kf = parseFloat(v.kmFinal);
  const km = (!isNaN(ki) && !isNaN(kf) && kf > ki) ? kf - ki : null;
  return { regs, custo, litros, km, custoKm: km ? custo / km : null, consumo: (km && litros > 0) ? km / litros : null };
}

/* Duplicidade: mesmo valor + data + categoria, ou mesma foto */
function hashImg(str){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36) + ':' + str.length;
}
function hashesDe(d){
  const n = (d.imagens || []).length;
  if(!d._h || d._hn !== n){ d._h = (d.imagens || []).map(hashImg); d._hn = n; }
  return d._h;
}
function duplicidadesDe(d){
  const meus = hashesDe(d);
  const out = [];
  despesas.forEach(o => {
    if(o.id === d.id || o.status === 'rejeitado') return;
    const motivos = [];
    if(Math.abs(o.valor - d.valor) < 0.005 && o.data === d.data && o.categoria === d.categoria) motivos.push('mesmo valor, data e categoria');
    if(meus.length && hashesDe(o).some(h => meus.includes(h))) motivos.push('mesma foto');
    if(motivos.length) out.push({ id:o.id, motivos });
  });
  return out;
}
function blocoDuplicidade(d){
  if(usuarioAtual.perfil !== 'admin' || d.status === 'rejeitado') return '';
  const dups = duplicidadesDe(d);
  if(!dups.length) return '';
  return `<div class="alerta-dup">${icon('alert')}<div><strong>Possível duplicidade</strong>
    ${dups.map(x => `<div class="mini">Registro <a href="#" data-abrir-reg="${x.id}">#${x.id}</a> — ${x.motivos.join(' e ')}</div>`).join('')}</div></div>`;
}

/* Aprovação em lote */
function aprovarLote(){
  const regs = [...selecionados].map(id => despesas.find(x => x.id === id)).filter(d => d && d.status === 'aguardando');
  if(!regs.length) return;
  const soma = regs.reduce((s,d) => s + d.valor, 0);
  const comDup = regs.filter(d => duplicidadesDe(d).length);
  let msg = `Aprovar ${regs.length} registro(s) no valor de ${fmtBRL(soma)}?`;
  if(comDup.length) msg += `\n\n⚠ Atenção: ${comDup.length} com possível duplicidade (${comDup.map(d => '#' + d.id).join(', ')}).\nDeseja aprovar mesmo assim?`;
  if(!confirm(msg)) return;
  const porMotorista = {};
  regs.forEach(d => {
    d.status = 'aprovado';
    registrar(d, 'Aprovado (em lote)');
    porMotorista[d.motoristaId] = (porMotorista[d.motoristaId] || 0) + 1;
  });
  auditar('Aprovou ' + regs.length + ' registro(s) em lote', regs.map(d => '#' + d.id).join(', '));
  Object.entries(porMotorista).forEach(([mid, n]) => notificar(mid, n === 1 ? 'Um registro seu foi aprovado.' : n + ' registros seus foram aprovados.'));
  selecionados.clear();
  mostrarMensagem(regs.length + ' despesa(s) aprovada(s) em lote.');
  desenharTabelaAdmin();
}

/* Busca global */
function buscarGlobal(q){
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  const casa = texto => { const n = norm(texto); return tokens.every(k => n.includes(k)); };
  const adm = usuarioAtual.perfil === 'admin';
  const r = { motoristas:[], caminhoes:[], viagens:[], registros:[] };
  if(adm){
    USUARIOS.filter(u => u.perfil === 'motorista').forEach(u => { if(casa([u.nome, u.usuario, u.telefone, u.email].join(' '))) r.motoristas.push(u); });
    CAMINHOES.forEach(x => { if(casa([x.placa, x.modelo, x.marca, x.tipo, x.carroceria, x.base].join(' '))) r.caminhoes.push(x); });
  }
  viagens.filter(v => adm || v.motoristaId === usuarioAtual.id).forEach(v => {
    if(casa(['viagem', '#' + v.id, v.origem, v.destino, v.placa, nomeMotorista(v.motoristaId), rotuloViagem(v)].join(' '))) r.viagens.push(v);
  });
  despesas.filter(d => adm || d.motoristaId === usuarioAtual.id).forEach(d => {
    if(casa(['registro', '#' + d.id, d.categoria, d.descricao, d.cidade, d.local, d.placa, nomeMotorista(d.motoristaId), fmtBRL(d.valor), String(d.valor), fmtData(d.data)].join(' '))) r.registros.push(d);
  });
  return r;
}

  const grupos = [

    ['Caminhões', 'truck', r.caminhoes, x => ({ tipo:'caminhao', id:x.placa, t:x.placa + ' — ' + x.modelo, s:(viagemDoCaminhao(x.placa) ? 'Em rota' : 'Disponível') + ' · ' + x.marca + ' · ' + x.base })],
    ['Viagens', 'route', r.viagens, v => ({ tipo:'viagem', id:v.id, t:'#' + v.id + ' ' + v.origem + ' → ' + v.destino, s:nomeMotorista(v.motoristaId) + ' · ' + v.placa + ' · ' + rotuloViagem(v) })],
    ['Registros', 'receipt', r.registros, d => ({ tipo:'registro', id:d.id, t:'#' + d.id + ' ' + d.categoria + ' — ' + d.descricao, s:fmtBRL(d.valor) + ' · ' + fmtData(d.data) + ' · ' + nomeMotorista(d.motoristaId) + ' · ' + rotulosStatus[d.status] })]
  ].filter(g => g[2].length);
  box.innerHTML = grupos.length ? grupos.map(([nome, ic, lista, fn]) => `
      <div class="busca-grupo">${nome}<span>${lista.length}</span></div>
      ${lista.slice(0, 5).map(fn).map(i => `<button type="button" class="busca-item" role="option" data-tipo="${i.tipo}" data-id="${esc(i.id)}">${icon(ic)}<span class="bi-txt"><strong>${esc(i.t.slice(0, 70))}</strong><span class="mini">${esc(i.s)}</span></span></button>`).join('')}
      ${lista.length > 5 ? `<div class="busca-mais">+${lista.length - 5} resultado(s) — refine a busca</div>` : ''}`).join('')
    : `<div class="busca-vazio">Nada encontrado para “${esc(q)}”.</div>`;
  box.classList.remove('oculto');
}
function irParaResultado(tipo, id){
  fecharBusca();
  const adm = usuarioAtual.perfil === 'admin';
  if(tipo === 'motorista'){
    irPara('motoristas');
    const i = document.getElementById('m-busca');
    if(i){ i.value = nomeMotorista(id); i.dispatchEvent(new Event('input')); }
  } else if(tipo === 'caminhao'){
    irPara('caminhoes');
    const tr = [...document.querySelectorAll('[data-placa]')].find(el => el.dataset.placa === id);
    if(tr){ tr.classList.add('destaque-busca'); tr.scrollIntoView({ behavior:'smooth', block:'center' }); }
  } else if(tipo === 'viagem'){
    irPara(adm ? 'viagens' : 'viagem');
    mostrarViagem(+id);
  } else if(tipo === 'registro'){
    abrirDetalhe(+id);
  }
}
function iniciarBusca(){
  const inp = document.getElementById('busca-input'), box = document.getElementById('busca-res');
  document.getElementById('busca-ico').innerHTML = icon('search');
  inp.addEventListener('input', renderBusca);
  inp.addEventListener('focus', renderBusca);
  box.addEventListener('click', e => {
    const b = e.target.closest('.busca-item');
    if(b){ const tipo = b.dataset.tipo, id = b.dataset.id; inp.value = ''; irParaResultado(tipo, id); }
  });
  inp.addEventListener('keydown', e => {
    const itens = [...box.querySelectorAll('.busca-item')];
    let i = itens.findIndex(x => x.classList.contains('ativo'));
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(!itens.length) return;
      if(i >= 0) itens[i].classList.remove('ativo');
      i = e.key === 'ArrowDown' ? (i + 1) % itens.length : (i <= 0 ? itens.length - 1 : i - 1);
      itens[i].classList.add('ativo');
      itens[i].scrollIntoView({ block:'nearest' });
    } else if(e.key === 'Enter'){
      const alvo = itens[i >= 0 ? i : 0];
      if(alvo){ e.preventDefault(); alvo.click(); }
    } else if(e.key === 'Escape'){
      inp.value = ''; fecharBusca(); inp.blur();
    }
  });
  document.addEventListener('click', e => { if(!e.target.closest('#busca-global')) fecharBusca(); });
  document.addEventListener('keydown', e => {
    if(!usuarioAtual) return;
    const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if((e.key === '/' && !digitando) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){
      e.preventDefault(); inp.focus(); inp.select();
    }
  });
}
iniciarBusca();

function viagemDoMotorista(id){
  return viagens.find(v => v.motoristaId === id && v.status === 'em andamento') || null;
}
function viagemDoCaminhao(placa){
  return viagens.find(v => v.placa === placa && v.status === 'em andamento') || null;
}
function tagEmRota(txt){
  return `<span class="tag em-rota">${icon('truck')}<span>${txt || 'Em rota'}</span></span>`;
}
function nomeMotorista(id){
  return USUARIOS.find(u => u.id === id)?.nome || '';
}
function cartaoViagem(v, atual){
  const mt = metricasViagem(v);
  const regs = mt.regs;
  const total = regs.reduce((s,d) => s + d.valor, 0);
  const rotulo = atual ? '<span class="status-vivo">EM ANDAMENTO</span>' : (v.status === 'agendada' ? 'Agendada' : v.status === 'cancelada' ? 'Cancelada' : 'Finalizada');
  const acao = atual ? '<button class="btn btn-primario btn-pequeno" data-acao="novo-reg">+ Registro</button>'
    : (v.status === 'agendada' || v.status === 'cancelada') ? ''
    : `<button class="btn btn-contorno btn-pequeno" data-acao="ver-viagem" data-id="${v.id}">Ver registros</button>`;
  return `<div class="card ${atual ? 'viagem-ativa' : ''}" style="margin-bottom:14px;${atual ? 'border-left:4px solid var(--verde)' : ''}">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div>
        <div class="mini">Viagem #${v.id} · ${rotulo}</div>
        <div style="font-size:18px;font-weight:800;margin-top:4px">${esc(v.origem)} → ${esc(v.destino)}</div>
        <div class="mini">Caminhão ${esc(v.placa)} · Saída ${fmtData(v.saida)}${v.previsaoRetorno && !v.chegada ? ' · Retorno previsto ' + fmtData(v.previsaoRetorno) : ''}${v.chegada ? ' · Chegada ' + fmtData(v.chegada) : ''}${mt.km ? ' · ' + fmtNum(mt.km, 0) + ' km · ' + fmtBRL(mt.custoKm) + '/km' : ''}</div>
      </div>
      <div style="text-align:right"><div class="mini">Registros</div><div style="font-size:20px;font-weight:800">${regs.length} · ${fmtBRL(total)}</div></div>
    </div>
    ${acao ? `<div class="acoes-rapidas" style="margin:14px 0 0">${acao}</div>` : ''}
  </div>`;
}
function finalizarViagem(v){
  const regs = despesas.filter(d => d.viagemId === v.id);
  const total = regs.reduce((s,d) => s + d.valor, 0);
  if(!confirm(`Encerrar viagem #${v.id}?\n\nRegistros: ${regs.length}\nTotal: ${fmtBRL(total)}`)) return false;
  let kmTxt = prompt('Quilometragem final' + (v.kmInicial ? ' (inicial: ' + v.kmInicial + ')' : '') + ' — opcional:', '');
  while(kmTxt && kmTxt.trim()){
    const n = parseFloat(kmTxt.replace(',', '.')), ki = parseFloat(v.kmInicial);
    if(!isNaN(n) && n >= 0 && (isNaN(ki) || n > ki)){ v.kmFinal = String(n); break; }
    mostrarMensagem('Km final inválido' + (!isNaN(ki) ? ': deve ser maior que o inicial (' + ki + ').' : '.'), true);
    kmTxt = prompt('Informe novamente a quilometragem final (ou deixe vazio para pular):', '');
  }
  v.status = 'finalizada';
  v.chegada = hojeIso();
  auditar('Encerrou viagem #'+v.id, v.origem+' → '+v.destino);
  avisar(v.motoristaId, 'viagem');
  const mf = metricasViagem(v);
  mostrarMensagem('Viagem encerrada.' + (mf.km ? ' ' + fmtNum(mf.km, 0) + ' km rodados · ' + fmtBRL(mf.custoKm) + '/km' : ''));
  return true;
}
function formIniciarViagem(c, motoristaId, voltar){
  const hoje = hojeIso();
  const seletorMotorista = motoristaId ? '' : `<div class="campo"><label for="v-motorista">Motorista</label>
    <select id="v-motorista" required>${USUARIOS.filter(u=>u.perfil==='motorista' && u.ativo).map(u=>`<option value="${u.id}" data-base="${esc(u.nome)}">${esc(u.nome)}</option>`).join('')}</select></div>`;
  c.innerHTML = `
    <div class="cabecalho-pagina"><div><h1>Iniciar ou agendar viagem</h1><p>Saída de hoje inicia a viagem. Uma data futura apenas reserva o motorista e o caminhão naquele período.</p></div></div>
    <form class="painel-bloco" id="form-viagem">
      <div class="grade-form">
        ${seletorMotorista}
        <div class="campo"><label for="v-caminhao">Caminhão</label>
          <select id="v-caminhao" required>${CAMINHOES.map(x=>`<option value="${x.id}" data-base="${esc(x.placa)} — ${esc(x.modelo)}">${esc(x.placa)} — ${esc(x.modelo)}</option>`).join('')}</select></div>
        <div class="campo"><label for="v-origem">Cidade de origem</label><input id="v-origem" required></div>
        <div class="campo"><label for="v-destino">Destino</label><input id="v-destino" required></div>
        <div class="campo"><label for="v-saida">Data de saída</label><input id="v-saida" type="date" required value="${hoje}"></div>
        <div class="campo"><label for="v-retorno">Previsão de retorno (opcional)</label><input id="v-retorno" type="date"></div>
        <div class="campo"><label for="v-km">Quilometragem inicial (opcional)</label><input id="v-km" type="number" min="0"></div>
        ${motoristaId ? '' : '<div class="campo"><label for="v-adiant">Adiantamento entregue ao motorista (R$, opcional)</label><input id="v-adiant" type="number" step="0.01" min="0"></div>'}
        <div class="campo inteiro"><label for="v-obs">Observações</label><textarea id="v-obs"></textarea></div>
      </div>
      <div class="erro oculto" id="aviso-disp"></div>
      <button class="btn btn-primario btn-bloco" type="submit" id="v-salvar">SALVAR E INICIAR</button>
    </form>`;
  const selMot = document.getElementById('v-motorista'), selCam = document.getElementById('v-caminhao');
  const inSaida = document.getElementById('v-saida'), inRet = document.getElementById('v-retorno');
  const btn = document.getElementById('v-salvar'), aviso = document.getElementById('aviso-disp');
  const periodoForm = () => {
    const ini = inSaida.value || hoje;
    const fim = inRet.value && inRet.value >= ini ? inRet.value : (ini <= hoje ? '9999-12-31' : ini);
    return [ini, fim];
  };
  const rotuloConflito = v => {
    if(v.status === 'em andamento') return 'em rota (indisponível)';
    const [a, b] = periodoViagem(v);
    return 'reservado ' + fmtData(a) + (b !== a ? ' a ' + fmtData(b) : '');
  };
  const atualizar = () => {
    const [ini, fim] = periodoForm();
    inRet.min = ini;
    const semOpcao = [];
    [[selMot, 'motoristaId', 'motorista'], [selCam, 'placa', 'caminhão']].forEach(([sel, campo, nome]) => {
      if(!sel) return;
      let livres = 0;
      [...sel.options].forEach(o => {
        const valor = campo === 'placa' ? CAMINHOES.find(x => x.id === o.value).placa : o.value;
        const cf = conflitoViagem(campo, valor, ini, fim);
        o.disabled = !!cf;
        o.textContent = o.dataset.base + (cf ? ' — ' + rotuloConflito(cf) : '');
        if(!cf) livres++;
      });
      if(sel.selectedIndex < 0 || sel.selectedOptions[0].disabled){
        const o = [...sel.options].find(x => !x.disabled);
        if(o) sel.value = o.value; else sel.selectedIndex = -1;
      }
      if(!livres) semOpcao.push(nome);
    });
    const bloqueado = semOpcao.length > 0;
    aviso.classList.toggle('oculto', !bloqueado);
    aviso.textContent = bloqueado ? 'Nenhum ' + semOpcao.join(' nem ') + ' disponível neste período. Altere as datas ou encerre/cancele uma viagem.' : '';
    btn.disabled = bloqueado;
    btn.style.opacity = bloqueado ? '.55' : '';
    btn.style.cursor = bloqueado ? 'not-allowed' : '';
    btn.textContent = ini > hoje ? 'AGENDAR VIAGEM' : 'SALVAR E INICIAR';
  };
  inSaida.addEventListener('input', atualizar);
  inRet.addEventListener('input', atualizar);
  atualizar();
  document.getElementById('form-viagem').addEventListener('submit', e => {
    e.preventDefault();
    const mid = motoristaId || (selMot && selMot.value);
    const caminhao = CAMINHOES.find(x => x.id === selCam.value);
    if(!mid || !caminhao){ mostrarMensagem('Selecione um motorista e um caminhão disponíveis.', true); return; }
    if(inRet.value && inRet.value < inSaida.value){ mostrarMensagem('A previsão de retorno não pode ser anterior à saída.', true); return; }
    const [ini, fim] = periodoForm();
    const cm = conflitoViagem('motoristaId', mid, ini, fim);
    if(cm){ mostrarMensagem('Este motorista já está ' + rotuloConflito(cm) + '.', true); return; }
    const cc = conflitoViagem('placa', caminhao.placa, ini, fim);
    if(cc){ mostrarMensagem('Este caminhão já está ' + rotuloConflito(cc) + '.', true); return; }
    const agendada = ini > hoje;
    const nova = {
      id: viagens.length + 1, motoristaId: mid, caminhaoId: caminhao.id, placa: caminhao.placa,
      origem: document.getElementById('v-origem').value.trim(),
      destino: document.getElementById('v-destino').value.trim(),
      saida: ini, previsaoRetorno: inRet.value || '',
      kmInicial: document.getElementById('v-km').value || '',
      adiantamento: Math.max(0, parseFloat((document.getElementById('v-adiant') || {}).value) || 0),
      obs: document.getElementById('v-obs').value.trim(),
      status: agendada ? 'agendada' : 'em andamento'
    };
    viagens.push(nova);
    auditar((agendada ? 'Agendou viagem #' : 'Iniciou viagem #') + nova.id, nova.origem + ' → ' + nova.destino);
    if(agendada) notificar(mid, 'Viagem agendada para ' + fmtData(ini) + ': ' + nova.origem + ' → ' + nova.destino + ' (caminhão ' + nova.placa + ').');
    else avisar(mid, 'viagem');
    mostrarMensagem(agendada ? 'Viagem agendada. Motorista e caminhão ficam reservados no período.' : 'Viagem iniciada com sucesso.');
    irPara(voltar);
  });
}

/* ================= MENSAGENS ================= */
function mostrarMensagem(texto, erro=false){
  let cont = document.getElementById('toasts');
  if(!cont){
    cont = document.createElement('div');
    cont.id = 'toasts';
    document.body.appendChild(cont);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (erro ? ' toast-erro' : '');
  el.textContent = texto;
  cont.appendChild(el);
  setTimeout(() => { el.classList.add('saindo'); setTimeout(() => el.remove(), 350); }, 3000);
}

/* ==========================================================
   v32 — somente Contador: adiantamento da viagem, fechamento
   da viagem em PDF e conferência com o cartão de combustível
   ========================================================== */
const ehAdmin = () => !!usuarioAtual && usuarioAtual.perfil === 'admin';

/* ----- Adiantamento e saldo ----- */
function saldoViagem(v){
  const regs = despesas.filter(d => d.viagemId === v.id);
  const soma = st => regs.filter(d => d.status === st).reduce((s, d) => s + d.valor, 0);
  const adiant = parseFloat(v.adiantamento) || 0;
  const aprovado = soma('aprovado');
  return {
    regs, adiant, aprovado,
    aguardando: soma('aguardando'), rejeitado: soma('rejeitado'),
    nAguard: regs.filter(d => d.status === 'aguardando').length,
    saldo: Math.round((adiant - aprovado) * 100) / 100
  };
}
function rotuloSaldo(s){
  return s > 0 ? 'Saldo a devolver' : s < 0 ? 'Saldo a reembolsar' : 'Saldo zerado';
}
function abrirAdiantamento(v){
  if(!ehAdmin()) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-topo"><h2 style="margin:0;font-size:20px">Adiantamento — viagem #${v.id}</h2>
      <button class="btn btn-pequeno btn-contorno" type="button" data-fechar>Fechar</button></div>
    <form id="form-adiant" style="margin-top:16px">
      <div class="campo"><label for="ad-valor">Valor entregue ao motorista (R$)</label>
        <input id="ad-valor" type="number" step="0.01" min="0" value="${v.adiantamento || ''}" required></div>
      <p class="mini" style="margin:0 0 16px">Saldo da viagem = adiantamento − despesas aprovadas. Informe 0 para remover o adiantamento. O motorista não vê este valor.</p>
      <button class="btn btn-primario btn-bloco" type="submit">SALVAR ADIANTAMENTO</button>
    </form></div>`;
  ov.addEventListener('click', e => { if(e.target === ov || e.target.hasAttribute('data-fechar')) ov.remove(); });
  document.body.appendChild(ov);
  const campo = ov.querySelector('#ad-valor');
  campo.focus();
  ov.querySelector('#form-adiant').addEventListener('submit', e => {
    e.preventDefault();
    const n = parseFloat(campo.value);
    if(isNaN(n) || n < 0){ mostrarMensagem('Informe um valor igual ou maior que zero.', true); return; }
    const antes = parseFloat(v.adiantamento) || 0;
    v.adiantamento = Math.round(n * 100) / 100;
    auditar('Definiu adiantamento da viagem #' + v.id, fmtBRL(antes) + ' → ' + fmtBRL(v.adiantamento));
    ov.remove();
    mostrarMensagem(v.adiantamento ? 'Adiantamento salvo.' : 'Adiantamento removido.');
    if(document.getElementById('detalhe-viagem')) mostrarViagem(v.id);
  });
}

/* ----- Fechamento da viagem em PDF ----- */
function fechamentoViagemPDF(v){
  if(!ehAdmin()) return;
  const sv = saldoViagem(v), mt = metricasViagem(v);
  const m = USUARIOS.find(u => u.id === v.motoristaId);
  const previa = v.status !== 'finalizada';
  if(!previa && sv.nAguard && !confirm('Esta viagem ainda tem ' + sv.nAguard + ' registro(s) aguardando análise (' + fmtBRL(sv.aguardando) + ').\n\nO saldo considera só os registros aprovados. Gerar o fechamento mesmo assim?')) return;
  const w = window.open('', '_blank');
  if(!w){ mostrarMensagem('Permita pop-ups para gerar o PDF.', true); return; }
  const logo = document.querySelector('.logo-img-topo')?.src || '';
  const regs = sv.regs.slice().sort((a, b) => String(a.data).localeCompare(String(b.data)) || a.id - b.id);
  const informado = regs.reduce((s, d) => s + d.valor, 0);
  const desconto = regs.reduce((s, d) => s + (d.desconto || 0), 0);

  const cats = {};
  regs.forEach(d => {
    const c = cats[d.categoria] = cats[d.categoria] || { qtd:0, informado:0, aprovado:0, aguardando:0, rejeitado:0 };
    c.qtd++; c.informado += d.valor;
    if(d.status === 'aprovado') c.aprovado += d.valor;
    else if(d.status === 'rejeitado') c.rejeitado += d.valor;
    else c.aguardando += d.valor;
  });
  const linhasCat = Object.keys(cats).sort((a, b) => cats[b].informado - cats[a].informado).map(k => {
    const c = cats[k];
    return `<tr><td>${esc(k)}</td><td class="r">${c.qtd}</td><td class="r">${fmtBRL(c.informado)}</td><td class="r">${fmtBRL(c.aprovado)}</td><td class="r">${fmtBRL(c.aguardando)}</td><td class="r">${fmtBRL(c.rejeitado)}</td></tr>`;
  }).join('');
  const linhasReg = regs.map(d => `<tr><td>${d.id}</td><td>${fmtData(d.data)}</td><td>${esc(d.categoria)}</td>
    <td>${esc(d.descricao)}<div class="mini">${esc([d.local, d.cidade].filter(Boolean).join(' · '))}${d.litros ? ' · ' + fmtNum(d.litros, 2) + ' L' : ''}${d.motivo ? ' · Motivo: ' + esc(d.motivo) : ''}</div></td>
    <td class="r">${fmtBRL(d.valor)}</td><td>${rotulosStatus[d.status]}</td><td class="r">${d.desconto ? fmtBRL(d.desconto) : '—'}</td></tr>`).join('');

  const comFoto = regs.filter(d => (d.imagens || []).length);
  const semFoto = regs.filter(d => !(d.imagens || []).length);
  const blocoFotos = comFoto.map(d => `<div class="foto-reg">
      <div class="foto-cab"><strong>Registro #${d.id}</strong> · ${fmtData(d.data)} · ${esc(d.categoria)} · ${fmtBRL(d.valor)} · ${rotulosStatus[d.status]}</div>
      <div class="fotos">${d.imagens.map((src, i) => `<img src="${src}" alt="Foto ${i + 1} do registro ${d.id}">`).join('')}</div>
    </div>`).join('');

  const blocoSaldo = sv.adiant
    ? `<div class="saldo ${sv.saldo < 0 ? 'neg' : ''}">
        <div><span>Adiantamento entregue</span><b>${fmtBRL(sv.adiant)}</b></div>
        <div><span>(−) Despesas aprovadas</span><b>${fmtBRL(sv.aprovado)}</b></div>
        <div class="res"><span>${rotuloSaldo(sv.saldo)}${sv.saldo > 0 ? ' pelo motorista' : sv.saldo < 0 ? ' ao motorista' : ''}</span><b>${fmtBRL(Math.abs(sv.saldo))}</b></div>
      </div>
      ${sv.nAguard ? `<p class="mini">Não incluído no saldo: ${sv.nAguard} registro(s) aguardando análise (${fmtBRL(sv.aguardando)}).</p>` : ''}`
    : '<p class="mini">Adiantamento não informado para esta viagem.</p>';

  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
  <title>Fechamento_Viagem_${v.id}_${esc(v.placa)}</title>
  <style>
    @page{size:A4;margin:14mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{font-family:Arial,Helvetica,sans-serif;color:#0B2A4A;margin:0;font-size:12px}
    .topo{background:#0B2A4A;color:#fff;padding:16px 20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
    .topo img{height:44px}
    .topo .t{text-align:right;font-size:11px;opacity:.9}
    h1{font-size:19px;margin:18px 0 2px}
    h2{font-size:14px;margin:22px 0 8px;color:#1565C0;break-after:avoid}

/* ----- Conferência com o cartão de combustível ----- */
let cartao = null;

const placaNorm = s => {
  const t = String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(t.length === 7) return t;
  const m = t.match(/[A-Z]{3}[0-9][A-Z0-9][0-9]{2}/);
  return m ? m[0] : t;
};
function numBR(v){
  if(typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d,.\-]/g, '');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  return parseFloat(s);
}
function dataIso(v){
  const f = (a, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31) ? a + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') : '';
  if(v instanceof Date && !isNaN(v)){ const d = new Date(v.getTime() + 60000); return f(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  if(typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400000)); return f(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m) return f(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return f(+m[1], +m[2], +m[3]);
  return '';
}
function decodificarTexto(buf){
  const u8 = new Uint8Array(buf);
  try{ return new TextDecoder('utf-8', { fatal:true }).decode(u8).replace(/^\uFEFF/, ''); }
  catch(e){ return new TextDecoder('windows-1252').decode(u8); }
}
function csvParaMatriz(txt){
  const amostra = txt.split(/\r?\n/).filter(l => l.trim()).slice(0, 10);
  const sep = [';', '\t', ',', '|'].map(s => [s, amostra.reduce((n, l) => n + l.split(s).length - 1, 0)]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = []; let linha = [], cel = '', asp = false;
  const fechar = () => { linha.push(cel); cel = ''; if(linha.some(x => String(x).trim() !== '')) linhas.push(linha); linha = []; };
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(asp){ if(ch === '"'){ if(txt[i + 1] === '"'){ cel += '"'; i++; } else asp = false; } else cel += ch; }
    else if(ch === '"') asp = true;
    else if(ch === sep){ linha.push(cel); cel = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && txt[i + 1] === '\n') i++; fechar(); }
    else cel += ch;
  }
  if(cel !== '' || linha.length) fechar();
  return linhas;
}
function lerRelatorioCartao(arquivo){
  return new Promise((ok, falha) => {
    const r = new FileReader();
    r.onerror = () => falha(new Error('Não foi possível ler o arquivo.'));
    if(/\.(xlsx|xls|xlsm|ods)$/i.test(arquivo.name)){
      if(typeof XLSX === 'undefined'){ falha(new Error('Biblioteca de Excel indisponível. Verifique a conexão ou envie o relatório em CSV.')); return; }
      r.onload = () => {
        try{
          const wb = XLSX.read(new Uint8Array(r.result), { type:'array', cellDates:true });
          ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' }));
        }catch(e){ falha(new Error('Arquivo de Excel inválido.')); }
      };
    } else {
      r.onload = () => { try{ ok(csvParaMatriz(decodificarTexto(r.result))); }catch(e){ falha(new Error('Arquivo CSV inválido.')); } };
    }
    r.readAsArrayBuffer(arquivo);
  });
}
const CC_CAMPOS = [
  ['data', 'Data do abastecimento', true, [/data.*(abast|transa|compra)/, /^data/, /data/]],
  ['placa', 'Placa', true, [/placa/, /ve[ií]culo/]],
  ['valor', 'Valor (R$)', true, [/valor.*total/, /valor.*(transa|abast)/, /^valor/, /valor/, /^total/, /vlr/]],
  ['litros', 'Litros', false, [/litro/, /volume/, /quantidade/, /^qtd/]],
  ['local', 'Posto / estabelecimento', false, [/estabelec/, /posto/, /raz[aã]o/, /fantasia/, /local/]]
];
function acharCabecalho(m){
  const chave = /data|placa|valor|litro|posto|estabelec|veiculo|total/;
  for(let i = 0; i < Math.min(m.length, 25); i++){
    const n = m[i].filter(c => chave.test(norm(c))).length;
    if(n >= 2) return i;
  }
  return 0;
}
function sugerirColunas(cab){
  const nc = cab.map(norm), map = {};
  CC_CAMPOS.forEach(([k, , , padroes]) => {
    map[k] = -1;
    for(const p of padroes){ const i = nc.findIndex(c => p.test(c)); if(i >= 0){ map[k] = i; break; } }
  });
  return map;
}
function normalizarCartao(st){
  const out = []; let ignoradas = 0;
  for(let i = st.linhaCab + 1; i < st.matriz.length; i++){
    const r = st.matriz[i];
    if(!r.some(x => String(x ?? '').trim() !== '')) continue;
    const data = st.map.data >= 0 ? dataIso(r[st.map.data]) : '';
    const placa = st.map.placa >= 0 ? placaNorm(r[st.map.placa]) : '';
    const valor = st.map.valor >= 0 ? numBR(r[st.map.valor]) : NaN;
    if(!data || !placa || !(valor > 0)){ ignoradas++; continue; }
    out.push({
      linha: i + 1, data, placa, valor,
      litros: st.map.litros >= 0 ? (numBR(r[st.map.litros]) || 0) : 0,
      local: st.map.local >= 0 ? String(r[st.map.local] ?? '').trim() : ''
    });
  }
  return { linhas: out, ignoradas };
}
const diasEntre = (a, b) => Math.round((Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 864e5);
function viagemNaData(placa, iso){
  return viagens.find(v => (v.status === 'em andamento' || v.status === 'finalizada') && placaNorm(v.placa) === placa
    && v.saida <= iso && iso <= (v.chegada || (v.status === 'em andamento' ? '9999-12-31' : v.previsaoRetorno) || v.saida)) || null;
}
function conciliarCartao(cartaoLinhas, cfg, listaDecl){
  const cart = cartaoLinhas.filter(c => c.data >= cfg.de && c.data <= cfg.ate);
  const somaDias = (iso, n) => new Date(Date.parse(iso + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const jIni = somaDias(cfg.de, -cfg.difDias), jFim = somaDias(cfg.ate, cfg.difDias);
  const declJanela = (listaDecl || despesas).filter(d => d.categoria === 'Combustível' && d.data >= jIni && d.data <= jFim
    && (cfg.incluirRej || d.status !== 'rejeitado'));
  const decl = declJanela;
  const porPlaca = {};
  decl.forEach((d, j) => (porPlaca[placaNorm(d.placa)] = porPlaca[placaNorm(d.placa)] || []).push(j));
  const pares = [];
  cart.forEach((c, i) => (porPlaca[c.placa] || []).forEach(j => {
    const d = decl[j], dd = Math.abs(diasEntre(c.data, d.data));
    if(dd > cfg.difDias) return;
    const dv = Math.abs(c.valor - d.valor);
    pares.push({ i, j, dd, dv, exato: dv <= cfg.tolValor + 1e-9 });
  }));
  pares.sort((a, b) => (b.exato - a.exato) || (a.dd - b.dd) || (a.dv - b.dv));
  const usadoC = new Set(), usadoD = new Set(), res = [];
  pares.forEach(p => {
    if(usadoC.has(p.i) || usadoD.has(p.j)) return;
    usadoC.add(p.i); usadoD.add(p.j);
    const c = cart[p.i], d = decl[p.j], motivos = [];
    if(!p.exato) motivos.push('Valor diferente');
    if(c.litros > 0 && d.litros > 0 && Math.abs(c.litros - d.litros) > Math.max(1, 0.05 * c.litros)) motivos.push('Litros diferentes');
    res.push({ tipo: motivos.length ? 'div' : 'ok', c, d, motivos, dd: p.dd, data: c.data, placa: c.placa });
  });
  cart.forEach((c, i) => {
    if(usadoC.has(i)) return;
    const v = viagemNaData(c.placa, c.data);
    res.push({ tipo: v ? 'falta_reg' : 'falta_reg_base', c, d: null, v, noCad: !CAMINHOES.some(x => placaNorm(x.placa) === c.placa), data: c.data, placa: c.placa });
  });
  decl.forEach((d, j) => {
    if(usadoD.has(j) || d.data < cfg.de || d.data > cfg.ate) return;
    res.push({ tipo: 'falta_cartao', c: null, d, data: d.data, placa: placaNorm(d.placa) });
  });
  res.sort((a, b) => a.data.localeCompare(b.data) || a.placa.localeCompare(b.placa));
  return { res, cart, decl: decl.filter(d => d.data >= cfg.de && d.data <= cfg.ate) };
}
const CC_ROTULO = {
  ok:'Conferido', div:'Divergente', falta_cartao:'Declarado sem cartão',
  falta_reg:'Cartão sem registro', falta_reg_base:'Cartão sem viagem'
};
const CC_CLASSE = { ok:'cc-ok', div:'cc-div', falta_cartao:'cc-falta', falta_reg:'cc-falta', falta_reg_base:'cc-base' };
const somaV = (lista, f) => lista.reduce((s, x) => s + f(x), 0);

function desenharCartao(){
  const corpo = document.getElementById('cc-corpo');
  if(!corpo) return;
  if(!cartao){
    corpo.innerHTML = '<div class="painel-bloco"><div class="vazio">Envie o relatório do cartão para começar a conferência.</div></div>';
    return;
  }
  const st = cartao;
  const opcoesCol = (k, obrig) => (obrig ? '' : '<option value="-1">(não usar)</option>')
    + st.cab.map((n, i) => `<option value="${i}" ${st.map[k] === i ? 'selected' : ''}>${esc(n)}</option>`).join('');
  const sel = (id, valor, ops) => `<select id="${id}">${ops.map(([v, t]) => `<option value="${v}" ${String(v) === String(valor) ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  corpo.innerHTML = `
    <div class="painel-bloco">
      <h2>Colunas e regras <span class="mini" style="font-weight:500">— ${esc(st.nome)}</span></h2>
      <div class="grade-form">
        ${CC_CAMPOS.map(([k, rot, obrig]) => `<div class="campo"><label for="cc-col-${k}">${rot}${obrig ? '' : ' (opcional)'}</label>
          <select id="cc-col-${k}" data-col="${k}" ${obrig ? 'required' : ''}>${opcoesCol(k, obrig)}</select></div>`).join('')}
        <div class="campo"><label for="cc-de">Período — de</label><input id="cc-de" type="date" value="${st.cfg.de}"></div>
        <div class="campo"><label for="cc-ate">Período — até</label><input id="cc-ate" type="date" value="${st.cfg.ate}"></div>
        <div class="campo"><label for="cc-dias">Diferença de data aceita</label>${sel('cc-dias', st.cfg.difDias, [[0, 'Mesmo dia'], [1, 'Até 1 dia'], [2, 'Até 2 dias'], [3, 'Até 3 dias']])}</div>
        <div class="campo"><label for="cc-val">Diferença de valor aceita</label>${sel('cc-val', st.cfg.tolValor, [[0.5, 'Até R$ 0,50'], [1, 'Até R$ 1,00'], [5, 'Até R$ 5,00'], [10, 'Até R$ 10,00']])}</div>
        <div class="campo inteiro"><label for="cc-rej">Registros declarados considerados</label>${sel('cc-rej', st.cfg.incluirRej ? '1' : '0', [['0', 'Aguardando e aprovados'], ['1', 'Todos, inclusive rejeitados']])}</div>
      </div>
      <div id="cc-aviso" class="mini"></div>
    </div>
    <div id="cc-res"></div>`;
  corpo.querySelectorAll('[data-col]').forEach(s => s.addEventListener('change', () => { st.map[s.dataset.col] = +s.value; if(!st.periodoManual) st.cfg.de = st.cfg.ate = ''; atualizarCartao(); }));
  const liga = (id, fn) => document.getElementById(id).addEventListener('change', e => { fn(e.target.value); atualizarCartao(); });
  liga('cc-de', v => { st.cfg.de = v; st.periodoManual = true; });
  liga('cc-ate', v => { st.cfg.ate = v; st.periodoManual = true; });
  liga('cc-dias', v => st.cfg.difDias = +v);
  liga('cc-val', v => st.cfg.tolValor = +v);
  liga('cc-rej', v => st.cfg.incluirRej = v === '1');
  atualizarCartao();
}

function atualizarCartao(){
  const st = cartao, alvo = document.getElementById('cc-res');
  if(!st || !alvo) return;
  const { linhas, ignoradas } = normalizarCartao(st);
  const aviso = document.getElementById('cc-aviso');
  if(!linhas.length){
    if(aviso) aviso.textContent = '';
    alvo.innerHTML = '<div class="painel-bloco"><div class="vazio">Nenhuma linha válida encontrada. Confira se as colunas de data, placa e valor estão corretas.</div></div>';
    return;
  }
  const datas = linhas.map(l => l.data).sort();
  if(!st.cfg.de) st.cfg.de = datas[0];
  if(!st.cfg.ate) st.cfg.ate = datas[datas.length - 1];
  document.getElementById('cc-de').value = st.cfg.de;
  document.getElementById('cc-ate').value = st.cfg.ate;
  if(aviso) aviso.textContent = ignoradas ? ignoradas + ' linha(s) do arquivo sem data, placa ou valor válidos foram ignoradas (totais, estornos e linhas em branco, por exemplo).' : '';
  const { res, cart, decl } = conciliarCartao(linhas, st.cfg);
  st.ultimo = { res, cart, decl };
  const por = t => res.filter(r => r.tipo === t);
  const ok = por('ok'), div = por('div'), fc = por('falta_cartao'), fr = por('falta_reg'), fb = por('falta_reg_base');
  const filtros = [['pend', 'Pendências (tudo que não conferiu)'], ['', 'Todos'], ['ok', 'Conferidos'], ['div', 'Divergentes'],
    ['falta_cartao', 'Declarado sem cartão'], ['falta_reg', 'Cartão sem registro (com viagem)'], ['falta_reg_base', 'Cartão sem viagem na data']];
  const visiveis = res.filter(r => st.cfg.filtro === 'pend' ? r.tipo !== 'ok' : (!st.cfg.filtro || r.tipo === st.cfg.filtro));
  const LIM = 500;
  const nomeMot = r => {
    const mid = r.d ? r.d.motoristaId : (r.v ? r.v.motoristaId : null);
    return mid ? nomeMotorista(mid) : '';
  };
  const celDecl = r => r.d ? `<div class="num">${fmtBRL(r.d.valor)}</div><div class="mini">${r.d.litros ? fmtNum(r.d.litros, 2) + ' L · ' : ''}Registro #${r.d.id}${r.d.viagemId ? ' · Viagem #' + r.d.viagemId : ''}${r.dd ? ' · ' + fmtData(r.d.data) : ''}</div>` : '—';
  const celCart = r => r.c ? `<div class="num">${fmtBRL(r.c.valor)}</div><div class="mini">${r.c.litros ? fmtNum(r.c.litros, 2) + ' L · ' : ''}${esc(r.c.local || 'Linha ' + r.c.linha)}${r.dd ? ' · ' + fmtData(r.c.data) : ''}</div>` : '—';
  const sit = r => {
    let extra = '';
    if(r.tipo === 'div') extra = `<div class="mini">${esc(r.motivos.join(' e '))}</div>`;
    else if(r.tipo === 'ok' && r.dd) extra = `<div class="mini">Data difere ${r.dd} dia(s)</div>`;
    else if(r.tipo === 'falta_reg') extra = `<div class="mini">Em viagem #${r.v.id}</div>`;
    else if(r.tipo === 'falta_reg_base') extra = `<div class="mini">${r.noCad ? 'Placa fora da frota' : 'Provável abastecimento de base'}</div>`;
    return `<span class="tag ${CC_CLASSE[r.tipo]}">${CC_ROTULO[r.tipo]}</span>${extra}`;
  };
  const dif = r => (r.c && r.d) ? (() => { const x = r.c.valor - r.d.valor; return `<span class="desvio ${Math.abs(x) > 0.005 ? (x > 0 ? 'alto' : 'baixo') : ''}">${x > 0 ? '+' : ''}${fmtBRL(x)}</span>`; })() : '—';
  alvo.innerHTML = `
    <div class="cards">
      <div class="card azul"><div class="rotulo">Lançamentos no cartão</div><div class="valor">${cart.length}</div><div class="mini">${fmtBRL(somaV(cart, x => x.valor))}</div></div>
      <div class="card azul"><div class="rotulo">Declarados no sistema</div><div class="valor">${decl.length}</div><div class="mini">${fmtBRL(somaV(decl, x => x.valor))}</div></div>
      <div class="card verde"><div class="rotulo">Conferidos</div><div class="valor">${ok.length}</div></div>
      <div class="card"><div class="rotulo">Divergentes</div><div class="valor">${div.length}</div><div class="mini">${fmtBRL(somaV(div, x => Math.abs(x.c.valor - x.d.valor)))} de diferença</div></div>
      <div class="card vermelho"><div class="rotulo">Declarado sem cartão</div><div class="valor">${fc.length}</div><div class="mini">${fmtBRL(somaV(fc, x => x.d.valor))}</div></div>
      <div class="card vermelho"><div class="rotulo">Cartão sem registro</div><div class="valor">${fr.length + fb.length}</div><div class="mini">${fmtBRL(somaV(fr.concat(fb), x => x.c.valor))}${fb.length ? ' · ' + fb.length + ' sem viagem' : ''}</div></div>
    </div>
    <div class="filtros" style="align-items:center">
      <select id="cc-filtro" aria-label="Situação">${filtros.map(([v, t]) => `<option value="${v}" ${v === st.cfg.filtro ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="btn btn-contorno btn-pequeno" type="button" id="cc-exportar">${icon('receipt')}<span>Exportar Excel</span></button>
      <span class="mini">${visiveis.length} linha(s)</span>
    </div>
    <div class="tabela-wrap"><table>
      <thead><tr><th>SITUAÇÃO</th><th>DATA</th><th>PLACA</th><th>MOTORISTA</th><th>DECLARADO</th><th>CARTÃO</th><th>DIFERENÇA</th></tr></thead>
      <tbody>${visiveis.slice(0, LIM).map((r, i) => `<tr class="${r.d ? 'linha-clicavel ' : ''}${['falta_cartao', 'falta_reg'].includes(r.tipo) ? 'linha-desvio' : ''}" data-i="${i}">
        <td>${sit(r)}</td><td>${fmtData(r.data)}</td><td>${esc(r.c ? r.c.placa : r.d.placa)}</td><td>${esc(nomeMot(r)) || '—'}</td>
        <td>${celDecl(r)}</td><td>${celCart(r)}</td><td>${dif(r)}</td></tr>`).join('')
        || '<tr><td colspan="7" class="vazio">Nada nesta situação. Tudo conferido.</td></tr>'}</tbody>
    </table></div>
    ${visiveis.length > LIM ? `<p class="mini" style="margin-top:10px">Mostrando as primeiras ${LIM} linhas. Use o filtro de situação ou exporte para o Excel para ver tudo.</p>` : ''}
    <p class="mini" style="margin-top:10px">Conferido: mesma placa, data e valor dentro das tolerâncias. Divergente: placa e data batem, mas o valor ou os litros diferem. Cartão sem viagem: nenhum caminhão em viagem naquela placa e data, como abastecimento de base.</p>`;
  decorarCards();
  document.getElementById('cc-filtro').addEventListener('change', e => { st.cfg.filtro = e.target.value; atualizarCartao(); });
  document.getElementById('cc-exportar').addEventListener('click', () => exportarConferencia(res));
  alvo.querySelectorAll('tr[data-i]').forEach(tr => tr.addEventListener('click', () => {
    const r = visiveis[+tr.dataset.i];
    if(r && r.d) abrirDetalhe(r.d.id);
  }));
}

function exportarConferencia(res){
  if(typeof XLSX === 'undefined'){ mostrarMensagem('Biblioteca de Excel indisponível. Verifique a conexão.', true); return; }
  if(!res || !res.length){ mostrarMensagem('Não há dados para exportar.', true); return; }
  const cfg = cartao.cfg;
  const linhas = res.map(r => ({
    'Situação': CC_ROTULO[r.tipo], 'Observação': r.motivos ? r.motivos.join(' e ') : (r.tipo === 'falta_reg_base' ? (r.noCad ? 'Placa fora da frota' : 'Provável abastecimento de base') : (r.v ? 'Em viagem #' + r.v.id : '')),
    'Data': fmtData(r.data), 'Placa': r.c ? r.c.placa : r.d.placa,
    'Motorista': r.d ? nomeMotorista(r.d.motoristaId) : (r.v ? nomeMotorista(r.v.motoristaId) : ''),
    'Registro': r.d ? '#' + r.d.id : '', 'Viagem': r.d && r.d.viagemId ? '#' + r.d.viagemId : (r.v ? '#' + r.v.id : ''),
    'Declarado (R$)': r.d ? r.d.valor : '', 'Declarado (L)': r.d && r.d.litros ? r.d.litros : '',
    'Cartão (R$)': r.c ? r.c.valor : '', 'Cartão (L)': r.c && r.c.litros ? r.c.litros : '',
    'Posto': r.c ? r.c.local : '', 'Diferença (R$)': (r.c && r.d) ? Math.round((r.c.valor - r.d.valor) * 100) / 100 : ''
  }));
  const resumo = [
    ['CONFERÊNCIA DO CARTÃO DE COMBUSTÍVEL — ROFE'], ['Arquivo: ' + cartao.nome], ['Período: ' + fmtData(cfg.de) + ' a ' + fmtData(cfg.ate)], [],
    ...Object.keys(CC_ROTULO).map(k => [CC_ROTULO[k], res.filter(r => r.tipo === k).length])
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), 'Resumo');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Conferência');
  XLSX.writeFile(wb, 'ROFE_conferencia_cartao_' + hojeIso() + '.xlsx');
  auditar('Exportou conferência do cartão de combustível', cartao.nome);
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFv8VaxTJs3yuTRY33K4RhGv6OsLRcebA",
  authDomain: "rofe-finance.firebaseapp.com",
  projectId: "rofe-finance",
  storageBucket: "rofe-finance.firebasestorage.app",
  messagingSenderId: "542847288223",
  appId: "1:542847288223:web:1cc28c7b0ee966a5d333aa",
  measurementId: "G-E7L1K02N8S"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ERROS = {
  'auth/invalid-credential': 'E-mail ou senha incorretos.',
  'auth/wrong-password': 'E-mail ou senha incorretos.',
  'auth/user-not-found': 'E-mail ou senha incorretos.',
  'auth/invalid-email': 'E-mail inválido.',
  'auth/user-disabled': 'Este usuário está desativado.',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
  'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/operation-not-allowed': 'Login por e-mail/senha não está ativado no Firebase.'
};

window.RofeAuth = {
  entrar: (email, senha) => signInWithEmailAndPassword(auth, email, senha),
  sair: () => signOut(auth),
  salvarPerfil: (uid, dados) => updateDoc(doc(db, 'usuarios', uid), dados),
  traduzirErro: err => ERROS[err && err.code] || 'Não foi possível entrar. Tente novamente.'
};

/* Dispara ao entrar e também ao recarregar a página com sessão ativa */
onAuthStateChanged(auth, async user => {
  if(!user) return;
  try {
    const snap = await getDoc(doc(db, 'usuarios', user.uid));
    if(!snap.exists()){
      await signOut(auth);
      return window.rofeLoginErro('Seu usuário não tem perfil cadastrado. Fale com o administrador.');
    }
    const perfil = snap.data();
    if(perfil.ativo === false){
      await signOut(auth);
      return window.rofeLoginErro('Seu acesso está desativado.');
    }
    if(perfil.perfil !== 'motorista' && perfil.perfil !== 'admin'){
      await signOut(auth);
      return window.rofeLoginErro('Perfil inválido. Fale com o administrador.');
    }
    window.rofeAbrirSessao(user.uid, user.email, perfil);
  } catch(err){
    console.error(err);
    await signOut(auth);
    window.rofeLoginErro('Não foi possível carregar seu perfil. Verifique as regras do Firestore.');
  }
});
</script>
