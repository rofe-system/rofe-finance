h1,h2,h3,button,nav a,.kp b{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
aside{width:244px;flex:none;background:var(--nv);color:var(--nt);padding:20px 12px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto;border-right:1px solid var(--ln)}
aside h1{font-size:23px;font-weight:800;margin:0 8px;color:var(--dk);letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
aside h1:before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:6px solid var(--ac);background:#fff;box-shadow:0 0 0 2px var(--dk)}

nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:9px;color:var(--nt);cursor:pointer;font-weight:600;font-size:16px;text-decoration:none}
nav a:hover{background:var(--hv)}nav a.on{background:var(--ac);color:var(--acf);box-shadow:0 2px 8px rgba(214,40,57,.3)}nav em{font-style:normal;font-weight:600;font-size:13px;opacity:.8}nav hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
main{flex:1;min-width:0;max-width:1180px;padding:28px 32px}h2{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px;color:var(--dk)}.sub{margin:0 0 18px;color:var(--mut)}
button{font-size:15px;font-weight:600;padding:7px 14px;border:1px solid var(--ln);background:var(--pn);color:var(--dk);border-radius:8px;cursor:pointer}
button:hover{background:var(--fld);border-color:var(--sky)}button.p{background:var(--ac);border-color:var(--ac);color:var(--acf)}button.p:hover{background:var(--ac);filter:brightness(.92)}button.d{color:var(--bad)}button.d:hover{border-color:var(--bad)}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.tb input{max-width:280px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.kp div{background:var(--pn);border:1px solid var(--ln);border-top:4px solid var(--sky);border-radius:12px;padding:12px 16px}.kp b{display:block;font-size:32px;font-weight:800;line-height:1.1;color:var(--dk)}.kp span{color:var(--mut);font-size:13px}
.sb{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--ln);margin:6px 0}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:18px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
h3{font-size:21px;font-weight:700;margin:20px 0 8px;color:var(--dk)}.tw{overflow-x:auto;background:var(--pn);border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ln);vertical-align:middle}th{font-size:13px;color:var(--dk);font-weight:600;background:var(--fld)}tbody tr:hover td{background:var(--fld)}tr:last-child td{border-bottom:0}td button{margin:2px 3px 2px 0;padding:3px 10px;font-size:14px}
.tg{display:inline-block;font-size:12px;font-weight:500;padding:1px 9px;border-radius:99px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent);margin:1px 3px 1px 0;white-space:nowrap}.tg.bad{color:var(--bad)}#fw .tg b{font-weight:800;font-size:14px;letter-spacing:.5px}#dupw{background:color-mix(in srgb,var(--bad) 12%,transparent);border:2px solid var(--bad);color:var(--bad);border-radius:10px;padding:12px;margin:12px 0;font-weight:700;font-size:14px;line-height:1.4}#dupw .pl{display:inline-block;background:var(--bad);color:#fff;padding:1px 10px;border-radius:6px;font-size:17px;letter-spacing:1px;margin:0 2px}#niw{background:color-mix(in srgb,var(--wn) 14%,transparent);border:2px solid var(--wn);color:var(--wn);border-radius:10px;padding:12px;margin:12px 0;font-weight:700;font-size:14px;line-height:1.4}#niw small{display:block;font-weight:500;margin-top:4px;opacity:.9}#niw .da{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}#dupw .da{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}.tg.wn{color:var(--wn)}.tg.ok{color:var(--ok)}.tg.mu{color:var(--mut)}
.em{padding:32px;text-align:center;color:var(--mut);background:var(--pn);border:1px dashed var(--sky);border-radius:12px}
.vc{background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--sky);border-radius:12px;padding:14px 18px;margin-bottom:14px}.vh{display:flex;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.vh h3{margin:0;font-size:28px;font-weight:800;line-height:1;letter-spacing:1.5px;color:var(--dk)}.vh .vi{display:block;margin-top:6px;color:var(--mut);font-size:14px}.vh .km{text-align:right;background:var(--fld);border:1px solid var(--ln);border-right:5px solid var(--ac);border-radius:10px;padding:6px 14px}.vh .km b{display:block;font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:30px;font-weight:800;line-height:1.1;color:var(--ink)}.vh .km small{color:var(--mut);font-size:12px}
.mp{display:flex;align-items:center;gap:28px;overflow-x:auto;padding:10px 4px 14px}.mp>small{color:var(--mut);writing-mode:vertical-rl;transform:rotate(180deg);flex:none}
.ax{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}.ax hr{width:100%;min-width:130px;border:0;border-top:4px solid var(--sky);border-radius:2px;margin:4px 0}
.mw{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start}.mw .ba{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:none;width:170px}.mw .ba button{margin:0;width:100%;white-space:nowrap}.mw .mp{flex:0 1 auto;min-width:0;margin-left:clamp(8px,4vw,56px);margin-right:auto}.mw .mp.v2{align-items:center}
.mp.v2{flex-direction:column;align-items:center;gap:14px}.mp.v2>small{writing-mode:horizontal-tb;transform:none;font-weight:600}
.mp.v2 .ax{flex-direction:row;align-items:flex-start;gap:6px}.mp.v2 .ax hr{width:0;min-width:0;align-self:stretch;border:0;border-left:4px solid var(--sky);border-radius:2px;margin:0 4px}
.mp.v2{gap:8px;padding:4px}.mp.v2 .ax{gap:4px}.mp.v2 .sl{gap:2px}.mp.v2 .sl small{font-size:11px}.mp.v2 .ax hr{margin:0 3px;border-left-width:3px}.mp.v2 .tr{width:86px;height:40px;border-radius:9px;font-size:12px}.mp.v2 .tr .ch{padding:1px 4px;border-radius:5px}.mp.v2 .tr b{font-size:12px}.mp.v2 .tr .ch span{font-size:9.5px}.mp.v2 .tr.v{height:40px;background:repeating-linear-gradient(90deg,var(--rb) 0 9px,#141f2f 9px 11px)}.mp.v2 .tr.v:hover{background:repeating-linear-gradient(90deg,var(--rb) 0 9px,#141f2f 9px 11px)}.mp.v2 .tr.v.e,.mp.v2 .tr.v.e:hover{background:none}.mp.v2 .tr.v.e:hover{background:var(--fld)}
/* ===== Pneu 3D no mapa ===== */
.mp.v2 .tr,.mp.v2 .tr.v{width:82px;height:auto;min-height:0;flex-direction:column;justify-content:flex-start;align-items:center;gap:0;padding:0;border:0;border-radius:12px;overflow:visible;box-shadow:none;background:none!important;font-weight:500}
.mp.v2 .tr.e{--g:var(--sky)}
.mp.v2 .t3{display:block;width:72px;height:auto;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));transition:transform .18s ease,filter .18s ease}
.mp.v2 .tr:hover .t3,.mp.v2 .tr:focus-visible .t3{transform:translateY(-3px) scale(1.06);filter:drop-shadow(0 8px 6px rgba(0,0,0,.4)) drop-shadow(0 0 7px var(--g))}
.mp.v2 .tr.e .t3{opacity:.38;filter:grayscale(.4)}
.mp.v2 .tr.e:hover .t3{opacity:.9;filter:drop-shadow(0 0 8px var(--sky))}
.mp.v2 .tr .pl{position:absolute;left:42.7%;top:25.5px;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:#06101c;font:700 13px/1 system-ui,sans-serif;font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .18s}
.mp.v2 .tr.e:hover .pl{transform:translate(-50%,-50%) scale(1.15)}
.mp.v2 .tr .ch{width:calc(100% - 4px);margin-top:-4px;padding:1px 4px 3px;border-radius:6px;background:rgba(6,14,26,.86);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g) 55%,transparent)}
.mp.v2 .tr .ch b{font-size:12px}.mp.v2 .tr .ch span{font-size:10px}.mp.v2 .tr .gg{position:static;display:block;height:2px;margin-top:2px;border-radius:3px;background:var(--g);max-width:100%;min-width:3px}
.mp.v2.bt{gap:4px}.mp.v2.bt .ax{gap:2px}.mp.v2.bt .tr,.mp.v2.bt .tr.v{width:74px}.mp.v2.bt .t3{width:62px}.mp.v2.bt .tr .pl{left:43%;top:22px;width:15px;height:15px;font-size:12px}.mp.v2.bt .tr .ch b{font-size:11px}.mp.v2.bt .tr .ch span{font-size:9px}.mp.v2.bt .tr .ch{margin-top:-3px;padding:1px 3px 2px}.mp.v2.bt .sl small{font-size:9.5px}
@media(prefers-reduced-motion:reduce){.mp.v2 .t3,.mp.v2 .tr .pl{transition:none}}
.sl{display:flex;flex-direction:column;align-items:center;gap:3px}.sl small{font-size:12px;color:var(--mut)}
.tr{position:relative;width:128px;height:52px;padding:0;border:0;border-radius:11px;background:repeating-linear-gradient(90deg,var(--rb) 0 9px,#141f2f 9px 11px);color:#fff;display:flex;justify-content:center;align-items:center;overflow:hidden;--g:#8da2b8;box-shadow:inset 0 0 0 2px var(--g)}
.tr:hover{background:repeating-linear-gradient(90deg,var(--rb) 0 9px,#141f2f 9px 11px)}
.tr.ok{--g:var(--ok)}.tr.wn{--g:var(--wn)}.tr.bd{--g:var(--bad)}.tr .ch{background:rgba(6,14,26,.75);border-radius:6px;padding:1px 8px;text-align:center;line-height:1.2}.tr b{display:block;font-size:15px}.tr .ch span{font-size:11px}
.tr .gg{position:absolute;left:0;bottom:0;height:4px;width:var(--w,0%);background:var(--g)}.tr.e{background:none;color:var(--mut);box-shadow:none;border:2px dashed var(--sky);font-weight:500;font-size:13px}.tr.e:hover{background:var(--fld)}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--pn);color:var(--ink);padding:24px;width:min(780px,96vw);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(13,35,64,.25)}dialog::backdrop{background:rgba(8,22,40,.55)}dialog h3{margin:0 0 2px;font-size:24px}dialog p{margin:0 0 8px;color:var(--mut)}
label{display:block;margin:10px 0 3px;font-size:13px;font-weight:500;color:var(--mut)}input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--fld);color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:var(--sky)}
.fa{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
@media(max-width:800px){body{display:block}aside{width:auto;height:auto;position:static;padding:10px;border-right:0;border-bottom:1px solid var(--ln)}aside small,nav hr{display:none}aside h1{margin-bottom:8px}nav{display:flex;gap:4px;overflow-x:auto}nav a{white-space:nowrap;gap:6px}main{padding:16px}}
@media(prefers-reduced-motion:no-preference){.tr,button,nav a{transition:background-color .15s,border-color .15s,filter .15s}}
.tr.v{width:72px;height:128px;background:repeating-linear-gradient(0deg,var(--rb) 0 9px,#141f2f 9px 11px)}.tr.v:hover{background:repeating-linear-gradient(0deg,var(--rb) 0 9px,#141f2f 9px 11px)}.tr.v.e{background:none}.tr.v.e:hover{background:var(--fld)}.tr.v .ch{padding:2px 4px;max-width:100%}.tr.v b{font-size:13px;overflow:hidden;text-overflow:ellipsis}.tr.v .ch span{display:block;font-size:10px}
/* mini mapa na instalação */
.ih{grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;margin-bottom:4px}.ih>.ht{min-width:0;flex:1}
.mm{flex:none;display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--fld)}
.mm .r{display:flex;gap:6px;align-items:center}.mm .a{display:flex;flex-direction:column;align-items:center;gap:3px}
.mm .a hr{width:100%;border:0;border-top:2px solid var(--sky);margin:1px 0}.mm .es{margin-left:6px;padding-left:6px;border-left:1px dotted var(--mut)}
.mm i{display:block;box-sizing:border-box;width:24px;height:13px;border-radius:4px;border:1.5px dashed var(--mut)}
.mm i.o{background:var(--mut);border-style:solid;opacity:.5}
.mm i.c{background:var(--bad);border:1.5px solid var(--bad);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 30%,transparent)}
.mm small{font-size:11px;line-height:1.2;color:var(--mut)}.mm b{font-size:14px;line-height:1.2;color:var(--ink)}
.mm .r{flex-direction:column;gap:5px}.mm .a{flex-direction:row;gap:3px}.mm .a hr{width:0;height:auto;align-self:stretch;border:0;border-left:2px solid var(--sky);margin:0 1px}
.mm .es{margin:3px 0 0;padding:4px 0 0;border-left:0;border-top:1px dotted var(--mut)}
@media(prefers-reduced-motion:no-preference){.mm i.c{animation:mmp 1.2s ease-in-out infinite}}@keyframes mmp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 12%,transparent)}}
#fm{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
#fm>*{grid-column:1/-1}#fm>.fd{grid-column:auto}#fm>.fd.w{grid-column:1/-1}
.tb select{width:auto;max-width:220px}
@media(max-width:480px){dialog{padding:16px}#fm{column-gap:10px}}

/* ===== visual v3 ===== */
aside{background:linear-gradient(180deg,var(--nv),color-mix(in srgb,var(--nv) 82%,var(--sky)));box-shadow:2px 0 18px rgba(13,35,64,.06)}
.gl{font:700 11px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 10px 6px}
nav a{justify-content:flex-start;gap:10px;padding:6px 10px;margin:2px 0}
nav .ic{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--pn);font-size:17px;box-shadow:0 1px 3px rgba(13,35,64,.14)}

main{background:radial-gradient(900px 300px at 100% 0,color-mix(in srgb,var(--sky) 14%,transparent),transparent)}
h2{display:flex;align-items:center;gap:10px}
.kp div{border-radius:16px;box-shadow:0 4px 14px rgba(13,35,64,.07);transition:transform .15s,box-shadow .15s}.kp div:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(13,35,64,.12)}
.vc{border-radius:16px;box-shadow:0 4px 14px rgba(13,35,64,.06)}
th{background:var(--fld)}tbody tr:hover td{background:var(--fld)}

@media(max-width:800px){aside{position:sticky;top:0;z-index:5}.gl{display:none}nav a{padding:5px 10px 5px 6px;border:1px solid var(--ln);background:var(--pn)}nav a.on{border-color:transparent}nav .ic{width:26px;height:26px;font-size:15px;box-shadow:none;background:var(--fld)}h2{font-size:26px}}

/* ===== mobile v1 ===== */
#tp,#ov,#mx{display:none}#mt{margin:0 8px 10px;width:calc(100% - 16px);text-align:left}
html.mob body{display:block;max-width:none}
html.mob #tp{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--nv);border-bottom:1px solid var(--ln);font:800 19px "Bricolage Grotesque",system-ui,sans-serif;color:var(--dk)}
html.mob #mb{font-size:22px;padding:2px 12px;line-height:1.3}

html.mob.mo aside{transform:none}
html.mob aside{visibility:hidden;transition:transform .25s,visibility 0s .25s}html.mob.mo aside{visibility:visible;transition:transform .25s}
html.mob #ov{display:block;position:fixed;inset:0;background:rgba(6,16,30,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}html.mob.mo #ov{opacity:1;pointer-events:auto}
html.mob #mx{display:block;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:4px 10px}
html.mob aside small{display:block}html.mob .gl{display:block}html.mob nav{display:block;overflow:visible}
html.mob nav a{white-space:normal;padding:8px 10px;margin:2px 0;border:0;font-size:17px}html.mob nav a:not(.on){background:transparent}html.mob nav .ic{width:34px;height:34px;font-size:18px}
html.mob main{padding:14px 14px 40px;max-width:none}html.mob h2{font-size:26px}
html.mob button{padding:9px 14px}html.mob :is(input,select,textarea){font-size:16px}
html.mob .kp{grid-template-columns:repeat(2,1fr)}html.mob .tb input:not([type=checkbox]){max-width:none;flex:1 1 100%}
html.mob dialog{width:min(410px,calc(100vw - 20px));max-width:none}
@media(min-width:801px){html.mob{background:color-mix(in srgb,var(--bg) 70%,#000)}html.mob body{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--ln),0 0 50px rgba(0,0,0,.2)}}

#mf2{display:none}html.mob #mf2{display:block;margin-left:auto;margin-right:8px;padding:5px 12px;border-radius:99px;font-size:14px}

/* ===== visual v4: paleta azul, menu à direita, correções de layout ===== */
:root{--bg:#eef4fb;--pn:#fff;--ink:#0b2240;--mut:#56708c;--ln:#d8e4f2;--nv:#0a2447;--nt:#d5e6fb;--sky:#2f8fe8;--dk:#123f75;--ok:#1a73c9;--fld:#f4f8fe;--hv:rgba(13,35,64,.06)}

:root[data-theme="dark"]{--bg:#08162a;--pn:#0f2441;--ink:#e8f2fc;--mut:#8fb0d1;--ln:#1f3b5c;--sky:#4aa8f5;--dk:#7db8f2;--ok:#5db3f7;--fld:#0b1d36;--hv:rgba(255,255,255,.07)}
/* menu em pé, à direita */
aside{order:2;background:linear-gradient(180deg,#0a2447 0%,#0f3a6d 100%);color:#d5e6fb;border:0;border-left:1px solid #1d4a80;box-shadow:-4px 0 24px rgba(10,36,71,.18)}
aside h1{color:#fff}aside h1:before{box-shadow:0 0 0 2px #5ab4f5}aside small{color:#9ec3ec}.gl{color:#7fa9d9}
nav a{color:#d5e6fb}nav a:hover:not(.on){background:rgba(255,255,255,.09)}nav .ic{background:rgba(255,255,255,.1);box-shadow:none}nav em{background:rgba(255,255,255,.13);color:#e8f3ff}
#mt{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#e8f3ff}#mt:hover{background:rgba(255,255,255,.17)}
main{margin-inline:auto}
/* correções de encaixe */
.kp{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.kp div{min-width:0}.kp b{font-size:clamp(20px,2.3vw,30px);overflow-wrap:anywhere}.kp span{display:block;overflow-wrap:anywhere}
.tw table{min-width:720px}td,th{overflow-wrap:break-word}td:last-child{min-width:150px}
.tb label{margin:0;white-space:nowrap}.tb select{min-width:0}
.vh>div{min-width:0}.vh .vi{overflow-wrap:anywhere}.vh h3{overflow-wrap:anywhere}

.pfc details{margin-top:14px}.pfc summary{cursor:pointer;color:#cfe3fa;font-weight:600}
#pfM{min-height:20px;color:#ffd6db;font-size:14px;margin-top:12px}.pfbt{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.pfbt button{padding:10px 18px}
#usw{position:fixed;inset:0;z-index:160;overflow:auto;background:var(--bg);overscroll-behavior:contain}#usw[hidden]{display:none}#usm{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
.ush{display:flex;gap:12px;align-items:center}.ush>div{min-width:0;display:flex;flex-direction:column}.ush b{font-size:17px;overflow-wrap:anywhere;color:var(--ink)}.ush small{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.usc .av{border-color:var(--ln)}.usc.pend{border-left-color:var(--wn)}.usc.bloq{border-left-color:var(--bad);opacity:.85}.usc.ativo,.usc.super{border-left-color:var(--ok)}
.ups{display:flex;gap:6px}
.ucat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ucat label{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--fld);color:var(--ink);cursor:pointer;font-size:14px}.ucat input{width:auto;margin-top:3px;flex:none}
.ucat small{display:block;color:var(--mut);font-size:12.5px;font-weight:400}.ucat label:has(input:checked){border-color:var(--sky);box-shadow:0 0 0 2px color-mix(in srgb,var(--sky) 35%,transparent)}.ucat .dis{opacity:.45;cursor:not-allowed}
.upg{border:1px solid var(--ln);border-radius:12px;padding:6px 12px 8px;margin:0 0 10px;min-width:0}.upg legend{font-weight:700;color:var(--dk);padding:0 6px;font-size:14px}.upg legend button{padding:2px 9px;font-size:12px;margin-left:6px;box-shadow:none}
.upi{display:flex;gap:10px;align-items:flex-start;margin:0;padding:8px 2px;border-bottom:1px dashed var(--ln);color:var(--ink);cursor:pointer;font-size:14px}.upi:last-child{border-bottom:0}.upi input{width:20px;height:20px;flex:none;margin-top:1px}
.upi small{display:block;color:var(--mut);font-size:12.5px;font-weight:400}.upn{color:var(--ok)!important;font-weight:600}
@media(max-width:600px){#usm{padding:14px 12px 60px}#usm .tb>*{flex:1 1 100%;max-width:none!important}#usm .kp{grid-template-columns:repeat(2,1fr)}#usm h2{font-size:26px}}
</style>

#cw .cwb button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#eceff4;border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit}

#cw iframe{flex:1;width:100%;border:0;background:#eef0f4}
</style>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Combustível</title>
<style>
[hidden]{display:none!important}
:root{--bg:#eef0f4;--card:#fff;--tx:#18202b;--mut:#6a7585;--bd:#dde1e8;--ac:#ea580c;--ac2:#fff1e8;--acx:#fff;--paper:#fffefa;--line:#e4e1d6;--hd:#1f2937;--hdx:#fff;--ok:#15803d;--ok2:#e3f6ea;--sh:0 6px 24px rgba(20,30,50,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#181c23;--tx:#eceff4;--mut:#93a0b2;--bd:#2a313c;--ac:#fb923c;--ac2:#2a1d12;--acx:#111;--paper:#1c2028;--line:#2b313c;--hd:#0b0e13;--hdx:#eceff4;--ok:#4ade80;--ok2:#12281a;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#181c23;--tx:#eceff4;--mut:#93a0b2;--bd:#2a313c;--ac:#fb923c;--ac2:#2a1d12;--acx:#111;--paper:#1c2028;--line:#2b313c;--hd:#0b0e13;--hdx:#eceff4;--ok:#4ade80;--ok2:#12281a;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:var(--hdx);padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ac);display:grid;place-items:center;font-size:20px}
header h1{font-size:17px;margin:0;line-height:1.2}
header small{opacity:.65;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.nav button{flex:none;padding:10px 16px;font-weight:600;border-radius:99px}
.nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
input:disabled{opacity:.7}
button{cursor:pointer;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button.g{background:var(--ok);color:var(--acx);border-color:var(--ok);font-weight:700;font-size:15px}
.card{background:var(--paper);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 0 8px}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>div{flex:1}
.row>button{flex:none}
.folhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.folhas button{text-align:left;padding:10px 12px}
.folhas b{display:block;font-size:15px}
.folhas span{font-size:12px;color:var(--mut)}
.folhas button.ok span{color:var(--ok)}
.folhas .pg{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--pc)}
.folhas .pg span,.folhas button.ok .pg span{color:inherit;font-size:12px}
.folhas .bar{display:block;height:4px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.folhas .bar i{display:block;height:100%;border-radius:99px;background:var(--pc)}
.folhas .c-r{--pc:#dc2626}.folhas .c-y{--pc:#b45309}.folhas .c-g{--pc:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .folhas .c-r{--pc:#f87171}:root:not([data-theme="light"]) .folhas .c-y{--pc:#facc15}:root:not([data-theme="light"]) .folhas .c-g{--pc:#4ade80}}
:root[data-theme="dark"] .folhas .c-r{--pc:#f87171}:root[data-theme="dark"] .folhas .c-y{--pc:#facc15}:root[data-theme="dark"] .folhas .c-g{--pc:#4ade80}
.sheet{border-color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--tx);padding-bottom:12px;margin-bottom:14px}
.top h2{margin:0 0 6px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.badge.ok{background:var(--ok2);color:var(--ok)}
.dt{font-size:32px;font-weight:800;color:var(--ac);line-height:1.1;text-align:right}
.dt small{display:block;font-size:12px;font-weight:500;color:var(--mut);text-transform:capitalize}
.cab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
@media(max-width:760px){.cab{grid-template-columns:1fr 1fr}}
.cab input{font-size:15px;padding:8px}
.cf{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:6px;background:var(--ok2);color:var(--ok)}

<body>
<div id="ld"><div class="lb"><div class="lg">⛽</div><h2>Controle de Combustível</h2><div class="lp"><i id="ldi"></i></div><ul id="ldl"></ul></div></div>
<header><div class="logo">⛽</div><div><h1>Controle de Entrada e Saída de Combustível</h1><small>Uma folha para cada dia</small></div></header>
<div class="wrap">

<div class="nav" id="nav">
<button data-v="lan" class="on"><i>🧾</i><span>Lançar controle</span><em>Lançar</em></button>
<button data-v="rel"><i>📊</i><span>Relatório do mês</span><em>Relatório</em></button>
<button data-v="bus"><i>🔍</i><span>Buscar</span><em>Buscar</em></button>
<button data-v="cad"><i>⚙</i><span>Cadastros</span><em>Cadastros</em></button>
</div>

<div id="v-lan">
 <div id="pick">
  <div class="card">
   <h2>Lançar controle</h2>
   <div class="row">
    <div><label>Escolha a data</label><input type="date" id="dsel"></div>
    <button class="p" id="abrir">Abrir folha</button>
   </div>
   <button class="p hj" id="hoje">🧾 Abrir a folha de hoje</button>
   <h3>Folhas já criadas</h3>
   <div class="folhas" id="folhas"></div>
  </div>
 </div>

 <div id="sheet" style="display:none">
  <button class="back" id="voltar">← Trocar data</button>
  <div class="card sheet">
   <div class="top">
    <div><h2>Folha do dia</h2><span class="badge" id="st"></span></div>
    <div class="dt"><small>Data</small><span id="dtv"></span><small id="dts"></small></div>
   </div>

   <h3 style="margin-top:0">Bomba e tanque</h3>
   <div class="cab">
    <div><label>Bomba inicial</label><input id="cbi" type="number" inputmode="decimal" step="any" min="0"></div>
    <div><label>Bomba final</label><input id="cbf" type="number" inputmode="decimal" step="any" min="0"></div>
    <div><label>Saldo do tanque</label><input id="ctq" type="number" inputmode="decimal" step="any" min="0"></div>
    <div><label>Medição</label><input id="cmd" type="number" inputmode="decimal" step="any" min="0"></div>
   </div>
   <div class="cf n" id="cf"></div>

   <div class="lh"><h3>Abastecimentos</h3><button class="p plus" id="mais" title="Adicionar abastecimento">+</button></div>
   <div id="cards"></div>
   <div class="sc tbl"><table>
    <thead><tr><th>Hora</th><th>Placa</th><th class="n">KM</th><th class="n">Litros</th><th class="n">km/l</th><th>Nome</th><th class="s">Status</th><th class="x"></th></tr></thead>
    <tbody id="tb"></tbody>
   </table></div>

   <div class="totbox"><small>Total de saída</small><b id="tl"></b><span id="cnt"></span></div>

   <details>
    <summary>Resumo do dia (por motorista e por placa)</summary>
    <h3>Por motorista</h3><div class="sc"><table style="min-width:320px"><thead><tr><th>Nome</th><th class="n">Abast.</th><th class="n">Litros</th></tr></thead><tbody id="mot"></tbody></table></div>
    <h3>Por placa</h3><div class="sc"><table style="min-width:320px"><thead><tr><th>Placa</th><th class="n">Abast.</th><th class="n">Litros</th><th class="n">km/l</th></tr></thead><tbody id="plc"></tbody></table></div>
   </details>

   <div class="btns" id="btns"></div>
  </div>
 </div>
</div>

<div id="v-rel" style="display:none">
 <div class="card">
  <div class="row"><div><label>Mês</label><input type="month" id="mes"></div></div>
  <div id="relc"></div>
  <div class="btns"><button id="rcsv">Exportar CSV do mês</button><button id="rcsv2">Exportar resumo (CSV)</button><button id="rpr">Imprimir</button></div>
 </div>
</div>

<div id="v-bus" style="display:none">
 <div class="card">
  <label>Placa ou nome (em todas as folhas)</label>
  <input type="search" id="bq" placeholder="Digite para buscar">
  <div id="bres"></div>
 </div>
</div>

<div id="v-cad" style="display:none">
 <div class="card">
  <h2>Cadastros</h2>
  <p class="mut" style="font-size:13px;margin-top:0">Cadastre uma vez e depois escolha ao lançar. Evita o mesmo motorista aparecer com nomes diferentes.</p>
  <div class="cols">
   <div><label>Motoristas</label><div class="row"><div><input id="nm" placeholder="Nome do motorista"></div><button class="p" id="am">Adicionar</button></div><ul id="cm"></ul></div>
   <div><label>Placas</label><div class="row"><div><input id="np" maxlength="8" placeholder="Placa" autocapitalize="characters"></div><button class="p" id="ap">Adicionar</button></div><ul id="cp"></ul></div>
  </div>
 </div>
 <div class="card">
  <h2>Sincronização</h2>
  <div class="cf n" id="sync">Conectando…</div>
  <p class="mut" style="font-size:13px;margin:8px 0 0">Tudo o que é lançado aqui é salvo na hora e aparece em tempo real para todos os usuários e aparelhos. Não é preciso baixar nem importar nada.</p>
 </div>
</div>

</div>

<div class="ov" id="ov">
 <div class="mod">
  <h3 id="mt">Novo abastecimento</h3>
  <div class="g2">
   <div class="f"><label>Hora</label><input id="fh" type="time"></div>
   <div class="f"><label>Placa</label><input id="fp" maxlength="8" placeholder="Placa" autocapitalize="characters" list="dlp"></div>
   <div class="f"><label>KM</label><input id="fk" type="number" inputmode="numeric" min="0" placeholder="KM"></div>
   <div class="f"><label>Litros</label><input id="fl" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Litros"></div>
  </div>
  <div class="f"><label>Nome</label><input id="fn" placeholder="Nome do motorista" list="dlm"></div>
  <div class="acts">
   <button id="fc">Cancelar</button>
   <button id="fs2">Salvar e novo</button>
   <button class="p" id="fs">Salvar</button>
  </div>
 </div>
</div>
<datalist id="dlm"></datalist><datalist id="dlp"></datalist>

<script>
var TOL=0.5,F={},C={m:[],p:[]},cur="",ed=null,vw="lan",API=null;
/* os dados vêm do sistema principal, que sincroniza em tempo real com o Firebase */
try{API=window.parent!==window&&window.parent.combDados?window.parent:null}catch(e){}
function $(i){return document.getElementById(i)}
function pad(n){return String(n).padStart(2,"0")}
function hoje(){var t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function nova(){return{lancada:false,itens:[],cab:{bi:"",bf:"",tq:"",md:""}}}
function carregar(){if(!API)return;var d=API.combDados();F=d.folhas||{};C=d.cad||{m:[],p:[]}}
function put(p,v){if(API)API.combSet(p,v)}
/* acessos do usuário (definidos pelo administrador na tela inicial) */
function PO(k){try{return!API||!API.P||!!API.P(k)}catch(e){return true}}
function permNav(){[["rel","cb_relatorio"],["bus","cb_relatorio"],["cad","cb_cadastros"]].forEach(function(x){var b=document.querySelector("#nav button[data-v="+x[0]+"]");if(b)b.hidden=!PO(x[1])})}
function nid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function itemDados(r){return{h:r.h,p:r.p,k:r.k,l:r.l,n:r.n,s:r.s||"PENDENTE"}}
function ordena(a){a.sort(function(x,y){return String(x.h).localeCompare(String(y.h))||String(x.id).localeCompare(String(y.id))})}
carregar();
function br(d){var a=d.split("-");return a[2]+"/"+a[1]+"/"+a[0].slice(2)}
function fmt(n){return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dobj(d){var a=d.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function dia(d){return dobj(d).toLocaleDateString("pt-BR",{weekday:"long"})}
function soma(a){return a.reduce(function(s,r){return s+r.l},0)}
function nrm(s){return String(s).toUpperCase().replace(/[\s-]/g,"")}
function nrmN(s){return String(s).trim().replace(/\s+/g," ").toUpperCase()}
function fo(){return F[cur]||nova()}
function achar(id){var a=fo().itens;for(var k=0;k<a.length;k++)if(a[k].id===id)return a[k];return null}

/* ---------- navegação ---------- */
function show(v){
 if((v==="rel"||v==="bus")&&!PO("cb_relatorio")||v==="cad"&&!PO("cb_cadastros"))v="lan";
 vw=v;
 ["lan","rel","bus","cad"].forEach(function(x){$("v-"+x).style.display=x===v?"":"none"});
 Array.prototype.forEach.call($("nav").children,function(b){b.className=b.getAttribute("data-v")===v?"on":""});document.documentElement.dataset.v=v;
 if(v==="lan")telaLan();
 if(v==="rel")rel();
 if(v==="bus")busca();
 window.scrollTo(0,0);
}
$("nav").onclick=function(e){var b=e.target.closest("button");if(b)show(b.getAttribute("data-v"))};
function telaLan(){if(cur)renderSheet();else renderPick()}

/* ---------- escolher data ---------- */
function prog(it){var t=it.length;if(!t)return "";var o=it.filter(function(r){return r.s==="OK"}).length,raw=o/t*100,pc=Math.round(raw),cl=raw<50?"c-r":raw<=70?"c-y":"c-g";return "<div class='"+cl+"'><div class='pg'><span>"+pc+"%</span><span>"+o+"/"+t+" ok</span></div><span class='bar'><i style='width:"+pc+"%'></i></span></div>"}
function renderPick(){
 cur="";$("pick").style.display="";$("sheet").style.display="none";
 if(!$("dsel").value)$("dsel").value=hoje();
 var ds=Object.keys(F).filter(function(d){return F[d].itens.length||F[d].lancada}).sort().reverse();
 $("folhas").innerHTML=ds.map(function(d){var g=F[d];return "<button data-d='"+d+"' class='"+(g.lancada?"ok":"")+"'><b>"+br(d)+"</b><span>"+(g.lancada?"✔ lançada":"aberta")+" · "+fmt(soma(g.itens))+" L</span>"+prog(g.itens)+"</button>"}).join("")||"<span class='mut'>Nenhuma folha ainda.</span>";
}
$("hoje").onclick=function(){abrir(hoje())};
$("abrir").onclick=function(){var d=$("dsel").value;if(!d){alert("Escolha uma data.");return}abrir(d)};
$("folhas").onclick=function(e){var b=e.target.closest("button");if(b)abrir(b.getAttribute("data-d"))};
$("voltar").onclick=function(){cur="";renderPick();window.scrollTo(0,0)};
function abrir(d){cur=d;$("dsel").value=d;if(!F[d])F[d]=nova();renderSheet();window.scrollTo(0,0)}

/* ---------- cadastro ---------- */
if(!C.m.length&&!C.p.length){
 var sm={},sp={};
 Object.keys(F).forEach(function(d){F[d].itens.forEach(function(r){var a=nrmN(r.n),b=nrm(r.p);if(a&&!sm[a]){sm[a]=1;C.m.push(r.n.trim().replace(/\s+/g," "))}if(b&&!sp[b]){sp[b]=1;C.p.push(r.p)}})});
 C.m.sort();C.p.sort();C.m.forEach(function(v){putCad("m",v)});C.p.forEach(function(v){putCad("p",v)});
}
function putCad(t,v,del){if(API)put("cad/"+t+"/"+API.ek(t==="p"?nrm(v):nrmN(v)),del?null:v)}
function cad(t,v){

 <div class="tb">${P('nf_registrar')?'<button type="button" class="p" onclick="nfNova()">＋ Registrar nova NF</button>':''}<input id="nfq" type="search" placeholder="Buscar nº, fornecedor, serviço…" value="${esc(NF_F.q)}" oninput="NF_F.q=this.value;nfLista()" aria-label="Buscar NF">

 const st={fotos:[],mud:false};if(id&&n.nfotos)st.fotos=(await nfFotos(id)).slice();

 const F=(k,l,t,ex='',w='')=>`<div class="fd${w}"><label for="n_${k}">${l}</label><input id="n_${k}" type="${t||'text'}" value="${esc(k==='valor'?nfMoeda(n.valor):n[k]??'')}" ${ex}></div>`,

 <div class="fd w"><label>Situação da NF *</label><div class="nfr"><label><input type="radio" name="n_st" value="andamento"${n.status==='andamento'?' checked':''}> ⏳ Em andamento</label><label><input type="radio" name="n_st" value="finalizado"${n.status==='finalizado'?' checked':''}> ✔ Finalizado</label></div></div>

<input id="lgE" type="email" autocomplete="username" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:inherit">

<div style="position:relative"><input id="lgS" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')fbEntrar()" style="width:100%;box-sizing:border-box;padding:10px 44px 10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:inherit"><button type="button" id="lgV" onclick="lgVer()" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:transparent;color:#cfe3fa;cursor:pointer"><span id="lgVo" style="display:grid"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span id="lgVx" style="display:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.8 19.8 0 0 1-3.17 4.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg></span></button></div>
<div id="lgM" role="alert" style="min-height:20px;color:#ffd6db;font-size:14px;margin:12px 0 0"></div>
<button type="button" onclick="fbEntrar()" style="width:100%;margin-top:6px;padding:11px;border-radius:10px;border:0;background:#d62839;color:#fff;font:600 16px 'Figtree',system-ui,sans-serif;cursor:pointer">Entrar</button>
</div></div>
<div id="pf" hidden><div class="pfc">
<h2 id="pfT">Complete seu cadastro</h2><p id="pfS"></p>
<div class="pfa"><div id="pfAv"></div><div class="pfab"><button type="button" onclick="document.getElementById('pfCam').click()">📷 Tirar foto</button><button type="button" onclick="document.getElementById('pfGal').click()">🖼️ Escolher foto</button><button type="button" id="pfRm" onclick="_pfFoto=null;pfAv()">Remover foto</button></div></div>
<input type="file" id="pfCam" accept="image/*" capture="user" hidden onchange="pfFotoSel(this)"><input type="file" id="pfGal" accept="image/*" hidden onchange="pfFotoSel(this)">
<small class="pfo">Foto de perfil opcional.</small>
<label for="pfN">Nome *</label><input id="pfN" autocomplete="given-name" oninput="if(!_pfFoto)pfAv()">
<label for="pfSo">Sobrenome *</label><input id="pfSo" autocomplete="family-name" oninput="if(!_pfFoto)pfAv()">
<label for="pfTel">Telefone (com DDD) *</label><input id="pfTel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(98) 99999-9999" oninput="this.value=telF(this.value)">
<details id="pfSen"><summary>🔑 Alterar minha senha</summary><label for="pfS1">Nova senha</label><input id="pfS1" type="password" autocomplete="new-password"><label for="pfS2">Repita a nova senha</label><input id="pfS2" type="password" autocomplete="new-password"></details>
<div id="pfM" role="alert"></div>
<div class="pfbt"><button type="button" id="pfX" onclick="pfCancelar()">Sair</button><button type="button" class="p" id="pfOk" onclick="pfSalvar()">Salvar</button></div>
</div></div>
<script>
function lgVer(){var i=document.getElementById('lgS'),b=document.getElementById('lgV'),on=i.type==='password';i.type=on?'text':'password';document.getElementById('lgVo').style.display=on?'none':'grid';document.getElementById('lgVx').style.display=on?'grid':'none';var t=on?'Ocultar senha':'Mostrar senha';b.setAttribute('aria-label',t);b.title=t;b.setAttribute('aria-pressed',on?'true':'false');i.focus()}
</script>
