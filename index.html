<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROFE Distribuidora — Prestação de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul-900:#0B2A4A; --azul-700:#0E4FA0; --azul:#1565C0; --azul-claro:#E3EEFB;
  --vermelho:#D32F2F; --vermelho-claro:#FDECEC; --verde:#1E7B3A; --verde-claro:#E6F4EA;
  --branco:#FFFFFF; --cinza:#F4F6F9; --cinza-borda:#E6ECF2; --texto-suave:#5B6B7F;
  --raio:18px; --sombra:0 12px 30px rgba(11,42,74,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--cinza);color:var(--azul-900);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.oculto{display:none!important}

/* ===== Login ===== */
#tela-login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-marca{background:linear-gradient(160deg,var(--azul-900),var(--azul-700) 60%,var(--azul));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-marca::before{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06)}
.login-marca::after{content:"";position:absolute;right:40px;bottom:-170px;width:320px;height:320px;border-radius:50%;background:rgba(211,47,47,.18)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:1.5px;position:relative;z-index:1}
.login-texto{position:relative;z-index:1;max-width:520px}
.login-texto h1{font-size:50px;line-height:1.08;margin:0 0 20px;font-weight:800;letter-spacing:-1px}
.login-texto h1 span{color:#FF7A7A}
.login-texto p{color:rgba(255,255,255,.8);font-size:17px;margin:0}
.login-stats{display:flex;gap:36px;position:relative;z-index:1}
.login-stats strong{display:block;font-size:28px}
.login-stats span{font-size:13px;color:rgba(255,255,255,.7)}
.login-form-area{display:grid;place-items:center;padding:40px 24px}
.card-login{width:100%;max-width:420px;background:var(--branco);border-radius:24px;padding:44px 40px;box-shadow:0 24px 60px rgba(11,42,74,.12)}
.card-login h2{margin:0 0 6px;font-size:26px}
.card-login .sub{color:var(--texto-suave);margin:0 0 28px}
.campo{margin-bottom:18px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.campo input,.campo select,.campo textarea{width:100%;height:50px;border:1.5px solid #D5DEE8;border-radius:12px;padding:0 15px;background:#F9FBFD;color:var(--azul-900)}
.campo textarea{height:auto;min-height:90px;padding:12px 15px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(21,101,192,.15)}
.campo-senha{position:relative}
.campo-senha input{padding-right:48px}
.btn-olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:#7A8899}
.btn-olho:hover{color:var(--azul);background:rgba(21,101,192,.08)}
.btn-olho:focus-visible{outline:2px solid var(--azul)}
.btn-olho svg{width:20px;height:20px;display:block}
.btn{height:54px;border:0;border-radius:14px;padding:0 22px;font-weight:700;font-size:15px;letter-spacing:.3px;transition:transform .08s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primario{background:linear-gradient(90deg,var(--azul),var(--azul-700));color:#fff;box-shadow:0 10px 24px rgba(21,101,192,.32)}
.btn-vermelho{background:var(--vermelho);color:#fff;box-shadow:0 10px 22px rgba(211,47,47,.28)}
.btn-contorno{background:var(--branco);color:var(--azul);border:1.5px solid var(--azul)}
.btn-bloco{width:100%}
.btn-pequeno{height:40px;font-size:13px;padding:0 14px;border-radius:10px}
.erro{background:var(--vermelho-claro);color:var(--vermelho);padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}
.rodape-login{margin-top:22px;text-align:center;font-size:12px;color:#7A8899}

/* ===== Layout interno ===== */
#tela-app{min-height:100%}
.topo{background:linear-gradient(160deg,var(--azul-900),var(--azul));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topo .logo{font-size:14px}
.topo-direita{display:flex;align-items:center;gap:14px}
.usuario-badge{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:13px}
.sair{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600}
.corpo{display:flex;min-height:calc(100vh - 70px)}
.menu-lateral{width:240px;background:var(--azul-900);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.menu-lateral button{background:transparent;border:0;color:rgba(255,255,255,.8);text-align:left;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.menu-lateral button.ativo,.menu-lateral button:hover{background:var(--azul);color:#fff}
.conteudo{flex:1;padding:28px 32px;min-width:0}
.cabecalho-pagina{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cabecalho-pagina h1{margin:0;font-size:26px}
.cabecalho-pagina p{margin:4px 0 0;color:var(--texto-suave)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--branco);border-radius:var(--raio);padding:20px;box-shadow:var(--sombra)}
.card .rotulo{font-size:13px;color:var(--texto-suave)}
.card .valor{font-size:26px;font-weight:800;margin-top:6px}
.card.azul{border-left:4px solid var(--azul)}
.card.vermelho{border-left:4px solid var(--vermelho)}
.card.verde{border-left:4px solid var(--verde)}
.painel-bloco{background:var(--branco);border-radius:var(--raio);padding:22px;box-shadow:var(--sombra);margin-bottom:22px}
.painel-bloco h2{margin:0 0 14px;font-size:17px}
.acoes-rapidas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tabela-wrap{overflow-x:auto;background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--texto-suave);font-size:12px;letter-spacing:.5px;padding:14px 12px;background:#FAFBFD;font-weight:600;white-space:nowrap}
td{padding:14px 12px;border-top:1px solid var(--cinza-borda);vertical-align:middle}
td.num{white-space:nowrap;font-weight:600}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.aguardando{background:var(--azul-claro);color:var(--azul)}
.tag.aprovado{background:var(--verde-claro);color:var(--verde)}
.tag.rejeitado{background:var(--vermelho-claro);color:var(--vermelho)}
.filtros{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.filtros input,.filtros select{height:42px;border:1.5px solid #D5DEE8;border-radius:12px;padding:0 14px;background:var(--branco);min-width:160px}
.vazio{padding:32px;text-align:center;color:var(--texto-suave)}
.grade-form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grade-form .inteiro{grid-column:1/-1}
.aviso-demo{font-size:12px;color:var(--texto-suave);margin-top:14px}
.mini{font-size:13px;color:var(--texto-suave)}
.linha-acoes{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Ícones e animações ===== */
.ico{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.ico-wrap{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.08);flex-shrink:0;transition:background .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.menu-lateral button{display:flex;align-items:center;gap:12px;transition:background .25s,transform .3s cubic-bezier(.34,1.56,.64,1),color .2s}
.menu-lateral button:hover{transform:translateX(5px)}
.menu-lateral button:active{transform:scale(.97)}
.menu-lateral button:hover .ico,.menu-lateral button.ativo .ico{transform:scale(1.15) rotate(-8deg)}
.menu-lateral button:hover .ico-wrap{background:rgba(255,255,255,.2);transform:rotate(-4deg)}
.menu-mobile button{transition:background .25s,color .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.menu-mobile button:hover .ico{transform:translateY(-3px) scale(1.12)}
.menu-mobile button:active{transform:scale(.92)}
.menu-mobile button.ativo .ico{animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.card{transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(11,42,74,.16)}
.card .rotulo{display:flex;align-items:center;gap:10px}
.ico-card{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--azul-claro);color:var(--azul);flex-shrink:0;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s}
.ico-card .ico{width:17px;height:17px}
.card:hover .ico-card{transform:rotate(-10deg) scale(1.12);background:var(--azul);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,box-shadow .25s,filter .25s}
.btn .ico{width:18px;height:18px}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 28px rgba(11,42,74,.18)}
.btn:hover .ico{transform:translateX(3px) rotate(-6deg)}
.sair{display:inline-flex;align-items:center;gap:8px;transition:background .25s,transform .25s}
.sair .ico{width:17px;height:17px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sair:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.sair:hover .ico{transform:translateX(3px)}
.logo-img{height:74px;width:auto;display:block;transition:transform .45s cubic-bezier(.34,1.56,.64,1),filter .3s}
.logo-img-topo{height:50px}
.logo:hover .logo-img{transform:scale(1.06) rotate(-2deg)}
.avatar{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.avatar:hover{transform:scale(1.12)}
tbody tr{transition:background .2s}
tbody tr:hover{background:#F7FAFE}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.linha-clicavel{cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(11,42,74,.45);display:flex;z-index:60;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay>.modal{margin:auto}
.modal{background:var(--branco);border-radius:20px;padding:26px;width:100%;max-width:520px;box-shadow:0 30px 60px rgba(11,42,74,.25)}
.modal-topo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dados{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;margin:18px 0 0}
.dados dt{color:var(--texto-suave);font-size:13px}
.dados dd{margin:0;font-weight:600}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.galeria img{width:100%;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--cinza-borda);cursor:zoom-in;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.galeria img:hover{transform:scale(1.05);box-shadow:0 12px 24px rgba(11,42,74,.18)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:70;cursor:zoom-out;padding:20px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:14px}

.fotos-botoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grade-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.foto-item{background:var(--branco);border:1px solid var(--cinza-borda);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(11,42,74,.06)}
.foto-item img{width:100%;height:120px;object-fit:cover;display:block}
.foto-acoes{display:flex;gap:6px;padding:8px}
.foto-acoes .btn{flex:1;height:34px;font-size:12px;padding:0 8px}
.modal-editor{max-width:680px;max-height:92vh;overflow:auto}
.previa{display:grid;place-items:center;background:var(--azul-900);border-radius:14px;padding:10px;margin:14px 0;min-height:200px}
.previa canvas{max-width:100%;max-height:50vh;width:auto;height:auto;border-radius:8px}
.ferramentas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.controles{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.controles label{display:grid;gap:4px;font-size:13px;font-weight:600}
.controles input[type=range]{width:100%;accent-color:var(--azul)}
.rodape-editor{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
@media (max-width:820px){.controles{grid-template-columns:1fr}}

.sino{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,transform .25s}
.sino:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.sino .ico{width:20px;height:20px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sino:hover .ico{transform:rotate(-14deg) scale(1.1)}
.sino-n{position:absolute;top:-5px;right:-5px;background:var(--vermelho);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--azul-900)}
.sino-n[hidden]{display:none}
.ordenavel{cursor:pointer;user-select:none;white-space:nowrap}
.ordenavel:hover{color:var(--azul)}
.paginacao{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.grade-graficos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.grade-graficos canvas{max-height:260px}
@media (max-width:820px){
  .grade-graficos{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}
  .cabecalho-pagina{flex-direction:column;align-items:flex-start}
  .filtros input,.filtros select{min-width:0;flex:1 1 140px}
}

.avatar{border:0;padding:0;cursor:pointer;color:#fff;font-family:inherit;font-weight:700;font-size:13px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar:focus-visible{outline:3px solid rgba(255,255,255,.6);outline-offset:2px}
.avatar-grande{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--azul-900));color:#fff;display:grid;place-items:center;font-weight:800;font-size:30px;overflow:hidden;box-shadow:0 10px 24px rgba(11,42,74,.25)}
.avatar-grande img{width:100%;height:100%;object-fit:cover}
.perfil-foto{display:grid;justify-items:center;gap:12px}
.modal-perfil{max-width:520px}

.contatos{display:flex;flex-wrap:wrap;gap:8px}
.contato-link{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--azul-claro);color:var(--azul);font-weight:600;font-size:13px;text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.contato-link:hover{transform:translateY(-2px);background:var(--azul);color:#fff}
.contato-link .ico{width:16px;height:16px}
.contato-link[href^="https://wa.me"]{background:#E6F4EA;color:#1E7B3A}
.contato-link[href^="https://wa.me"]:hover{background:#1E7B3A;color:#fff}

.linha-em-viagem td{background:#E6F4EA}
.linha-em-viagem td:first-child{box-shadow:inset 4px 0 0 #1E7B3A}
.tag.disponivel{background:#EEF2F6;color:#5B6B7F}
.legenda{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--texto-suave);margin:-8px 0 14px}
.bolinha{width:12px;height:12px;border-radius:50%;background:#D5DEE8;display:inline-block}
.bolinha.verde{background:#1E7B3A}


@keyframes piscar{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes piscar-lento{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes anel{0%{box-shadow:0 0 0 0 rgba(30,123,58,.55)}70%{box-shadow:0 0 0 9px rgba(30,123,58,0)}100%{box-shadow:0 0 0 0 rgba(30,123,58,0)}}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entrar{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes fundo-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sino-balanca{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(0)}}
@keyframes pulso-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes brilho-card{0%,100%{box-shadow:0 0 0 0 rgba(30,123,58,0)}50%{box-shadow:0 0 0 6px rgba(30,123,58,.12)}}

.status-vivo{display:inline-flex;align-items:center;gap:7px;color:var(--verde);font-weight:800;letter-spacing:.5px}
.status-vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde);animation:piscar 1.2s infinite,anel 1.8s infinite}
.bolinha.verde{background:#1E7B3A;animation:anel 1.8s infinite,piscar 1.8s infinite}
.linha-em-viagem .tag.aprovado{animation:piscar-lento 2.4s infinite}
.linha-em-viagem td:first-child{animation:brilho-card 2.4s infinite}
.viagem-ativa{animation:brilho-card 2.4s infinite}
.tag.aguardando{animation:piscar-lento 3s infinite}
.sino-n:not([hidden]){animation:pulso-badge 1s 3}
.sino.tem-novas .ico{animation:sino-balanca 1s 3}

.conteudo > *{animation:subir .5s both}
.cards > .card{animation:subir .55s both}
.cards > .card:nth-child(2){animation-delay:0.05s}
.cards > .card:nth-child(3){animation-delay:0.10s}
.cards > .card:nth-child(4){animation-delay:0.15s}
.cards > .card:nth-child(5){animation-delay:0.20s}
.cards > .card:nth-child(6){animation-delay:0.25s}
.cards > .card:nth-child(7){animation-delay:0.30s}
.cards > .card:nth-child(8){animation-delay:0.35s}
.tabela-wrap tbody tr{animation:entrar .4s both}
.tabela-wrap tbody tr:nth-child(2){animation-delay:0.04s}
.tabela-wrap tbody tr:nth-child(3){animation-delay:0.08s}
.tabela-wrap tbody tr:nth-child(4){animation-delay:0.12s}
.tabela-wrap tbody tr:nth-child(5){animation-delay:0.16s}
.tabela-wrap tbody tr:nth-child(6){animation-delay:0.20s}
.tabela-wrap tbody tr:nth-child(7){animation-delay:0.24s}
.tabela-wrap tbody tr:nth-child(8){animation-delay:0.28s}
.tabela-wrap tbody tr:nth-child(9){animation-delay:0.32s}
.tabela-wrap tbody tr:nth-child(10){animation-delay:0.36s}
.overlay{animation:fundo-in .25s both}
.overlay > .modal{animation:modal-in .35s cubic-bezier(.34,1.56,.64,1) both}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:99;display:grid;gap:8px;width:max-content;max-width:92vw;pointer-events:none}
.toast{padding:14px 20px;border-radius:14px;color:#fff;font-weight:600;font-size:14px;background:var(--verde);box-shadow:0 12px 30px rgba(11,42,74,.25);animation:toastEntrar .35s cubic-bezier(.34,1.56,.64,1) both}
.toast.toast-erro{background:var(--vermelho)}
.toast.saindo{animation:toastSair .35s both}
@keyframes toastEntrar{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastSair{to{opacity:0;transform:translateY(10px)}}
.card-login{animation:subir .6s both}
.login-texto h1{animation:subir .7s .1s both}
.grade-graficos canvas{animation:fundo-in .8s both}


body{background:radial-gradient(1200px 600px at 110% -10%,rgba(21,101,192,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(211,47,47,.07),transparent 55%),var(--cinza)}

/* ===== v27: situação "Em rota" + animações de situação em todas as abas ===== */
@keyframes tag-pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
@keyframes rodar-caminhao{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes estrada{from{background-position:0 0}to{background-position:24px 0}}
@keyframes disponivel-respira{0%,100%{box-shadow:0 0 0 0 rgba(91,107,127,0)}50%{box-shadow:0 0 0 4px rgba(91,107,127,.14)}}
@keyframes check-desenha{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes linha-flash{0%{background:rgba(30,123,58,.28)}100%{background:transparent}}

.tag{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both}
.tag.aguardando{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,piscar-lento 3s .5s infinite}
.tag.aprovado{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both}
.tag.rejeitado{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,tremer .5s .45s 1}
.tag.disponivel{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,disponivel-respira 3.2s .5s infinite}
.tag.em-rota{display:inline-flex;align-items:center;gap:7px;background:var(--verde-claro);color:var(--verde);position:relative;overflow:hidden;
  animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,anel 1.8s .5s infinite}
.tag.em-rota .ico{width:15px;height:15px;animation:rodar-caminhao .9s ease-in-out infinite}
.tag.em-rota::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:repeating-linear-gradient(90deg,var(--verde) 0 8px,transparent 8px 16px);opacity:.55;animation:estrada .8s linear infinite}
.linha-em-viagem .tag.aprovado,.linha-em-viagem .tag.em-rota{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,anel 1.8s .5s infinite}
.linha-em-viagem td{animation:linha-flash 1.2s .1s both}
.linha-em-viagem td:first-child{animation:linha-flash 1.2s .1s both,brilho-card 2.4s 1.3s infinite}
.cards > .card .valor{animation:subir .6s .15s both}
.menu-lateral button,.menu-mobile button{transition:background .25s,color .25s,transform .25s,box-shadow .25s}
.menu-lateral button:hover{transform:translateX(4px)}
.menu-lateral button.ativo{animation:entrar .35s both}
.campo select option:disabled{color:#9AA9BF}
[data-tema="escuro"] .tag.em-rota{background:rgba(30,123,58,.28);color:#7BE0A0}
[data-tema="escuro"] .tag.disponivel{background:#22324D;color:#9AA9BF}

/* ===== v28: reservas, duplicidade, lote, conversa, comparativo e busca ===== */
@keyframes alerta-pisca{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,0)}50%{box-shadow:0 0 0 4px rgba(211,47,47,.18)}}
@keyframes barra-cresce{from{transform:scaleX(0)}to{transform:none}}
@keyframes destaque-busca{0%,100%{box-shadow:inset 0 0 0 0 rgba(21,101,192,0)}50%{box-shadow:inset 0 0 0 3px rgba(21,101,192,.55)}}
@keyframes descer{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tag.agendada{display:inline-flex;align-items:center;gap:6px;background:var(--azul-claro);color:var(--azul);animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,piscar-lento 3s .5s infinite}
.tag.agendada .ico{width:14px;height:14px}
.reserva{display:flex;align-items:center;gap:5px;color:var(--azul);margin-top:5px;font-weight:600;animation:entrar .4s both}
.reserva .ico{width:13px;height:13px;flex-shrink:0}
.chip-dup{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 9px;border-radius:999px;background:var(--vermelho-claro);color:var(--vermelho);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;animation:tag-pop .45s both,alerta-pisca 2s .5s infinite}
.chip-dup .ico{width:13px;height:13px}
.chip-chat{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--azul-claro);color:var(--azul);font-size:11px;font-weight:800;vertical-align:middle}
.chip-chat .ico{width:12px;height:12px}
.alerta-dup{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--vermelho-claro);color:var(--vermelho);animation:tremer .5s both}
.alerta-dup .ico{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.alerta-dup .mini{color:var(--azul-900)}
.alerta-dup a{color:var(--vermelho);font-weight:800}
.col-sel{width:40px;text-align:center}
.col-sel input,#sel-todos{width:18px;height:18px;accent-color:var(--azul);cursor:pointer}
.linha-sel td{background:var(--azul-claro)!important}
.barra-lote{position:sticky;top:84px;z-index:15;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--azul-claro);border:1px solid rgba(21,101,192,.25);box-shadow:0 10px 24px rgba(11,42,74,.12);animation:descer .3s both}
.lote-aviso{display:inline-flex;align-items:center;gap:6px;color:var(--vermelho);font-weight:700;font-size:13px}
.lote-aviso .ico{width:15px;height:15px}
.lote-botoes{display:flex;gap:8px}
.chat{display:grid;gap:8px;max-height:260px;overflow:auto;padding:4px 2px}
.bolha{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;word-break:break-word;animation:subir .3s both}
.bolha-topo{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:11px;opacity:.85;margin-bottom:3px}
.bolha.minha{justify-self:end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
.bolha.outra{justify-self:start;background:var(--cinza);border:1px solid var(--cinza-borda);border-bottom-left-radius:4px}
.chat-envio{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.chat-envio textarea{flex:1;border:1.5px solid #D5DEE8;border-radius:12px;padding:8px 12px;resize:none;background:#F9FBFD;color:var(--azul-900)}
.chat-envio textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(21,101,192,.15)}
.rota-topo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rota-topo h2{margin:0}
.cmp-celula{display:flex;flex-direction:column;gap:5px;min-width:150px}
.cmp-barra{position:relative;height:10px;border-radius:999px;background:var(--cinza-borda)}
.cmp-barra span{display:block;height:100%;border-radius:999px;background:var(--azul);transform-origin:left;animation:barra-cresce .8s both}
.cmp-barra.alerta span{background:var(--vermelho)}
.cmp-barra i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--azul-900);border-radius:2px}
.desvio{font-weight:800}
.desvio.alto{color:var(--vermelho)}
.desvio.baixo{color:var(--verde)}
.linha-desvio td{background:rgba(211,47,47,.06)}
.destaque-busca td{animation:destaque-busca 1s 3!important}
.busca-global{position:relative;flex:1;max-width:460px;margin:0 16px}
.busca-global input{width:100%;height:40px;border:1.5px solid rgba(255,255,255,.28);border-radius:12px;padding:0 40px 0 38px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;transition:background .25s,border-color .25s,box-shadow .25s}
.busca-global input::placeholder{color:rgba(255,255,255,.7)}
.busca-global input:focus{outline:none;background:rgba(255,255,255,.2);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.busca-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:grid;place-items:center;color:#fff;pointer-events:none}
.busca-ico .ico{width:18px;height:18px}
.busca-atalho{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 11px/1 'Inter',sans-serif;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 7px;pointer-events:none}
.busca-global input:focus ~ .busca-atalho{opacity:0}
.busca-res{position:absolute;left:0;right:0;top:calc(100% + 8px);min-width:340px;max-height:70vh;overflow:auto;background:var(--branco);color:var(--azul-900);border:1px solid var(--cinza-borda);border-radius:16px;box-shadow:0 24px 50px rgba(11,42,74,.3);padding:8px;animation:descer .2s both;z-index:95}
.busca-grupo{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--texto-suave)}
.busca-grupo span{background:var(--azul-claro);color:var(--azul);border-radius:999px;padding:1px 8px}
.busca-item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:inherit;padding:9px 10px;border-radius:12px;transition:background .15s,transform .15s}
.busca-item:hover,.busca-item.ativo{background:var(--azul-claro);transform:translateX(3px)}
.busca-item .ico{width:20px;height:20px;flex-shrink:0;color:var(--azul)}
.bi-txt{display:grid;min-width:0}
.bi-txt strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.busca-mais,.busca-vazio{padding:10px;font-size:13px;color:var(--texto-suave)}
@media (max-width:820px){
  .topo{flex-wrap:wrap}
  .busca-global{order:3;flex:1 0 100%;max-width:none;margin:8px 0 0}
  .busca-res{min-width:0}
  .barra-lote{top:118px}
}
[data-tema="escuro"] .busca-res{color:#E6EEF9}
[data-tema="escuro"] .bolha.outra{background:#101C30}
[data-tema="escuro"] .chat-envio textarea{background:#0F1A2D;color:#E6EEF9;border-color:#2C3E5C}
[data-tema="escuro"] .alerta-dup .mini{color:#E6EEF9}
[data-tema="escuro"] .linha-sel td{background:rgba(21,101,192,.28)!important}
[data-tema="escuro"] .linha-desvio td{background:rgba(211,47,47,.14)}

/* ===== Dúvidas (chat com opções clicáveis) ===== */
.dv-chat{display:grid;gap:12px;align-content:start;min-height:260px;max-height:50vh;overflow-y:auto;padding:6px 4px 10px;scroll-behavior:smooth}
.dv-linha{display:flex;gap:10px;align-items:flex-end;animation:subir .35s both}
.dv-linha.usuario{flex-direction:row-reverse}
.dv-av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--azul),var(--azul-900));color:#fff}
.dv-av .ico{width:18px;height:18px}
.dv-bolha{max-width:min(82%,640px);padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.55}
.dv-linha.bot .dv-bolha{background:var(--cinza);border:1px solid var(--cinza-borda);border-bottom-left-radius:4px}
.dv-linha.usuario .dv-bolha{background:var(--azul);color:#fff;border-bottom-right-radius:4px}
.dv-quem{display:block;font-size:11px;opacity:.75;margin-bottom:2px;font-weight:600}
.dv-digitando{display:inline-flex;gap:5px;padding:4px 2px}
.dv-digitando i{width:7px;height:7px;border-radius:50%;background:var(--texto-suave);opacity:.55;animation:dvPulso 1s infinite}
.dv-digitando i:nth-child(2){animation-delay:.15s}.dv-digitando i:nth-child(3){animation-delay:.3s}
@keyframes dvPulso{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
.dv-opcoes{margin-top:14px;padding-top:14px;border-top:1px solid var(--cinza-borda)}
.dv-titulo-op{font-size:13px;font-weight:700;color:var(--texto-suave);margin:0 0 10px}
.dv-temas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dv-tema{border:1.5px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;transition:border-color .2s,background .2s}
.dv-tema.ativo{background:var(--azul-claro);border-color:var(--azul);color:var(--azul-700)}
.dv-lista{display:grid;gap:8px}
.dv-perg{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;width:100%;border:1.5px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;transition:border-color .2s,background .2s,transform .2s}
.dv-perg:hover{border-color:var(--azul);background:var(--azul-claro);transform:translateY(-1px)}
.dv-perg:disabled{opacity:.6;cursor:wait;transform:none}
.dv-perg .dv-vista{flex:0 0 auto;color:var(--verde);display:none}
.dv-perg.vista .dv-vista{display:inline-grid}
.dv-perg .dv-vista .ico{width:16px;height:16px}
.dv-rodape{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
[data-tema="escuro"] .dv-tema,[data-tema="escuro"] .dv-perg{color:#E6EEF9}
[data-tema="escuro"] .dv-tema.ativo{color:#8FC1FF}
[data-tema="escuro"] .dv-linha.bot .dv-bolha{background:#101C30}
[data-tema="escuro"] .dv-perg:hover{background:#1A2A44}
@media (max-width:820px){.dv-bolha{max-width:88%}.dv-chat{max-height:46vh}}

.dv-assist-av{flex:0 0 auto;width:132px;height:132px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--azul),var(--azul-900));box-shadow:0 10px 28px rgba(11,42,74,.25)}
.dv-assist-av.falando{animation:dvAnel 1.3s ease-out infinite}
@keyframes dvAnel{0%{box-shadow:0 10px 28px rgba(11,42,74,.25),0 0 0 0 rgba(21,101,192,.5)}100%{box-shadow:0 10px 28px rgba(11,42,74,.25),0 0 0 18px rgba(21,101,192,0)}}
.dv-assist-txt{display:grid;gap:3px}
.dv-assist-txt strong{font-size:17px;color:var(--azul-900)}
.dv-assist-txt .mini{display:flex;align-items:center;gap:7px}
.dv-assist-txt .mini::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde);flex:0 0 auto}
[data-tema="escuro"] .dv-assist{border-color:#24324A}
[data-tema="escuro"] .dv-assist-txt strong{color:#E6EEF9}
@media (max-width:820px){.dv-assist-av{width:96px;height:96px}.dv-assist{gap:12px}}

/* ===== v32: conferência do cartão de combustível ===== */
.tag.cc-ok,.tag.cc-div,.tag.cc-falta,.tag.cc-base{animation:none}
.tag.cc-ok{background:var(--verde-claro);color:var(--verde)}
.tag.cc-div{background:#FFF1D6;color:#9A5B00}
.tag.cc-falta{background:var(--vermelho-claro);color:var(--vermelho)}
.tag.cc-base{background:#EEF2F6;color:var(--texto-suave)}
[data-tema="escuro"] .tag.cc-ok{background:rgba(30,123,58,.28);color:#7BE0A0}
[data-tema="escuro"] .tag.cc-div{background:rgba(255,170,40,.2);color:#FFC46B}
[data-tema="escuro"] .tag.cc-falta{background:rgba(211,47,47,.25);color:#FF9A9A}
[data-tema="escuro"] .tag.cc-base{background:#22324D;color:#9AA9BF}
.card .mini{margin-top:2px}

function renderLogin(){
  const card = document.querySelector('.card-login');
  card.innerHTML = `<h2>Bem-vindo</h2>
    <p class="sub">Entre com seu e-mail e senha.</p>
    <div class="erro oculto" id="login-erro"></div>
    <form id="form-login" novalidate>
      <div class="campo"><label for="login-email">E-mail</label><input id="login-email" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="login-senha">Senha</label>
        <div class="campo-senha"><input id="login-senha" type="password" autocomplete="current-password" required>
          <button type="button" class="btn-olho" id="btn-olho" aria-label="Mostrar senha" title="Mostrar senha"></button></div></div>
      <button class="btn btn-primario btn-bloco" type="submit">ENTRAR</button>
    </form>
    <div class="rodape-login">Acesso restrito a motoristas e administração ROFE</div>`;
  const OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const OLHO_CORTADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18.7 18.7 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>';
  const campoSenha = card.querySelector('#login-senha');
  const btnOlho = card.querySelector('#btn-olho');
  btnOlho.innerHTML = OLHO;
  btnOlho.addEventListener('click', () => {
    const mostrar = campoSenha.type === 'password';
    campoSenha.type = mostrar ? 'text' : 'password';
    btnOlho.innerHTML = mostrar ? OLHO_CORTADO : OLHO;
    const rot = mostrar ? 'Ocultar senha' : 'Mostrar senha';
    btnOlho.setAttribute('aria-label', rot); btnOlho.title = rot;
    campoSenha.focus();
  });
  card.querySelector('#form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const email = card.querySelector('#login-email').value.trim();
    const senha = card.querySelector('#login-senha').value;
    const btn = card.querySelector('button[type="submit"]');
    const erro = card.querySelector('#login-erro');
    erro.classList.add('oculto');
    if(!email || !senha){ erro.textContent = 'Informe e-mail e senha.'; erro.classList.remove('oculto'); return; }
    if(!window.RofeAuth){ erro.textContent = 'Não foi possível carregar o Firebase. Verifique sua conexão.'; erro.classList.remove('oculto'); return; }
    btn.disabled = true; btn.textContent = 'ENTRANDO…';
    try { await window.RofeAuth.entrar(email, senha); }   /* o restante acontece em rofeAbrirSessao() */
    catch(err){ window.rofeLoginErro(window.RofeAuth.traduzirErro(err)); }
  });
}
/* Chamadas pelo módulo do Firebase (final do arquivo) */
window.rofeLoginErro = function(msg){
  const erro = document.getElementById('login-erro');
  const btn = document.querySelector('#form-login button[type="submit"]');
  if(btn){ btn.disabled = false; btn.textContent = 'ENTRAR'; }
  if(erro){ erro.textContent = msg; erro.classList.remove('oculto'); }
};
window.rofeAbrirSessao = function(uid, email, perfilDoc){
  if(usuarioAtual && usuarioAtual.uid === uid) return;
  /* liga o usuário do Firebase ao cadastro em memória (campo idApp) enquanto os dados não migram para o Firestore */
  let u = USUARIOS.find(x => x.id === perfilDoc.idApp);
  if(!u){
    u = { id: perfilDoc.idApp || uid, usuario: email, perfil: perfilDoc.perfil, nome: perfilDoc.nome || email, ativo: true };
    USUARIOS.push(u);
  }
  u.uid = uid; u.email = u.email || email;
  /* campos de perfil salvos no Firestore */
  ['telefone','email','foto','tema','cadastroFeito'].forEach(k => { if(perfilDoc[k] !== undefined && perfilDoc[k] !== '') u[k] = perfilDoc[k]; });
  usuarioAtual = u;
  entrar();
};

  atualizarMenuAvisos();
}
function marcarMenu(){
  document.querySelectorAll('[data-rota]').forEach(b =>

}
function irPara(rota){
  promoverAgendadas();
  rotaAtual = rota;
  limparAviso(rota);
  fecharPainelAvisos();
  montarMenus();
  marcarMenu();
  const c = document.getElementById('conteudo');
  const telas = usuarioAtual.perfil === 'admin' ? TELAS_ADMIN : TELAS_MOTORISTA;
  (telas[rota] || telas.inicio)(c);

  exibirNotificacoesPendentes();
  atualizarSino();
  document.querySelectorAll('[data-det]').forEach(tr => tr.addEventListener('click', () => abrirDetalhe(+tr.dataset.det)));
  document.querySelectorAll('[data-viagem-atalho]').forEach(el => el.addEventListener('click', () => { irPara('viagens'); mostrarViagem(+el.dataset.viagemAtalho); }));
  window.scrollTo(0,0);
}

      </table></div>` : '<div class="card vazio">Nenhum motorista encontrado.</div>';
    };
    document.getElementById('m-busca').addEventListener('input', desenhar);
    desenhar();
  },

  comparativo(c){
    const fin = viagens.filter(v => v.status === 'finalizada');
    c.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Comparativo de viagens</h1><p>Mesma rota, custo diferente: encontre desvios nas viagens finalizadas.</p></div>
        <div class="filtros" style="margin:0"><select id="cmp-lim" title="Limite de desvio sobre a média da rota">${[10,20,30,50].map(p => `<option value="${p}" ${p===filtroCmp.limite?'selected':''}>Alertar acima de +${p}% da média</option>`).join('')}</select></div></div>
      <div id="cmp-conteudo"></div>
      <div id="detalhe-viagem"></div>`;
    const desenhar = () => {
      const limite = filtroCmp.limite;
      const grupos = {};
      fin.forEach(v => {
        const k = norm(v.origem) + '>' + norm(v.destino);
        (grupos[k] = grupos[k] || { rota: v.origem.toUpperCase() + ' → ' + v.destino.toUpperCase(), itens: [] }).itens.push(v);
      });
      const todos = Object.values(grupos);
      const comp = todos.filter(g => g.itens.length >= 2);
      const sozinhas = todos.length - comp.length;
      comp.forEach(g => {
        g.itens = g.itens.map(v => {
          const mt = metricasViagem(v), cats = {};
          mt.regs.filter(d => d.status !== 'rejeitado').forEach(d => { cats[d.categoria] = (cats[d.categoria] || 0) + d.valor; });
          return { v, mt, cats };
        });
        g.media = g.itens.reduce((s,i) => s + i.mt.custo, 0) / g.itens.length;
        g.max = Math.max(...g.itens.map(i => i.mt.custo), 1);
        const nomesCat = [...new Set(g.itens.flatMap(i => Object.keys(i.cats)))];
        const mediaCat = {};
        nomesCat.forEach(k => { mediaCat[k] = g.itens.reduce((s,i) => s + (i.cats[k] || 0), 0) / g.itens.length; });
        g.itens.forEach(i => {
          i.desvio = g.media > 0 ? (i.mt.custo - g.media) / g.media * 100 : 0;
          i.alto = i.desvio >= limite;
          let pior = null;
          nomesCat.forEach(k => { const dif = (i.cats[k] || 0) - mediaCat[k]; if(!pior || dif > pior.dif) pior = { cat:k, dif }; });
          i.pior = pior && pior.dif > 0 ? pior : null;
        });
        g.altos = g.itens.filter(i => i.alto).length;
      });
      comp.sort((a,b) => b.altos - a.altos || b.itens.length - a.itens.length);
      const totalAltos = comp.reduce((s,g) => s + g.altos, 0);
      const excesso = comp.reduce((s,g) => s + g.itens.filter(i => i.alto).reduce((x,i) => x + (i.mt.custo - g.media), 0), 0);

      const linhasCam = CAMINHOES.map(x => {
        const vs = fin.filter(v => v.placa === x.placa);
        if(!vs.length) return null;
        const ms = vs.map(v => metricasViagem(v));
        const comKm = ms.filter(m => m.km);
        const km = comKm.reduce((s,m) => s + m.km, 0);
        const custoKm = comKm.reduce((s,m) => s + m.custo, 0);
        const comLit = comKm.filter(m => m.litros > 0);
        const consumo = comLit.length ? comLit.reduce((s,m) => s + m.km, 0) / comLit.reduce((s,m) => s + m.litros, 0) : null;
        return { x, n: vs.length, custo: ms.reduce((s,m) => s + m.custo, 0), km, rkm: km > 0 ? custoKm / km : null, litros: ms.reduce((s,m) => s + m.litros, 0), consumo };
      }).filter(Boolean).sort((a,b) => (b.rkm ?? -1) - (a.rkm ?? -1));

      document.getElementById('cmp-conteudo').innerHTML = `
        <div class="cards">
          <div class="card azul"><div class="rotulo">Rotas comparáveis</div><div class="valor">${comp.length}</div></div>
          <div class="card vermelho"><div class="rotulo">Viagens com desvio</div><div class="valor">${totalAltos}</div></div>
          <div class="card vermelho"><div class="rotulo">Excesso acima da média</div><div class="valor">${fmtBRL(excesso)}</div></div>
          <div class="card"><div class="rotulo">Viagens finalizadas</div><div class="valor">${fin.length}</div></div>
        </div>
        ${comp.length ? comp.map(g => `
          <div class="painel-bloco">
            <div class="rota-topo"><h2>${esc(g.rota)}</h2>
              <span class="mini">${g.itens.length} viagens · média ${fmtBRL(g.media)}${g.altos ? ` · <strong style="color:var(--vermelho)">${g.altos} com desvio</strong>` : ''}</span></div>
            <div class="tabela-wrap" style="box-shadow:none"><table>
              <thead><tr><th>VIAGEM</th><th>MOTORISTA</th><th>CAMINHÃO</th><th>SAÍDA</th><th>CUSTO × MÉDIA</th><th>DESVIO</th><th>MAIOR EXCESSO</th><th>R$/KM</th></tr></thead>
              <tbody>${g.itens.slice().sort((a,b) => b.mt.custo - a.mt.custo).map(i => `<tr class="linha-clicavel ${i.alto ? 'linha-desvio' : ''}" data-viagem="${i.v.id}">
                <td class="num">#${i.v.id}</td><td>${esc(nomeMotorista(i.v.motoristaId))}</td><td>${esc(i.v.placa)}</td><td>${fmtData(i.v.saida)}</td>
                <td><div class="cmp-celula"><div class="cmp-barra ${i.alto ? 'alerta' : ''}"><span style="width:${(i.mt.custo / g.max * 100).toFixed(0)}%"></span><i style="left:${(g.media / g.max * 100).toFixed(0)}%" title="Média da rota"></i></div><strong>${fmtBRL(i.mt.custo)}</strong></div></td>
                <td><span class="desvio ${i.alto ? 'alto' : i.desvio <= -limite ? 'baixo' : ''}">${i.desvio > 0 ? '+' : ''}${fmtNum(i.desvio, 0)}%</span></td>
                <td>${i.pior ? esc(i.pior.cat) + ' <span class="mini">+' + fmtBRL(i.pior.dif) + '</span>' : '—'}</td>
                <td>${i.mt.custoKm != null ? fmtBRL(i.mt.custoKm) : '—'}</td></tr>`).join('')}</tbody>
            </table></div>
          </div>`).join('')
        : `<div class="painel-bloco"><div class="vazio">Ainda não há duas ou mais viagens finalizadas na mesma rota (origem → destino).${sozinhas ? ' ' + sozinhas + ' rota(s) com apenas uma viagem.' : ''}</div></div>`}
        ${comp.length && sozinhas ? `<p class="mini">${sozinhas} rota(s) com apenas uma viagem finalizada ficaram fora da comparação.</p>` : ''}
        <div class="painel-bloco"><h2>Desempenho por caminhão</h2>
          ${linhasCam.length ? `<div class="tabela-wrap" style="box-shadow:none"><table>
            <thead><tr><th>CAMINHÃO</th><th>VIAGENS</th><th>KM RODADO</th><th>CUSTO TOTAL</th><th>CUSTO/KM</th><th>LITROS</th><th>CONSUMO (KM/L)</th></tr></thead>
            <tbody>${linhasCam.map(l => `<tr><td class="num">${esc(l.x.placa)}<div class="mini">${esc(l.x.modelo)}</div></td><td>${l.n}</td>
              <td>${l.km ? fmtNum(l.km, 0) + ' km' : '—'}</td><td class="num">${fmtBRL(l.custo)}</td>
              <td>${l.rkm != null ? fmtBRL(l.rkm) : '—'}</td><td>${l.litros ? fmtNum(l.litros, 1) + ' L' : '—'}</td><td>${l.consumo != null ? fmtNum(l.consumo, 2) : '—'}</td></tr>`).join('')}</tbody>
          </table></div>` : '<div class="vazio">Sem viagens finalizadas ainda.</div>'}
          <p class="mini" style="margin-top:12px">Custos desconsideram registros rejeitados. Km rodado = km final − km inicial da viagem. O consumo usa os litros informados nos registros de combustível.</p>
        </div>`;
      document.querySelectorAll('#cmp-conteudo [data-viagem]').forEach(tr => tr.addEventListener('click', () => mostrarViagem(+tr.dataset.viagem)));
    };
    document.getElementById('cmp-lim').addEventListener('change', e => { filtroCmp.limite = +e.target.value; desenhar(); });
    desenhar();
  },

  relatorios(c){
    c.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Relatórios</h1><p>Filtre, agrupe e exporte para fechar as contas.</p></div>
        <div class="linha-acoes">
          <button class="btn btn-contorno btn-pequeno" data-exp="xlsx">Exportar Excel</button>
          <button class="btn btn-primario btn-pequeno" data-exp="pdf">Exportar PDF</button>
        </div></div>
      <div class="painel-bloco">
        <div class="filtros" style="margin-bottom:0">
          <select id="r-motorista"><option value="">Todos os motoristas</option>${USUARIOS.filter(u=>u.perfil==='motorista').map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join('')}</select>
          <select id="r-placa"><option value="">Todos os caminhões</option>${CAMINHOES.map(x=>`<option>${esc(x.placa)}</option>`).join('')}</select>
          <select id="r-viagem"><option value="">Todas as viagens</option>${viagens.map(v=>`<option value="${v.id}">Viagem #${v.id} — ${esc(v.origem)} → ${esc(v.destino)}</option>`).join('')}</select>

          <select id="r-status"><option value="">Todos os status</option>${Object.entries(rotulosStatus).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
          <select id="r-agrupar"><option value="">Sem agrupamento</option><option value="motorista">Por motorista</option><option value="placa">Por caminhão</option><option value="viagem">Por viagem</option><option value="categoria">Por categoria</option><option value="mes">Por mês</option></select>
          <input type="date" id="r-de" title="Data inicial"><input type="date" id="r-ate" title="Data final">

    ['r-motorista','r-placa','r-viagem','r-categoria','r-status','r-agrupar','r-de','r-ate'].forEach(id =>

  auditoria(c){
    c.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Auditoria</h1><p>Todas as ações registradas no sistema.</p></div></div>
      <div class="filtros">
        <select id="a-usuario"><option value="">Todos os usuários</option>${[...new Set(auditoria.map(a=>a.quem))].map(q=>`<option>${esc(q)}</option>`).join('')}</select>
        <input type="date" id="a-de" title="Data inicial"><input type="date" id="a-ate" title="Data final">
      </div>
      <div id="a-tabela"></div>`;
    let pag = 1;
    const desenhar = () => {
      const u = document.getElementById('a-usuario').value;
      const de = document.getElementById('a-de').value;
      const ate = document.getElementById('a-ate').value;
      const lista = auditoria.filter(a => (!u || a.quem===u) && (!de || a.dataIso>=de) && (!ate || a.dataIso<=ate)).slice().reverse();
      const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
      if(pag > paginas) pag = paginas;
      const pagina = lista.slice((pag-1)*POR_PAGINA, pag*POR_PAGINA);
      document.getElementById('a-tabela').innerHTML = !lista.length
        ? '<div class="card vazio">Nenhuma ação registrada.</div>'
        : `<div class="tabela-wrap"><table>
            <thead><tr><th>QUANDO</th><th>USUÁRIO</th><th>PERFIL</th><th>AÇÃO</th><th>DETALHE</th></tr></thead>
            <tbody>${pagina.map(a=>`<tr><td>${esc(a.quando)}</td><td>${esc(a.quem)}</td><td>${a.perfil==='admin'?'Contador':'Motorista'}</td><td>${esc(a.acao)}</td><td class="mini">${esc(a.detalhe)}</td></tr>`).join('')}</tbody>
          </table></div>
          <div class="paginacao"><span class="mini">${lista.length} ação(ões) · página ${pag} de ${paginas}</span>
            <button class="btn btn-pequeno btn-contorno" data-p="-1" ${pag<=1?'disabled':''}>Anterior</button>
            <button class="btn btn-pequeno btn-contorno" data-p="1" ${pag>=paginas?'disabled':''}>Próxima</button></div>`;
      document.querySelectorAll('#a-tabela [data-p]').forEach(b => b.addEventListener('click', () => { pag += +b.dataset.p; desenhar(); }));
    };
    ['a-usuario','a-de','a-ate'].forEach(id => document.getElementById(id).addEventListener('change', () => { pag = 1; desenhar(); }));
    desenhar();
  }
};

function desenharTabelaAdmin(){
  const t = filtroAdmin.texto.toLowerCase();
  const lista = despesas.filter(d => {
    const motorista = nomeMotorista(d.motoristaId);
    return (!t || (motorista+d.placa+d.descricao).toLowerCase().includes(t))
      && (!filtroAdmin.status || d.status===filtroAdmin.status)
      && (!filtroAdmin.categoria || d.categoria===filtroAdmin.categoria)
      && (!filtroAdmin.de || d.data >= filtroAdmin.de)
      && (!filtroAdmin.ate || d.data <= filtroAdmin.ate)
      && (!filtroAdmin.dup || (d.status !== 'rejeitado' && duplicidadesDe(d).length > 0));
  });
  const chaves = { data:d=>d.data, valor:d=>d.valor, motorista:d=>nomeMotorista(d.motoristaId), placa:d=>d.placa, categoria:d=>d.categoria, status:d=>d.status };
  const campo = chaves[ordemAdmin.campo];
  lista.sort((a,b) => { const x = campo(a), y = campo(b); return (x>y?1:x<y?-1:0) * ordemAdmin.dir; });
  const total = lista.length;
  const alvo = document.getElementById('tabela-admin');
  if(!total){ alvo.innerHTML = '<div class="card vazio">Nenhum registro encontrado.</div>'; return; }
  const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  if(paginaAdmin > paginas) paginaAdmin = paginas;
  const pagina = lista.slice((paginaAdmin-1)*POR_PAGINA, paginaAdmin*POR_PAGINA);
  const seta = c => ordemAdmin.campo === c ? (ordemAdmin.dir > 0 ? ' ▲' : ' ▼') : '';
  const th = (c, rot) => `<th class="ordenavel" data-ord="${c}">${rot}${seta(c)}</th>`;
  [...selecionados].forEach(id => { const r = despesas.find(x => x.id === id); if(!r || r.status !== 'aguardando') selecionados.delete(id); });
  alvo.innerHTML = `<div class="barra-lote oculto" id="barra-lote">
      <span><strong id="lote-n">0</strong> selecionado(s) · <strong id="lote-total">R$ 0,00</strong></span>
      <span class="lote-aviso oculto" id="lote-aviso">${icon('alert')}<span></span></span>
      <span class="lote-botoes"><button class="btn btn-pequeno btn-primario" type="button" data-aprovar-lote>Aprovar selecionados</button><button class="btn btn-pequeno btn-contorno" type="button" data-limpar-lote>Limpar</button></span>
    </div>
    <div class="tabela-wrap"><table>
    <thead><tr><th class="col-sel"><input type="checkbox" id="sel-todos" title="Selecionar todos os pendentes desta página" aria-label="Selecionar todos os pendentes desta página"></th>${th('data','DATA')}${th('motorista','MOTORISTA')}${th('placa','PLACA')}${th('categoria','CATEGORIA')}${th('valor','VALOR')}<th>TIPO</th>${th('status','STATUS')}<th>AÇÕES</th></tr></thead>
    <tbody>${pagina.map(d => {
      const dups = d.status !== 'rejeitado' ? duplicidadesDe(d) : [];
      return `<tr class="${selecionados.has(d.id) ? 'linha-sel' : ''}">
      <td class="col-sel">${d.status==='aguardando' ? `<input type="checkbox" class="sel-reg" data-sel="${d.id}" aria-label="Selecionar registro ${d.id}" ${selecionados.has(d.id) ? 'checked' : ''}>` : ''}</td>
      <td>${fmtData(d.data)}</td><td>${esc(nomeMotorista(d.motoristaId))}</td><td>${esc(d.placa)}</td><td>${esc(d.categoria)}${chipChat(d)}</td>
      <td class="num">${fmtBRL(d.valor)}</td><td>${d.viagemId ? 'Viagem #'+d.viagemId : 'Avulso'}</td>
      <td><span class="tag ${d.status}">${rotulosStatus[d.status]}</span>${dups.length ? `<div><span class="chip-dup" data-ver="${d.id}" title="Parecido com: ${dups.map(x => '#' + x.id).join(', ')}">${icon('alert')}Possível duplicidade</span></div>` : ''}</td>
      <td><div class="linha-acoes">
        ${d.status==='aguardando' ? `<button class="btn btn-pequeno btn-primario" data-aprovar="${d.id}">Aprovar</button><button class="btn btn-pequeno btn-vermelho" data-rejeitar="${d.id}">Rejeitar</button>` : ''}
        <button class="btn btn-pequeno btn-contorno" data-ver="${d.id}">Detalhes</button>
        <button class="btn btn-pequeno btn-contorno" data-desconto="${d.id}">Desconto</button>
      </div></td></tr>`;
    }).join('')}</tbody></table></div>
    <div class="paginacao">
      <span class="mini">${total} registro(s) · página ${paginaAdmin} de ${paginas}</span>
      <button class="btn btn-pequeno btn-contorno" data-pag="-1" ${paginaAdmin<=1?'disabled':''}>Anterior</button>
      <button class="btn btn-pequeno btn-contorno" data-pag="1" ${paginaAdmin>=paginas?'disabled':''}>Próxima</button>
    </div>`;
  const barra = document.getElementById('barra-lote');
  const marcaTodos = document.getElementById('sel-todos');
  const atualizarLote = () => {
    const regs = [...selecionados].map(id => despesas.find(x => x.id === id)).filter(Boolean);
    const nDup = regs.filter(d => duplicidadesDe(d).length).length;
    barra.classList.toggle('oculto', regs.length === 0);
    document.getElementById('lote-n').textContent = regs.length;
    document.getElementById('lote-total').textContent = fmtBRL(regs.reduce((s,d) => s + d.valor, 0));
    const av = document.getElementById('lote-aviso');
    av.classList.toggle('oculto', nDup === 0);
    av.querySelector('span').textContent = nDup + ' com possível duplicidade';
    const caixas = [...alvo.querySelectorAll('.sel-reg')];
    marcaTodos.disabled = caixas.length === 0;
    marcaTodos.checked = caixas.length > 0 && caixas.every(cb => cb.checked);
    marcaTodos.indeterminate = caixas.some(cb => cb.checked) && !marcaTodos.checked;
  };
  const marcar = (cb, ligado) => {
    const id = +cb.dataset.sel;
    cb.checked = ligado;
    if(ligado) selecionados.add(id); else selecionados.delete(id);
    cb.closest('tr').classList.toggle('linha-sel', ligado);
  };
  alvo.querySelectorAll('.sel-reg').forEach(cb => cb.addEventListener('change', () => { marcar(cb, cb.checked); atualizarLote(); }));
  marcaTodos.addEventListener('change', () => { alvo.querySelectorAll('.sel-reg').forEach(cb => marcar(cb, marcaTodos.checked)); atualizarLote(); });
  alvo.querySelector('[data-limpar-lote]').addEventListener('click', () => { selecionados.clear(); desenharTabelaAdmin(); });
  alvo.querySelector('[data-aprovar-lote]').addEventListener('click', aprovarLote);
  atualizarLote();
  alvo.querySelectorAll('[data-ord]').forEach(el => el.addEventListener('click', () => {
    const c = el.dataset.ord;
    ordemAdmin = { campo: c, dir: ordemAdmin.campo === c ? -ordemAdmin.dir : 1 };
    desenharTabelaAdmin();
  }));
  alvo.querySelectorAll('[data-pag]').forEach(b => b.addEventListener('click', () => { paginaAdmin += +b.dataset.pag; desenharTabelaAdmin(); }));
  alvo.querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => abrirDetalhe(+b.dataset.ver)));
  alvo.querySelectorAll('[data-aprovar]').forEach(b => b.addEventListener('click', () => {
    const d = despesas.find(x => x.id == b.dataset.aprovar);
    const dupsAprov = duplicidadesDe(d);
    if(dupsAprov.length && !confirm('Atenção: possível duplicidade com ' + dupsAprov.map(x => '#' + x.id).join(', ') + '.\n\nAprovar mesmo assim?')) return;
    d.status = 'aprovado';
    registrar(d, 'Aprovado');
    auditar('Aprovou registro #'+d.id, d.descricao);
    notificar(d.motoristaId, 'Registro aprovado: ' + d.descricao);
    mostrarMensagem('Despesa aprovada.');
    desenharTabelaAdmin();
  }));
  alvo.querySelectorAll('[data-rejeitar]').forEach(b => b.addEventListener('click', () => {
    const motivo = prompt('Motivo obrigatório da rejeição:');
    if(!motivo || !motivo.trim()){ mostrarMensagem('A rejeição exige um motivo.', true); return; }
    const d = despesas.find(x => x.id == b.dataset.rejeitar);
    d.status = 'rejeitado'; d.motivo = motivo.trim();
    registrar(d, 'Rejeitado: ' + d.motivo);
    auditar('Rejeitou registro #'+d.id, d.motivo);
    notificar(d.motoristaId, 'Registro rejeitado: ' + d.descricao + ' — ' + d.motivo);
    mostrarMensagem('Despesa rejeitada.');
    desenharTabelaAdmin();
  }));
  alvo.querySelectorAll('[data-desconto]').forEach(b => b.addEventListener('click', () => {
    const d = despesas.find(x => x.id == b.dataset.desconto);
    const valor = prompt(`Valor informado: ${fmtBRL(d.valor)}\nValor a descontar (use 0 para nenhum):`, '0');
    if(valor === null) return;
    const n = parseFloat(String(valor).replace(',', '.'));
    if(isNaN(n) || n < 0 || n > d.valor){ mostrarMensagem('Valor inválido.', true); return; }
    const justificativa = prompt('Justificativa da decisão:');
    if(!justificativa || !justificativa.trim()){ mostrarMensagem('A justificativa é obrigatória.', true); return; }
    d.desconto = n; d.motivo = justificativa.trim();
    registrar(d, 'Desconto definido: ' + fmtBRL(n) + ' — ' + d.motivo);
    auditar('Definiu desconto no registro #'+d.id, fmtBRL(n)+' — '+d.motivo);
    notificar(d.motoristaId, 'Desconto definido em "' + d.descricao + '": ' + fmtBRL(n));
    mostrarMensagem('Desconto registrado para conferência. Nenhum desconto é aplicado automaticamente em folha.');
    desenharTabelaAdmin();
  }));
}

/* ===== Relatórios ===== */
function lerFiltroRelatorio(){
  return {
    motorista: document.getElementById('r-motorista').value,
    placa: document.getElementById('r-placa').value,
    viagem: document.getElementById('r-viagem').value,
    categoria: document.getElementById('r-categoria').value,
    status: document.getElementById('r-status').value,
    agrupar: document.getElementById('r-agrupar').value,
    de: document.getElementById('r-de').value,
    ate: document.getElementById('r-ate').value
  };
}
function dadosRelatorio(f){
  return despesas.filter(d =>
    (!f.motorista || d.motoristaId === f.motorista) &&
    (!f.placa || d.placa === f.placa) &&
    (!f.viagem || String(d.viagemId || '') === f.viagem) &&
    (!f.categoria || d.categoria === f.categoria) &&
    (!f.status || d.status === f.status) &&
    (!f.de || d.data >= f.de) && (!f.ate || d.data <= f.ate)
  ).sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : a.id - b.id);
}
function totaisRelatorio(lista){
  const soma = st => lista.filter(d => d.status === st).reduce((s,d) => s + d.valor, 0);
  return {
    qtd: lista.length,
    informado: lista.reduce((s,d) => s + d.valor, 0),
    aprovado: soma('aprovado'),
    rejeitado: soma('rejeitado'),
    aguardando: soma('aguardando'),
    desconto: lista.reduce((s,d) => s + (d.desconto || 0), 0)
  };
}
function filtrarPeriodo(lista, de, ate){
  return lista.filter(d => (!de || d.data >= de) && (!ate || d.data <= ate));
}
function rotuloAgrupar(c){
  return ({motorista:'MOTORISTA', placa:'CAMINHÃO', viagem:'VIAGEM', categoria:'CATEGORIA', mes:'MÊS'})[c] || '';
}
function chaveAgrupamento(d, campo){
  if(campo === 'motorista') return nomeMotorista(d.motoristaId);
  if(campo === 'placa') return d.placa;
  if(campo === 'viagem') return d.viagemId ? 'Viagem #'+d.viagemId : 'Avulso';
  if(campo === 'categoria') return d.categoria;
  if(campo === 'mes') return d.data.slice(0,7);
  return '';
}
function descreverFiltros(f){
  const partes = [];
  if(f.motorista) partes.push('Motorista: ' + nomeMotorista(f.motorista));
  if(f.placa) partes.push('Caminhão: ' + f.placa);
  if(f.viagem) partes.push('Viagem #' + f.viagem);
  if(f.categoria) partes.push('Categoria: ' + f.categoria);
  if(f.status) partes.push('Status: ' + rotulosStatus[f.status]);
  if(f.de || f.ate) partes.push('Período: ' + (f.de ? fmtData(f.de) : 'início') + ' a ' + (f.ate ? fmtData(f.ate) : 'hoje'));
  if(f.agrupar) partes.push('Agrupado por ' + rotuloAgrupar(f.agrupar).toLowerCase());
  return partes.join(' · ') || 'Todos os registros';
}
function desenharRelatorio(){
  const f = lerFiltroRelatorio();

  document.getElementById('r-resultado').innerHTML = `
    <div class="cards">

      <thead><tr><th>${rotuloAgrupar(f.agrupar)}</th><th>QTD</th><th>INFORMADO</th><th>APROVADO</th><th>REJEITADO</th><th>DESCONTO</th></tr></thead>
      <tbody>${linhasGrupo || '<tr><td colspan="6" class="vazio">Sem dados.</td></tr>'}</tbody></table></div>` : ''}
    <div class="tabela-wrap"><table>
      <thead><tr><th>DATA</th><th>MOTORISTA</th><th>PLACA</th><th>VIAGEM</th><th>CATEGORIA</th><th>DESCRIÇÃO</th><th>VALOR</th><th>STATUS</th><th>DESCONTO</th></tr></thead>
      <tbody>${lista.map(d => `<tr><td>${fmtData(d.data)}</td><td>${esc(nomeMotorista(d.motoristaId))}</td><td>${esc(d.placa)}</td><td>${d.viagemId ? '#'+d.viagemId : 'Avulso'}</td><td>${esc(d.categoria)}</td><td>${esc(d.descricao)}</td><td class="num">${fmtBRL(d.valor)}</td><td><span class="tag ${d.status}">${rotulosStatus[d.status]}</span></td><td class="num">${fmtBRL(d.desconto||0)}</td></tr>`).join('') || '<tr><td colspan="9" class="vazio">Nenhum registro com esses filtros.</td></tr>'}</tbody>
    </table></div>`;
  ultimoRelatorio = { f, lista, t, grupos };
}
function exportarRelatorio(tipo){
  if(!ultimoRelatorio || !ultimoRelatorio.lista.length){ mostrarMensagem('Não há registros para exportar.', true); return; }
  if(tipo === 'xlsx') exportarExcel(); else exportarPDF();
}
function exportarExcel(){
  if(typeof XLSX === 'undefined'){ mostrarMensagem('Biblioteca de Excel indisponível. Verifique a conexão.', true); return; }
  const { lista, t, grupos, f } = ultimoRelatorio;
  const linhas = lista.map(d => ({
    'Data': fmtData(d.data), 'Motorista': nomeMotorista(d.motoristaId), 'Placa': d.placa,
    'Viagem': d.viagemId ? '#'+d.viagemId : 'Avulso', 'Categoria': d.categoria, 'Descrição': d.descricao,
    'Cidade': d.cidade, 'Local': d.local || '', 'Valor (R$)': d.valor, 'Status': rotulosStatus[d.status],
    'Desconto (R$)': d.desconto || 0, 'Motivo / justificativa': d.motivo || ''
  }));
  const resumo = [
    ['RESUMO — ROFE DISTRIBUIDORA — PRESTAÇÃO DE CONTAS'], [descreverFiltros(f)], [],
    ['Quantidade', t.qtd], ['Total informado', t.informado], ['Aprovado', t.aprovado],
    ['Rejeitado', t.rejeitado], ['Desconto definido', t.desconto]
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), 'Resumo');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Registros');
  if(f.agrupar){
    const linhasG = Object.keys(grupos).sort().map(k => {
      const g = totaisRelatorio(grupos[k]);
      return { [rotuloAgrupar(f.agrupar)]: k, 'Quantidade': g.qtd, 'Informado (R$)': g.informado,
               'Aprovado (R$)': g.aprovado, 'Rejeitado (R$)': g.rejeitado, 'Desconto (R$)': g.desconto };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasG), 'Agrupado');
  }
  XLSX.writeFile(wb, `ROFE_relatorio_${hojeIso()}.xlsx`);
}

/* ===== Gráficos do painel ===== */
function desenharGraficos(lista){
  const escuro = document.documentElement.dataset.tema === 'escuro';
  if(typeof Chart !== 'undefined') Chart.defaults.color = escuro ? '#C9D6EA' : '#5B6B7F';
  graficosAtivos.forEach(g => g.destroy());
  graficosAtivos = [];
  if(typeof Chart === 'undefined'){
    document.querySelectorAll('.grade-graficos').forEach(g => g.insertAdjacentHTML('beforeend', '<p class="aviso-demo">Gráficos indisponíveis: verifique a conexão para carregar a biblioteca.</p>'));
    return;
  }
  const cores = ['#1565C0','#D32F2F','#0B2A4A','#5C9BE0','#F28B8B','#7A8899','#2E8B57','#E0A100','#8E44AD','#00A3A3','#C0392B'];
  const porMes = {}, porCat = {}, porMot = {}, porCam = {};
  lista.forEach(d => {
    const mes = d.data.slice(0,7);
    porMes[mes] = (porMes[mes] || 0) + d.valor;
    porCat[d.categoria] = (porCat[d.categoria] || 0) + d.valor;
    const mot = nomeMotorista(d.motoristaId);
    porMot[mot] = (porMot[mot] || 0) + d.valor;
    porCam[d.placa] = (porCam[d.placa] || 0) + d.valor;
  });
  const criar = (id, tipo, rotulos, valores) => {
    const el = document.getElementById(id);
    if(!el) return;
    graficosAtivos.push(new Chart(el, {
      type: tipo,
      data: { labels: rotulos, datasets: [{ data: valores, backgroundColor: rotulos.map((_,i) => cores[i % cores.length]), borderRadius: tipo === 'bar' ? 8 : 0 }] },
      options: {
        responsive: true,
        plugins: { legend: { display: tipo !== 'bar', position: 'bottom' } },
        scales: tipo === 'bar' ? { y: { beginAtZero: true, ticks: { callback: v => 'R$ ' + Number(v).toLocaleString('pt-BR') } } } : {}
      }
    }));
  };
  const meses = Object.keys(porMes).sort();
  criar('g-mes', 'bar', meses.map(m => m.split('-').reverse().join('/')), meses.map(m => porMes[m]));
  criar('g-categoria', 'doughnut', Object.keys(porCat), Object.values(porCat));
  criar('g-motorista', 'bar', Object.keys(porMot), Object.values(porMot));
  criar('g-caminhao', 'bar', Object.keys(porCam), Object.values(porCam));
}

function abrirEdicao(id){
  const d = despesas.find(x => x.id === id);
  if(!d) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal modal-editor">
    <div class="modal-topo"><h2 style="margin:0;font-size:20px">Editar registro #${d.id}</h2></div>
    <form id="form-edicao" style="margin-top:14px">
      <div class="grade-form">
        <div class="campo"><label>Categoria</label><select name="categoria">${CATEGORIAS.map(x => `<option ${x===d.categoria?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
        <div class="campo"><label>Valor (R$)</label><input name="valor" type="number" step="0.01" min="0" value="${d.valor}"></div>
        <div class="campo"><label>Data</label><input name="data" type="date" value="${d.data}"></div>
        <div class="campo"><label>Cidade</label><input name="cidade" value="${esc(d.cidade)}"></div>
        <div class="campo"><label>Local</label><input name="local" value="${esc(d.local||'')}"></div>
        <div class="campo"><label>Litros (somente combustível)</label><input name="litros" type="number" step="0.01" min="0" value="${d.litros || ''}"></div>
        <div class="campo inteiro"><label>Descrição/Observação</label><textarea name="descricao">${esc(d.descricao)}</textarea></div>
        
      </div>
      <div class="rodape-editor">
        <button type="button" class="btn btn-contorno btn-pequeno" data-cancelar>Cancelar</button>
        <button type="submit" class="btn btn-primario btn-pequeno">Salvar alterações</button>
      </div>
    </form></div>`;
  ov.querySelector('[data-cancelar]').addEventListener('click', () => ov.remove());
  ov.querySelector('#form-edicao').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const novo = {
      categoria: f.get('categoria'), valor: parseFloat(f.get('valor')), data: f.get('data'),
      cidade: f.get('cidade').trim().toUpperCase(), local: f.get('local').trim().toUpperCase(),
      descricao: f.get('descricao').trim().toUpperCase(), obs: d.obs || '',
      litros: f.get('categoria') === 'Combustível' ? (parseFloat(f.get('litros')) || 0) : 0
    };
    if(!(novo.valor > 0)){ mostrarMensagem('Informe um valor maior que zero.', true); return; }
    if(!novo.data || novo.data > hojeIso()){ mostrarMensagem('Informe uma data válida, que não seja futura.', true); return; }
    if(!novo.cidade || !novo.descricao){ mostrarMensagem('Cidade e descrição são obrigatórias.', true); return; }
    if((d.desconto || 0) > novo.valor){ mostrarMensagem('O valor não pode ficar abaixo do desconto já definido (' + fmtBRL(d.desconto) + ').', true); return; }
    const nomes = { categoria:'Categoria', valor:'Valor', data:'Data', cidade:'Cidade', local:'Local', descricao:'Descrição', obs:'Observações', litros:'Litros' };
    const fmt = (k, v) => k === 'valor' ? fmtBRL(v) : k === 'data' ? fmtData(v) : (v || '—');
    const mudancas = Object.keys(novo).filter(k => String(d[k] ?? '') !== String(novo[k] ?? ''))
      .map(k => `${nomes[k]}: ${fmt(k, d[k])} → ${fmt(k, novo[k])}`);
    if(!mudancas.length){ ov.remove(); return; }
    Object.assign(d, novo);
    registrar(d, 'Editado: ' + mudancas.join('; '));
    auditar('Editou registro #'+d.id, mudancas.join('; '));
    if(usuarioAtual.perfil === 'admin') avisar(d.motoristaId, 'meus'); else avisar(contadorId(), 'registros');
    mostrarMensagem('Alterações salvas e registradas no histórico.');
    ov.remove();
    irPara(rotaAtual);
  });
  document.body.appendChild(ov);
}

function linksContato(u){
  if(!u) return '';
  const digitos = (u.telefone || '').replace(/\D/g, '');
  const fone = digitos ? (digitos.length <= 11 ? '55' + digitos : digitos) : '';
  const partes = [];
  if(digitos) partes.push(`<a class="contato-link" href="https://wa.me/${fone}" target="_blank" rel="noopener">${icon('phone')}<span>${esc(u.telefone)}</span></a>`);
  if(u.email) partes.push(`<a class="contato-link" href="mailto:${esc(u.email)}">${icon('mail')}<span>${esc(u.email)}</span></a>`);
  return partes.length ? `<div class="contatos">${partes.join('')}</div>` : '<span class="mini">Contato não informado</span>';
}
