  viagens:'route', nova:'play', auditoria:'list', duvidas:'help', caminhoes:'truck', motoristas:'users', relatorios:'chart', comparativo:'bars', combustivel:'fuel'
};
/* Menu lateral em grupos (contador e operador). O motorista mantém o menu simples. */
const GRUPOS_MENU = [
  { id: 'operacao',   titulo: 'Operação',   ico: 'truck',   rotas: ['monitor', 'viagens', 'nova', 'solicitacoes'] },
  { id: 'financeiro', titulo: 'Financeiro', ico: 'receipt', rotas: ['registros', 'combustivel', 'comparativo', 'relatorios'] },
  { id: 'cadastros',  titulo: 'Cadastros',  ico: 'users',   rotas: ['motoristas', 'caminhoes', 'equipe'] },
  { id: 'sistema',    titulo: 'Sistema',    ico: 'shield',  rotas: ['auditoria'] }
];
/* grupos do menu: começam sempre fechados a cada entrada; só um aberto por vez */
let gruposAbertos = {};
function lerGruposAbertos(){ return gruposAbertos; }
function salvarGruposAbertos(o){ gruposAbertos = o; }
try { localStorage.removeItem('rofe_menu_grupos'); } catch(e){}
function montarMenus(){
  const itens = itensMenu();
  document.body.dataset.perfil = usuarioAtual.perfil;
  const avMenu = '<canvas class="av-cv" data-av="mini" aria-hidden="true"></canvas>';
  const botao = (id, rot, sub) => `<button type="button" data-rota="${id}" class="${sub ? 'm-sub-item' : 'm-item'}" title="${esc(rot)}"><span class="ico-wrap${id === 'duvidas' ? ' av' : ''}">${id === 'duvidas' ? avMenu : icon(ICONE_MENU[id])}</span><span class="m-rot">${rot}</span></button>`;
  const rotulo = Object.fromEntries(itens);
  let html = '';
  if(usuarioAtual.perfil === 'motorista'){
    html = itens.map(([id, rot]) => botao(id, rot)).join('');
  } else {
    const abertos = lerGruposAbertos();
    const soltos = itens.filter(([id]) => id === rotaInicial() || !GRUPOS_MENU.some(g => g.rotas.includes(id)));
    const topo = soltos.filter(([id]) => id !== 'duvidas');
    html = topo.map(([id, rot]) => botao(id, rot)).join('');
    GRUPOS_MENU.forEach(g => {
      const filhos = g.rotas.filter(r => rotulo[r] && r !== rotaInicial());
      if(!filhos.length) return;
      const aberto = abertos[g.id] === true;
      html += `<div class="m-grupo${aberto ? ' aberto' : ''}" data-grupo="${g.id}">
        <button type="button" class="m-grupo-cab" aria-expanded="${aberto}" title="${g.titulo}"><span class="ico-wrap">${icon(g.ico)}</span><span class="m-rot">${g.titulo}</span><span class="m-seta">${icon('chevron')}</span></button>
        <div class="m-sub">${filhos.map(r => botao(r, rotulo[r], true)).join('')}</div></div>`;
    });
    if(rotulo.duvidas) html += `<div class="m-rodape">${botao('duvidas', rotulo.duvidas)}</div>`;
  }
  html += `<button type="button" class="m-recolher" id="m-recolher" title="Recolher menu">${icon('chevron')}<span class="m-rot">Recolher menu</span></button>`;
  const lateral = document.getElementById('menu-lateral');
  lateral.innerHTML = html;
  lateral.querySelectorAll('.m-grupo-cab').forEach(cab => cab.addEventListener('click', () => {
    const g = cab.parentElement, ab = !g.classList.contains('aberto');
    /* sanfona: abrir um grupo fecha os outros */
    lateral.querySelectorAll('.m-grupo.aberto').forEach(x => { if(x !== g){ x.classList.remove('aberto'); x.querySelector('.m-grupo-cab').setAttribute('aria-expanded', 'false'); } });
    g.classList.toggle('aberto', ab); cab.setAttribute('aria-expanded', ab);
    salvarGruposAbertos(ab ? { [g.dataset.grupo]: true } : {});
    if(ab) setTimeout(() => { const r = g.getBoundingClientRect(), L = lateral.getBoundingClientRect(); if(r.bottom > L.bottom) lateral.scrollBy({ top: r.bottom - L.bottom + 12, behavior: 'smooth' }); }, 30);
    if(document.body.classList.contains('menu-recolhido') && ab){ document.body.classList.remove('menu-recolhido'); try { localStorage.setItem('rofe_menu_recolhido', '0'); } catch(e){} }
  }));
  lateral.querySelector('#m-recolher').addEventListener('click', () => {
    const r = !document.body.classList.contains('menu-recolhido');
    document.body.classList.toggle('menu-recolhido', r);
    try { localStorage.setItem('rofe_menu_recolhido', r ? '1' : '0'); } catch(e){}
  });
  try { document.body.classList.toggle('menu-recolhido', localStorage.getItem('rofe_menu_recolhido') === '1' && window.innerWidth > 820); } catch(e){}
  /* barra inferior: só para o motorista no celular (contador e operador usam o menu lateral pelo botão ☰) */
  const CURTO = { viagem:'Viagens', meus:'Registros', novo:'Novo', duvidas:'Ajuda', orcamentos:'Orçamentos' };
  document.getElementById('menu-mobile').innerHTML = usuarioAtual.perfil === 'motorista' ? itens.map(([id,rot]) =>
    `<button data-rota="${id}">${id === 'duvidas' ? `<span class="av-mini">${avMenu}</span>` : icon(ICONE_MENU[id])}<span>${CURTO[id] || rot}</span></button>`).join('') : '';
  AvatarRofe.ligar(document);
  document.querySelectorAll('#menu-lateral [data-rota], #menu-mobile [data-rota]').forEach(b =>
    b.addEventListener('click', () => { fecharGaveta(); irPara(b.dataset.rota); }));
  atualizarMenuAvisos();
}
function abrirGaveta(){
  document.body.classList.add('gaveta-aberta');
  /* trava a tela de trás enquanto o menu está aberto */
  if(!document.body.dataset.travaY){ document.body.dataset.travaY = String(window.scrollY); document.body.style.top = -window.scrollY + 'px'; document.body.classList.add('rolagem-travada'); }
}
function fecharGaveta(){
  document.body.classList.remove('gaveta-aberta');
  if(document.body.dataset.travaY !== undefined){
    const y = +document.body.dataset.travaY; delete document.body.dataset.travaY;
    document.body.classList.remove('rolagem-travada'); document.body.style.top = '';
    window.scrollTo(0, y);
  }
}
window.addEventListener('resize', () => { if(window.innerWidth > 820 && document.body.classList.contains('gaveta-aberta')) fecharGaveta(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && document.body.classList.contains('gaveta-aberta')) fecharGaveta(); });
/* altura do cabeçalho para o menu lateral fixo do computador */
(() => { const t = document.querySelector('#tela-app .topo'); if(!t || !window.ResizeObserver) return;
  new ResizeObserver(() => document.documentElement.style.setProperty('--topo-h', t.offsetHeight + 'px')).observe(t); })();
function marcarMenu(){
  document.querySelectorAll('[data-rota]').forEach(b =>
    b.classList.toggle('ativo', b.dataset.rota === rotaAtual));
  /* o grupo da tela atual fica marcado (sem abrir sozinho) */
  document.querySelectorAll('.m-grupo').forEach(g => g.classList.toggle('contem-ativo', !!g.querySelector('[data-rota="' + rotaAtual + '"]')));
}
let assinaturaMenu = '';
function irPara(rota, suave){
  /* suave = atualização em tempo real: mantém rolagem, painel de avisos e não repete as animações de entrada */
  promoverAgendadas();
  rotaAtual = rota;
  limparAviso(rota);
  const assin = itensMenu().map(i => i[0]).join('|');
  if(!suave){ fecharPainelAvisos(); montarMenus(); }
  else if(assin !== assinaturaMenu) montarMenus();
  assinaturaMenu = assin;
  marcarMenu();
  const c = document.getElementById('conteudo');
  c.classList.toggle('render-suave', !!suave);
  if(!suave) viagemDetalhada = null;
  const telas = usuarioAtual.perfil === 'admin' ? TELAS_ADMIN : usuarioAtual.perfil === 'operador' ? TELAS_OPERADOR : TELAS_MOTORISTA;
  (telas[rota] || telas.inicio)(c);
  document.body.dataset.perfil = usuarioAtual.perfil;
  decorarCards();
  atualizarSino();
  document.querySelectorAll('#conteudo [data-det]').forEach(tr => tr.addEventListener('click', () => abrirDetalhe(+tr.dataset.det)));
  document.querySelectorAll('#conteudo [data-viagem-atalho]').forEach(el => el.addEventListener('click', () => { irPara('viagens'); mostrarViagem(+el.dataset.viagemAtalho); }));
  destacarRecentes();
  if(!suave) window.scrollTo(0,0);
}

        return;
      }
      if(document.getElementById('d-data').value > hojeIso()){ mostrarMensagem('A data da despesa não pode ser futura.', true); return; }
      const viagem = viagens.find(v => v.motoristaId === usuarioAtual.id && v.status === 'em andamento');
      const caminhao = { placa: viagem ? viagem.placa : '' };
      const nova = {
        motoristaId: usuarioAtual.id, placa: caminhao.placa,
        categoria: document.getElementById('d-categoria').value,
        descricao: document.getElementById('d-descricao').value.trim().toUpperCase(),
        valor: parseFloat(document.getElementById('d-valor').value),
        data: document.getElementById('d-data').value,
        cidade: document.getElementById('d-cidade').value.trim().toUpperCase(),
        local: document.getElementById('d-local').value.trim().toUpperCase(),
        obs: '',
        historico: [{ quando: agora(), quem: usuarioAtual.nome, acao: 'Registro criado', ts: Date.now() }],
        status: 'aguardando', motivo:'', desconto:0,
        tipo: viagem ? 'viagem' : 'avulso', viagemId: viagem ? viagem.id : null,
        fotos: fotosNovoRegistro.length,
        litros: document.getElementById('d-categoria').value === 'Combustível' ? (parseFloat(document.getElementById('d-litros').value) || 0) : 0,
        comentarios: [], criadoEm: Date.now()
      };
      btnSalvar.disabled = true; btnSalvar.textContent = 'PREPARANDO FOTOS…';
      const liberar = () => { btnSalvar.disabled = false; btnSalvar.textContent = 'SALVAR REGISTRO'; };
      let fotosC;
      try { fotosC = await Promise.all(fotosNovoRegistro.map(compactarFoto)); }
      catch(err){ console.error(err); liberar(); mostrarMensagem('Não foi possível preparar as fotos. Tente anexar de novo.', true); return; }
      nova.fotoHashes = fotosC.map(f => f.hash);
      const dups = duplicidadesDe(nova);
      if(dups.length){
        const proprios = dups.filter(x => despesas.find(o => o.id === x.id)?.motoristaId === usuarioAtual.id);
        const motivos = [...new Set(dups.flatMap(x => x.motivos))].join(' e ');
        if(!confirm('Atenção: já existe registro com ' + motivos + (proprios.length ? ' (seu registro #' + proprios[0].id + ')' : '') + '.\n\nSalvar mesmo assim? O contador será avisado da possível duplicidade.')){ liberar(); return; }
      }
      btnSalvar.textContent = 'SALVANDO…';
      const concluir = msg => {
        fotosNovoRegistro = []; limparRascunho();
        mostrarMensagem(msg);
        irPara('meus');
      };
      if(!navigator.onLine){
        if(await guardarNaFila(nova, fotosC)) concluir('Sem internet: registro guardado no aparelho. Ele será enviado sozinho quando a conexão voltar.');
        else liberar();
        return;
      }
      try {
        const n = await criarDespesaNoBanco(nova, fotosC);
        concluir('Registro #' + n + ' salvo. Aguardando análise.');
      } catch(err){
        console.error(err);
        if(ehErroConexao(err)){
          if(await guardarNaFila(nova, fotosC)) concluir('Conexão instável: registro guardado no aparelho e será enviado automaticamente.');
          else liberar();
        } else {
          liberar();
          mostrarMensagem(window.RofeAuth.traduzirErro(err, 'Não foi possível salvar o registro. Tente novamente.'), true);
        }
      }
    });
  },

  comparativo(c){
    const fin = viagens.filter(v => v.status === 'finalizada');
    c.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Comparativo de viagens</h1><p>Mesma rota, custo diferente: encontre desvios nas viagens finalizadas.</p></div>
        <div class="filtros" style="margin:0"><select id="cmp-lim" title="Limite de desvio sobre a média da rota">${[10,20,30,50].map(p => `<option value="${p}" ${p===filtroCmp.limite?'selected':''}>Alertar acima de +${p}% da média</option>`).join('')}</select></div></div>
      <div id="cmp-conteudo"></div>
      <div id="detalhe-viagem"></div>`;
    const desenhar = () => {
      const limite = filtroCmp.limite;
      const grupos = {};
      fin.forEach(v => {
        const k = norm(v.origem) + '>' + norm(v.destino);
        (grupos[k] = grupos[k] || { rota: v.origem.toUpperCase() + ' → ' + v.destino.toUpperCase(), itens: [] }).itens.push(v);
      });
      const todos = Object.values(grupos);
      const comp = todos.filter(g => g.itens.length >= 2);
      const sozinhas = todos.length - comp.length;
      comp.forEach(g => {
        g.itens = g.itens.map(v => {
          const mt = metricasViagem(v), cats = {};
          mt.regs.filter(d => d.status !== 'rejeitado').forEach(d => { cats[d.categoria] = (cats[d.categoria] || 0) + d.valor; });
          return { v, mt, cats };
        });
        g.media = g.itens.reduce((s,i) => s + i.mt.custo, 0) / g.itens.length;
        g.max = Math.max(...g.itens.map(i => i.mt.custo), 1);
        const nomesCat = [...new Set(g.itens.flatMap(i => Object.keys(i.cats)))];
        const mediaCat = {};
        nomesCat.forEach(k => { mediaCat[k] = g.itens.reduce((s,i) => s + (i.cats[k] || 0), 0) / g.itens.length; });
        g.itens.forEach(i => {
          i.desvio = g.media > 0 ? (i.mt.custo - g.media) / g.media * 100 : 0;
          i.alto = i.desvio >= limite;
          let pior = null;
          nomesCat.forEach(k => { const dif = (i.cats[k] || 0) - mediaCat[k]; if(!pior || dif > pior.dif) pior = { cat:k, dif }; });
          i.pior = pior && pior.dif > 0 ? pior : null;
        });
        g.altos = g.itens.filter(i => i.alto).length;
      });
      comp.sort((a,b) => b.altos - a.altos || b.itens.length - a.itens.length);
      const totalAltos = comp.reduce((s,g) => s + g.altos, 0);
      const excesso = comp.reduce((s,g) => s + g.itens.filter(i => i.alto).reduce((x,i) => x + (i.mt.custo - g.media), 0), 0);

      const linhasCam = CAMINHOES.map(x => {
        const vs = fin.filter(v => v.placa === x.placa);
        if(!vs.length) return null;
        const ms = vs.map(v => metricasViagem(v));
        const comKm = ms.filter(m => m.km);
        const km = comKm.reduce((s,m) => s + m.km, 0);
        const custoKm = comKm.reduce((s,m) => s + m.custo, 0);
        const comLit = comKm.filter(m => m.litros > 0);
        const consumo = comLit.length ? comLit.reduce((s,m) => s + m.km, 0) / comLit.reduce((s,m) => s + m.litros, 0) : null;
        return { x, n: vs.length, custo: ms.reduce((s,m) => s + m.custo, 0), km, rkm: km > 0 ? custoKm / km : null, litros: ms.reduce((s,m) => s + m.litros, 0), consumo };
      }).filter(Boolean).sort((a,b) => (b.rkm ?? -1) - (a.rkm ?? -1));

      document.getElementById('cmp-conteudo').innerHTML = `
        <div class="cards">
          <div class="card azul"><div class="rotulo">Rotas comparáveis</div><div class="valor">${comp.length}</div></div>
          <div class="card vermelho"><div class="rotulo">Viagens com desvio</div><div class="valor">${totalAltos}</div></div>
          <div class="card vermelho"><div class="rotulo">Excesso acima da média</div><div class="valor">${fmtBRL(excesso)}</div></div>
          <div class="card"><div class="rotulo">Viagens finalizadas</div><div class="valor">${fin.length}</div></div>
        </div>
        ${comp.length ? comp.map(g => `
          <div class="painel-bloco">
            <div class="rota-topo"><h2>${esc(g.rota)}</h2>
              <span class="mini">${g.itens.length} viagens · média ${fmtBRL(g.media)}${g.altos ? ` · <strong style="color:var(--vermelho)">${g.altos} com desvio</strong>` : ''}</span></div>
            <div class="tabela-wrap" style="box-shadow:none"><table>
              <thead><tr><th>VIAGEM</th><th>MOTORISTA</th><th>CAMINHÃO</th><th>SAÍDA</th><th>CUSTO × MÉDIA</th><th>DESVIO</th><th>MAIOR EXCESSO</th><th>R$/KM</th></tr></thead>
              <tbody>${g.itens.slice().sort((a,b) => b.mt.custo - a.mt.custo).map(i => `<tr class="linha-clicavel ${i.alto ? 'linha-desvio' : ''}" data-viagem="${i.v.id}">
                <td class="num">#${i.v.id}</td><td>${esc(nomeMotorista(i.v.motoristaId))}</td><td>${esc(i.v.placa)}</td><td>${fmtData(i.v.saida)}</td>
                <td><div class="cmp-celula"><div class="cmp-barra ${i.alto ? 'alerta' : ''}"><span style="width:${(i.mt.custo / g.max * 100).toFixed(0)}%"></span><i style="left:${(g.media / g.max * 100).toFixed(0)}%" title="Média da rota"></i></div><strong>${fmtBRL(i.mt.custo)}</strong></div></td>
                <td><span class="desvio ${i.alto ? 'alto' : i.desvio <= -limite ? 'baixo' : ''}">${i.desvio > 0 ? '+' : ''}${fmtNum(i.desvio, 0)}%</span></td>
                <td>${i.pior ? esc(i.pior.cat) + ' <span class="mini">+' + fmtBRL(i.pior.dif) + '</span>' : '—'}</td>
                <td>${i.mt.custoKm != null ? fmtBRL(i.mt.custoKm) : '—'}</td></tr>`).join('')}</tbody>
            </table></div>
          </div>`).join('')
        : `<div class="painel-bloco"><div class="vazio">Ainda não há duas ou mais viagens finalizadas na mesma rota (origem → destino).${sozinhas ? ' ' + sozinhas + ' rota(s) com apenas uma viagem.' : ''}</div></div>`}
        ${comp.length && sozinhas ? `<p class="mini">${sozinhas} rota(s) com apenas uma viagem finalizada ficaram fora da comparação.</p>` : ''}
        <div class="painel-bloco"><h2>Desempenho por caminhão</h2>
          ${linhasCam.length ? `<div class="tabela-wrap" style="box-shadow:none"><table>
            <thead><tr><th>CAMINHÃO</th><th>VIAGENS</th><th>KM RODADO</th><th>CUSTO TOTAL</th><th>CUSTO/KM</th><th>LITROS</th><th>CONSUMO (KM/L)</th></tr></thead>
            <tbody>${linhasCam.map(l => `<tr><td class="num">${esc(l.x.placa)}<div class="mini">${esc(l.x.modelo)}</div></td><td>${l.n}</td>
              <td>${l.km ? fmtNum(l.km, 0) + ' km' : '—'}</td><td class="num">${fmtBRL(l.custo)}</td>
              <td>${l.rkm != null ? fmtBRL(l.rkm) : '—'}</td><td>${l.litros ? fmtNum(l.litros, 1) + ' L' : '—'}</td><td>${l.consumo != null ? fmtNum(l.consumo, 2) : '—'}</td></tr>`).join('')}</tbody>
          </table></div>` : '<div class="vazio">Sem viagens finalizadas ainda.</div>'}
          <p class="mini" style="margin-top:12px">Custos desconsideram registros rejeitados. Km rodado = km final − km inicial da viagem. O consumo usa os litros informados nos registros de combustível.</p>
        </div>`;
      document.querySelectorAll('#cmp-conteudo [data-viagem]').forEach(tr => tr.addEventListener('click', () => mostrarViagem(+tr.dataset.viagem)));
    };
    document.getElementById('cmp-lim').addEventListener('change', e => { filtroCmp.limite = +e.target.value; desenhar(); });
    desenhar();
  },

  relatorios(c){
    c.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Relatórios</h1><p>Filtre, agrupe e exporte para fechar as contas.</p></div>
        <div class="linha-acoes">
          <button class="btn btn-contorno btn-pequeno" data-exp="xlsx">Exportar Excel</button>
          <button class="btn btn-primario btn-pequeno" data-exp="pdf">Exportar PDF</button>
        </div></div>
      <div class="painel-bloco">
        <div class="filtros" style="margin-bottom:0">

          <select id="r-placa"><option value="">Todos os caminhões</option>${CAMINHOES.map(x=>`<option>${esc(x.placa)}</option>`).join('')}</select>
          <select id="r-viagem"><option value="">Todas as viagens</option>${viagens.map(v=>`<option value="${v.id}">Viagem #${v.id} — ${esc(v.origem)} → ${esc(v.destino)}</option>`).join('')}</select>

  auditoria(c){

      <div class="cabecalho-pagina"><div><h1>Auditoria</h1><p>Todas as ações registradas no sistema.</p></div></div>
      <div class="filtros">
        <select id="a-usuario"><option value="">Todos os usuários</option>${[...new Set(auditoria.map(a=>a.quem))].map(q=>`<option>${esc(q)}</option>`).join('')}</select>
        <input type="date" id="a-de" title="Data inicial"><input type="date" id="a-ate" title="Data final">
      </div>
      <div id="a-tabela"></div>`;
    let pag = 1;
    const desenhar = () => {
      const u = document.getElementById('a-usuario').value;
      const de = document.getElementById('a-de').value;
      const ate = document.getElementById('a-ate').value;
      const lista = auditoria.filter(a => (!u || a.quem===u) && (!de || a.dataIso>=de) && (!ate || a.dataIso<=ate)).slice().reverse();
      const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
      if(pag > paginas) pag = paginas;
      const pagina = lista.slice((pag-1)*POR_PAGINA, pag*POR_PAGINA);
      document.getElementById('a-tabela').innerHTML = !lista.length
        ? '<div class="card vazio">Nenhuma ação registrada.</div>'
        : `<div class="tabela-wrap"><table>
            <thead><tr><th>QUANDO</th><th>USUÁRIO</th><th>PERFIL</th><th>AÇÃO</th><th>DETALHE</th></tr></thead>

function desenharTabelaAdmin(){
  const t = filtroAdmin.texto.toLowerCase();
  const lista = despesas.filter(d => {
    const motorista = nomeMotorista(d.motoristaId);
    return (!t || (motorista+d.placa+d.descricao).toLowerCase().includes(t))
      && (!filtroAdmin.status || d.status===filtroAdmin.status)
      && (!filtroAdmin.categoria || d.categoria===filtroAdmin.categoria)
      && (!filtroAdmin.de || d.data >= filtroAdmin.de)
      && (!filtroAdmin.ate || d.data <= filtroAdmin.ate)
      && (!filtroAdmin.dup || (d.status !== 'rejeitado' && duplicidadesDe(d).length > 0));
  });
  const chaves = { data:d=>d.data, valor:d=>d.valor, motorista:d=>nomeMotorista(d.motoristaId), placa:d=>d.placa, categoria:d=>d.categoria, status:d=>d.status };
  const campo = chaves[ordemAdmin.campo];
  lista.sort((a,b) => { const x = campo(a), y = campo(b); return (x>y?1:x<y?-1:0) * ordemAdmin.dir; });
  const total = lista.length;
  const alvo = document.getElementById('tabela-admin');
  if(!total){ alvo.innerHTML = '<div class="card vazio">Nenhum registro encontrado.</div>'; return; }
  const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
  if(paginaAdmin > paginas) paginaAdmin = paginas;
  const pagina = lista.slice((paginaAdmin-1)*POR_PAGINA, paginaAdmin*POR_PAGINA);
  const seta = c => ordemAdmin.campo === c ? (ordemAdmin.dir > 0 ? ' ▲' : ' ▼') : '';
  const th = (c, rot) => `<th class="ordenavel" data-ord="${c}">${rot}${seta(c)}</th>`;
  [...selecionados].forEach(id => { const r = despesas.find(x => x.id === id); if(!r || r.status !== 'aguardando') selecionados.delete(id); });
  alvo.innerHTML = `<div class="barra-lote oculto" id="barra-lote">
      <span><strong id="lote-n">0</strong> selecionado(s) · <strong id="lote-total">R$ 0,00</strong></span>
      <span class="lote-aviso oculto" id="lote-aviso">${icon('alert')}<span></span></span>
      <span class="lote-botoes"><button class="btn btn-pequeno btn-primario" type="button" data-aprovar-lote>Aprovar selecionados</button><button class="btn btn-pequeno btn-contorno" type="button" data-limpar-lote>Limpar</button></span>
    </div>
    <div class="tabela-wrap"><table>
    <thead><tr><th class="col-sel"><input type="checkbox" id="sel-todos" title="Selecionar todos os pendentes desta página" aria-label="Selecionar todos os pendentes desta página"></th>${th('data','DATA')}${th('motorista','MOTORISTA')}${th('placa','PLACA')}${th('categoria','CATEGORIA')}${th('valor','VALOR')}<th>TIPO</th>${th('status','STATUS')}<th>AÇÕES</th></tr></thead>
    <tbody>${pagina.map(d => {
      const dups = d.status !== 'rejeitado' ? duplicidadesDe(d) : [];
      return `<tr class="${selecionados.has(d.id) ? 'linha-sel' : ''}">
      <td class="col-sel">${d.status==='aguardando' ? `<input type="checkbox" class="sel-reg" data-sel="${d.id}" aria-label="Selecionar registro ${d.id}" ${selecionados.has(d.id) ? 'checked' : ''}>` : ''}</td>
      <td>${fmtData(d.data)}</td><td>${esc(nomeMotorista(d.motoristaId))}</td><td>${esc(d.placa)}</td><td>${esc(d.categoria)}${chipChat(d)}</td>
      <td class="num">${fmtBRL(d.valor)}</td><td>${d.viagemId ? 'Viagem #'+d.viagemId : 'Avulso'}</td>
      <td><span class="tag ${d.status}">${rotulosStatus[d.status]}</span>${dups.length ? `<div><span class="chip-dup" data-ver="${d.id}" title="Parecido com: ${dups.map(x => '#' + x.id).join(', ')}">${icon('alert')}Possível duplicidade</span></div>` : ''}</td>
      <td><div class="linha-acoes">
        ${d.status==='aguardando' ? `<button class="btn btn-pequeno btn-primario" data-aprovar="${d.id}">Aprovar</button><button class="btn btn-pequeno btn-vermelho" data-rejeitar="${d.id}">Rejeitar</button>` : ''}
        <button class="btn btn-pequeno btn-contorno" data-ver="${d.id}">Detalhes</button>
        <button class="btn btn-pequeno btn-contorno" data-desconto="${d.id}">Desconto</button>
      </div></td></tr>`;
    }).join('')}</tbody></table></div>
    <div class="paginacao">
      <span class="mini">${total} registro(s) · página ${paginaAdmin} de ${paginas}</span>
      <button class="btn btn-pequeno btn-contorno" data-pag="-1" ${paginaAdmin<=1?'disabled':''}>Anterior</button>
      <button class="btn btn-pequeno btn-contorno" data-pag="1" ${paginaAdmin>=paginas?'disabled':''}>Próxima</button>
    </div>`;
  const barra = document.getElementById('barra-lote');
  const marcaTodos = document.getElementById('sel-todos');
  const atualizarLote = () => {
    const regs = [...selecionados].map(id => despesas.find(x => x.id === id)).filter(Boolean);
    const nDup = regs.filter(d => duplicidadesDe(d).length).length;
    barra.classList.toggle('oculto', regs.length === 0);
    document.getElementById('lote-n').textContent = regs.length;
    document.getElementById('lote-total').textContent = fmtBRL(regs.reduce((s,d) => s + d.valor, 0));
    const av = document.getElementById('lote-aviso');
    av.classList.toggle('oculto', nDup === 0);
    av.querySelector('span').textContent = nDup + ' com possível duplicidade';
    const caixas = [...alvo.querySelectorAll('.sel-reg')];
    marcaTodos.disabled = caixas.length === 0;
    marcaTodos.checked = caixas.length > 0 && caixas.every(cb => cb.checked);
    marcaTodos.indeterminate = caixas.some(cb => cb.checked) && !marcaTodos.checked;
  };
  const marcar = (cb, ligado) => {
    const id = +cb.dataset.sel;
    cb.checked = ligado;
    if(ligado) selecionados.add(id); else selecionados.delete(id);
    cb.closest('tr').classList.toggle('linha-sel', ligado);
  };
  alvo.querySelectorAll('.sel-reg').forEach(cb => cb.addEventListener('change', () => { marcar(cb, cb.checked); atualizarLote(); }));
  marcaTodos.addEventListener('change', () => { alvo.querySelectorAll('.sel-reg').forEach(cb => marcar(cb, marcaTodos.checked)); atualizarLote(); });
  alvo.querySelector('[data-limpar-lote]').addEventListener('click', () => { selecionados.clear(); desenharTabelaAdmin(); });
  alvo.querySelector('[data-aprovar-lote]').addEventListener('click', aprovarLote);
  atualizarLote();
  alvo.querySelectorAll('[data-ord]').forEach(el => el.addEventListener('click', () => {
    const c = el.dataset.ord;
    ordemAdmin = { campo: c, dir: ordemAdmin.campo === c ? -ordemAdmin.dir : 1 };
    desenharTabelaAdmin();
  }));
  alvo.querySelectorAll('[data-pag]').forEach(b => b.addEventListener('click', () => { paginaAdmin += +b.dataset.pag; desenharTabelaAdmin(); }));
  alvo.querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => abrirDetalhe(+b.dataset.ver)));
  alvo.querySelectorAll('[data-aprovar]').forEach(b => b.addEventListener('click', () => {
    const d = despesas.find(x => x.id == b.dataset.aprovar);
    const dupsAprov = duplicidadesDe(d);
    if(dupsAprov.length && !confirm('Atenção: possível duplicidade com ' + dupsAprov.map(x => '#' + x.id).join(', ') + '.\n\nAprovar mesmo assim?')) return;
    salvarDespesa(d, { status: 'aprovado' }, 'Aprovado');
    auditar('Aprovou registro #'+d.id, d.descricao);
    notificar(d.motoristaId, 'Registro aprovado: ' + d.descricao);
    mostrarMensagem('Despesa aprovada.');
    desenharTabelaAdmin();
  }));
  alvo.querySelectorAll('[data-rejeitar]').forEach(b => b.addEventListener('click', () => {
    const motivo = prompt('Motivo obrigatório da rejeição:');
    if(!motivo || !motivo.trim()){ mostrarMensagem('A rejeição exige um motivo.', true); return; }
    const d = despesas.find(x => x.id == b.dataset.rejeitar);
    salvarDespesa(d, { status: 'rejeitado', motivo: motivo.trim() }, 'Rejeitado: ' + motivo.trim());
    auditar('Rejeitou registro #'+d.id, d.motivo);
    notificar(d.motoristaId, 'Registro rejeitado: ' + d.descricao + ' — ' + d.motivo);
    mostrarMensagem('Despesa rejeitada.');
    desenharTabelaAdmin();
  }));
  alvo.querySelectorAll('[data-desconto]').forEach(b => b.addEventListener('click', () => {
    const d = despesas.find(x => x.id == b.dataset.desconto);
    const valor = prompt(`Valor informado: ${fmtBRL(d.valor)}\nValor a descontar (use 0 para nenhum):`, '0');
    if(valor === null) return;
    const n = parseFloat(String(valor).replace(',', '.'));
    if(isNaN(n) || n < 0 || n > d.valor){ mostrarMensagem('Valor inválido.', true); return; }
    const justificativa = prompt('Justificativa da decisão:');
    if(!justificativa || !justificativa.trim()){ mostrarMensagem('A justificativa é obrigatória.', true); return; }
    salvarDespesa(d, { desconto: n, motivo: justificativa.trim() }, 'Desconto definido: ' + fmtBRL(n) + ' — ' + justificativa.trim());
    auditar('Definiu desconto no registro #'+d.id, fmtBRL(n)+' — '+d.motivo);
    notificar(d.motoristaId, 'Desconto definido em "' + d.descricao + '": ' + fmtBRL(n));
    mostrarMensagem('Desconto registrado para conferência. Nenhum desconto é aplicado automaticamente em folha.');
    desenharTabelaAdmin();
  }));
}

/* ===== Relatórios ===== */
function lerFiltroRelatorio(){
  return {
    motorista: document.getElementById('r-motorista').value,
    placa: document.getElementById('r-placa').value,
    viagem: document.getElementById('r-viagem').value,
    categoria: document.getElementById('r-categoria').value,
    status: document.getElementById('r-status').value,
    agrupar: document.getElementById('r-agrupar').value,
    de: document.getElementById('r-de').value,
    ate: document.getElementById('r-ate').value
  };
}
function dadosRelatorio(f){
  return despesas.filter(d =>
    (!f.motorista || d.motoristaId === f.motorista) &&
    (!f.placa || d.placa === f.placa) &&
    (!f.viagem || String(d.viagemId || '') === f.viagem) &&
    (!f.categoria || d.categoria === f.categoria) &&
    (!f.status || d.status === f.status) &&
    (!f.de || d.data >= f.de) && (!f.ate || d.data <= f.ate)
  ).sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : a.id - b.id);
}
function totaisRelatorio(lista){
  const soma = st => lista.filter(d => d.status === st).reduce((s,d) => s + d.valor, 0);
  return {
    qtd: lista.length,
    informado: lista.reduce((s,d) => s + d.valor, 0),
    aprovado: soma('aprovado'),
    rejeitado: soma('rejeitado'),
    aguardando: soma('aguardando'),
    desconto: lista.reduce((s,d) => s + (d.desconto || 0), 0)
  };
}
function filtrarPeriodo(lista, de, ate){
  return lista.filter(d => (!de || d.data >= de) && (!ate || d.data <= ate));
}
function rotuloAgrupar(c){
  return ({motorista:'MOTORISTA', placa:'CAMINHÃO', viagem:'VIAGEM', categoria:'CATEGORIA', mes:'MÊS'})[c] || '';
}
function chaveAgrupamento(d, campo){
  if(campo === 'motorista') return nomeMotorista(d.motoristaId);
  if(campo === 'placa') return d.placa;
  if(campo === 'viagem') return d.viagemId ? 'Viagem #'+d.viagemId : 'Avulso';
  if(campo === 'categoria') return d.categoria;
  if(campo === 'mes') return d.data.slice(0,7);
  return '';
}
function descreverFiltros(f){
  const partes = [];
  if(f.motorista) partes.push('Motorista: ' + nomeMotorista(f.motorista));
  if(f.placa) partes.push('Caminhão: ' + f.placa);
  if(f.viagem) partes.push('Viagem #' + f.viagem);
  if(f.categoria) partes.push('Categoria: ' + f.categoria);
  if(f.status) partes.push('Status: ' + rotulosStatus[f.status]);
  if(f.de || f.ate) partes.push('Período: ' + (f.de ? fmtData(f.de) : 'início') + ' a ' + (f.ate ? fmtData(f.ate) : 'hoje'));
  if(f.agrupar) partes.push('Agrupado por ' + rotuloAgrupar(f.agrupar).toLowerCase());
  return partes.join(' · ') || 'Todos os registros';
}

function desenharGraficos(lista){
  const escuro = document.documentElement.dataset.tema === 'escuro';
  if(typeof Chart !== 'undefined') Chart.defaults.color = escuro ? '#C9D6EA' : '#5B6B7F';
  graficosAtivos.forEach(g => g.destroy());
  graficosAtivos = [];
  if(typeof Chart === 'undefined'){
    document.querySelectorAll('.grade-graficos').forEach(g => g.insertAdjacentHTML('beforeend', '<p class="aviso-demo">Gráficos indisponíveis: verifique a conexão para carregar a biblioteca.</p>'));
    return;
  }
  const cores = ['#1565C0','#D32F2F','#0B2A4A','#5C9BE0','#F28B8B','#7A8899','#2E8B57','#E0A100','#8E44AD','#00A3A3','#C0392B'];
  const porMes = {}, porCat = {}, porMot = {}, porCam = {};
  lista.forEach(d => {
    const mes = d.data.slice(0,7);
    porMes[mes] = (porMes[mes] || 0) + d.valor;
    porCat[d.categoria] = (porCat[d.categoria] || 0) + d.valor;
    const mot = nomeMotorista(d.motoristaId);
    porMot[mot] = (porMot[mot] || 0) + d.valor;
    porCam[d.placa] = (porCam[d.placa] || 0) + d.valor;
  });
  const criar = (id, tipo, rotulos, valores) => {
    const el = document.getElementById(id);
    if(!el) return;
    graficosAtivos.push(new Chart(el, {
      type: tipo,
      data: { labels: rotulos, datasets: [{ data: valores, backgroundColor: rotulos.map((_,i) => cores[i % cores.length]), borderRadius: tipo === 'bar' ? 8 : 0 }] },
      options: {
        responsive: true,
        ...(document.getElementById('conteudo').classList.contains('render-suave') ? { animation: false } : {}),
        plugins: { legend: { display: tipo !== 'bar', position: 'bottom' } },
        scales: tipo === 'bar' ? { y: { beginAtZero: true, ticks: { callback: v => 'R$ ' + Number(v).toLocaleString('pt-BR') } } } : {}
      }
    }));
  };
  const meses = Object.keys(porMes).sort();
  criar('g-mes', 'bar', meses.map(m => m.split('-').reverse().join('/')), meses.map(m => porMes[m]));
  criar('g-categoria', 'doughnut', Object.keys(porCat), Object.values(porCat));
  criar('g-motorista', 'bar', Object.keys(porMot), Object.values(porMot));
  criar('g-caminhao', 'bar', Object.keys(porCam), Object.values(porCam));
}

      </div>

      </div>

  ov.querySelector('#form-edicao').addEventListener('submit', e => {

    const f = new FormData(e.target);
    const novo = {
      categoria: f.get('categoria'), valor: parseFloat(f.get('valor')), data: f.get('data'),
      cidade: f.get('cidade').trim().toUpperCase(), local: f.get('local').trim().toUpperCase(),

      litros: f.get('categoria') === 'Combustível' ? (parseFloat(f.get('litros')) || 0) : 0
    };
    if(!(novo.valor > 0)){ mostrarMensagem('Informe um valor maior que zero.', true); return; }
    if(!novo.data || novo.data > hojeIso()){ mostrarMensagem('Informe uma data válida, que não seja futura.', true); return; }
    if(!novo.cidade || !novo.descricao){ mostrarMensagem('Cidade e descrição são obrigatórias.', true); return; }
    if((d.desconto || 0) > novo.valor){ mostrarMensagem('O valor não pode ficar abaixo do desconto já definido (' + fmtBRL(d.desconto) + ').', true); return; }
    const nomes = { categoria:'Categoria', valor:'Valor', data:'Data', cidade:'Cidade', local:'Local', descricao:'Descrição', obs:'Observações', litros:'Litros' };
    const fmt = (k, v) => k === 'valor' ? fmtBRL(v) : k === 'data' ? fmtData(v) : (v || '—');
    const mudancas = Object.keys(novo).filter(k => String(d[k] ?? '') !== String(novo[k] ?? ''))
      .map(k => `${nomes[k]}: ${fmt(k, d[k])} → ${fmt(k, novo[k])}`);
    if(!mudancas.length){ ov.remove(); return; }
    const alterados = {};
    Object.keys(novo).forEach(k => { if(String(d[k] ?? '') !== String(novo[k] ?? '')) alterados[k] = novo[k]; });
    salvarDespesa(d, alterados, 'Editado: ' + mudancas.join('; '));
    auditar('Editou registro #'+d.id, mudancas.join('; '));
    if(ehEquipe()) avisar(d.motoristaId, 'meus'); else avisar(contadorId(), 'registros');
    mostrarMensagem('Alterações salvas e registradas no histórico.');
    ov.remove();
    irPara(rotaAtual);
  });
  document.body.appendChild(ov);
}

/* ==========================================================
   v40 — ACOMPANHAMENTO DOS MOTORISTAS, ORÇAMENTOS E EQUIPE
   eventos/{id}      status da viagem, localização e ocorrências
   solicitacoes/{id} pedidos de orçamento (motorista pede, equipe libera)
   ========================================================== */
const STATUS_VIAGEM = {
  inicio:     { rot: 'Viagem iniciada',       cor: 'verde',    ico: 'play'  },
  transito:   { rot: 'Em trânsito',           cor: 'verde',    ico: 'truck' },
  parada:     { rot: 'Parado',                cor: 'amarelo',  ico: 'pause' },
  chegada:    { rot: 'Chegou ao destino',     cor: 'azul',     ico: 'flag'  },
  ocorrencia: { rot: 'Ocorrência',            cor: 'vermelho', ico: 'alert' },
  posicao:    { rot: 'Localização enviada',   cor: 'azul',     ico: 'pin'   }
};
const MOTIVOS_PARADA = ['Almoço', 'Descanso', 'Abastecimento', 'Pernoite', 'Carga / descarga', 'Fiscalização', 'Aguardando liberação', 'Outro'];
const TIPOS_OCORRENCIA = ['Problema mecânico', 'Pneu furado', 'Acidente', 'Atraso', 'Bloqueio na estrada', 'Roubo / assalto', 'Problema de saúde', 'Outro'];
const TIPOS_ORCAMENTO = ['Adiantamento extra', 'Manutenção / conserto', 'Pneu', 'Hospedagem', 'Combustível extra', 'Peças', 'Outros'];
const ROT_ORC = { pendente: 'Aguardando', liberado: 'Liberado', negado: 'Negado', cancelada: 'Cancelado' };
const CLASSE_ORC = { pendente: 'aguardando', liberado: 'aprovado', negado: 'rejeitado', cancelada: 'rejeitado' };

function tempoDesde(ts){
  if(!ts) return '';
  const min = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if(min < 1) return 'agora';
  if(min < 60) return 'há ' + min + ' min';
  const h = Math.floor(min / 60);
  if(h < 24) return 'há ' + h + ' h' + (min % 60 && h < 6 ? ' ' + (min % 60) + ' min' : '');
  const d = Math.floor(h / 24);
  return 'há ' + d + (d === 1 ? ' dia' : ' dias');
}
const fmtHora = ts => ts ? new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const linkMapa = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
function limiteHoras(){ try { return +(localStorage.getItem('rofe_lim_horas') || 4); } catch(e){ return 4; } }
function eventosDaViagem(id){ return eventos.filter(e => e.viagemId === id).sort((a, b) => (b.ts || 0) - (a.ts || 0)); }
function ocorrenciasAbertas(viagemId){ return eventos.filter(e => e.tipo === 'ocorrencia' && e.resolvida === false && (viagemId == null || e.viagemId === viagemId)); }
/* status mais recente da viagem (gravado na própria viagem; se faltar, usa o último evento ou a criação) */
function statusAtual(v){
  const ult = eventosDaViagem(v.id)[0];
  const s = v.ultimoStatus;
  if(s && (!ult || (s.ts || 0) >= (ult.ts || 0))) return s;
  if(ult) return { tipo: ult.tipo, detalhe: ult.detalhe, ts: ult.ts, lat: ult.lat, lng: ult.lng };
  return { tipo: 'inicio', detalhe: '', ts: v.criadoEm || (v.saida ? new Date(v.saida + 'T08:00').getTime() : 0) };
}
function horasSemAtualizacao(v){ const s = statusAtual(v); return s.ts ? (Date.now() - s.ts) / 3.6e6 : 0; }
function chipStatusViagem(v, comTempo){
  const s = statusAtual(v);
  let cfg = STATUS_VIAGEM[s.tipo] || STATUS_VIAGEM.transito;
  if(s.tipo === 'ocorrencia' && !ocorrenciasAbertas(v.id).length) cfg = { rot: 'Ocorrência resolvida', cor: 'azul', ico: 'check' };
  const atrasado = v.status === 'em andamento' && horasSemAtualizacao(v) >= limiteHoras();
  return `<span class="st-chip st-${cfg.cor}">${icon(cfg.ico)}<span>${esc(cfg.rot)}${s.detalhe ? ' · ' + esc(s.detalhe) : ''}</span></span>`
    + (comTempo && s.ts ? `<div class="mini st-tempo${atrasado ? ' st-atrasado' : ''}">${atrasado ? icon('clock') + ' Sem atualização ' : ''}${tempoDesde(s.ts)}${s.lat != null ? ` · <a href="${linkMapa(s.lat, s.lng)}" target="_blank" rel="noopener">ver no mapa</a>` : ''}</div>` : '');
}
function obterLocalizacao(ms){
  return new Promise(ok => {
    if(!navigator.geolocation) return ok(null);
    let feito = false;
    const fim = r => { if(!feito){ feito = true; ok(r); } };
    setTimeout(() => fim(null), ms || 9000);
    navigator.geolocation.getCurrentPosition(
      p => fim({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), precisao: Math.round(p.coords.accuracy || 0) }),
      () => fim(null), { enableHighAccuracy: true, timeout: (ms || 9000) - 500, maximumAge: 120000 });
  });
}
/* Motorista registra status/ocorrência: evento + último status gravado na viagem (aparece na hora para a operação) */
async function registrarEvento(v, tipo, detalhe, obs, comLocal){
  const loc = comLocal ? await obterLocalizacao() : null;
  const ts = Date.now();
  const ev = { motoristaId: v.motoristaId, motoristaNome: nomeMotorista(v.motoristaId) || usuarioAtual.nome, viagemId: v.id, placa: v.placa || '',
    tipo, detalhe: detalhe || '', obs: String(obs || '').slice(0, 500), ts, quando: agora(), por: usuarioAtual.nome };
  if(loc){ ev.lat = loc.lat; ev.lng = loc.lng; ev.precisao = loc.precisao; }
  if(tipo === 'ocorrencia') ev.resolvida = false;
  gravar(RofeDB.add('eventos', ev), 'Não foi possível enviar o status.');
  const ult = { tipo, detalhe: ev.detalhe, ts };
  if(loc){ ult.lat = loc.lat; ult.lng = loc.lng; }
  salvarViagem(v, { ultimoStatus: ult });
  if(tipo === 'ocorrencia'){ avisarEquipe('monitor'); auditar('Registrou ocorrência na viagem #' + v.id, detalhe + (obs ? ' — ' + obs : '')); }
  return !!loc;
}
function abrirAtualizarStatus(v, inicial){
  document.querySelectorAll('.overlay[data-status-modal]').forEach(o => o.remove());
  let lembrarLocal = true;
  try { lembrarLocal = localStorage.getItem('rofe_enviar_local') !== '0'; } catch(e){}
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.dataset.statusModal = '1';
  ov.innerHTML = `<div class="modal modal-status">

  const enviar = async (tipo, detalhe, obs) => {

function pedirAtualizacao(v){
  const ult = v.pedidoAtualizacaoEm || 0;
  if(Date.now() - ult < 10 * 60000 && !confirm('Você já pediu uma atualização ' + tempoDesde(ult) + '. Pedir de novo?')) return;
  notificar(v.motoristaId, 'A operação pediu uma atualização da viagem #' + v.id + ' (' + v.origem + ' → ' + v.destino + '). Toque em "Atualizar status" no Início.', 'inicio');

  auditar('Pediu atualização da viagem #' + v.id, nomeMotorista(v.motoristaId));

function resolverOcorrencia(id){
  const e = eventos.find(x => x.id === id);

  const sol = prompt('Como a ocorrência "' + e.detalhe + '" foi resolvida?', '');
  if(sol === null) return;
  const dados = { resolvida: true, solucao: sol.trim().slice(0, 300) || 'Resolvida', resolvidaPor: usuarioAtual.nome, resolvidaEm: Date.now() };
  Object.assign(e, dados);
  gravar(RofeDB.upd('eventos', id, dados), 'Não foi possível atualizar a ocorrência.');
  notificar(e.motoristaId, 'Ocorrência "' + e.detalhe + '" da viagem #' + e.viagemId + ' foi marcada como resolvida.', 'inicio');
  auditar('Resolveu ocorrência da viagem #' + e.viagemId, e.detalhe + ' — ' + dados.solucao);
  mostrarMensagem('Ocorrência resolvida.');

  agendarAtualizacaoTela();
}

/* ---------- Viagem do motorista: checklist, início/encerramento com km e jornada ---------- */
const ITENS_CHECK = {
  saida: ['Pneus e estepe', 'Freios', 'Luzes e setas', 'Óleo e água do motor', 'Documentos (CRLV, CNH, notas)', 'Extintor e triângulo', 'Tacógrafo', 'Carga amarrada ou lacrada']
};
/* Tempo ao volante desde a última parada (Lei 13.103/2015: no máximo 5h30 seguidas dirigindo, com 30 min de descanso) */
function jornada(v){
  if(!v || v.status !== 'em andamento') return null;
  const inicio = (v.checklistSaida && v.checklistSaida.ts) || v.criadoEm || 0;
  let dirigindo = true, desde = inicio;
  eventosDaViagem(v.id).slice().reverse().forEach(e => {
    if((e.ts || 0) < inicio) return;
    if(['parada', 'chegada', 'ocorrencia'].includes(e.tipo)){ if(dirigindo){ dirigindo = false; desde = e.ts; } }
    else if(['transito', 'inicio'].includes(e.tipo)){ if(!dirigindo){ dirigindo = true; desde = e.ts; } }
  });
  if(!desde) return null;
  const min = Math.max(0, Math.round((Date.now() - desde) / 60000));
  const hm = min >= 60 ? Math.floor(min / 60) + 'h' + String(min % 60).padStart(2, '0') : min + ' min';
  if(dirigindo){
    if(min >= 330) return { dirigindo, nivel: 'jor-vermelho', texto: `Dirigindo há <strong>${hm}</strong> sem parar. Pare agora e descanse 30 min (lei do motorista: no máximo 5h30 seguidas ao volante).` };
    if(min >= 300) return { dirigindo, nivel: 'jor-amarelo', texto: `Dirigindo há <strong>${hm}</strong>. Planeje uma parada de 30 min: o limite é 5h30 seguidas.` };
    return { dirigindo, nivel: '', texto: `Dirigindo há <strong>${hm}</strong> desde a última parada.` };
  }
  return { dirigindo, nivel: min >= 30 ? 'jor-verde' : '', texto: `Parado há <strong>${hm}</strong>${min >= 30 ? ' · descanso mínimo de 30 min cumprido' : ''}. Ao voltar a rodar, marque "Em trânsito".` };
}
function abrirChecklist(v, fase){
  if(fase !== 'saida') return;   /* o motorista só faz o checklist de saída; encerrar é com a operação/contador */
  const saida = fase === 'saida';
  const itens = ITENS_CHECK[fase];
  const kmIni = parseFloat(v.kmInicial);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal modal-status">
    <div class="modal-topo"><h2 style="margin:0;font-size:20px">${saida ? (v.status === 'agendada' ? 'Iniciar viagem' : 'Checklist de saída') : 'Encerrar viagem'}</h2><button type="button" class="btn btn-pequeno btn-contorno" data-fechar>Fechar</button></div>
    <p class="mini" style="margin:6px 0 14px">Viagem #${v.id} · ${esc(v.origem)} → ${esc(v.destino)} · ${esc(v.placa)}</p>
    <form id="form-ck" novalidate>
      <div class="campo"><label for="ck-km">${saida ? 'Km do painel na saída *' : 'Km do painel na chegada *'}</label>
        <input id="ck-km" type="number" inputmode="numeric" min="0" step="1" value="${saida && v.kmInicial ? esc(v.kmInicial) : ''}" placeholder="${!saida && kmIni ? 'Saída: ' + kmIni : 'Ex.: 152340'}"></div>
      <div class="mini" style="margin:-4px 0 10px">${saida ? 'Confira cada item do caminhão:' : 'Confira a entrega e o caminhão:'}</div>
      <div class="ck-lista">${itens.map((t, i) => `<div class="ck-item" data-i="${i}"><span>${esc(t)}</span>
        <div class="ck-opc"><button type="button" data-v="ok">OK</button><button type="button" data-v="prob">Problema</button></div></div>`).join('')}</div>
      <div class="campo" style="margin-top:12px"><label for="ck-obs">Observações <span class="mini" id="ck-obs-req"></span></label><textarea id="ck-obs" rows="2" maxlength="500" placeholder="${saida ? 'Ex.: luz de freio traseira queimada' : 'Ex.: cliente recebeu com 1 caixa avariada'}"></textarea></div>
      <div class="rodape-editor"><button type="submit" class="btn btn-primario btn-pequeno">${saida ? (v.status === 'agendada' ? 'Iniciar viagem' : 'Salvar checklist') : 'Encerrar viagem'}</button></div>
    </form></div>`;
  ov.addEventListener('click', e => { if(e.target === ov || e.target.hasAttribute('data-fechar')) ov.remove(); });
  const resp = {};
  ov.querySelectorAll('.ck-item').forEach(row => row.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    resp[row.dataset.i] = b.dataset.v;
    row.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('sel', x === b));
    row.classList.toggle('ck-prob', b.dataset.v === 'prob');
    ov.querySelector('#ck-obs-req').textContent = Object.values(resp).includes('prob') ? '(obrigatório: descreva o problema)' : '';
  })));
  ov.querySelector('#form-ck').addEventListener('submit', async e => {
    e.preventDefault();
    const km = Math.round(parseFloat(ov.querySelector('#ck-km').value));
    const obs = ov.querySelector('#ck-obs').value.trim();
    if(!(km > 0)){ mostrarMensagem('Informe o km do painel.', true); return; }
    if(!saida && kmIni && km <= kmIni){ mostrarMensagem('O km de chegada precisa ser maior que o de saída (' + kmIni + ').', true); return; }
    if(!saida && kmIni && km - kmIni > 6000 && !confirm('Foram ' + (km - kmIni) + ' km nesta viagem. Está correto?')) return;
    if(Object.keys(resp).length < itens.length){ mostrarMensagem('Marque OK ou Problema em todos os itens.', true); return; }
    const problemas = itens.filter((t, i) => resp[i] === 'prob');
    if(problemas.length && !obs){ mostrarMensagem('Descreva o problema nas observações.', true); return; }
    const ck = { itens: Object.fromEntries(itens.map((t, i) => [t, resp[i] === 'ok'])), problemas: problemas.length, obs, km, ts: Date.now(), por: usuarioAtual.nome };
    ov.querySelectorAll('button').forEach(b => b.disabled = true);
    if(saida){
      if(v.status === 'agendada'){
        salvarViagem(v, { status: 'em andamento', kmInicial: String(km), checklistSaida: ck, iniciadaPor: usuarioAtual.nome });
        await registrarEvento(v, 'inicio', '', problemas.length ? 'Checklist com problema: ' + problemas.join(', ') : '', false);
        avisarEquipe('monitor');
        auditar('Iniciou a viagem #' + v.id, 'Km ' + km + (problemas.length ? ' · checklist com problema: ' + problemas.join(', ') : ' · checklist OK'));
        mostrarMensagem('Viagem iniciada. Boa viagem e atenção na estrada!');
      } else {
        salvarViagem(v, { checklistSaida: ck, ...(v.kmInicial ? {} : { kmInicial: String(km) }) });
        auditar('Fez checklist de saída da viagem #' + v.id, problemas.length ? 'Problemas: ' + problemas.join(', ') : 'OK');
        mostrarMensagem('Checklist salvo.');
      }
      if(problemas.length){ avisarEquipe('monitor'); mostrarMensagem('A operação foi avisada dos problemas: ' + problemas.join(', ') + '.', true); }
    } else {
      if(!confirm('Encerrar a viagem #' + v.id + ' com km ' + km + '? Depois disso você não lança mais despesas nela.')){ ov.querySelectorAll('button').forEach(b => b.disabled = false); return; }
      await registrarEvento(v, 'chegada', 'Viagem encerrada', obs, false);
      salvarViagem(v, { status: 'finalizada', kmFinal: String(km), chegada: hojeIso(), checklistChegada: ck, encerradaPor: usuarioAtual.nome });
      avisarEquipe('viagens');
      auditar('Encerrou a viagem #' + v.id + ' (motorista)', 'Km ' + km + (kmIni ? ' · ' + (km - kmIni) + ' km rodados' : '') + (problemas.length ? ' · pendências: ' + problemas.join(', ') : ''));
      mostrarMensagem('Viagem encerrada' + (kmIni ? ': ' + (km - kmIni) + ' km rodados' : '') + '. Obrigado!');
    }
    ov.remove();
    irPara(rotaAtual);
  });
  document.body.appendChild(ov);
  ov.querySelector('#ck-km').focus();
}
function linhaChecklist(titulo, ck){
  const falhas = Object.entries(ck.itens || {}).filter(([, ok]) => !ok).map(([t]) => t);
  return `<div class="ck-resumo ${falhas.length ? 'ck-resumo-prob' : ''}"><strong>${titulo}:</strong> ${falhas.length ? 'problema em ' + falhas.map(esc).join(', ') : 'tudo OK'} · km ${esc(ck.km)} · ${esc(ck.por || '')} · ${fmtHora(ck.ts)}${ck.obs ? `<div class="mini">“${esc(ck.obs)}”</div>` : ''}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-checklist]');
  if(!b || !usuarioAtual) return;
  const v = viagens.find(x => x.id === +b.dataset.checklist);
  if(v && b.dataset.fase === 'saida') abrirChecklist(v, 'saida');
});
/* relógio da jornada: atualiza o Início do motorista a cada minuto */

/* ---------- Orçamentos ---------- */
function criarSolicitacao(dados){
  const v = viagens.find(x => x.motoristaId === usuarioAtual.id && x.status === 'em andamento')
    || viagens.filter(x => x.motoristaId === usuarioAtual.id && x.status === 'agendada').sort((a, b) => a.saida.localeCompare(b.saida))[0];
  const s = { motoristaId: usuarioAtual.id, motoristaNome: usuarioAtual.nome, viagemId: v ? v.id : null, placa: v ? v.placa : '',
    tipo: dados.tipo, valor: dados.valor, descricao: dados.descricao, urgente: !!dados.urgente, status: 'pendente', criadoEm: Date.now(), quando: agora() };
  gravar(RofeDB.add('solicitacoes', s), 'Não foi possível enviar o pedido.');
  avisarEquipe('solicitacoes');
  auditar('Pediu orçamento', s.tipo + ' · ' + fmtBRL(s.valor));
}
function abrirDecisaoOrcamento(id, liberar){
  const s = solicitacoes.find(x => x.id === id);
  if(!s || s.status !== 'pendente') return;
  const v = s.viagemId ? viagens.find(x => x.id === s.viagemId) : null;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal modal-perfil">
    <div class="modal-topo"><h2 style="margin:0;font-size:20px">${liberar ? 'Liberar orçamento' : 'Negar pedido'}</h2><button type="button" class="btn btn-pequeno btn-contorno" data-fechar>Fechar</button></div>
    <div class="orc-resumo"><strong>${esc(s.tipo)}</strong> · ${fmtBRL(s.valor)}${s.urgente ? ' <span class="tag rejeitado">Urgente</span>' : ''}
      <div class="mini">${esc(s.motoristaNome || nomeMotorista(s.motoristaId))}${v ? ' · Viagem #' + v.id + ' ' + esc(v.origem) + ' → ' + esc(v.destino) : ''}</div>
      <p style="margin:8px 0 0">${esc(s.descricao)}</p></div>
    <form id="form-dec" novalidate>
      ${liberar ? `<div class="campo"><label for="dec-valor">Valor liberado (R$)</label><input id="dec-valor" type="number" step="0.01" min="0.01" inputmode="decimal" value="${s.valor}"></div>` : ''}
      <div class="campo"><label for="dec-txt">${liberar ? 'Orientação ao motorista (opcional)' : 'Motivo (obrigatório)'}</label><textarea id="dec-txt" rows="3" maxlength="400" placeholder="${liberar ? 'Ex.: pode fazer no posto X, guarde a nota' : 'Ex.: conserto será feito na base'}"></textarea></div>
      ${liberar && v ? `<label class="st-local"><input type="checkbox" id="dec-somar" ${s.tipo === 'Adiantamento extra' ? 'checked' : ''}> Somar ao adiantamento da viagem #${v.id} (hoje ${fmtBRL(parseFloat(v.adiantamento) || 0)})</label>` : ''}
      <div class="rodape-editor"><button type="submit" class="btn ${liberar ? 'btn-primario' : 'btn-vermelho'} btn-pequeno">${liberar ? 'Liberar' : 'Negar pedido'}</button></div>
    </form></div>`;
  ov.addEventListener('click', e => { if(e.target === ov || e.target.hasAttribute('data-fechar')) ov.remove(); });
  ov.querySelector('#form-dec').addEventListener('submit', e => {
    e.preventDefault();
    const txt = ov.querySelector('#dec-txt').value.trim();
    const dados = { status: liberar ? 'liberado' : 'negado', resposta: txt, decididoPor: usuarioAtual.nome, decididoPerfil: usuarioAtual.perfil, decididoEm: Date.now() };
    if(liberar){
      const val = Math.round(parseFloat(ov.querySelector('#dec-valor').value) * 100) / 100;
      if(!(val > 0)){ mostrarMensagem('Informe o valor liberado.', true); return; }
      dados.valorLiberado = val;
      const somar = ov.querySelector('#dec-somar');
      if(somar && somar.checked && v){
        dados.somadoAdiantamento = true;
        salvarViagem(v, { adiantamento: Math.round(((parseFloat(v.adiantamento) || 0) + val) * 100) / 100 });
      }
    } else if(!txt){ mostrarMensagem('Informe o motivo.', true); return; }
    Object.assign(s, dados);
    gravar(RofeDB.upd('solicitacoes', s.id, dados), 'Não foi possível salvar a decisão.');
    notificar(s.motoristaId, liberar
      ? 'Orçamento LIBERADO: ' + s.tipo + ' · ' + fmtBRL(dados.valorLiberado) + (txt ? ' — ' + txt : '')
      : 'Pedido de orçamento negado: ' + s.tipo + ' — ' + txt, 'orcamentos');
    auditar((liberar ? 'Liberou' : 'Negou') + ' orçamento', (s.motoristaNome || '') + ' · ' + s.tipo + ' · ' + fmtBRL(liberar ? dados.valorLiberado : s.valor));
    ov.remove();
    mostrarMensagem(liberar ? 'Orçamento liberado. O motorista foi avisado.' : 'Pedido negado. O motorista foi avisado.');
    agendarAtualizacaoTela();
  });
  document.body.appendChild(ov);
  ov.querySelector(liberar ? '#dec-valor' : '#dec-txt').focus();
}
function linhaOrcamento(s, gest){
  const v = s.viagemId ? viagens.find(x => x.id === s.viagemId) : null;
  return `<tr data-orc="${esc(s.id)}" class="${s.urgente && s.status === 'pendente' ? 'linha-urgente' : ''}">
    <td>${fmtHora(s.criadoEm)}<div class="mini">${tempoDesde(s.criadoEm)}</div></td>
    ${gest ? `<td><strong>${esc(s.motoristaNome || nomeMotorista(s.motoristaId))}</strong><div class="mini">${v ? 'Viagem #' + v.id + ' · ' + esc(v.placa) : 'Sem viagem'}</div></td>` : ''}
    <td>${esc(s.tipo)}${s.urgente ? ' <span class="tag rejeitado">Urgente</span>' : ''}<div class="mini">${esc(s.descricao)}</div></td>
    <td class="num">${fmtBRL(s.valor)}${s.status === 'liberado' && s.valorLiberado !== s.valor ? `<div class="mini">Liberado ${fmtBRL(s.valorLiberado)}</div>` : ''}</td>
    <td><span class="tag ${CLASSE_ORC[s.status]}">${ROT_ORC[s.status]}</span>${s.decididoPor ? `<div class="mini">${esc(s.decididoPor)}${s.somadoAdiantamento ? ' · somado ao adiantamento' : ''}</div>` : ''}${s.resposta ? `<div class="mini">“${esc(s.resposta)}”</div>` : ''}</td>

let filtroOrc = 'pendente';
function desenharSolicitacoes(){
  const alvo = document.getElementById('orc-lista');
  if(!alvo) return;
  const lista = solicitacoes.filter(s => filtroOrc === 'todos' || s.status === filtroOrc)
    .sort((a, b) => (filtroOrc === 'pendente' ? (b.urgente - a.urgente) : 0) || (b.criadoEm - a.criadoEm));
  document.querySelectorAll('[data-filtro-orc]').forEach(b => b.classList.toggle('ativo', b.dataset.filtroOrc === filtroOrc));

    <tbody>${lista.map(s => linhaOrcamento(s, true)).join('')}</tbody></table></div>` : '<div class="card vazio">Nenhum pedido nesta lista.</div>';

/* ---------- Mapa do monitoramento (Leaflet, carregado só quando a tela abre) ---------- */
let leafletPromessa = null;
function carregarLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(leafletPromessa) return leafletPromessa;
  leafletPromessa = new Promise((ok, falha) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    js.onload = () => ok(window.L);
    js.onerror = () => { leafletPromessa = null; falha(new Error('Leaflet indisponível')); };
    document.head.appendChild(js);
  });
  return leafletPromessa;
}
const CORES_ST = { verde: '#1E7B3A', amarelo: '#E0A100', azul: '#1565C0', vermelho: '#D32F2F' };
function desenharMapaMonitor(info){
  const slot = document.getElementById('mon-mapa');
  const legenda = document.getElementById('mon-mapa-info');
  if(!slot) return;
  const comPos = info.filter(i => i.st.lat != null);
  if(!window.__mapaEl){ window.__mapaEl = document.createElement('div'); window.__mapaEl.className = 'mon-mapa-canvas'; }
  slot.appendChild(window.__mapaEl);
  if(legenda) legenda.textContent = comPos.length ? comPos.length + ' de ' + info.length + ' viagem(ns) com localização. Os pontos mostram a última posição enviada pelo motorista.' : 'Nenhuma localização enviada ainda. Os motoristas enviam pelo botão "Atualizar status".';
  carregarLeaflet().then(L => {
    if(!window.__mapaMonitor){
      window.__mapaMonitor = L.map(window.__mapaEl, { zoomControl: true, attributionControl: true }).setView([-3.5, -45.5], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(window.__mapaMonitor);
      window.__mapaCamada = L.layerGroup().addTo(window.__mapaMonitor);
    }
    const mapa = window.__mapaMonitor;
    setTimeout(() => mapa.invalidateSize(), 50);
    window.__mapaCamada.clearLayers();
    const pts = [];
    comPos.forEach(({ v, st }) => {
      const cfg = STATUS_VIAGEM[st.tipo] || STATUS_VIAGEM.transito;
      const mk = L.circleMarker([st.lat, st.lng], { radius: 10, color: '#fff', weight: 2, fillColor: CORES_ST[cfg.cor], fillOpacity: .95 });
      mk.bindPopup(`<strong>${esc(nomeMotorista(v.motoristaId))}</strong><br>${esc(v.placa)} · #${v.id} ${esc(v.origem)} → ${esc(v.destino)}<br>${esc(cfg.rot)}${st.detalhe ? ' · ' + esc(st.detalhe) : ''}<br><small>${tempoDesde(st.ts)}</small>`);
      mk.addTo(window.__mapaCamada);
      pts.push([st.lat, st.lng]);
    });
    const assin = pts.map(p => p.join(',')).join('|');
    if(pts.length && assin !== window.__mapaAssin){
      window.__mapaAssin = assin;
      if(pts.length === 1) mapa.setView(pts[0], 11); else mapa.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
    }
  }).catch(() => { window.__mapaEl.innerHTML = '<div class="vazio">Mapa indisponível agora (sem internet). Use os links "ver no mapa" de cada viagem.</div>'; });
}

function celulaCNH(u){
  const c = situacaoCNH(u);
  if(!u.cnhCategoria && !c) return '<span class="mini">—</span>';
  return `${u.cnhCategoria ? '<strong>' + esc(u.cnhCategoria) + '</strong>' : ''}${c ? `<div class="mini ${c.vencida ? 'g-verm' : c.vencendo ? 'st-atrasado' : ''}">${c.vencida ? 'Vencida há ' + (-c.dias) + ' dia(s)' : c.vencendo ? 'Vence em ' + c.dias + ' dia(s)' : 'Válida até ' + fmtData(u.cnhValidade)}</div>` : ''}`;
}

          <div class="linha-acoes"><button type="button" class="btn btn-pequeno btn-primario" data-aprovar-cad="${esc(d.uid)}">Aprovar</button><button type="button" class="btn btn-pequeno btn-vermelho" data-recusar-cad="${esc(d.uid)}">Recusar</button></div>
        </div></div>`;
    }).join('')}</div>`;

async function decidirCadastro(uid, aprovar, vinculoId){
  const d = cadastrosPendentes.find(x => x.uid === uid);
  if(!d || !ehAdmin()) return;
  const vinc = vinculoId ? USUARIOS.find(u => u.id === vinculoId) : null;
  if(aprovar && !confirm(vinc ? `Aprovar ${d.nome} e vincular ao cadastro de ${vinc.nome}? As viagens e registros de ${vinc.nome} passam a aparecer para este novo login.` : `Aprovar o cadastro de ${d.nome}?`)) return;
  if(!aprovar && !confirm('Recusar o cadastro de ' + d.nome + '?')) return;
  const dados = aprovar
    ? { ativo: true, cadastroStatus: 'aprovado', aprovadoPor: usuarioAtual.nome, aprovadoEm: Date.now(), ...(vinc ? { idApp: vinc.id } : {}) }
    : { ativo: false, cadastroStatus: 'recusado', recusadoPor: usuarioAtual.nome, recusadoEm: Date.now() };
  try {
    const ops = [{ tipo: 'upd', col: 'usuarios', id: uid, dados }];
    if(aprovar && vinc && vinc.uid && vinc.uid !== uid) ops.push({ tipo: 'upd', col: 'usuarios', id: vinc.uid, dados: { ativo: false, cadastroStatus: 'substituido', substituidoPor: uid, substituidoEm: Date.now() } });
    await RofeDB.lote(ops);
    auditar(aprovar ? 'Aprovou cadastro de motorista' : 'Recusou cadastro de motorista', d.nome + ' · ' + (d.telefone || '') + (vinc ? ' · vinculado a ' + vinc.nome : ''));
    mostrarMensagem(aprovar ? d.nome + ' aprovado. Ele já pode entrar pelo "SOU MOTORISTA".' : 'Cadastro recusado.');
  } catch(err){ console.error(err); mostrarMensagem(window.RofeAuth.traduzirErro(err, 'Não foi possível salvar a decisão.'), true); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-aprovar-cad],[data-recusar-cad]');
  if(!a || !usuarioAtual) return;
  const item = a.closest('.cad-item');
  if(a.dataset.aprovarCad) decidirCadastro(a.dataset.aprovarCad, true, item.querySelector('[data-vinculo]').value);
  else decidirCadastro(a.dataset.recusarCad, false);
});

/* ---------- 2. Dinheiro na rua ---------- */
function calcularDinheiro(){
  const linhas = viagens.filter(v => v.status === 'em andamento' || (v.status === 'finalizada' && Math.abs(saldoViagem(v).saldo) > 0.009))
    .map(v => { const sv = saldoViagem(v); return { v, ...sv, semComprov: Math.max(0, sv.adiant - sv.aprovado - sv.aguardando) }; })
    .filter(x => x.adiant > 0 || x.v.status === 'em andamento');
  const porMot = {};
  linhas.forEach(x => {
    const k = x.v.motoristaId, o = porMot[k] || (porMot[k] = { id: k, adiant: 0, aprovado: 0, aguardando: 0, semComprov: 0, viagens: 0 });
    o.adiant += x.adiant; o.aprovado += x.aprovado; o.aguardando += x.aguardando; o.semComprov += x.semComprov; o.viagens++;
  });
  const tot = linhas.reduce((t, x) => ({ adiant: t.adiant + x.adiant, aprovado: t.aprovado + x.aprovado, aguardando: t.aguardando + x.aguardando, semComprov: t.semComprov + x.semComprov }), { adiant: 0, aprovado: 0, aguardando: 0, semComprov: 0 });
  return { linhas, porMot: Object.values(porMot).sort((a, b) => b.semComprov - a.semComprov), tot };
}
function descontosDoMes(m){
  const por = {};
  despesas.filter(d => (d.desconto || 0) > 0 && mesDe(d.data) === m).forEach(d => {
    const o = por[d.motoristaId] || (por[d.motoristaId] = { id: d.motoristaId, total: 0, regs: [] });
    o.total += d.desconto; o.regs.push(d);
  });
  return Object.values(por).sort((a, b) => b.total - a.total);
}

/* ---------- 3. Custos ---------- */
function calcularCustos(m){
  const doMes = validas().filter(d => mesDe(d.data) === m), antes = validas().filter(d => mesDe(d.data) === mesAnterior(m));
  const soma = l => l.reduce((s, d) => s + d.valor, 0);
  const cats = CATEGORIAS.map(c => ({ c, atual: soma(doMes.filter(d => d.categoria === c)), ant: soma(antes.filter(d => d.categoria === c)) })).filter(x => x.atual || x.ant).sort((a, b) => b.atual - a.atual);
  const vIds = [...new Set(doMes.map(d => d.viagemId).filter(x => x != null))];
  const porViagem = vIds.map(id => viagens.find(v => v.id === id)).filter(Boolean).map(v => ({ v, ...metricasViagem(v) })).sort((a, b) => b.custo - a.custo);
  const porCam = {};
  porViagem.forEach(x => {
    const k = x.v.placa, o = porCam[k] || (porCam[k] = { placa: k, cam: caminhaoDe(x.v), custo: 0, km: 0, litros: 0, viagens: 0, kmLitros: 0 });
    o.custo += x.custo; o.viagens++;
    if(x.km){ o.km += x.km; if(x.litros > 0){ o.kmLitros += x.km; o.litros += x.litros; } }
  });
  return { total: soma(doMes), totalAnt: soma(antes), n: doMes.length, cats, porViagem, porCam: Object.values(porCam).sort((a, b) => b.custo - a.custo) };
}
function setaVar(atual, ant){
  if(!ant) return atual ? '<span class="g-var g-sobe">novo</span>' : '';
  const p = (atual - ant) / ant * 100;
  if(Math.abs(p) < 1) return '<span class="g-var">=</span>';
  return `<span class="g-var ${p > 0 ? 'g-sobe' : 'g-desce'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%</span>`;
}

/* ---------- 4. Vistoria automática ---------- */
const TIPOS_VISTORIA = {
  acima: 'Valor acima do normal', preco: 'Preço do litro fora do padrão', mesmoDia: 'Vários abastecimentos no mesmo dia',
  tardio: 'Lançado com atraso', semFoto: 'Sem foto da nota', dup: 'Possível duplicidade'
};
function calcularVistoria(){
  const base = validas();
  const med = {};
  CATEGORIAS.forEach(c => { const vals = base.filter(d => d.categoria === c).map(d => d.valor); med[c] = { m: mediana(vals), n: vals.length }; });
  const A = [];
  const add = (tipo, d, motivo, grav) => A.push({ tipo, d, motivo, grav });
  base.forEach(d => {
    const md = med[d.categoria];
    if(md && md.n >= 5 && md.m > 0 && d.valor >= md.m * 3) add('acima', d, `${fmtBRL(d.valor)} é ${(d.valor / md.m).toFixed(1)}× o valor típico de ${d.categoria} (${fmtBRL(md.m)})`, 2);
    if(d.categoria === 'Combustível' && d.litros > 0){
      const pl = d.valor / d.litros;
      if(pl < 3.5 || pl > 9.5) add('preco', d, `${fmtBRL(pl)} por litro (${fmtNum(d.litros, 1)} L por ${fmtBRL(d.valor)}). Confira se os litros foram digitados certo.`, 2);
    }
    if(d.criadoEm && d.data){
      const atraso = diasAte(d.data, new Date(d.criadoEm - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10));
      if(atraso > 7) add('tardio', d, `Nota de ${fmtData(d.data)} lançada ${atraso} dias depois.`, 1);
    }
    if(!(d.fotos > 0) && !(d.fotoIds || []).length) add('semFoto', d, 'Registro sem foto da nota.', 1);
    if(d.status === 'aguardando'){ const dp = duplicidadesDe(d); if(dp.length) add('dup', d, 'Parecido com ' + dp.map(x => '#' + x.id + ' (' + x.motivos.join(' e ') + ')').join(', '), 3); }
  });
  const comb = {};
  base.filter(d => d.categoria === 'Combustível').forEach(d => { const k = (d.placa || d.motoristaId) + '|' + d.data; (comb[k] = comb[k] || []).push(d); });
  Object.values(comb).filter(l => l.length > 1).forEach(l => l.forEach(d => add('mesmoDia', d, `${l.length} abastecimentos em ${fmtData(d.data)} (${esc(d.placa || '')}): ${l.map(x => '#' + x.id).join(', ')}`, 2)));
  return A.sort((a, b) => (b.grav - a.grav) || (b.d.id - a.d.id));
}

/* ---------- 5. Movimentações ---------- */
function calcularMovimentos(){
  const itens = auditoria.map(a => ({ ts: a.tsLocal || 0, quem: a.quem, perfil: a.perfil, texto: a.acao, detalhe: a.detalhe, tipo: 'acao' }))
    .concat(eventos.filter(e => e.tipo !== 'ocorrencia').map(e => ({ ts: e.ts, quem: e.motoristaNome || nomeMotorista(e.motoristaId), perfil: 'motorista',
      texto: (STATUS_VIAGEM[e.tipo] || {}).rot + (e.detalhe ? ' · ' + e.detalhe : ''), detalhe: 'Viagem #' + e.viagemId + (e.obs ? ' — ' + e.obs : ''), tipo: 'status' })));
  return itens.filter(x => x.ts).sort((a, b) => b.ts - a.ts);
}

/* ---------- 6. Ranking ---------- */
function calcularRanking(m){
  const mots = USUARIOS.filter(u => u.perfil === 'motorista');
  return mots.map(u => {
    const regs = despesas.filter(d => d.motoristaId === u.id && mesDe(d.data) === m);
    const val = regs.filter(d => d.status !== 'rejeitado');
    const gasto = val.reduce((s, d) => s + d.valor, 0);
    const vs = viagens.filter(v => v.motoristaId === u.id && v.status !== 'cancelada' && v.status !== 'agendada' && (mesDe(v.saida) === m || mesDe(v.chegada) === m || (v.status === 'em andamento' && mesDe(v.saida) <= m)));
    const dias = vs.reduce((s, v) => s + Math.max(1, diasAte(v.saida, v.chegada || hojeIso()) + 1), 0);
    const atrasos = regs.filter(d => d.criadoEm).map(d => Math.max(0, diasAte(d.data, new Date(d.criadoEm - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10))));
    const evs = eventos.filter(e => e.motoristaId === u.id && vs.some(v => v.id === e.viagemId));
    return { u, viagens: vs.length, dias, gasto, gastoDia: dias ? gasto / dias : 0, n: regs.length,
      rejeit: regs.length ? regs.filter(d => d.status === 'rejeitado').length / regs.length * 100 : 0,
      atraso: atrasos.length ? atrasos.reduce((a, b) => a + b, 0) / atrasos.length : 0,
      status: vs.length ? evs.filter(e => e.tipo !== 'ocorrencia').length / vs.length : 0,
      ocs: evs.filter(e => e.tipo === 'ocorrencia').length,
      desconto: regs.reduce((s, d) => s + (d.desconto || 0), 0) };
  }).filter(r => r.n || r.viagens);
}

/* ---------- 7. Fechamento ---------- */
function exportarFechamentoCSV(m){
  const linhas = [['Registro', 'Data', 'Motorista', 'Placa', 'Viagem', 'Categoria', 'Cidade', 'Descrição', 'Valor', 'Litros', 'Status', 'Desconto', 'Motivo']];
  despesas.filter(d => mesDe(d.data) === m).sort((a, b) => a.data.localeCompare(b.data) || a.id - b.id).forEach(d => linhas.push([
    d.id, fmtData(d.data), nomeMotorista(d.motoristaId), d.placa || '', d.viagemId || '', d.categoria, d.cidade || '', d.descricao || '',
    String(d.valor.toFixed(2)).replace('.', ','), d.litros ? String(d.litros).replace('.', ',') : '', rotulosStatus[d.status] || d.status,
    String((d.desconto || 0).toFixed(2)).replace('.', ','), d.motivo || '']));
  const csv = '﻿' + linhas.map(l => l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'rofe_fechamento_' + m + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  auditar('Exportou fechamento do mês', nomeMes(m));
}

function abaFechamento(el){
  const m = mesGestor;

  const aguard = doMes.filter(d => d.status === 'aguardando');
  const abertas = viagens.filter(v => v.status === 'em andamento' && mesDe(v.saida) <= m);

  const fin = viagens.filter(v => v.status === 'finalizada' && mesDe(v.chegada || v.saida) === m);
  const comSaldo = fin.filter(v => Math.abs(saldoViagem(v).saldo) > 0.009);
  const desc = descontosDoMes(m);
  const aprov = doMes.filter(d => d.status === 'aprovado');
  const porCat = CATEGORIAS.map(c => [c, aprov.filter(d => d.categoria === c).reduce((s, d) => s + d.valor, 0)]).filter(x => x[1]);
  const item = (ok, txt) => `<li class="${ok ? 'ok' : 'pend'}">${ok ? '✔' : '✖'} ${txt}</li>`;
  const pronto = !aguard.length && !orc.length;
  el.innerHTML = `
    <div class="linha-acoes" style="margin-bottom:14px">
      <button type="button" class="btn btn-primario btn-pequeno" id="fc-csv">${icon('download')}<span>Exportar planilha (CSV)</span></button>

    <div id="g-fech">
      <div class="painel-bloco ${pronto ? 'g-fech-ok' : 'g-fech-pend'}"><h2>${pronto ? 'Mês pronto para fechar' : 'Ainda falta resolver'}</h2>
        <ul class="g-check">
          ${item(!aguard.length, aguard.length ? aguard.length + ' registro(s) do mês aguardando análise' : 'Todos os registros do mês analisados')}
          ${item(!orc.length, orc.length ? orc.length + ' orçamento(s) sem resposta' : 'Nenhum orçamento pendente')}
          ${item(!abertas.length, abertas.length ? abertas.length + ' viagem(ns) ainda em andamento (entram no próximo fechamento)' : 'Nenhuma viagem aberta')}
          ${item(!comSaldo.length, comSaldo.length ? comSaldo.length + ' viagem(ns) encerrada(s) com saldo a acertar' : 'Saldos das viagens acertados')}
        </ul></div>
      <div class="cards">
        <div class="card verde"><div class="rotulo">Aprovado no mês</div><div class="valor">${fmtBRL(aprov.reduce((s, d) => s + d.valor, 0))}</div></div>
        <div class="card"><div class="rotulo">Viagens encerradas</div><div class="valor">${fin.length}</div></div>
        <div class="card vermelho"><div class="rotulo">Descontos em folha</div><div class="valor">${fmtBRL(desc.reduce((s, o) => s + o.total, 0))}</div></div>
        <div class="card azul"><div class="rotulo">Registros no mês</div><div class="valor">${doMes.length}</div></div>
      </div>
      <div class="painel-bloco"><h2>Aprovado por categoria</h2>${porCat.length ? `<table><tbody>${porCat.map(([c, v]) => `<tr><td>${esc(c)}</td><td class="num">${fmtBRL(v)}</td></tr>`).join('')}</tbody></table>` : '<div class="vazio">Nada aprovado neste mês.</div>'}</div>
      <div class="painel-bloco"><h2>Saldos das viagens encerradas</h2>${comSaldo.length ? `<table><thead><tr><th>Viagem</th><th>Motorista</th><th>Adiantado</th><th>Aprovado</th><th>Saldo</th></tr></thead><tbody>
        ${comSaldo.map(v => { const s = saldoViagem(v); return `<tr><td>#${v.id} ${esc(v.origem)} → ${esc(v.destino)}</td><td>${esc(nomeMotorista(v.motoristaId))}</td><td class="num">${fmtBRL(s.adiant)}</td><td class="num">${fmtBRL(s.aprovado)}</td><td class="num"><strong>${fmtBRL(Math.abs(s.saldo))}</strong> ${rotuloSaldo(s.saldo).toLowerCase()}</td></tr>`; }).join('')}</tbody></table>` : '<div class="vazio">Nenhum saldo a acertar.</div>'}</div>
      <div class="painel-bloco"><h2>Descontos a lançar em folha</h2>${desc.length ? `<table><tbody>${desc.map(o => `<tr><td>${esc(nomeMotorista(o.id))}</td><td class="mini">${o.regs.map(d => '#' + d.id).join(', ')}</td><td class="num"><strong>${fmtBRL(o.total)}</strong></td></tr>`).join('')}</tbody></table>` : '<div class="vazio">Nenhum desconto.</div>'}</div>
    </div>`;
  el.querySelector('#fc-csv').addEventListener('click', () => exportarFechamentoCSV(m));
  el.querySelector('#fc-pdf').addEventListener('click', () => imprimirFechamento(m));
}

function linksContato(u){
  if(!u) return '';
  const digitos = (u.telefone || '').replace(/\D/g, '');
  const fone = digitos ? (digitos.length <= 11 ? '55' + digitos : digitos) : '';
  const partes = [];
  if(digitos) partes.push(`<a class="contato-link" href="https://wa.me/${fone}" target="_blank" rel="noopener">${icon('phone')}<span>${esc(u.telefone)}</span></a>`);
  if(u.email) partes.push(`<a class="contato-link" href="mailto:${esc(u.email)}">${icon('mail')}<span>${esc(u.email)}</span></a>`);
  return partes.length ? `<div class="contatos">${partes.join('')}</div>` : '<span class="mini">Contato não informado</span>';
}
