/* ---- fila offline (IndexedDB): registros feitos sem internet ---- */
const FilaIDB = (() => {
  let conexao;
  const abrir = () => conexao || (conexao = new Promise((ok, falha) => {
    const r = indexedDB.open('rofe-fila', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('registros', { keyPath: 'chave' });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => { conexao = null; falha(r.error); };
  }));
  const tx = async (modo, fn) => {
    const db = await abrir();
    return new Promise((ok, falha) => {
      const t = db.transaction('registros', modo);
      const req = fn(t.objectStore('registros'));
      t.oncomplete = () => ok(req ? req.result : undefined);
      t.onerror = () => falha(t.error);
    });
  };
  return {
    por: item => tx('readwrite', s => s.put(item)),
    tirar: chave => tx('readwrite', s => s.delete(chave)),
    todos: () => tx('readonly', s => s.getAll())
  };
})();
async function atualizarFila(){
  const antes = filaItens.length;
  if(!usuarioAtual || usuarioAtual.perfil !== 'motorista' || !window.indexedDB) filaItens = [];
  else {
    try { filaItens = (await FilaIDB.todos()).filter(x => x.dono === (usuarioAtual.uid || usuarioAtual.id)).sort((a, b) => a.criadoEm - b.criadoEm); }
    catch(e){ console.warn(e); filaItens = []; }
  }
  atualizarIndicadorSync();
  if(antes !== filaItens.length && ['inicio', 'meus'].includes(rotaAtual)) agendarAtualizacaoTela();
}
async function guardarNaFila(dados, fotosC){
  const item = { chave: 'f' + Date.now() + Math.random().toString(36).slice(2, 7), dono: usuarioAtual.uid || usuarioAtual.id, criadoEm: Date.now(), dados, fotos: fotosC };
  try { await FilaIDB.por(item); }
  catch(e){ console.error(e); mostrarMensagem('Não foi possível guardar o registro no aparelho. Libere espaço e tente de novo.', true); return false; }
  await atualizarFila();
  return true;
}
async function enviarFila(){
  if(Sync.enviandoFila || !usuarioAtual || !filaItens.length || !navigator.onLine || !window.RofeDB) return;
  Sync.enviandoFila = true; atualizarIndicadorSync();
  let enviados = 0;
  try {
    for(const item of filaItens.slice()){
      if(!usuarioAtual || item.dono !== (usuarioAtual.uid || usuarioAtual.id)) break;
      try {
        const n = await criarDespesaNoBanco(item.dados, item.fotos || []);
        await FilaIDB.tirar(item.chave);
        enviados++;
        mostrarMensagem('Registro guardado no aparelho foi enviado: #' + n + '.');
      } catch(err){
        console.error(err);
        if(!ehErroConexao(err)) mostrarMensagem(window.RofeAuth.traduzirErro(err, 'Não foi possível enviar um registro guardado. Ele continua no aparelho.'), true);
        break;
      }
    }
  } finally {
    Sync.enviandoFila = false;
    await atualizarFila();
    if(enviados) agendarAtualizacaoTela();
  }
}

const CAMPOS_RASCUNHO = ['d-categoria', 'd-valor', 'd-litros', 'd-data', 'd-cidade', 'd-local', 'd-descricao'];
function ligarRascunho(form){
  if(!form) return;
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(chaveRascunho()) || 'null'); } catch(e){}
  if(salvo){
    CAMPOS_RASCUNHO.forEach(id => { const el = document.getElementById(id); if(el && salvo[id] != null) el.value = salvo[id]; });
    if(salvo['d-valor'] || salvo['d-descricao'] || salvo['d-cidade']) mostrarMensagem('Rascunho recuperado. Continue de onde parou.');
  }
  const data = document.getElementById('d-data');
  if(data && !data.value) data.value = hojeIso();
  let t;
  form.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const o = {};
      CAMPOS_RASCUNHO.forEach(id => { const el = document.getElementById(id); if(el) o[id] = el.value; });
      try { localStorage.setItem(chaveRascunho(), JSON.stringify(o)); } catch(e){}
    }, 400);
  });
}

function mostrarMensagem(texto, erro=false){
  let cont = document.getElementById('toasts');
  if(!cont){
    cont = document.createElement('div');
    cont.id = 'toasts';
    document.body.appendChild(cont);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (erro ? ' toast-erro' : '');

  cont.appendChild(el);
  setTimeout(() => { el.classList.add('saindo'); setTimeout(() => el.remove(), 350); }, 3000);
}

/* situação da CNH: vencida, vence em até 30 dias ou ok */
function situacaoCNH(u){
  if(!u || !u.cnhValidade) return null;
  const dias = Math.round((new Date(u.cnhValidade + 'T12:00') - new Date(hojeIso() + 'T12:00')) / 864e5);
  return { dias, vencida: dias < 0, vencendo: dias >= 0 && dias <= 30 };

/* ----- Adiantamento e saldo ----- */
function saldoViagem(v){
  const regs = despesas.filter(d => d.viagemId === v.id);
  const soma = st => regs.filter(d => d.status === st).reduce((s, d) => s + d.valor, 0);
  const adiant = parseFloat(v.adiantamento) || 0;
  const aprovado = soma('aprovado');
  return {
    regs, adiant, aprovado,
    aguardando: soma('aguardando'), rejeitado: soma('rejeitado'),
    nAguard: regs.filter(d => d.status === 'aguardando').length,
    saldo: Math.round((adiant - aprovado) * 100) / 100
  };
}
function rotuloSaldo(s){
  return s > 0 ? 'Saldo a devolver' : s < 0 ? 'Saldo a reembolsar' : 'Saldo zerado';
}
function abrirAdiantamento(v){
  if(!ehAdmin()) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div class="modal-topo"><h2 style="margin:0;font-size:20px">Adiantamento — viagem #${v.id}</h2>
      <button class="btn btn-pequeno btn-contorno" type="button" data-fechar>Fechar</button></div>
    <form id="form-adiant" style="margin-top:16px">
      <div class="campo"><label for="ad-valor">Valor entregue ao motorista (R$)</label>
        <input id="ad-valor" type="number" step="0.01" min="0" value="${v.adiantamento || ''}" required></div>
      <p class="mini" style="margin:0 0 16px">Saldo da viagem = adiantamento − despesas aprovadas. Informe 0 para remover o adiantamento. O motorista não vê este valor.</p>
      <button class="btn btn-primario btn-bloco" type="submit">SALVAR ADIANTAMENTO</button>
    </form></div>`;
  ov.addEventListener('click', e => { if(e.target === ov || e.target.hasAttribute('data-fechar')) ov.remove(); });
  document.body.appendChild(ov);
  const campo = ov.querySelector('#ad-valor');
  campo.focus();
  ov.querySelector('#form-adiant').addEventListener('submit', e => {
    e.preventDefault();
    const n = parseFloat(campo.value);
    if(isNaN(n) || n < 0){ mostrarMensagem('Informe um valor igual ou maior que zero.', true); return; }
    const antes = parseFloat(v.adiantamento) || 0;
    salvarViagem(v, { adiantamento: Math.round(n * 100) / 100 });
    auditar('Definiu adiantamento da viagem #' + v.id, fmtBRL(antes) + ' → ' + fmtBRL(v.adiantamento));
    ov.remove();
    mostrarMensagem(v.adiantamento ? 'Adiantamento salvo.' : 'Adiantamento removido.');
    if(document.getElementById('detalhe-viagem')) mostrarViagem(v.id);
  });
}

    else setTimeout(esperar, 200);
  };
  setTimeout(esperar, 300);
  auditar('Gerou ' + (previa ? 'prévia do fechamento' : 'fechamento') + ' em PDF da viagem #' + v.id, v.origem + ' → ' + v.destino);
}

/* ----- Conferência com o cartão de combustível ----- */
let cartao = null;

const placaNorm = s => {
  const t = String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(t.length === 7) return t;
  const m = t.match(/[A-Z]{3}[0-9][A-Z0-9][0-9]{2}/);
  return m ? m[0] : t;
};
function numBR(v){
  if(typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d,.\-]/g, '');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  return parseFloat(s);
}
function dataIso(v){
  const f = (a, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31) ? a + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') : '';
  if(v instanceof Date && !isNaN(v)){ const d = new Date(v.getTime() + 60000); return f(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  if(typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400000)); return f(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m) return f(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return f(+m[1], +m[2], +m[3]);
  return '';
}
function decodificarTexto(buf){
  const u8 = new Uint8Array(buf);
  try{ return new TextDecoder('utf-8', { fatal:true }).decode(u8).replace(/^\uFEFF/, ''); }
  catch(e){ return new TextDecoder('windows-1252').decode(u8); }
}
function csvParaMatriz(txt){
  const amostra = txt.split(/\r?\n/).filter(l => l.trim()).slice(0, 10);
  const sep = [';', '\t', ',', '|'].map(s => [s, amostra.reduce((n, l) => n + l.split(s).length - 1, 0)]).sort((a, b) => b[1] - a[1])[0][0];
  const linhas = []; let linha = [], cel = '', asp = false;
  const fechar = () => { linha.push(cel); cel = ''; if(linha.some(x => String(x).trim() !== '')) linhas.push(linha); linha = []; };
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(asp){ if(ch === '"'){ if(txt[i + 1] === '"'){ cel += '"'; i++; } else asp = false; } else cel += ch; }
    else if(ch === '"') asp = true;
    else if(ch === sep){ linha.push(cel); cel = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && txt[i + 1] === '\n') i++; fechar(); }
    else cel += ch;
  }
  if(cel !== '' || linha.length) fechar();
  return linhas;
}
function lerRelatorioCartao(arquivo){
  return new Promise((ok, falha) => {
    const r = new FileReader();
    r.onerror = () => falha(new Error('Não foi possível ler o arquivo.'));
    if(/\.(xlsx|xls|xlsm|ods)$/i.test(arquivo.name)){
      if(typeof XLSX === 'undefined'){ falha(new Error('Biblioteca de Excel indisponível. Verifique a conexão ou envie o relatório em CSV.')); return; }
      r.onload = () => {
        try{
          const wb = XLSX.read(new Uint8Array(r.result), { type:'array', cellDates:true });
          ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' }));
        }catch(e){ falha(new Error('Arquivo de Excel inválido.')); }
      };
    } else {
      r.onload = () => { try{ ok(csvParaMatriz(decodificarTexto(r.result))); }catch(e){ falha(new Error('Arquivo CSV inválido.')); } };
    }
    r.readAsArrayBuffer(arquivo);
  });
}
const CC_CAMPOS = [
  ['data', 'Data do abastecimento', true, [/data.*(abast|transa|compra)/, /^data/, /data/]],
  ['placa', 'Placa', true, [/placa/, /ve[ií]culo/]],
  ['valor', 'Valor (R$)', true, [/valor.*total/, /valor.*(transa|abast)/, /^valor/, /valor/, /^total/, /vlr/]],
  ['litros', 'Litros', false, [/litro/, /volume/, /quantidade/, /^qtd/]],
  ['local', 'Posto / estabelecimento', false, [/estabelec/, /posto/, /raz[aã]o/, /fantasia/, /local/]]
];
function acharCabecalho(m){
  const chave = /data|placa|valor|litro|posto|estabelec|veiculo|total/;
  for(let i = 0; i < Math.min(m.length, 25); i++){
    const n = m[i].filter(c => chave.test(norm(c))).length;
    if(n >= 2) return i;
  }
  return 0;
}
function sugerirColunas(cab){
  const nc = cab.map(norm), map = {};
  CC_CAMPOS.forEach(([k, , , padroes]) => {
    map[k] = -1;
    for(const p of padroes){ const i = nc.findIndex(c => p.test(c)); if(i >= 0){ map[k] = i; break; } }
  });
  return map;
}
function normalizarCartao(st){
  const out = []; let ignoradas = 0;
  for(let i = st.linhaCab + 1; i < st.matriz.length; i++){
    const r = st.matriz[i];
    if(!r.some(x => String(x ?? '').trim() !== '')) continue;
    const data = st.map.data >= 0 ? dataIso(r[st.map.data]) : '';
    const placa = st.map.placa >= 0 ? placaNorm(r[st.map.placa]) : '';
    const valor = st.map.valor >= 0 ? numBR(r[st.map.valor]) : NaN;
    if(!data || !placa || !(valor > 0)){ ignoradas++; continue; }
    out.push({
      linha: i + 1, data, placa, valor,
      litros: st.map.litros >= 0 ? (numBR(r[st.map.litros]) || 0) : 0,
      local: st.map.local >= 0 ? String(r[st.map.local] ?? '').trim() : ''
    });
  }
  return { linhas: out, ignoradas };
}
const diasEntre = (a, b) => Math.round((Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 864e5);
function viagemNaData(placa, iso){
  return viagens.find(v => (v.status === 'em andamento' || v.status === 'finalizada') && placaNorm(v.placa) === placa
    && v.saida <= iso && iso <= (v.chegada || (v.status === 'em andamento' ? '9999-12-31' : v.previsaoRetorno) || v.saida)) || null;
}
function conciliarCartao(cartaoLinhas, cfg, listaDecl){
  const cart = cartaoLinhas.filter(c => c.data >= cfg.de && c.data <= cfg.ate);
  const somaDias = (iso, n) => new Date(Date.parse(iso + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const jIni = somaDias(cfg.de, -cfg.difDias), jFim = somaDias(cfg.ate, cfg.difDias);
  const declJanela = (listaDecl || despesas).filter(d => d.categoria === 'Combustível' && d.data >= jIni && d.data <= jFim
    && (cfg.incluirRej || d.status !== 'rejeitado'));
  const decl = declJanela;
  const porPlaca = {};
  decl.forEach((d, j) => (porPlaca[placaNorm(d.placa)] = porPlaca[placaNorm(d.placa)] || []).push(j));
  const pares = [];
  cart.forEach((c, i) => (porPlaca[c.placa] || []).forEach(j => {
    const d = decl[j], dd = Math.abs(diasEntre(c.data, d.data));
    if(dd > cfg.difDias) return;
    const dv = Math.abs(c.valor - d.valor);
    pares.push({ i, j, dd, dv, exato: dv <= cfg.tolValor + 1e-9 });
  }));
  pares.sort((a, b) => (b.exato - a.exato) || (a.dd - b.dd) || (a.dv - b.dv));
  const usadoC = new Set(), usadoD = new Set(), res = [];
  pares.forEach(p => {
    if(usadoC.has(p.i) || usadoD.has(p.j)) return;
    usadoC.add(p.i); usadoD.add(p.j);
    const c = cart[p.i], d = decl[p.j], motivos = [];
    if(!p.exato) motivos.push('Valor diferente');
    if(c.litros > 0 && d.litros > 0 && Math.abs(c.litros - d.litros) > Math.max(1, 0.05 * c.litros)) motivos.push('Litros diferentes');
    res.push({ tipo: motivos.length ? 'div' : 'ok', c, d, motivos, dd: p.dd, data: c.data, placa: c.placa });
  });
  cart.forEach((c, i) => {
    if(usadoC.has(i)) return;
    const v = viagemNaData(c.placa, c.data);
    res.push({ tipo: v ? 'falta_reg' : 'falta_reg_base', c, d: null, v, noCad: !CAMINHOES.some(x => placaNorm(x.placa) === c.placa), data: c.data, placa: c.placa });
  });
  decl.forEach((d, j) => {
    if(usadoD.has(j) || d.data < cfg.de || d.data > cfg.ate) return;
    res.push({ tipo: 'falta_cartao', c: null, d, data: d.data, placa: placaNorm(d.placa) });
  });
  res.sort((a, b) => a.data.localeCompare(b.data) || a.placa.localeCompare(b.placa));
  return { res, cart, decl: decl.filter(d => d.data >= cfg.de && d.data <= cfg.ate) };
}
const CC_ROTULO = {
  ok:'Conferido', div:'Divergente', falta_cartao:'Declarado sem cartão',
  falta_reg:'Cartão sem registro', falta_reg_base:'Cartão sem viagem'
};
const CC_CLASSE = { ok:'cc-ok', div:'cc-div', falta_cartao:'cc-falta', falta_reg:'cc-falta', falta_reg_base:'cc-base' };
const somaV = (lista, f) => lista.reduce((s, x) => s + f(x), 0);

function atualizarCartao(){

  }
  const datas = linhas.map(l => l.data).sort();
  if(!st.cfg.de) st.cfg.de = datas[0];

function exportarConferencia(res){
  if(typeof XLSX === 'undefined'){ mostrarMensagem('Biblioteca de Excel indisponível. Verifique a conexão.', true); return; }
  if(!res || !res.length){ mostrarMensagem('Não há dados para exportar.', true); return; }
  const cfg = cartao.cfg;
  const linhas = res.map(r => ({
    'Situação': CC_ROTULO[r.tipo], 'Observação': r.motivos ? r.motivos.join(' e ') : (r.tipo === 'falta_reg_base' ? (r.noCad ? 'Placa fora da frota' : 'Provável abastecimento de base') : (r.v ? 'Em viagem #' + r.v.id : '')),
    'Data': fmtData(r.data), 'Placa': r.c ? r.c.placa : r.d.placa,
    'Motorista': r.d ? nomeMotorista(r.d.motoristaId) : (r.v ? nomeMotorista(r.v.motoristaId) : ''),
    'Registro': r.d ? '#' + r.d.id : '', 'Viagem': r.d && r.d.viagemId ? '#' + r.d.viagemId : (r.v ? '#' + r.v.id : ''),
    'Declarado (R$)': r.d ? r.d.valor : '', 'Declarado (L)': r.d && r.d.litros ? r.d.litros : '',
    'Cartão (R$)': r.c ? r.c.valor : '', 'Cartão (L)': r.c && r.c.litros ? r.c.litros : '',
    'Posto': r.c ? r.c.local : '', 'Diferença (R$)': (r.c && r.d) ? Math.round((r.c.valor - r.d.valor) * 100) / 100 : ''
  }));
  const resumo = [
    ['CONFERÊNCIA DO CARTÃO DE COMBUSTÍVEL — ROFE'], ['Arquivo: ' + cartao.nome], ['Período: ' + fmtData(cfg.de) + ' a ' + fmtData(cfg.ate)], [],
    ...Object.keys(CC_ROTULO).map(k => [CC_ROTULO[k], res.filter(r => r.tipo === k).length])
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumo), 'Resumo');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Conferência');
  XLSX.writeFile(wb, 'ROFE_conferencia_cartao_' + hojeIso() + '.xlsx');
  auditar('Exportou conferência do cartão de combustível', cartao.nome);
}

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, where, getDocs, onSnapshot, runTransaction, writeBatch, arrayUnion, increment, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFv8VaxTJs3yuTRY33K4RhGv6OsLRcebA",
  authDomain: "rofe-finance.firebaseapp.com",
  projectId: "rofe-finance",
  storageBucket: "rofe-finance.firebasestorage.app",
  messagingSenderId: "542847288223",
  appId: "1:542847288223:web:1cc28c7b0ee966a5d333aa",
  measurementId: "G-E7L1K02N8S"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
/* Cache local persistente (IndexedDB): o app abre rápido, funciona sem internet e envia as alterações ao reconectar */
let db;
let semCacheLocal = false;
try { semCacheLocal = localStorage.getItem('rofe_cache_memoria') === '1'; } catch(e){}
try { db = semCacheLocal ? getFirestore(app) : initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ console.warn('Cache offline indisponível, usando memória.', e); db = getFirestore(app); }

const ERROS = {
  'auth/invalid-credential': 'E-mail ou senha incorretos.',
  'auth/wrong-password': 'E-mail ou senha incorretos.',
  'auth/user-not-found': 'E-mail ou senha incorretos.',
  'auth/invalid-email': 'E-mail inválido.',
  'auth/user-disabled': 'Este usuário está desativado.',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
  'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/operation-not-allowed': 'Login por e-mail/senha não está ativado no Firebase.',
  'auth/email-already-in-use': 'Já existe um usuário com este e-mail.',
  'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
  'auth/unauthorized-domain': 'Este endereço do site não está autorizado no Firebase (Authentication → Configurações → Domínios autorizados).',
  'auth/missing-email': 'Digite seu e-mail.',
  'permission-denied': 'Sem permissão. Verifique as regras do Firestore.'
};
auth.languageCode = 'pt-BR';   /* e-mail de redefinição de senha em português */

window.RofeAuth = {
  entrar: (email, senha) => signInWithEmailAndPassword(auth, email, senha),
  redefinirSenha: email => sendPasswordResetEmail(auth, email),
  sair: () => signOut(auth),
  salvarPerfil: (uid, dados) => updateDoc(doc(db, 'usuarios', uid), dados),
  traduzirErro: (err, padrao) => ERROS[err && err.code] || padrao || 'Não foi possível entrar. Tente novamente.',

  /* ADMIN: cria o login do motorista SEM deslogar o admin (usa uma instância secundária do Firebase) */
  criarMotorista: (nome, email, senha) => window.RofeAuth.criarUsuario(nome, email, senha, 'motorista', {}),
  /* ADMIN: cria login + perfil de qualquer usuário (motorista ou operador) */
  criarUsuario: async (nome, email, senha, perfilNovo, extras) => {
    const appSec = initializeApp(firebaseConfig, 'criador-' + Date.now());
    let uid;
    try {
      const authSec = getAuth(appSec);
      const cred = await createUserWithEmailAndPassword(authSec, email, senha);
      uid = cred.user.uid;
      await signOut(authSec);
    } finally {
      await deleteApp(appSec);
    }
    try {
      await setDoc(doc(db, 'usuarios', uid), { ...(extras || {}), nome, perfil: perfilNovo || 'motorista', ativo: true, login: email, email, criadoEm: Date.now() });
    } catch(err){
      err.loginCriado = true; err.uid = uid;   /* login existe, mas o perfil não foi gravado */
      throw err;
    }
    return { uid };
  },
  listarMotoristas: async () => {
    const snap = await getDocs(query(collection(db, 'usuarios'), where('perfil', '==', 'motorista')));
    return snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  },
  definirAtivo: (uid, ativo) => updateDoc(doc(db, 'usuarios', uid), { ativo })
};

/* ==========================================================
   v39 — Banco de dados (Firestore) em tempo real
   Coleções: despesas, fotos, viagens, auditoria, notificacoes,
   avisos, contadores, config
   ========================================================== */
const ref = (col, id) => doc(db, col, String(id));
let pendentes = 0;
const acompanhar = p => {
  pendentes++; window.rofeSyncMudou && window.rofeSyncMudou();
  return p.finally(() => { pendentes--; window.rofeSyncMudou && window.rofeSyncMudou(); });
};
const montarConsulta = spec => {
  const partes = [];
  (spec.where || []).forEach(([c, op, v]) => partes.push(where(c, op, v)));
  if(spec.orderBy) partes.push(orderBy(spec.orderBy[0], spec.orderBy[1] || 'asc'));
  if(spec.limit) partes.push(limit(spec.limit));
  return query(collection(db, spec.col), ...partes);
};
window.RofeDB = {
  fv: { arrayUnion, increment },
  pendentes: () => pendentes,
  set: (col, id, dados, merge) => acompanhar(setDoc(ref(col, id), dados, merge ? { merge: true } : {})),
  upd: (col, id, dados) => acompanhar(updateDoc(ref(col, id), dados)),
  add: (col, dados) => acompanhar(addDoc(collection(db, col), dados)),
  get: async (col, id) => { const s = await getDoc(ref(col, id)); return s.exists() ? { _id: s.id, ...s.data() } : null; },
  novoId: col => doc(collection(db, col)).id,
  /* várias gravações de uma vez (tudo ou nada) */
  lote: ops => {
    const b = writeBatch(db);
    ops.forEach(o => {
      if(o.tipo === 'upd') b.update(ref(o.col, o.id), o.dados);
      else b.set(ref(o.col, o.id), o.dados, o.merge ? { merge: true } : {});
    });
    return acompanhar(b.commit());
  },
  /* número sequencial (#1, #2…) — precisa de conexão com o servidor */
  proximoNumero: (nome, ms = 10000) => Promise.race([
    runTransaction(db, async t => {
      const r = ref('contadores', nome);
      const s = await t.get(r);
      const n = (s.exists() ? (s.data().n || 0) : 0) + 1;
      t.set(r, { n });
      return n;
    }),
    new Promise((_, falha) => setTimeout(() => falha(Object.assign(new Error('Tempo esgotado'), { code: 'unavailable' })), ms))
  ]),
  /* escuta em tempo real: cb(docs, mudanças, primeira) */
  ouvir: (spec, cb, aoErro) => {
    let primeira = true;
    const alvo = spec.doc ? ref(spec.doc[0], spec.doc[1]) : montarConsulta(spec);
    return onSnapshot(alvo, snap => {
      if(spec.doc){
        cb(snap.exists() ? [{ _id: snap.id, ...snap.data() }] : [], [], primeira);
      } else {
        const docs = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
        const mud = snap.docChanges().map(c => ({ tipo: c.type, id: c.doc.id, local: c.doc.metadata.hasPendingWrites, dados: { _id: c.doc.id, ...c.doc.data() } }));
        cb(docs, mud, primeira);
      }
      primeira = false;
    }, err => { console.error('Escuta ' + (spec.col || spec.doc.join('/')), err); aoErro && aoErro(err); });
  }
};

/* ===== Primeiro acesso: usuário administrador ===== */
let criandoAdmin = false;
window.RofeAuth.instalado = async () => (await getDoc(doc(db, 'config', 'instalacao'))).exists();
window.RofeAuth.criarAdministrador = async (dados, senha) => {
  criandoAdmin = true;   /* segura o onAuthStateChanged até o perfil existir */
  try {
    let cred;
    try { cred = await createUserWithEmailAndPassword(auth, dados.email, senha); }
    catch(err){
      if(err.code !== 'auth/email-already-in-use') throw err;
      cred = await signInWithEmailAndPassword(auth, dados.email, senha);   /* login já existe (ex.: Gestão de Frota): promove */
    }
    const uid = cred.user.uid, agoraMs = Date.now();
    const b = writeBatch(db);
    b.set(doc(db, 'usuarios', uid), {
      nome: dados.nome, perfil: 'admin', categoria: 'Adm', cargo: dados.cargo, setor: dados.setor, empresa: dados.empresa,
      email: dados.email, login: dados.email, telefone: dados.telefone,
      ativo: true, cadastroFeito: true, tema: 'claro', criadoEm: agoraMs
    });
    b.set(doc(db, 'config', 'contador'), { nome: dados.nome, telefone: dados.telefone, email: dados.email });
    b.set(doc(db, 'config', 'instalacao'), { adminUid: uid, adminNome: dados.nome, em: agoraMs });
    await b.commit();
    criandoAdmin = false;
    window.rofeAdminRecemCriado = dados.email;   /* registrado na auditoria ao abrir a sessão */
    await carregarSessao(cred.user);
  } catch(err){
    criandoAdmin = false;
    if(auth.currentUser) await signOut(auth).catch(() => {});
    throw err;
  }
};

/* ===== Motorista: entra com TELEFONE + PIN (o telefone vira um login interno do Firebase) ===== */
const DOMINIO_MOTORISTA = '@motorista.rofe-finance.firebaseapp.com';
const normTel = t => { let d = String(t || '').replace(/\D/g, ''); if(d.length <= 11) d = '55' + d; return d; };
window.RofeAuth.emailDoTelefone = tel => normTel(tel) + DOMINIO_MOTORISTA;
window.RofeAuth.ehLoginTelefone = email => String(email || '').endsWith(DOMINIO_MOTORISTA);
window.RofeAuth.entrarMotorista = (tel, pin) => signInWithEmailAndPassword(auth, normTel(tel) + DOMINIO_MOTORISTA, pin);
/* Autocadastro: cria o login e o perfil "aguardando aprovação". Só entra depois que o contador aprovar. */
window.RofeAuth.cadastrarMotorista = async (dados, pin) => {
  criandoAdmin = true;   /* segura o onAuthStateChanged: o perfil ainda não existe */
  try {
    const email = normTel(dados.telefone) + DOMINIO_MOTORISTA;
    const cred = await createUserWithEmailAndPassword(auth, email, pin);
    await setDoc(doc(db, 'usuarios', cred.user.uid), {
      ...dados, perfil: 'motorista', ativo: false, cadastroStatus: 'pendente', origem: 'autocadastro',
      login: email, loginTelefone: normTel(dados.telefone), cadastroFeito: true, criadoEm: Date.now()
    });
    await signOut(auth);
  } finally { criandoAdmin = false; }
};

/* Dispara ao entrar e também ao recarregar a página com sessão ativa */
onAuthStateChanged(auth, user => { if(user && !criandoAdmin) carregarSessao(user); });
window.rofeVerificarInstalacao();
async function carregarSessao(user){
  try {
    const snap = await getDoc(doc(db, 'usuarios', user.uid));
    if(!snap.exists()){
      await signOut(auth);
      return window.rofeLoginErro('Seu usuário não tem perfil cadastrado. Fale com o administrador.');
    }
    const perfil = snap.data();
    if(perfil.cadastroStatus === 'pendente'){
      await signOut(auth);
      return window.rofeLoginErro('Seu cadastro foi recebido e está aguardando a aprovação do contador. Assim que for aprovado, você já consegue entrar.', true);
    }
    if(perfil.cadastroStatus === 'recusado'){
      await signOut(auth);
      return window.rofeLoginErro('Seu cadastro não foi aprovado. Fale com o contador.');
    }
    if(perfil.ativo === false){
      await signOut(auth);
      return window.rofeLoginErro('Seu acesso está desativado.');
    }
    if(!['motorista', 'admin', 'operador'].includes(perfil.perfil)){
      await signOut(auth);
      return window.rofeLoginErro('Perfil inválido. Fale com o administrador.');
    }
    window.rofeAbrirSessao(user.uid, user.email, perfil);
  } catch(err){
    console.error(err);
    await signOut(auth);
    window.rofeLoginErro('Não foi possível carregar seu perfil. Verifique as regras do Firestore.');
  }
}
</script>
