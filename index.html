você está fechando e pede a quilometragem final (opcional, e precisa ser maior que a inicial). Com ela ele calcula km rodado, custo por km e consumo médio. Registros rejeitados não entram no custo."}, {"lado": "contador", "tema": "Registros", "p": "Como aprovo, rejeito ou defino desconto em um registro?", "r": "Em <strong>Registros</strong>: <strong>Aprovar</strong> aceita a despesa. <strong>Rejeitar</strong> exige um motivo, que é enviado ao motorista. <strong>Desconto</strong> pede o valor a descontar (não pode passar do valor informado; use 0 para nenhum) e uma justificativa obrigatória."}, {"lado": "contador", "tema": "Registros", "p": "O desconto é aplicado na folha do motorista?", "r": "Não. O desconto fica apenas <strong>registrado para conferência</strong>, com a justificativa, e o motorista é notificado. Nenhum valor é descontado automaticamente em folha."}, {"lado": "contador", "tema": "Registros", "p": "Como aprovo vários registros de uma vez?", "r": "Marque as caixas dos registros <strong>Aguardando</strong> (ou a caixa do cabeçalho para selecionar todos os pendentes da página). A barra mostra quantos estão selecionados e o total em reais. Toque em <strong>Aprovar selecionados</strong>. Se algum tiver possível duplicidade, o sistema avisa antes de confirmar.", "ir": "registros"}, {"lado": "contador", "tema": "Registros", "p": "Como o sistema identifica uma possível duplicidade?", "r": "Ele compara cada registro com os demais (ignorando os rejeitados) e alerta quando há <strong>mesmo valor, data e categoria</strong> ou a <strong>mesma foto</strong>. Você vê o alerta no registro, no card <strong>Possíveis duplicidades</strong> do painel e no filtro da lista. É um aviso para conferir, não uma prova: duas despesas legítimas iguais também disparam o alerta."}, {"lado": "contador", "tema": "Registros", "p": "Posso corrigir um registro lançado pelo motorista?", "r": "Pode, a qualquer momento: abra <strong>Detalhes</strong> e toque em <strong>Editar</strong>. Cada mudança é gravada como \"antes → depois\" no histórico do registro e na Auditoria, e o motorista recebe um aviso."}, {"lado": "contador", "tema": "Registros", "p": "Devo rejeitar ou conversar com o motorista?", "r": "Se faltou algo simples, como uma foto mais legível, use a <strong>Conversa</strong> do registro para pedir o ajuste sem rejeitar. Rejeite quando a despesa não for aceita: o motivo é obrigatório e fica visível para o motorista."}, {"lado": "contador", "tema": "Registros", "p": "Preciso ligar para o motorista. Onde está o contato?", "r": "Nos detalhes do registro, nos detalhes da viagem e na lista <strong>Motoristas</strong> aparecem atalhos de WhatsApp e e-mail. Se mostrar \"Contato não informado\", o motorista ainda não preencheu o perfil."}, {"lado": "contador", "tema": "Análises", "p": "Como funciona o Comparativo de viagens?", "r": "Ele agrupa as viagens <strong>finalizadas</strong> pela mesma origem e destino e compara o custo de cada uma com a média da rota. Você escolhe o limite de alerta (+10%, +20%, +30% ou +50%) e o sistema destaca as viagens acima dele e a categoria que mais pesou. Rotas com apenas uma viagem ainda não entram na comparação, e registros rejeitados não contam.", "ir": "comparativo"}, {"lado": "contador", "tema": "Análises", "p": "Como gero um relatório para fechar as contas?", "r": "Em <strong>Relatórios</strong>, filtre por motorista, caminhão, viagem, categoria, status e período, escolha se quer agrupar (por motorista, caminhão, viagem, categoria...) e use <strong>Exportar Excel</strong> ou <strong>Exportar PDF</strong>.", "ir": "relatorios"}, {"lado": "contador", "tema": "Análises", "p": "Como sei quem fez o quê no sistema?", "r": "Na <strong>Auditoria</strong> ficam registradas todas as ações, com data e hora, usuário, perfil e detalhe. Dá para filtrar por usuário e por período.", "ir": "auditoria"}, {"lado": "motorista", "tema": "Viagens", "p": "Posso estar em duas viagens ao mesmo tempo?", "r": "Não. O sistema não deixa o contador abrir ou agendar uma viagem se você ou o caminhão já estiverem em outra viagem no mesmo período. Uma viagem <strong>em andamento sem retorno previsto</strong> ocupa você e o caminhão até ser encerrada."}, {"lado": "motorista", "tema": "Viagens", "p": "O que significam Agendada, Em andamento, Finalizada e Cancelada?", "r": "<strong>Agendada</strong>: reservada para uma data futura. <strong>Em andamento</strong>: é a viagem atual, onde você lança despesas. <strong>Finalizada</strong>: encerrada pela operação ou pelo contador. <strong>Cancelada</strong>: a reserva foi cancelada e você recebe um aviso."}, {"lado": "motorista", "tema": "Viagens", "p": "Troquei de caminhão no meio da viagem. Como eu lanço as despesas?", "r": "Os registros usam o caminhão da viagem aberta. Antes de lançar, fale com o contador pelo card <strong>Fale com o contador</strong>: ele pode encerrar a viagem atual e abrir outra com o caminhão correto, para que as despesas fiquem na placa certa."}, {"lado": "motorista", "tema": "Registros", "p": "Qual categoria devo escolher?", "r": "As categorias são: Hospedagem, Alimentação, Combustível, Manutenção mecânica, Pneus, Peças e acessórios, Pedágios, Estacionamento, Lavagem, Serviços de terceiros e Outros. Se nenhuma servir direito, escolha <strong>Outros</strong> e explique bem na descrição.", "k": "categoria tipo despesa almoco comida janta hotel pousada pedagio oficina lavagem estacionamento onde lanco"}, {"lado": "motorista", "tema": "Registros", "p": "Posso lançar uma despesa de ontem? E de uma data futura?", "r": "Pode lançar de dias anteriores, basta escolher a data real da despesa. <strong>Datas futuras não são aceitas</strong>, porque a despesa precisa já ter acontecido."}, {"lado": "motorista", "tema": "Registros", "p": "Esqueci de anexar a foto ou quero trocar uma foto. E agora?", "r": "Todo registro novo precisa de pelo menos uma foto ou PDF, então não dá para salvar sem comprovante. Num registro já salvo, a edição altera os dados mas não troca as fotos: escreva na <strong>Conversa</strong> do registro avisando o contador ou fale com ele pelo card <strong>Fale com o contador</strong>."}, {"lado": "motorista", "tema": "Registros", "p": "Lancei a mesma despesa duas vezes sem querer. Posso excluir?", "r": "O motorista não exclui registros. Avise o contador pela <strong>Conversa</strong> do registro repetido para que ele o rejeite com o motivo. Assim fica tudo documentado no histórico."}, {"lado": "motorista", "tema": "Aprovação e descontos", "p": "Não concordo com um desconto. O que faço?", "r": "Abra o registro e escreva na <strong>Conversa</strong> explicando o que aconteceu, anexando informações que ajudem. Cada desconto tem uma justificativa registrada pelo contador, e vocês podem acertar a decisão por ali."}, {"lado": "motorista", "tema": "Aprovação e descontos", "p": "Quanto tempo leva para o contador aprovar?", "r": "O sistema não define prazo: depende da análise do contador. Quando ele aprovar, rejeitar, editar ou definir desconto, você recebe um aviso e o registro muda de status em <strong>Meus registros</strong>."}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "O que são o \"!\" no menu e o sino no topo?", "r": "São os <strong>avisos</strong>. O \"!\" marca a aba onde há novidade (por exemplo, Meus registros depois de uma edição do contador) e o sino soma tudo que ainda não foi visto. Ao abrir a aba, o \"!\" some."}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "Posso usar o sistema no celular?", "r": "Sim. O sistema se adapta à tela do celular: as tabelas viram cartões, <strong>Tirar foto</strong> abre a câmera para fotografar a nota na hora e <strong>Arquivo (PDF)</strong> pega um PDF salvo no celular."}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "Como saio do sistema?", "r": "Toque no botão vermelho <strong>Sair</strong> no topo da tela e confirme em <strong>Sim, sair</strong>. Em aparelho compartilhado, saia sempre que terminar. Se estiver sem internet com registros ainda não enviados, o sistema avisa antes."}, {"lado": "contador", "tema": "Viagens", "p": "Como vejo quais motoristas e caminhões estão livres?", "r": "Em <strong>Motoristas</strong> e <strong>Caminhões</strong> cada item aparece como <strong>Em rota</strong> (com a viagem) ou <strong>Disponível</strong>, e as reservas futuras aparecem logo abaixo. Ao criar uma viagem, quem estiver ocupado no período aparece bloqueado no seletor."}, {"lado": "contador", "tema": "Viagens", "p": "O motorista trocou de caminhão no meio da viagem. Como ajusto?", "r": "Nesta versão não há edição de viagem. O caminho é <strong>encerrar</strong> a viagem atual e abrir outra com o caminhão correto, informando o km final da primeira e o km inicial da segunda."}, {"lado": "contador", "tema": "Viagens", "p": "A viagem agendada não começou sozinha. Por quê?", "r": "Ela começa quando chega a data de saída, desde que o motorista e o caminhão não estejam em outra viagem em andamento. Se algum deles ainda estiver ocupado, encerre a outra viagem e use <strong>Iniciar agora</strong> nos detalhes da agendada."}, {"lado": "contador", "tema": "Registros", "p": "Como filtro e ordeno a lista de registros?", "r": "Em <strong>Registros</strong> você busca por motorista, placa ou descrição e filtra por status, categoria, período e somente possíveis duplicidades. Clique no título de uma coluna para ordenar. A lista mostra 15 registros por página."}, {"lado": "contador", "tema": "Registros", "p": "Aprovei um registro por engano. Dá para desfazer?", "r": "Nesta versão não existe botão para desfazer uma aprovação. Por isso confira bem antes de aprovar, principalmente quando houver alerta de duplicidade. Para ajustar valores, use <strong>Editar</strong> ou <strong>Desconto</strong>, que ficam registrados no histórico e na Auditoria."}, {"lado": "contador", "tema": "Registros", "p": "Como os registros rejeitados entram nos totais?", "r": "O <strong>Total informado</strong> soma tudo que foi lançado, e o <strong>Rejeitado</strong> aparece separado. Já o custo da viagem, o custo por km, o consumo, o comparativo e o desempenho por caminhão <strong>desconsideram os rejeitados</strong>."}, {"lado": "contador", "tema": "Registros", "p": "O que é o card \"Definido para desconto\" no painel?", "r": "É a soma dos descontos que você definiu nos registros do período filtrado no painel. É um valor de conferência e não é aplicado automaticamente em folha."}, {"lado": "contador", "tema": "Registros", "p": "Como confiro as fotos e os PDFs da nota?", "r": "Nos <strong>Detalhes</strong> do registro aparecem os <strong>Comprovantes</strong>: clique numa foto para ampliar ou no quadro <strong>PDF</strong> para abrir o arquivo numa aba nova. Todo registro novo de motorista tem pelo menos um comprovante. Fotos ou arquivos iguais em registros diferentes disparam o alerta de possível duplicidade."}, {"lado": "contador", "tema": "Análises", "p": "Como filtro o painel por período?", "r": "No topo do <strong>Painel</strong> há os campos de data inicial e final. Eles atualizam os cards de valores e os gráficos por mês, categoria, motorista e caminhão. Os contadores de viagens mostram sempre a situação atual."}, {"lado": "contador", "tema": "Análises", "p": "O que mostra o \"Desempenho por caminhão\"?", "r": "Está no <strong>Comparativo</strong> e lista, para cada caminhão com viagens finalizadas, a quantidade de viagens, km rodado, custo total, custo por km, litros e consumo médio (km/L). Rejeitados não entram, e km e consumo só aparecem quando foram informados."}, {"lado": "contador", "tema": "Análises", "p": "Como encontro rápido um motorista, uma placa ou um registro?", "r": "Use a <strong>busca</strong> no topo: ela procura motoristas, caminhões, viagens e registros ao mesmo tempo (a partir de 2 letras). Ao clicar no resultado, o sistema leva direto para o item."}, {"lado": "contador", "tema": "Análises", "p": "O PDF ou o Excel do relatório não abre. O que fazer?", "r": "O PDF abre em uma nova janela, então <strong>permita pop-ups</strong> no navegador. O Excel e os gráficos dependem de bibliotecas carregadas pela internet: se a conexão estiver ruim, aparece um aviso. Também é preciso ter ao menos um registro no filtro para exportar."}, {"lado": "contador", "tema": "Conta e avisos", "p": "O que são o \"!\" no menu e o sino no topo?", "r": "São os <strong>avisos</strong>. O \"!\" marca a aba com novidade (por exemplo, Registros quando um motorista lança ou comenta algo) e o sino soma o que ainda não foi visto. Ao abrir a aba, o aviso some."}, {"lado": "contador", "tema": "Conta e avisos", "p": "Como o motorista consegue falar comigo?", "r": "Na tela de Início dele existe o card <strong>Fale com o contador</strong>, com WhatsApp e e-mail. Para aparecer, preencha seu telefone e e-mail no perfil (clique no seu avatar no topo)."}, {"lado": "contador", "tema": "Viagens", "p": "Como informo o adiantamento entregue ao motorista?", "r": "Ao iniciar a viagem, no campo <strong>Adiantamento</strong>, ou depois: em <strong>Viagens</strong>, abra a viagem e clique em <strong>Informar adiantamento</strong>. O motorista não vê esse valor."}, {"lado": "contador", "tema": "Viagens", "p": "Como o saldo da viagem é calculado?", "r": "Saldo = adiantamento − despesas <strong>aprovadas</strong>. Se der positivo, o motorista devolve à empresa; se der negativo, a empresa reembolsa. Registros aguardando análise ficam fora até serem aprovados, e rejeitados não entram. O desconto definido não altera o saldo."}, {"lado": "contador", "tema": "Viagens", "p": "Como gero o fechamento da viagem em PDF?", "r": "Em <strong>Viagens</strong>, abra a viagem e clique em <strong>Fechamento em PDF</strong>. Na janela de impressão, escolha <strong>Salvar como PDF</strong>. O documento traz resumo, saldo do adiantamento, categorias, registros, fotos das notas e linhas de assinatura. Em viagem em andamento, o botão gera uma prévia."}, {"lado": "contador", "tema": "Combustível", "p": "Como confiro o cartão de combustível?", "r": "Abra <strong>Combustível</strong> no menu e envie o relatório do cartão (Excel ou CSV). O sistema sugere as colunas de data, placa, valor, litros e posto; confira e veja o resultado: conferidos, divergentes, declarados sem cartão e cartão sem registro.", "ir": "combustivel"}, {"lado": "contador", "tema": "Combustível", "p": "Como o sistema decide que dois abastecimentos são o mesmo?", "r": "Mesma placa, data dentro da tolerância e valor dentro da tolerância (padrão: 1 dia e R$ 1,00). Se placa e data batem, mas o valor ou os litros diferem, o abastecimento vira <strong>divergente</strong>. Você pode ajustar as tolerâncias na própria tela."}, {"lado": "contador", "tema": "Combustível", "p": "O que significa Cartão sem registro?", "r": "O cartão mostra um abastecimento que nenhum motorista lançou. Se o caminhão estava em viagem na data, aparece em vermelho com o número da viagem. Sem viagem na data, aparece em cinza como <strong>Cartão sem viagem</strong>, em geral abastecimento de base."}, {"lado": "motorista", "tema": "Na estrada", "p": "Fiquei sem internet na estrada. Consigo lançar a despesa?", "r": "Consegue. Salve normalmente: o registro fica <strong>guardado no aparelho</strong> e aparece no bloco <strong>Guardados no aparelho</strong> em Início e Meus registros. Quando a internet voltar, ele é enviado sozinho e ganha o número (#). O indicador no topo mostra <strong>Offline</strong> enquanto estiver sem conexão. Não limpe os dados do navegador antes do envio.", "k": "internet sinal sem rede offline"}, {"lado": "motorista", "tema": "Registros", "p": "Saí da tela no meio do lançamento. Perdi o que digitei?", "r": "Não. O formulário de <strong>Novo registro</strong> salva um <strong>rascunho</strong> automaticamente, e as fotos anexadas continuam lá enquanto você estiver no sistema. Ao voltar, é só continuar de onde parou."}, {"lado": "contador", "tema": "Conta e avisos", "p": "Preciso recarregar a página para ver registros novos?", "r": "Não. O sistema funciona <strong>em tempo real</strong>: registros, mensagens, viagens e avisos chegam na hora, com um aviso na tela e a linha piscando em azul. O indicador no topo mostra <strong>Tempo real</strong> quando está conectado, <strong>Sincronizando…</strong> enquanto envia alterações e <strong>Offline</strong> sem internet."}, {"lado": "operador", "tema": "Monitoramento", "p": "O que aparece no Monitoramento?", "r": "Todos os motoristas em rota, em tempo real: status atual (em trânsito, parado, chegou, ocorrência), há quanto tempo foi a última atualização, posição no <strong>mapa</strong> e as <strong>ocorrências abertas</strong> no topo. Quem está sem atualização há mais tempo que o limite escolhido fica em amarelo.", "ir": "monitor"}, {"lado": "operador", "tema": "Monitoramento", "p": "Um motorista está sem dar notícia. O que faço?", "r": "No cartão dele, toque em <strong>Pedir atualização</strong>: ele recebe um aviso no celular para atualizar o status. Se precisar falar na hora, use o atalho de <strong>WhatsApp</strong> do próprio cartão."}, {"lado": "operador", "tema": "Monitoramento", "p": "Como resolvo uma ocorrência?", "r": "Na caixa vermelha <strong>Ocorrências abertas</strong> (ou na linha do tempo da viagem), toque em <strong>Resolver</strong> e escreva como foi resolvida. O motorista é avisado e a solução fica no histórico da viagem."}, {"lado": "operador", "tema": "Monitoramento", "p": "Como mudo o tempo do alerta de “sem atualização”?", "r": "No topo do Monitoramento escolha entre 2, 4, 6, 8 ou 12 horas. A escolha fica salva neste navegador."}, {"lado": "operador", "tema": "Orçamentos", "p": "Como libero um orçamento?", "r": "Em <strong>Orçamentos</strong>, na aba Aguardando, toque em <strong>Liberar</strong>, confira o valor (pode liberar menos do que foi pedido) e escreva uma orientação se quiser. Se for <strong>Adiantamento extra</strong>, deixe marcada a opção de somar ao adiantamento da viagem para o saldo do fechamento ficar certo. Pedidos urgentes aparecem primeiro e em vermelho.", "ir": "solicitacoes"}, {"lado": "operador", "tema": "Orçamentos", "p": "Posso negar um pedido?", "r": "Pode. Toque em <strong>Negar</strong> e informe o motivo, que é obrigatório e vai para o motorista na hora."}, {"lado": "operador", "tema": "Viagens", "p": "O que o operador pode fazer nas viagens?", "r": "Iniciar e agendar viagens, iniciar ou cancelar reservas, encerrar viagens, ver os registros de cada viagem e conversar nos registros. Aprovar despesas, dar descontos, ver adiantamento, relatórios e auditoria continuam sendo do contador."}, {"lado": "motorista", "tema": "Na estrada", "p": "Para que serve o botão <strong>Atualizar status da viagem</strong>?", "r": "Ele avisa a operação, na hora, como está a viagem: <strong>Em trânsito</strong>, <strong>Parei</strong> (almoço, descanso, pernoite…), <strong>Cheguei</strong> ou <strong>Ocorrência</strong>. Marque <strong>Enviar minha localização</strong> para a operação ver você no mapa. Atualize sempre que parar ou voltar a rodar."}, {"lado": "motorista", "tema": "Na estrada", "p": "Tive um problema na estrada. Como aviso?", "r": "No Início toque em <strong>Ocorrência</strong>, escolha o tipo (problema mecânico, pneu, acidente, atraso…) e escreva o que aconteceu. A operação e o contador recebem um alerta vermelho na hora. Se for grave, ligue também.", "k": "acidente batida pneu quebrou pane guincho problema caminhao"}, {"lado": "motorista", "tema": "Orçamentos", "p": "Como peço dinheiro ou autorização para um gasto?", "r": "Vá em <strong>Orçamentos</strong>, escolha o tipo, informe o valor e explique para que é. Marque <strong>urgente</strong> se você estiver parado esperando. Você recebe um aviso quando o pedido for liberado ou negado, e pode cancelar enquanto ele estiver aguardando.", "ir": "orcamentos"}, {"lado": "contador", "tema": "Conta e avisos", "p": "Como cadastro um operador?", "r": "Em <strong>Equipe</strong>, toque em <strong>+ Novo operador</strong> e informe nome, e-mail, senha provisória, telefone e cargo. O operador acompanha os motoristas, abre viagens e libera orçamentos, mas não aprova despesas nem vê adiantamentos, relatórios e auditoria. Para bloquear, use <strong>Desativar</strong>.", "ir": "equipe"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Como entro no sistema pela primeira vez (SOU MOTORISTA)?", "r": "Na tela de login toque em <strong>SOU MOTORISTA</strong> → <strong>Primeiro acesso</strong>. Informe nome, sobrenome e telefone com DDD, e se quiser base, CNH e contato de emergência. Crie um <strong>PIN de 6 números</strong>. O contador aprova o cadastro e, a partir daí, você entra só com <strong>telefone + PIN</strong>."}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Esqueci meu PIN. E agora?", "r": "Fale com o contador. Ele apaga o seu acesso antigo e você faz o <strong>Primeiro acesso</strong> de novo com um PIN novo; ao aprovar, ele liga o novo acesso ao seu cadastro e nada do seu histórico se perde."}, {"lado": "motorista", "tema": "Viagens", "p": "Como inicio minha viagem?", "r": "No dia da saída aparece no Início o cartão verde <strong>PRONTA PARA SAIR</strong>. Toque em <strong>Iniciar viagem</strong>, informe o km do painel e marque OK ou Problema em cada item do <strong>checklist</strong> (pneus, freios, luzes, óleo, documentos, extintor, tacógrafo, carga). Se marcar Problema, descreva: a operação é avisada na hora.", "ir": "inicio"}, {"lado": "motorista", "tema": "Na estrada", "p": "O que é o aviso de tempo dirigindo?", "r": "O Início mostra há quanto tempo você está dirigindo desde a última parada. Pela lei do motorista (Lei 13.103) são no máximo <strong>5h30 seguidas ao volante</strong>, com 30 minutos de descanso. O aviso fica amarelo perto do limite e vermelho quando passa. Para o relógio funcionar, marque <strong>Parei</strong> e <strong>Em trânsito</strong> em Atualizar status."}, {"lado": "contador", "tema": "Conta e avisos", "p": "Um motorista se cadastrou pelo SOU MOTORISTA. Como aprovo?", "r": "Em <strong>Motoristas</strong> aparece o bloco amarelo <strong>Cadastros aguardando aprovação</strong> (também na Central do gestor). Se o motorista já tinha cadastro antigo, escolha-o em <strong>Vincular a</strong> para manter o histórico; senão deixe <strong>Novo motorista</strong>. Toque em <strong>Aprovar</strong> ou <strong>Recusar</strong>.", "ir": "motoristas"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Qual a diferença entre entrar pelo SOU MOTORISTA e pelo login normal?", "r": "Os dois funcionam. Se o contador criou o seu acesso, entre com o <strong>usuário e a senha</strong> que ele passou. Se você se cadastrou sozinho pelo <strong>SOU MOTORISTA</strong>, entre sempre por lá, com <strong>telefone e PIN</strong>.", "k": "login entrar acesso senha telefone pin"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Meu cadastro está \"aguardando aprovação\". Quanto tempo demora?", "r": "Assim que você se cadastra, o contador recebe um aviso. O tempo depende dele conferir os seus dados. Se estiver demorando, ligue ou mande mensagem para o contador avisando que já fez o cadastro.", "k": "pendente aprovacao aprovar demora cadastro"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Apareceu \"cadastro não aprovado\". O que faço?", "r": "O contador recusou o cadastro, geralmente por dados errados ou porque você já tinha um acesso. Fale com ele antes de tentar de novo.", "k": "recusado reprovado negado cadastro"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Para que serve o olho ao lado da senha ou do PIN?", "r": "Toque no <strong>olho</strong> para ver o que você digitou e conferir se está certo. Toque de novo para esconder. Use em lugar onde ninguém esteja olhando a sua tela.", "k": "olho mostrar senha pin ver"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Quais dados devo preencher no meu perfil?", "r": "O essencial é <strong>telefone com DDD</strong>. Recomendado: foto, <strong>base</strong>, categoria e validade da <strong>CNH</strong> e um <strong>contato de emergência</strong>. A validade da CNH ativa um aviso quando ela estiver perto de vencer.", "k": "perfil dados cadastro cnh emergencia foto", "ir": "inicio"}, {"lado": "motorista", "tema": "Primeiros passos", "p": "Dá para deixar o sistema como um aplicativo no celular?", "r": "Dá. No Chrome do Android, abra o sistema, toque nos <strong>três pontinhos</strong> e escolha <strong>Adicionar à tela inicial</strong>. No iPhone (Safari), toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>. Aparece um ícone igual a um aplicativo.", "k": "aplicativo app instalar icone tela inicial atalho celular"}, {"lado": "motorista", "tema": "Viagens", "p": "Esqueci de fazer o checklist na saída. E agora?", "r": "No Início, o cartão da viagem mostra o botão amarelo <strong>Checklist de saída pendente</strong>. Toque nele, informe o km e confira os itens. A operação vê que ele foi feito depois.", "k": "checklist saida esqueci pendente", "ir": "inicio"}, {"lado": "motorista", "tema": "Viagens", "p": "Marquei \"Problema\" no checklist. O que acontece?", "r": "A operação e o contador recebem um aviso na hora com o item e a sua descrição. Aguarde a orientação. Se o problema impedir de seguir viagem (freio, pneu, luz), abra também uma <strong>Ocorrência</strong> e ligue para a operação.", "k": "checklist problema defeito item"}, {"lado": "motorista", "tema": "Viagens", "p": "A viagem foi encerrada e esqueci de lançar uma despesa. Consigo lançar?", "r": "Depois de encerrada, a viagem não aceita mais registros. Fale com o contador pelo card <strong>Fale com o contador</strong>, envie a foto ou o PDF da nota e ele resolve.", "k": "esqueci lancar depois encerrada fechada"}, {"lado": "motorista", "tema": "Viagens", "p": "Onde vejo quanto já gastei nesta viagem?", "r": "No <strong>Início</strong>, o bloco <strong>Gastos desta viagem</strong> mostra o total lançado, o aprovado e o que ainda está em análise. Em <strong>Minhas viagens</strong> aparecem todas as viagens com os seus registros.", "k": "gastos total quanto gastei resumo", "ir": "inicio"}, {"lado": "motorista", "tema": "Na estrada", "p": "Como envio minha localização para a operação?", "r": "Em <strong>Atualizar status da viagem</strong>, deixe marcado <strong>Enviar minha localização</strong>. Na primeira vez o celular pergunta se pode usar a localização: toque em <strong>Permitir</strong>. A localização só é enviada quando você atualiza o status.", "k": "localizacao gps mapa posicao onde estou"}, {"lado": "motorista", "tema": "Na estrada", "p": "O celular não deixa enviar a localização. O que faço?", "r": "Ligue o <strong>GPS</strong> do celular. Depois, no Chrome, toque no cadeado ao lado do endereço do site, abra <strong>Permissões</strong> e libere <strong>Localização</strong>. Sem isso, o status é enviado mesmo assim, só que sem o ponto no mapa.", "k": "localizacao bloqueada permissao gps nao funciona"}, {"lado": "motorista", "tema": "Na estrada", "p": "Onde estão os telefones de emergência?", "r": "No final do <strong>Início</strong> há botões que já ligam direto: <strong>191</strong> PRF, <strong>192</strong> SAMU, <strong>193</strong> Bombeiros e <strong>190</strong> Polícia. Em acidente, ligue primeiro para a emergência e depois abra uma Ocorrência no sistema.", "k": "emergencia acidente prf samu bombeiro policia telefone", "ir": "inicio"}, {"lado": "motorista", "tema": "Na estrada", "p": "Quando devo marcar \"Parei\" e \"Em trânsito\"?", "r": "Marque <strong>Parei</strong> toda vez que parar por mais de alguns minutos (almoço, descanso, abastecimento, pernoite) e <strong>Em trânsito</strong> quando voltar a rodar. Isso mantém a operação informada e faz o relógio de jornada contar certo.", "k": "parei transito status quando parada descanso"}, {"lado": "motorista", "tema": "Na estrada", "p": "Recebi um \"pedido de atualização\" da operação. O que faço?", "r": "A operação está sem notícias suas. Quando for seguro (com o caminhão parado), abra o Início e toque em <strong>Atualizar status da viagem</strong>. Nunca mexa no celular dirigindo.", "k": "pedido atualizacao operacao cobrando", "ir": "inicio"}, {"lado": "motorista", "tema": "Na estrada", "p": "Minha CNH aparece vencida ou vencendo. O que faço?", "r": "Se você já renovou, atualize a <strong>validade da CNH</strong> no seu perfil (toque no seu avatar). Se ainda não renovou, procure o contador: com a CNH vencida você não pode dirigir.", "k": "cnh vencida vencendo carteira habilitacao"}, {"lado": "motorista", "tema": "Registros", "p": "Que tipo de nota ou comprovante devo guardar?", "r": "Sempre que possível, a <strong>nota fiscal</strong> ou o <strong>cupom</strong> com nome do estabelecimento, data e valor. Fotografe de perto, com boa luz e a nota inteira na foto. Recibo à mão só quando não houver nota, com nome, CPF/CNPJ e assinatura de quem recebeu.", "k": "nota fiscal cupom recibo comprovante foto"}, {"lado": "motorista", "tema": "Registros", "p": "O posto não deu nota. Posso lançar mesmo assim?", "r": "Pode. Lance o abastecimento com a foto do comprovante do cartão ou do recibo que tiver, e explique na descrição que o posto não emitiu nota. O contador decide se aceita.", "k": "sem nota posto combustivel recibo"}, {"lado": "motorista", "tema": "Orçamentos", "p": "Meu orçamento foi liberado. Como uso o dinheiro?", "r": "Faça o gasto e depois lance normalmente em <strong>Novo registro</strong>, com a foto da nota. Se o valor liberado foi menor que o pedido, respeite o valor liberado ou peça de novo explicando o motivo.", "k": "orcamento liberado dinheiro adiantamento", "ir": "orcamentos"}, {"lado": "motorista", "tema": "Orçamentos", "p": "Meu pedido de orçamento foi negado. E agora?", "r": "O motivo aparece no próprio pedido, em <strong>Orçamentos</strong>. Se precisar mesmo do gasto, ligue para a operação ou faça um pedido novo com mais detalhes.", "k": "orcamento negado recusado", "ir": "orcamentos"}, {"lado": "motorista", "tema": "Aprovação e descontos", "p": "Como sei se vou receber ou devolver dinheiro no fim da viagem?", "r": "No fechamento, o contador compara o <strong>adiantamento</strong> que você recebeu com as <strong>despesas aprovadas</strong>. Se sobrar dinheiro, você devolve; se faltar, a empresa reembolsa. O valor do adiantamento só o contador vê, então confirme com ele no fechamento.", "k": "saldo devolver receber reembolso adiantamento fechamento"}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "Troquei de celular. Como entro de novo?", "r": "É só abrir o sistema no celular novo e entrar com o mesmo login (ou telefone + PIN). Seus registros enviados estão todos lá. Antes de trocar, confira se não ficou nada em <strong>Guardados no aparelho</strong> no celular antigo.", "k": "trocar celular novo aparelho"}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "O que significam \"Tempo real\", \"Sincronizando\" e \"Offline\" no topo?", "r": "<strong>Tempo real</strong>: está tudo conectado. <strong>Sincronizando…</strong>: o sistema está enviando o que você salvou. <strong>Offline</strong>: sem internet; o que você salvar fica guardado no aparelho e é enviado quando a conexão voltar.", "k": "offline sincronizando tempo real internet indicador internet sinal offline conexao"}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "Posso usar o sistema no computador também?", "r": "Pode. É o mesmo endereço, com o mesmo login. No computador as telas ficam maiores e o menu fica na lateral.", "k": "computador notebook pc"}, {"lado": "equipe", "tema": "Monitoramento", "p": "Como vejo os caminhões no rastreador Féria?", "r": "No <strong>Monitoramento</strong>, ao lado do mapa: <strong>Caminhões no Féria</strong> abre o rastreador dentro do sistema e <strong>Abrir Féria</strong> abre numa aba nova. Entre com o login do Féria. Se ficar em branco dentro do sistema, use a aba nova.", "k": "feria soha rastreador rastreamento gps caminhao mapa", "ir": "monitor"}, {"lado": "equipe", "tema": "Monitoramento", "p": "O que significa o aviso de jornada (tempo dirigindo)?", "r": "Mostra há quanto tempo o motorista está dirigindo desde a última parada que ele marcou. Fica <strong>amarelo</strong> a partir de 5h e <strong>vermelho</strong> a partir de 5h30, o limite seguido da Lei 13.103. Depende do motorista marcar Parei e Em trânsito.", "k": "jornada lei 13103 descanso horas dirigindo", "ir": "monitor"}, {"lado": "equipe", "tema": "Monitoramento", "p": "O motorista diz que enviou status, mas não aparece no mapa.", "r": "O ponto só aparece quando o motorista marca <strong>Enviar minha localização</strong> e o celular dele permite o GPS. O status chega mesmo sem localização. Peça para ele liberar a localização do navegador.", "k": "mapa localizacao nao aparece", "ir": "monitor"}, {"lado": "equipe", "tema": "Uso do sistema", "p": "Existe atalho para a busca?", "r": "Sim. No computador, aperte <strong>/</strong> ou <strong>Ctrl+K</strong> para ir direto à busca do topo. Ela procura motoristas, placas, viagens e registros.", "k": "atalho busca teclado procurar"}, {"lado": "equipe", "tema": "Uso do sistema", "p": "Como deixo o menu lateral mais estreito?", "r": "No computador, toque em <strong>Recolher menu</strong> no pé do menu: ficam só os ícones. Toque de novo para abrir. No celular, o menu abre pelo botão ☰ e os grupos começam fechados; toque num grupo para ver as opções.", "k": "menu recolher lateral esconder"}, {"lado": "equipe", "tema": "Uso do sistema", "p": "Esqueci minha senha. Como recupero?", "r": "Na tela de login, toque em <strong>Esqueci minha senha</strong> e informe o seu e-mail. O sistema envia um link para criar uma senha nova (confira o spam).", "k": "senha esqueci recuperar redefinir"}, {"lado": "equipe", "tema": "Uso do sistema", "p": "Apareceu \"Falha na sincronização\". O que faço?", "r": "Confira a internet. O que você salvou fica guardado e é enviado quando a conexão voltar. Se a mensagem continuar com internet boa, recarregue a página; se persistir, anote o horário e avise o responsável pelo sistema.", "k": "falha sincronizacao erro conexao"}, {"lado": "equipe", "tema": "Uso do sistema", "p": "Um motorista ligou com dúvida sobre o aplicativo. Como ajudo?", "r": "Aqui em Dúvidas, troque para <strong>Ajuda para motoristas</strong>: são as mesmas perguntas e respostas que o motorista vê, para você orientar por telefone.", "k": "ajudar motorista suporte duvida telefone"}, {"lado": "equipe", "tema": "Uso do sistema", "p": "Como filtro os caminhões por estado?", "r": "Em <strong>Caminhões</strong>, toque na sigla do estado (MA, PA, TO…) no topo da lista para ver só os caminhões daquele estado. <strong>Limpar</strong> mostra todos de novo.", "k": "caminhao estado uf filtro frota placa", "ir": "caminhoes"}, {"lado": "contador", "tema": "Motoristas e equipe", "p": "Um motorista esqueceu o PIN. O que faço?", "r": "No Firebase (console.firebase.google.com, projeto <strong>rofe-finance</strong>), abra <strong>Authentication → Users</strong>, encontre o login dele (o telefone seguido de @motorista…) e exclua. Peça para ele fazer o <strong>Primeiro acesso</strong> de novo e, ao aprovar, escolha o cadastro antigo em <strong>Vincular a</strong>. O histórico continua.", "k": "pin esqueceu senha motorista recuperar", "ir": "motoristas"}, {"lado": "contador", "tema": "Motoristas e equipe", "p": "O que quer dizer a coluna CNH na lista de motoristas?", "r": "Mostra a validade informada pelo motorista: <strong>vermelho</strong> se já venceu, <strong>amarelo</strong> se vence em até 30 dias. Motoristas nessa situação também aparecem na Central do gestor.", "k": "cnh vencida validade carteira", "ir": "motoristas"}, {"lado": "contador", "tema": "Motoristas e equipe", "p": "Como bloqueio o acesso de um motorista ou operador?", "r": "Em <strong>Motoristas</strong> ou em <strong>Equipe</strong>, use <strong>Desativar</strong> na linha da pessoa. Ela não consegue mais entrar, mas todo o histórico continua. Para liberar de novo, use <strong>Reativar</strong>.", "k": "desativar bloquear acesso demitido", "ir": "motoristas"}, {"lado": "contador", "tema": "Motoristas e equipe", "p": "Aprovei um cadastro sem vincular ao motorista antigo. E agora?", "r": "O motorista ficou com um cadastro novo, sem o histórico antigo. As viagens antigas continuam no cadastro antigo. Para unir, exclua o login novo no Firebase (Authentication → Users), peça um novo Primeiro acesso e, na aprovação, escolha o cadastro antigo em <strong>Vincular a</strong>.", "k": "vincular errado cadastro duplicado historico", "ir": "motoristas"}, {"lado": "contador", "tema": "Viagens", "p": "O motorista pode iniciar e encerrar a viagem sozinho?", "r": "Ele pode <strong>iniciar</strong>: na data de saída vê <strong>PRONTA PARA SAIR</strong>, faz o checklist de saída e informa o km. <strong>Encerrar</strong> é só com a operação ou o contador: em Viagens, abra a viagem e use <strong>Encerrar viagem</strong>, informando o km final.", "k": "motorista iniciar encerrar sozinho checklist", "ir": "viagens"}, {"lado": "operador", "tema": "Viagens", "p": "Como abro uma viagem para um motorista?", "r": "Em <strong>Iniciar viagem</strong>, escolha motorista, caminhão, origem, destino e data de saída. Com data de hoje, ela começa na hora; com data futura, fica <strong>agendada</strong>. Motorista ou caminhão ocupado no período aparece bloqueado.", "k": "abrir viagem nova iniciar agendar", "ir": "nova"}, {"lado": "operador", "tema": "Viagens", "p": "Por que não vejo valores de adiantamento e aprovação de despesas?", "r": "Essas partes são do <strong>contador</strong>: aprovar ou rejeitar despesas, descontos, adiantamento, relatórios e auditoria. O operador cuida da operação: monitoramento, viagens, orçamentos e cadastros.", "k": "permissao adiantamento aprovar despesas acesso"}, {"lado": "operador", "tema": "Monitoramento", "p": "Quais telas são mais úteis no dia a dia do operador?", "r": "Comece pelo <strong>Monitoramento</strong>: ocorrências abertas, motoristas sem atualização, saídas de hoje e amanhã e os caminhões no Féria. Depois veja <strong>Orçamentos</strong> aguardando: pedidos urgentes aparecem primeiro.", "k": "rotina dia a dia comecar", "ir": "monitor"}, {"lado": "gestor", "tema": "Central do gestor", "p": "O que é a Central do gestor?", "r": "Uma visão só sua com tudo o que precisa de atenção: <strong>Pendências</strong>, <strong>Dinheiro na rua</strong>, <strong>Custos</strong>, <strong>Vistoria</strong>, <strong>Movimentações</strong>, <strong>Ranking</strong> e <strong>Fechamento do mês</strong>. Os números ao lado de cada aba mostram quantos itens pedem ação.", "k": "central gestor visao geral", "ir": "gestor"}, {"lado": "gestor", "tema": "Central do gestor", "p": "O que entra em Pendências?", "r": "Tudo que pede decisão, do mais urgente ao menos urgente: ocorrências na estrada, orçamentos aguardando, registros parados há mais de 48 h, cadastros de motoristas para aprovar, duplicidades, viagens atrasadas, motoristas sem dar notícia, CNH vencida ou vencendo, viagens sem checklist, checklist com problema e saldos a devolver. Cada item leva direto para a tela onde se resolve.", "k": "pendencias urgente decisao", "ir": "gestor"}, {"lado": "gestor", "tema": "Central do gestor", "p": "O que é \"Dinheiro na rua\"?", "r": "O adiantamento entregue aos motoristas em viagens em andamento ou com saldo em aberto, comparado com o que já foi <strong>aprovado</strong> e o que está <strong>em análise</strong>. A coluna <strong>sem comprovação</strong> mostra quanto ainda não tem nota, por motorista e por viagem.", "k": "dinheiro rua adiantamento comprovar", "ir": "gestor"}, {"lado": "gestor", "tema": "Central do gestor", "p": "Como uso o \"Fechamento do mês\"?", "r": "Escolha o mês e confira os <strong>descontos a lançar em folha</strong> por motorista, com a justificativa de cada um. Dá para exportar e imprimir para enviar ao RH/DP. O sistema não desconta nada sozinho.", "k": "fechamento mes folha desconto rh dp", "ir": "gestor"}, {"lado": "gestor", "tema": "Central do gestor", "p": "O que mostram Vistoria, Movimentações e Ranking?", "r": "<strong>Vistoria</strong>: registros que merecem um segundo olhar (valor muito acima do normal da categoria, preço por litro estranho, nota lançada mais de 7 dias depois, sem foto, duplicidade, vários abastecimentos no mesmo dia). <strong>Movimentações</strong>: tudo que a equipe e os motoristas fizeram, em ordem de horário. <strong>Ranking</strong>: motoristas no mês por gasto por dia, rejeições, atraso no lançamento, atualizações de status, ocorrências e descontos.", "k": "vistoria movimentacoes ranking auditoria", "ir": "gestor"}, {"lado": "motorista", "tema": "Conta e aplicativo", "p": "O sistema travou ou não abre. O que faço?", "r": "Confira se o celular está com internet. Depois feche a aba do sistema e abra de novo. Se você tiver registros em <strong>Guardados no aparelho</strong>, <strong>não limpe os dados do navegador</strong>: eles ainda não foram enviados e seriam perdidos. Se continuar travando, fale com o contador e diga o que estava fazendo quando travou.", "k": "travou erro lento carregando nao abre bugou tela branca"}];

function dvDistancia(a, b){
  if(Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
      i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] ? d[i - 2][j - 2] + 1 : 99);
  return d[a.length][b.length];
}
function dvIndice(d){
  if(d._idx) return d._idx;
  const m = {}, pals = new Set();
  const pal = (txt, peso) => dvTokens(txt).forEach(w => {
    pals.add(w);
    const r = dvRaiz(w); m[r] = Math.max(m[r] || 0, peso);
    (DV_SINONIMOS[r] || []).forEach(x => { m[x] = Math.max(m[x] || 0, peso * 0.8); });
  });
  pal(d.r, 1); pal(d.tema, 1.5); pal(d.k || '', 3); pal(d.p, 3);
  Object.defineProperty(d, '_pals', { value: pals, enumerable: false });
  return (d._idx = m);
}
/* corrige uma palavra digitada errado usando o vocabulário das respostas ("conbustivel" → "combustivel") */
function dvCorrigir(w, vocab){
  if(w.length < 4) return null;
  const lim = w.length >= 7 ? 2 : 1;
  let melhor = null, dist = 9;
  vocab.forEach(v => { if(v[0] !== w[0] && w.length < 6) return; const x = dvDistancia(w, v); if(x < dist){ dist = x; melhor = v; } });
  return dist <= lim ? melhor : null;
}
function dvBuscar(texto, lista){
  const palavras = [...new Set(dvTokens(texto))];
  if(!palavras.length) return [];
  lista.forEach(dvIndice);
  const raizes = new Set(); lista.forEach(d => Object.keys(d._idx).forEach(r => raizes.add(r)));
  const vocab = new Set(); lista.forEach(d => d._pals.forEach(w => vocab.add(w)));
  Object.keys(DV_SINONIMOS).forEach(r => vocab.add(r));
  const qs = palavras.map(w => {
    let r = dvRaiz(w);
    if(!raizes.has(r) && !DV_SINONIMOS[r]){ const c = dvCorrigir(w, vocab); if(c) r = dvRaiz(c); }
    return [[r, 1], ...[...(DV_SINONIMOS[r] || [])].filter(x => x !== r).map(x => [x, 0.85])];
  });
  return lista.map(d => {
    const ix = d._idx;
    let pts = 0, acertos = 0;
    qs.forEach(alts => { const melhor = Math.max(0, ...alts.map(([r, f]) => (ix[r] || 0) * f)); if(melhor){ pts += melhor; acertos++; } });
    return { d, pts: pts * (0.5 + 0.5 * acertos / qs.length) };
  }).filter(x => x.pts >= 1.8).sort((a, b) => b.pts - a.pts);
}

/* Reduz a foto de perfil (mantém o documento do Firestore pequeno) */
function reduzirFoto(src, max){
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => falha(new Error('foto inválida'));
    img.src = src;
  });
}

  const alvo = document.getElementById('detalhe-viagem');

  const btnAd = alvo.querySelector('[data-adiant]');

  const btnPdf = alvo.querySelector('[data-pdf-fech]');

  const btnIni = alvo.querySelector('[data-iniciar-ag]');
  if(btnIni) btnIni.addEventListener('click', () => {
    const ocupado = viagens.find(o => o.id !== v.id && o.status === 'em andamento' && (o.motoristaId === v.motoristaId || o.placa === v.placa));
    if(ocupado){ mostrarMensagem('Não é possível iniciar: ' + (ocupado.motoristaId === v.motoristaId ? 'o motorista' : 'o caminhão') + ' está em rota na viagem #' + ocupado.id + '.', true); return; }
    const mud = { status: 'em andamento' };
    if(v.saida > hojeIso()){ mud.saidaAgendada = v.saida; mud.saida = hojeIso(); }
    salvarViagem(v, mud);
    auditar('Iniciou viagem agendada #' + v.id, v.origem + ' → ' + v.destino);
    avisar(v.motoristaId, 'viagem');
    mostrarMensagem('Viagem iniciada.');
    irPara(rotaAtual); mostrarViagem(v.id);
  });
  const btnCan = alvo.querySelector('[data-cancelar-ag]');
  if(btnCan) btnCan.addEventListener('click', () => {
    if(!confirm('Cancelar a reserva da viagem #' + v.id + '? O motorista e o caminhão serão liberados.')) return;

    irPara(rotaAtual); mostrarViagem(v.id);

function lerArquivo(arquivo){
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = () => resolve(leitor.result);
    leitor.onerror = reject;
    leitor.readAsDataURL(arquivo);
  });
}

function processarFila(){
  if(!filaFotos.length) return;
  const arquivo = filaFotos.shift();
  if(arquivo.type === 'application/pdf' || /\.pdf$/i.test(arquivo.name || '')){
    if(arquivo.size > LIMITE_PDF){
      mostrarMensagem(`O PDF "${arquivo.name}" tem ${Math.round(arquivo.size / 1024)} KB. O limite é ${Math.round(LIMITE_PDF / 1024)} KB: tire uma foto da nota ou envie um PDF menor.`, true);
      processarFila(); return;
    }
    lerArquivo(arquivo).then(src => {
      const nome = String(arquivo.name || 'documento.pdf').replace(/[;,]/g, ' ').slice(0, 60);
      fotosNovoRegistro.push(src.replace(/^data:[^;,]*/, 'data:application/pdf;name=' + encodeURIComponent(nome)));
      desenharGradeFotos(); processarFila();
    }).catch(() => { mostrarMensagem('Não foi possível ler o PDF.', true); processarFila(); });
    return;
  }
  if(!/^image\//.test(arquivo.type || '') && arquivo.type){ mostrarMensagem('Esse tipo de arquivo não é aceito. Envie foto ou PDF.', true); processarFila(); return; }
  lerArquivo(arquivo).then(src => abrirEditorFoto(src,
    resultado => { fotosNovoRegistro.push(resultado); desenharGradeFotos(); processarFila(); },
    () => processarFila()));
}

function abrirEditorFoto(src, aplicar, cancelar){

      </div>

function gerarImagem(img, st, maxLado){
  const girado = st.rot % 180 !== 0;
  const base = document.createElement('canvas');
  base.width = girado ? img.height : img.width;
  base.height = girado ? img.width : img.height;
  const bc = base.getContext('2d');
  bc.translate(base.width / 2, base.height / 2);
  bc.rotate(st.rot * Math.PI / 180);
  bc.drawImage(img, -img.width / 2, -img.height / 2);

  const W = base.width, H = base.height;
  const sx = Math.round(W * st.left / 100), sy = Math.round(H * st.top / 100);
  const sw = Math.max(1, Math.round(W * (100 - st.left - st.right) / 100));
  const sh = Math.max(1, Math.round(H * (100 - st.top - st.bottom) / 100));
  const escala = Math.min(1, maxLado / Math.max(sw, sh));

  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(sw * escala));
  out.height = Math.max(1, Math.round(sh * escala));
  const oc = out.getContext('2d');
  oc.drawImage(base, sx, sy, sw, sh, 0, 0, out.width, out.height);

  if(st.bri !== 100 || st.con !== 100){
    const dados = oc.getImageData(0, 0, out.width, out.height);
    const d = dados.data;
    const b = st.bri / 100, c = st.con / 100;
    for(let i = 0; i < d.length; i += 4){
      for(let k = 0; k < 3; k++){
        let v = d[i+k] * b;
        v = (v - 128) * c + 128;
        d[i+k] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
    }
    oc.putImageData(dados, 0, 0);
  }
  return out;
}

/* ===== v28: datas, reservas, quilometragem, duplicidade, conversa e busca ===== */
const hojeIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const norm = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const fmtNum = (n, c = 1) => (n == null || isNaN(n)) ? '—' : n.toLocaleString('pt-BR', { minimumFractionDigits:c, maximumFractionDigits:c });
const viagemAtiva = v => v.status === 'em andamento' || v.status === 'agendada';
const rotuloViagem = v => ({ 'em andamento':'Em andamento', agendada:'Agendada', cancelada:'Cancelada', finalizada:'Finalizada' })[v.status] || v.status;

/* Período que a viagem ocupa. Em andamento sem retorno previsto ocupa o recurso por tempo indeterminado. */
function periodoViagem(v){
  const ini = v.saida || hojeIso();
  let fim;
  if(v.status === 'em andamento' && (!v.previsaoRetorno || v.previsaoRetorno < hojeIso())) fim = '9999-12-31';
  else fim = v.previsaoRetorno || ini;
  return [ini, fim < ini ? ini : fim];
}
function conflitoViagem(campo, valor, ini, fim, ignorarId){
  return viagens.find(v => v.id !== ignorarId && viagemAtiva(v) && v[campo] === valor && (() => {
    const [a, b] = periodoViagem(v);
    return a <= fim && ini <= b;
  })()) || null;
}
function reservasDe(campo, valor){
  return viagens.filter(v => v.status === 'agendada' && v[campo] === valor).sort((a,b) => a.saida.localeCompare(b.saida));
}
function textoReservas(campo, valor){
  return reservasDe(campo, valor).map(v => {
    const [a, b] = periodoViagem(v);
    return `<div class="mini reserva">${icon('clock')}<span>Reservado ${fmtData(a)}${b !== a ? ' a ' + fmtData(b) : ''} · #${v.id}</span></div>`;
  }).join('');
}
function promoverAgendadas(){
  /* o motorista inicia a própria viagem pelo botão "Iniciar viagem" (com checklist e km); a equipe promove automaticamente */
  if(!usuarioAtual || !Sync.pronto.viagens || usuarioAtual.perfil === 'motorista') return;
  const hoje = hojeIso();
  viagens.filter(v => v.status === 'agendada' && v.saida <= hoje && !Sync.promovidas.has(v.id)).forEach(v => {
    if(viagens.some(o => o.id !== v.id && o.status === 'em andamento' && (o.motoristaId === v.motoristaId || o.placa === v.placa))) return;
    Sync.promovidas.add(v.id);   /* tenta uma vez por sessão (evita repetir se a gravação for recusada) */
    salvarViagem(v, { status: 'em andamento' });
    auditar('Viagem #' + v.id + ' iniciada automaticamente', v.origem + ' → ' + v.destino);
    notificar(v.motoristaId, 'Sua viagem #' + v.id + ' (' + v.origem + ' → ' + v.destino + ') foi iniciada.');
  });
}
function tagViagem(v){
  if(v.status === 'em andamento') return tagEmRota('Em andamento');
  if(v.status === 'agendada') return `<span class="tag agendada">${icon('clock')}<span>Agendada</span></span>`;
  if(v.status === 'cancelada') return '<span class="tag rejeitado">Cancelada</span>';
  return '<span class="tag aprovado">Finalizada</span>';
}

/* Quilometragem: km rodado, custo por km e consumo médio */
function metricasViagem(v){
  const regs = despesas.filter(d => d.viagemId === v.id);
  const validos = regs.filter(d => d.status !== 'rejeitado');
  const custo = validos.reduce((s,d) => s + d.valor, 0);
  const litros = validos.reduce((s,d) => s + (d.litros || 0), 0);
  const ki = parseFloat(v.kmInicial), kf = parseFloat(v.kmFinal);
  const km = (!isNaN(ki) && !isNaN(kf) && kf > ki) ? kf - ki : null;
  return { regs, custo, litros, km, custoKm: km ? custo / km : null, consumo: (km && litros > 0) ? km / litros : null };
}

/* Duplicidade: mesmo valor + data + categoria, ou mesma foto */
function hashImg(str){
  let h = 2166136261 >>> 0;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36) + ':' + str.length;
}
function hashesDe(d){
  if(Array.isArray(d.fotoHashes)) return d.fotoHashes;   /* calculado ao salvar (as fotos ficam na coleção "fotos") */
  const n = (d.imagens || []).length;
  if(!d._h || d._hn !== n){ d._h = (d.imagens || []).map(hashImg); d._hn = n; }
  return d._h;
}
function duplicidadesDe(d){
  const meus = hashesDe(d);
  const out = [];
  despesas.forEach(o => {
    if(o.id === d.id || o.status === 'rejeitado') return;
    const motivos = [];
    if(Math.abs(o.valor - d.valor) < 0.005 && o.data === d.data && o.categoria === d.categoria) motivos.push('mesmo valor, data e categoria');
    if(meus.length && hashesDe(o).some(h => meus.includes(h))) motivos.push('mesma foto');
    if(motivos.length) out.push({ id:o.id, motivos });
  });
  return out;
}
function blocoDuplicidade(d){
  if(usuarioAtual.perfil !== 'admin' || d.status === 'rejeitado') return '';
  const dups = duplicidadesDe(d);
  if(!dups.length) return '';
  return `<div class="alerta-dup">${icon('alert')}<div><strong>Possível duplicidade</strong>
    ${dups.map(x => `<div class="mini">Registro <a href="#" data-abrir-reg="${x.id}">#${x.id}</a> — ${x.motivos.join(' e ')}</div>`).join('')}</div></div>`;
}

/* Aprovação em lote */
function aprovarLote(){
  const regs = [...selecionados].map(id => despesas.find(x => x.id === id)).filter(d => d && d.status === 'aguardando');
  if(!regs.length) return;
  const soma = regs.reduce((s,d) => s + d.valor, 0);
  const comDup = regs.filter(d => duplicidadesDe(d).length);
  let msg = `Aprovar ${regs.length} registro(s) no valor de ${fmtBRL(soma)}?`;
  if(comDup.length) msg += `\n\n⚠ Atenção: ${comDup.length} com possível duplicidade (${comDup.map(d => '#' + d.id).join(', ')}).\nDeseja aprovar mesmo assim?`;
  if(!confirm(msg)) return;
  const porMotorista = {};
  const ops = [];
  regs.forEach(d => {
    const h = entradaHistorico('Aprovado (em lote)');
    d.status = 'aprovado';
    (d.historico = d.historico || []).push(h);
    ops.push({ tipo: 'upd', col: 'despesas', id: d.id, dados: { status: 'aprovado', historico: RofeDB.fv.arrayUnion(h), atualizadoEm: Date.now() } });
    porMotorista[d.motoristaId] = (porMotorista[d.motoristaId] || 0) + 1;
  });
  /* lote de até 450 por gravação (limite do Firestore é 500) */
  for(let i = 0; i < ops.length; i += 450) gravar(RofeDB.lote(ops.slice(i, i + 450)), 'Não foi possível aprovar o lote.');
  auditar('Aprovou ' + regs.length + ' registro(s) em lote', regs.map(d => '#' + d.id).join(', '));
  Object.entries(porMotorista).forEach(([mid, n]) => notificar(mid, n === 1 ? 'Um registro seu foi aprovado.' : n + ' registros seus foram aprovados.'));
  selecionados.clear();
  mostrarMensagem(regs.length + ' despesa(s) aprovada(s) em lote.');
  desenharTabelaAdmin();
}

/* Busca global */
function buscarGlobal(q){
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  const casa = texto => { const n = norm(texto); return tokens.every(k => n.includes(k)); };
  const adm = ehEquipe();
  const r = { motoristas:[], caminhoes:[], viagens:[], registros:[] };
  if(adm){
    USUARIOS.filter(u => u.perfil === 'motorista').forEach(u => { if(casa([u.nome, u.usuario, u.telefone, u.email].join(' '))) r.motoristas.push(u); });
    CAMINHOES.forEach(x => { if(casa([x.placa, x.modelo, x.marca, x.tipo, x.carroceria, x.base, x.uf, x.posse].join(' '))) r.caminhoes.push(x); });
  }
  viagens.filter(v => adm || v.motoristaId === usuarioAtual.id).forEach(v => {
    if(casa(['viagem', '#' + v.id, v.origem, v.destino, v.placa, nomeMotorista(v.motoristaId), rotuloViagem(v)].join(' '))) r.viagens.push(v);
  });
  despesas.filter(d => adm || d.motoristaId === usuarioAtual.id).forEach(d => {
    if(casa(['registro', '#' + d.id, d.categoria, d.descricao, d.cidade, d.local, d.placa, nomeMotorista(d.motoristaId), fmtBRL(d.valor), String(d.valor), fmtData(d.data)].join(' '))) r.registros.push(d);
  });
  return r;
}
function fecharBusca(){

}
function limparBusca(){

function renderBusca(){
  const inp = document.getElementById('busca-input'), box = document.getElementById('busca-res');
  const q = inp.value.trim();
  if(!usuarioAtual || q.length < 2){ fecharBusca(); return; }

    ['Motoristas', 'user', r.motoristas, u => ({ tipo:'motorista', id:u.id, t:u.nome, s:(viagemDoMotorista(u.id) ? 'Em rota' : 'Disponível') + ' · ' + u.usuario })],
    ['Caminhões', 'truck', r.caminhoes, x => ({ tipo:'caminhao', id:x.placa, t:x.placa + ' — ' + x.modelo, s:(viagemDoCaminhao(x.placa) ? 'Em rota' : 'Disponível') + ' · ' + x.marca + ' · ' + x.base })],
    ['Viagens', 'route', r.viagens, v => ({ tipo:'viagem', id:v.id, t:'#' + v.id + ' ' + v.origem + ' → ' + v.destino, s:nomeMotorista(v.motoristaId) + ' · ' + v.placa + ' · ' + rotuloViagem(v) })],
    ['Registros', 'receipt', r.registros, d => ({ tipo:'registro', id:d.id, t:'#' + d.id + ' ' + d.categoria + ' — ' + d.descricao, s:fmtBRL(d.valor) + ' · ' + fmtData(d.data) + ' · ' + nomeMotorista(d.motoristaId) + ' · ' + rotulosStatus[d.status] })]
  ].filter(g => g[2].length);
  box.innerHTML = grupos.length ? grupos.map(([nome, ic, lista, fn]) => `
      <div class="busca-grupo">${nome}<span>${lista.length}</span></div>

      ${lista.length > 5 ? `<div class="busca-mais">+${lista.length - 5} resultado(s) — refine a busca</div>` : ''}`).join('')
    : `<div class="busca-vazio">Nada encontrado para “${esc(q)}”.</div>`;
  box.classList.remove('oculto');

function irParaResultado(tipo, id){
  fecharBusca();
  const adm = ehEquipe();
  if(tipo === 'motorista'){
    irPara('motoristas');
    const i = document.getElementById('m-busca');
    if(i){ i.value = nomeMotorista(id); i.dispatchEvent(new Event('input')); }
  } else if(tipo === 'caminhao'){
    irPara('caminhoes');
    const tr = [...document.querySelectorAll('[data-placa]')].find(el => el.dataset.placa === id);
    if(tr){ tr.classList.add('destaque-busca'); tr.scrollIntoView({ behavior:'smooth', block:'center' }); }
  } else if(tipo === 'viagem'){
    irPara(adm ? 'viagens' : 'viagem');
    mostrarViagem(+id);
  } else if(tipo === 'registro'){
    abrirDetalhe(+id);
  }
}
function iniciarBusca(){
  const inp = document.getElementById('busca-input'), box = document.getElementById('busca-res');
  document.getElementById('busca-ico').innerHTML = icon('search');
  inp.addEventListener('input', renderBusca);
  inp.addEventListener('focus', renderBusca);
  box.addEventListener('click', e => {
    const b = e.target.closest('.busca-item');
    if(b){ const tipo = b.dataset.tipo, id = b.dataset.id; inp.value = ''; irParaResultado(tipo, id); }
  });
  inp.addEventListener('keydown', e => {
    const itens = [...box.querySelectorAll('.busca-item')];
    let i = itens.findIndex(x => x.classList.contains('ativo'));
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(!itens.length) return;
      if(i >= 0) itens[i].classList.remove('ativo');
      i = e.key === 'ArrowDown' ? (i + 1) % itens.length : (i <= 0 ? itens.length - 1 : i - 1);
      itens[i].classList.add('ativo');
      itens[i].scrollIntoView({ block:'nearest' });
    } else if(e.key === 'Enter'){
      const alvo = itens[i >= 0 ? i : 0];
      if(alvo){ e.preventDefault(); alvo.click(); }
    } else if(e.key === 'Escape'){
      inp.value = ''; fecharBusca(); inp.blur();
    }
  });
  document.addEventListener('click', e => { if(!e.target.closest('#busca-global')) fecharBusca(); });
  document.addEventListener('keydown', e => {
    if(!usuarioAtual) return;
    const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if((e.key === '/' && !digitando) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){
      e.preventDefault(); inp.focus(); inp.select();
    }
  });
}

function finalizarViagem(v){
  const regs = despesas.filter(d => d.viagemId === v.id);
  const total = regs.reduce((s,d) => s + d.valor, 0);
  if(!confirm(`Encerrar viagem #${v.id}?\n\nRegistros: ${regs.length}\nTotal: ${fmtBRL(total)}`)) return false;
  let kmTxt = prompt('Quilometragem final' + (v.kmInicial ? ' (inicial: ' + v.kmInicial + ')' : '') + ' — opcional:', '');
  while(kmTxt && kmTxt.trim()){
    const n = parseFloat(kmTxt.replace(',', '.')), ki = parseFloat(v.kmInicial);
    if(!isNaN(n) && n >= 0 && (isNaN(ki) || n > ki)){ v.kmFinal = String(n); break; }
    mostrarMensagem('Km final inválido' + (!isNaN(ki) ? ': deve ser maior que o inicial (' + ki + ').' : '.'), true);
    kmTxt = prompt('Informe novamente a quilometragem final (ou deixe vazio para pular):', '');
  }
  salvarViagem(v, { status: 'finalizada', chegada: hojeIso(), kmFinal: v.kmFinal || '' });
  auditar('Encerrou viagem #'+v.id, v.origem+' → '+v.destino);
  avisar(v.motoristaId, 'viagem');
  const mf = metricasViagem(v);
  mostrarMensagem('Viagem encerrada.' + (mf.km ? ' ' + fmtNum(mf.km, 0) + ' km rodados · ' + fmtBRL(mf.custoKm) + '/km' : ''));
  return true;
}
function formIniciarViagem(c, motoristaId, voltar){

  const btn = document.getElementById('v-salvar'), aviso = document.getElementById('aviso-disp');
  const periodoForm = () => {
    const ini = inSaida.value || hoje;
    const fim = inRet.value && inRet.value >= ini ? inRet.value : (ini <= hoje ? '9999-12-31' : ini);
    return [ini, fim];
  };
  const rotuloConflito = v => {
    if(v.status === 'em andamento') return 'em rota (indisponível)';
    const [a, b] = periodoViagem(v);
    return 'reservado ' + fmtData(a) + (b !== a ? ' a ' + fmtData(b) : '');
  };
  const atualizar = () => {
    const [ini, fim] = periodoForm();
    inRet.min = ini;
    const semOpcao = [];
    [[selMot, 'motoristaId', 'motorista'], [selCam, 'placa', 'caminhão']].forEach(([sel, campo, nome]) => {
      if(!sel) return;
      let livres = 0;
      [...sel.options].forEach(o => {
        const valor = campo === 'placa' ? CAMINHOES.find(x => x.id === o.value).placa : o.value;
        const cf = conflitoViagem(campo, valor, ini, fim);
        o.disabled = !!cf;
        o.textContent = o.dataset.base + (cf ? ' — ' + rotuloConflito(cf) : '');
        if(!cf) livres++;

      if(sel.selectedIndex < 0 || sel.selectedOptions[0].disabled){
        const o = [...sel.options].find(x => !x.disabled);
        if(o) sel.value = o.value; else sel.selectedIndex = -1;

    const agendada = ini > hoje;

      origem: document.getElementById('v-origem').value.trim(),
      destino: document.getElementById('v-destino').value.trim(),
      saida: ini, previsaoRetorno: inRet.value || '',
      kmInicial: document.getElementById('v-km').value || '',
      adiantamento: Math.max(0, parseFloat((document.getElementById('v-adiant') || {}).value) || 0),
      obs: document.getElementById('v-obs').value.trim(),
      status: agendada ? 'agendada' : 'em andamento',
      criadoEm: Date.now(), atualizadoEm: Date.now()
    };
    const textoBtn = btn.textContent;

    } catch(err){

      delete btn.dataset.salvando; btn.disabled = false; btn.textContent = textoBtn;
      mostrarMensagem(ehErroConexao(err) ? 'Sem conexão com o servidor. Abrir viagem exige internet: tente de novo em instantes.' : window.RofeAuth.traduzirErro(err, 'Não foi possível criar a viagem.'), true);
      return;
    }
    viagens.push(nova);

    auditar((agendada ? 'Agendou viagem #' : 'Iniciou viagem #') + nova.id, nova.origem + ' → ' + nova.destino);

    irPara(voltar);
  });
}

/* ==========================================================
   v39 — SINCRONIZAÇÃO EM TEMPO REAL (Firestore)
   Cada coleção é escutada com onSnapshot: qualquer mudança feita
   por outro usuário aparece na tela sem recarregar a página.
   ========================================================== */
const Sync = { falhas: new Map(), escutas: [], pronto: {}, carregado: false, recentes: new Map(), promovidas: new Set(), enviandoFila: false, erroAvisado: false, timer: null, esperandoFoco: false };
const fotoCache = new Map();   /* id da foto → dataURL */

const TITULO_BASE = document.title;
const LIMITE_FOTO = 750000;
const LIMITE_PDF = 540 * 1024;  /* PDF em base64 cresce ~33%: 540 KB → ~720 KB, abaixo do limite de 1 MB do documento */
const ehPdf = u => typeof u === 'string' && u.startsWith('data:application/pdf');
const nomePdf = u => { const m = /;name=([^;,]+)/.exec(u || ''); try { return m ? decodeURIComponent(m[1]) : ''; } catch(e){ return ''; } };
/* abre o PDF numa aba nova (o navegador não abre "data:" direto por segurança) */
function abrirPdf(u){
  try {
    const b64 = u.slice(u.indexOf(',') + 1), bin = atob(b64), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    const w = window.open(url, '_blank');
    if(!w){ const a = document.createElement('a'); a.href = url; a.download = nomePdf(u) || 'comprovante.pdf'; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(e){ mostrarMensagem('Não foi possível abrir o PDF.', true); }
}    /* tamanho máximo de cada foto gravada (documento do Firestore tem limite de 1 MB) */

/* ---- gravação ---- */
function gravar(promessa, msgErro){
  return promessa.catch(err => {
    console.error(err);
    if(msgErro !== undefined) mostrarMensagem(window.RofeAuth ? window.RofeAuth.traduzirErro(err, msgErro || 'Não foi possível salvar no banco.') : msgErro, true);
  });
}
const ehErroConexao = e => !!e && (['unavailable', 'deadline-exceeded'].includes(e.code) || /offline|network|tempo esgotado/i.test(e.message || ''));
function entradaHistorico(acao){
  return { quando: agora(), quem: usuarioAtual.nome, acao, ts: Date.now() };
}
/* Atualiza o registro na tela na hora e grava no banco (o cache local do Firestore garante o envio mesmo offline) */
function salvarDespesa(d, campos, acaoHist){
  const dados = { ...campos, atualizadoEm: Date.now() };
  Object.assign(d, campos);
  if(acaoHist){
    const h = entradaHistorico(acaoHist);
    (d.historico = d.historico || []).push(h);
    dados.historico = RofeDB.fv.arrayUnion(h);
  }
  return gravar(RofeDB.upd('despesas', d.id, dados), 'Não foi possível salvar o registro #' + d.id + '.');

function salvarViagem(v, campos){

/* Novo registro: número sequencial (#N) + fotos em documentos próprios, tudo numa gravação única */
async function criarDespesaNoBanco(dados, fotosC){
  const n = await RofeDB.proximoNumero('despesas');
  const fotoIds = fotosC.map(() => RofeDB.novoId('fotos'));
  const registro = { ...dados, id: n, fotoIds, fotoHashes: fotosC.map(f => f.hash), fotos: fotosC.length, atualizadoEm: Date.now() };
  const ops = fotosC.map((f, i) => ({ tipo: 'set', col: 'fotos', id: fotoIds[i],
    dados: { despesaId: n, motoristaId: dados.motoristaId, dataUrl: f.url, hash: f.hash, tsLocal: Date.now() } }));
  ops.push({ tipo: 'set', col: 'despesas', id: n, dados: registro });
  fotosC.forEach((f, i) => fotoCache.set(fotoIds[i], f.url));
  gravar(RofeDB.lote(ops), 'Não foi possível gravar o registro #' + n + '.');   /* não espera o servidor: o cache local garante */
  auditar('Criou registro #' + n, dados.descricao);
  avisar(contadorId(), 'registros');
  return n;
}

/* ---- leitura ---- */
function normDespesa(x){
  const d = { ...x };
  delete d._id;
  d.id = Number(d.id ?? x._id);
  d.valor = Number(d.valor) || 0;
  d.desconto = Number(d.desconto) || 0;
  d.litros = Number(d.litros) || 0;
  const porTs = (a, b) => (a.ts || 0) - (b.ts || 0);
  d.historico = Array.isArray(d.historico) ? d.historico.slice().sort(porTs) : [];
  d.comentarios = Array.isArray(d.comentarios) ? d.comentarios.slice().sort(porTs) : [];
  d.fotoIds = Array.isArray(d.fotoIds) ? d.fotoIds : [];
  d.fotos = d.fotos ?? d.fotoIds.length;
  return d;
}
function normViagem(x){
  const v = { ...x };
  delete v._id;
  v.id = Number(v.id ?? x._id);
  return v;
}
async function carregarImagens(d){
  const ids = d.fotoIds || [];
  if(!ids.length) return (d.imagens || []).slice();
  return Promise.all(ids.map(async id => {
    if(fotoCache.has(id)) return fotoCache.get(id);
    try {
      const f = await RofeDB.get('fotos', id);
      const url = (f && f.dataUrl) || '';
      if(url) fotoCache.set(id, url);
      return url;
    } catch(e){ console.error(e); return ''; }
  }));
}
/* Compacta a foto para caber no banco (máx. ~750 KB) */
function compactarFoto(src){
  if(ehPdf(src)) return Promise.resolve({ url: src, hash: hashImg(src) });   /* PDF vai como está (tamanho já conferido) */
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      let lado = 1400, q = 0.72, url = '';
      for(let i = 0; i < 6; i++){
        const k = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL('image/jpeg', q);
        if(url.length <= LIMITE_FOTO) break;
        lado = Math.round(lado * 0.8); q = Math.max(0.5, q - 0.06);
      }
      ok({ url, hash: hashImg(url) });
    };
    img.onerror = () => falha(new Error('foto inválida'));
    img.src = src;
  });
}

/* ---- escutas ---- */
function iniciarSincronizacao(){
  pararSincronizacao();
  if(!window.RofeDB || !usuarioAtual) return;
  const adm = ehEquipe(), meu = usuarioAtual.id;   /* "adm" aqui = equipe (contador ou operador): enxerga todos os motoristas */
  const precisa = ehAdmin() ? ['despesas', 'viagens', 'avisos', 'config', 'usuarios', 'auditoria', 'solicitacoes', 'eventos']
    : adm ? ['despesas', 'viagens', 'avisos', 'config', 'usuarios', 'solicitacoes', 'eventos']
    : ['despesas', 'viagens', 'avisos', 'config', 'notificacoes', 'solicitacoes', 'eventos'];
  const pronto = nome => {
    Sync.pronto[nome] = true;
    if(!Sync.carregado && precisa.every(n => Sync.pronto[n])){ Sync.carregado = true; atualizarIndicadorSync(); agendarAtualizacaoTela(); }
  };
  /* Escuta que se reconecta sozinha: uma falha momentânea (celular em segundo plano, rede caindo)
     não derruba mais o tempo real. Só avisa se a falha se repetir. */
  const ouvir = (nome, spec, cb) => {
    let tentativas = 0, parar = null, timer = null, ativa = true;
    const ligar = () => {
      try {
        parar = RofeDB.ouvir(spec, (docs, mud, prim) => {
          if(tentativas){ tentativas = 0; Sync.falhas.delete(nome); atualizarBannerSync(); }
          try { cb(docs, mud, prim); } catch(e){ console.error(e); }
          pronto(nome);
        }, err => falhou(err));
      } catch(err){ falhou(err); }
    };
    const falhou = err => {
      const cod = (err && err.code) || 'desconhecido';
      console.error('[sincronização] "' + nome + '" falhou (' + cod + '):', err && err.message);
      pronto(nome);
      if(!ativa) return;
      tentativas++;
      Sync.falhas.set(nome, { cod, tentativas, msg: (err && err.message) || '' });
      atualizarBannerSync();
      const espera = Math.min(30000, 1500 * Math.pow(2, tentativas - 1));
      clearTimeout(timer);
      timer = setTimeout(() => { if(ativa && usuarioAtual) ligar(); }, cod === 'permission-denied' ? Math.max(espera, 15000) : espera);
    };
    ligar();
    Sync.escutas.push(() => { ativa = false; clearTimeout(timer); try { parar && parar(); } catch(e){} });
  };

  ouvir('despesas', adm ? { col: 'despesas' } : { col: 'despesas', where: [['motoristaId', '==', meu]] }, (docs, mud, prim) => {
    const antes = new Map(despesas.map(d => [d.id, (d.comentarios || []).length]));
    despesas = docs.map(normDespesa).sort((a, b) => a.id - b.id);
    if(!prim) avisarMudancasRemotas('despesas', mud, antes);
    atualizarModalAberto();
    agendarAtualizacaoTela();
  });
  ouvir('viagens', adm ? { col: 'viagens' } : { col: 'viagens', where: [['motoristaId', '==', meu]] }, (docs, mud, prim) => {
    viagens = docs.map(normViagem).sort((a, b) => a.id - b.id);
    if(!prim) avisarMudancasRemotas('viagens', mud);
    agendarAtualizacaoTela();
  });
  ouvir('avisos', { doc: ['avisos', minhaChaveAvisos()] }, docs => {
    const dados = docs[0] || {};
    avisos = {};
    Object.keys(dados).forEach(k => { if(typeof dados[k] === 'number') avisos[k] = dados[k]; });
    if(avisos[rotaAtual] > 0) limparAviso(rotaAtual);
    atualizarMenuAvisos(); atualizarSino();
  });
  ouvir('config', { doc: ['config', 'contador'] }, docs => {
    const c = docs[0];
    const alvo = USUARIOS.find(u => u.perfil === 'admin');
    if(!c || !alvo || alvo === usuarioAtual) return;
    if(c.nome) alvo.nome = c.nome;
    alvo.telefone = c.telefone || ''; alvo.email = c.email || '';
    agendarAtualizacaoTela();
  });
  /* pedidos de orçamento e eventos de acompanhamento (status, localização, ocorrências) */
  ouvir('solicitacoes', adm ? { col: 'solicitacoes', orderBy: ['criadoEm', 'desc'], limit: 300 } : { col: 'solicitacoes', where: [['motoristaId', '==', meu]] }, (docs, mud, prim) => {
    solicitacoes = docs.map(x => ({ ...x, id: x._id })).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
    if(!prim) avisarMudancasAcompanhamento('solicitacoes', mud);
    agendarAtualizacaoTela();
  });
  ouvir('eventos', adm ? { col: 'eventos', orderBy: ['ts', 'desc'], limit: 500 } : { col: 'eventos', where: [['motoristaId', '==', meu]] }, (docs, mud, prim) => {
    eventos = docs.map(x => ({ ...x, id: x._id })).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    if(!prim) avisarMudancasAcompanhamento('eventos', mud);
    agendarAtualizacaoTela();
  });
  if(adm){
    ouvir('usuarios', ehAdmin() ? { col: 'usuarios', where: [['perfil', 'in', ['motorista', 'operador']]] } : { col: 'usuarios', where: [['perfil', '==', 'motorista']] }, (docs, mud, prim) => {
      mesclarMotoristas(docs.map(d => ({ uid: d._id, ...d })));
      if(ehAdmin()) mud.filter(c => c.tipo === 'added' && !c.local && c.dados.cadastroStatus === 'pendente' && !prim)
        .forEach(c => mostrarMensagem('Novo cadastro de motorista: ' + c.dados.nome + '. Aprove em Cadastros → Motoristas.'));
      atualizarMenuAvisos();
      agendarAtualizacaoTela();
    });
  }
  if(ehAdmin()){
    ouvir('auditoria', { col: 'auditoria', orderBy: ['tsLocal', 'desc'], limit: 500 }, docs => {
      auditoria = docs.map(a => { const x = { ...a }; delete x._id; return x; }).reverse();
      if(rotaAtual === 'auditoria') agendarAtualizacaoTela();
    });
  }
  if(!adm){
    ouvir('notificacoes', { col: 'notificacoes', where: [['para', '==', meu], ['lida', '==', false]] }, docs => {
      if(!docs.length) return;
      docs.sort((a, b) => (a.tsLocal || 0) - (b.tsLocal || 0)).forEach((n, i) => setTimeout(() => mostrarMensagem(n.texto), i * 450));
      try { if(navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch(e){}
      gravar(RofeDB.lote(docs.map(n => ({ tipo: 'upd', col: 'notificacoes', id: n._id, dados: { lida: true } }))));
    });
  }
  atualizarIndicadorSync();
}
function pararSincronizacao(){
  Sync.falhas.clear(); atualizarBannerSync();
  Sync.escutas.forEach(parar => { try { parar(); } catch(e){} });
  Sync.escutas = []; Sync.pronto = {}; Sync.carregado = false; Sync.erroAvisado = false;
  Sync.recentes.clear(); Sync.promovidas.clear();

/* Mudanças feitas por OUTRO usuário: aviso discreto + destaque da linha */
function avisarMudancasRemotas(col, mud, comentAntes){
  const remotas = mud.filter(c => !c.local && c.tipo !== 'removed');
  if(!remotas.length) return;
  const t = Date.now();
  remotas.forEach(c => Sync.recentes.set(col + ':' + Number(c.dados.id ?? c.id), t));
  if(col !== 'despesas' || !ehAdmin()) return;
  const novos = remotas.filter(c => c.tipo === 'added');
  if(novos.length > 3) mostrarMensagem(novos.length + ' novos registros recebidos.');
  else novos.forEach(c => mostrarMensagem('Novo registro #' + c.dados.id + ' — ' + nomeMotorista(c.dados.motoristaId) + ' · ' + fmtBRL(Number(c.dados.valor) || 0)));
  remotas.filter(c => c.tipo === 'modified').forEach(c => {
    const msgs = c.dados.comentarios || [];
    const ant = comentAntes && comentAntes.get(Number(c.dados.id));
    const ult = msgs.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).pop();
    if(ant != null && msgs.length > ant && ult && ult.autorId !== usuarioAtual.id)
      mostrarMensagem('Mensagem de ' + ult.autor.split(' ')[0] + ' no registro #' + c.dados.id + ': ' + String(ult.texto).slice(0, 60));
  });
}

/* ---- falhas de conexão: faixa discreta com diagnóstico (em vez de erro vermelho) ---- */
function atualizarBannerSync(){
  let el = document.getElementById('banner-sync');
  const lista = [...Sync.falhas.entries()].filter(([, f]) => f.tentativas >= (f.cod === 'permission-denied' ? 2 : 3));
  if(!lista.length || !usuarioAtual){ if(el) el.remove(); atualizarIndicadorSync(); return; }
  const semPermissao = lista.filter(([, f]) => f.cod === 'permission-denied').map(([n]) => n);
  const travou = lista.some(([, f]) => f.cod === 'failed-precondition' || f.cod === 'internal');
  /* travou o cache local deste aparelho: na próxima abertura usa o modo sem cache, que é mais estável */
  if(travou){ try { localStorage.setItem('rofe_cache_memoria', '1'); } catch(e){} }
  if(!el){
    el = document.createElement('div');
    el.id = 'banner-sync'; el.className = 'banner-sync'; el.setAttribute('role', 'status');
    document.getElementById('tela-app').insertBefore(el, document.querySelector('#tela-app .corpo'));
  }
  el.innerHTML = semPermissao.length
    ? `${icon('alert')}<span><strong>Sem permissão no banco</strong> para: ${semPermissao.map(esc).join(', ')}. Confira se as regras <strong>v40</strong> foram publicadas no projeto ROFE-FINANCE (Firestore → Regras).</span><button type="button" class="btn btn-pequeno btn-contorno" data-recarregar>Recarregar</button>`
    : `${icon('refresh')}<span><strong>Conexão em tempo real instável.</strong> Reconectando sozinho${travou ? '. Se não voltar, toque em Recarregar (o sistema passa a usar um modo mais estável neste aparelho)' : ''}. <span class="mini">(${lista.map(([n, f]) => esc(n) + ': ' + esc(f.cod)).join(', ')})</span></span><button type="button" class="btn btn-pequeno btn-contorno" data-recarregar>Recarregar</button>`;
  el.querySelector('[data-recarregar]').onclick = () => location.reload();
  atualizarIndicadorSync();
}
