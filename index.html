<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROFE Distribuidora — Prestação de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul-900:#0B2A4A; --azul-700:#0E4FA0; --azul:#1565C0; --azul-claro:#E3EEFB;
  --vermelho:#D32F2F; --vermelho-claro:#FDECEC; --verde:#1E7B3A; --verde-claro:#E6F4EA;
  --branco:#FFFFFF; --cinza:#F4F6F9; --cinza-borda:#E6ECF2; --texto-suave:#5B6B7F;
  --raio:18px; --sombra:0 12px 30px rgba(11,42,74,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--cinza);color:var(--azul-900);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.oculto{display:none!important}

/* ===== Login ===== */
#tela-login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-marca{background:linear-gradient(160deg,var(--azul-900),var(--azul-700) 60%,var(--azul));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-marca::before{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06)}
.login-marca::after{content:"";position:absolute;right:40px;bottom:-170px;width:320px;height:320px;border-radius:50%;background:rgba(211,47,47,.18)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:1.5px;position:relative;z-index:1}
.login-texto{position:relative;z-index:1;max-width:520px}
.login-texto h1{font-size:50px;line-height:1.08;margin:0 0 20px;font-weight:800;letter-spacing:-1px}
.login-texto h1 span{color:#FF7A7A}
.login-texto p{color:rgba(255,255,255,.8);font-size:17px;margin:0}
.login-stats{display:flex;gap:36px;position:relative;z-index:1}
.login-stats strong{display:block;font-size:28px}
.login-stats span{font-size:13px;color:rgba(255,255,255,.7)}
.login-form-area{display:grid;place-items:center;padding:40px 24px}
.card-login{width:100%;max-width:420px;background:var(--branco);border-radius:24px;padding:44px 40px;box-shadow:0 24px 60px rgba(11,42,74,.12)}
.card-login h2{margin:0 0 6px;font-size:26px}
.card-login .sub{color:var(--texto-suave);margin:0 0 28px}
.campo{margin-bottom:18px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.campo input,.campo select,.campo textarea{width:100%;height:50px;border:1.5px solid #D5DEE8;border-radius:12px;padding:0 15px;background:#F9FBFD;color:var(--azul-900)}
.campo textarea{height:auto;min-height:90px;padding:12px 15px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(21,101,192,.15)}
.campo-senha{position:relative}
.campo-senha input{padding-right:48px}
.btn-olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:#7A8899}
.btn-olho:hover{color:var(--azul);background:rgba(21,101,192,.08)}
.btn-olho:focus-visible{outline:2px solid var(--azul)}
.btn-olho svg{width:20px;height:20px;display:block}
.btn{height:54px;border:0;border-radius:14px;padding:0 22px;font-weight:700;font-size:15px;letter-spacing:.3px;transition:transform .08s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primario{background:linear-gradient(90deg,var(--azul),var(--azul-700));color:#fff;box-shadow:0 10px 24px rgba(21,101,192,.32)}
.btn-vermelho{background:var(--vermelho);color:#fff;box-shadow:0 10px 22px rgba(211,47,47,.28)}
.btn-contorno{background:var(--branco);color:var(--azul);border:1.5px solid var(--azul)}
.btn-bloco{width:100%}
.btn-pequeno{height:40px;font-size:13px;padding:0 14px;border-radius:10px}
.erro{background:var(--vermelho-claro);color:var(--vermelho);padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}
.rodape-login{margin-top:22px;text-align:center;font-size:12px;color:#7A8899}
/* ===== v40: acompanhamento, orçamentos, área do motorista ===== */
.card.amarelo{border-left:4px solid #E0A100}
.st-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.2}
.st-chip .ico{width:15px;height:15px}
.st-verde.st-chip{background:var(--verde-claro);color:var(--verde)}
.st-amarelo.st-chip{background:#FFF4D6;color:#8A6200}
.st-azul.st-chip{background:var(--azul-claro);color:var(--azul)}
.st-vermelho.st-chip{background:var(--vermelho-claro);color:var(--vermelho)}
.st-tempo{margin-top:4px}
.st-atrasado{color:#B26A00;font-weight:700}
.st-atrasado .ico{width:13px;height:13px;vertical-align:-2px}
.modal-status{max-width:560px}
.st-opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-op{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border-radius:14px;border:2px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);text-align:left;cursor:pointer;font:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.st-op .ico{width:26px;height:26px;margin-bottom:4px}
.st-op strong{font-size:15px}.st-op span{font-size:12px;color:var(--texto-suave)}
.st-op:hover{transform:translateY(-2px)}
.st-op.st-verde .ico{color:var(--verde)}.st-op.st-amarelo .ico{color:#E0A100}.st-op.st-azul .ico{color:var(--azul)}.st-op.st-vermelho .ico{color:var(--vermelho)}
.st-op.sel{box-shadow:0 6px 18px rgba(11,42,74,.12)}
.st-op.st-verde.sel{border-color:var(--verde)}.st-op.st-amarelo.sel{border-color:#E0A100}.st-op.st-azul.sel{border-color:var(--azul)}.st-op.st-vermelho.sel{border-color:var(--vermelho)}
.st-detalhe{margin-top:14px}
.st-local{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-weight:600;cursor:pointer}
.st-local input{width:18px;height:18px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl-item{display:flex;gap:12px;padding:0 0 16px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--cinza-borda)}
.tl-ico{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--azul-claro);color:var(--azul)}
.tl-ico .ico{width:16px;height:16px}
.tl-item.st-verde .tl-ico{background:var(--verde-claro);color:var(--verde)}
.tl-item.st-amarelo .tl-ico{background:#FFF4D6;color:#8A6200}
.tl-item.st-vermelho .tl-ico{background:var(--vermelho-claro);color:var(--vermelho)}
.tl-obs{margin-top:4px;padding:8px 10px;border-radius:10px;background:var(--cinza);font-size:13px}
.tl-ok{background:var(--verde-claro)}
.tl-quem{font-size:12px;color:var(--texto-suave);font-weight:700}
.tl a .ico{width:12px;height:12px;vertical-align:-1px}
.acomp-bloco{margin:10px 0 6px;padding:14px;border-radius:14px;background:var(--cinza)}
.acomp-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.acomp-alerta{margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--vermelho);font-weight:700;font-size:13.5px}
.mon-grade{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.mon-grade > .painel-bloco{margin:0}
.mon-mapa{height:360px;border-radius:14px;overflow:hidden;background:var(--cinza);position:relative;z-index:0;isolation:isolate}
/* o mapa (Leaflet usa z-index 400–1000) fica sempre atrás de janelas e menus */
.mon-mapa-canvas,.leaflet-container{position:relative;z-index:0;isolation:isolate}
.mon-mapa-canvas{width:100%;height:100%}
.mon-quadro{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.mon-card{border:1px solid var(--cinza-borda);border-left:4px solid var(--verde);border-radius:14px;padding:14px;background:var(--branco)}
.mon-card.mon-atraso{border-left-color:#E0A100;background:#FFFBF0}
.mon-card.mon-alerta{border-left-color:var(--vermelho);background:#FFF7F7}
.mon-card-topo{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mon-rota{font-weight:800;font-size:16px;margin:4px 0 8px}
.mon-ocorrencias{border-left:4px solid var(--vermelho)}
.mon-ocorrencias h2{display:flex;align-items:center;gap:8px;color:var(--vermelho)}
.mon-oc{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--cinza-borda)}
.abas-filtro{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.abas-filtro button{border:1.5px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);padding:8px 16px;border-radius:999px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.abas-filtro button.ativo{background:var(--azul);border-color:var(--azul);color:#fff}
.linha-urgente td{background:#FFF7F7}
.orc-resumo{margin:12px 0 14px;padding:12px 14px;border-radius:12px;background:var(--cinza)}
/* Área do motorista */
.mot-saudacao h1{margin:0;font-size:26px}
.mot-saudacao p{margin:2px 0 18px;color:var(--texto-suave);text-transform:capitalize}
.mot-viagem{background:linear-gradient(150deg,var(--azul-900),var(--azul-700));color:#fff;border-radius:22px;padding:20px;box-shadow:var(--sombra);margin-bottom:18px}
.mot-viagem .status-vivo{color:#7BE0A0}
.mot-viagem.vazia{background:var(--branco);color:var(--azul-900)}
.mot-viagem.vazia p{margin:6px 0 0;color:var(--texto-suave)}
.mot-viagem-topo{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;opacity:.95}
.mot-rota{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:22px;font-weight:800;margin:10px 0 4px}
.mot-rota .ico{width:22px;height:22px;opacity:.7}
.mot-info{font-size:13.5px;opacity:.85;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mot-info .ico{width:15px;height:15px}
.mot-status{margin:14px 0 12px}
.mot-status .st-tempo,.mot-status .st-tempo a{color:rgba(255,255,255,.85)}
.mot-status .st-atrasado{color:#FFD27A}
.mot-pedido{display:flex;gap:8px;align-items:center;background:rgba(255,196,107,.18);border:1px solid rgba(255,196,107,.5);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:13.5px}
.mot-pedido .ico{width:16px;height:16px}
.mot-btn-status{background:#fff;color:var(--azul-900);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.mot-acoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.mot-acao{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-radius:18px;border:1px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);text-decoration:none;text-align:left;font:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(11,42,74,.05);transition:transform .15s,box-shadow .15s}
.mot-acao:hover{transform:translateY(-3px);box-shadow:var(--sombra)}
.mot-acao .ico{width:28px;height:28px;color:var(--azul);margin-bottom:6px}
.mot-acao strong{font-size:15px}.mot-acao span{font-size:12.5px;color:var(--texto-suave)}
.mot-acao.mot-principal{background:var(--azul);border-color:var(--azul);color:#fff}
.mot-acao.mot-principal .ico,.mot-acao.mot-principal span{color:#fff}
.mot-acao.mot-perigo .ico{color:var(--vermelho)}
.mot-grade{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.mot-grade > .painel-bloco{margin:0 0 18px}
[data-tema="escuro"] .mot-acao,[data-tema="escuro"] .st-op,[data-tema="escuro"] .mon-card,[data-tema="escuro"] .mot-viagem.vazia,[data-tema="escuro"] .abas-filtro button:not(.ativo){background:#172339;border-color:#24324A;color:#E6EDF7}
[data-tema="escuro"] .acomp-bloco,[data-tema="escuro"] .tl-obs,[data-tema="escuro"] .orc-resumo{background:#1B2A42}
[data-tema="escuro"] .mon-card.mon-atraso{background:#2A2614}[data-tema="escuro"] .mon-card.mon-alerta{background:#2E1A1D}
[data-tema="escuro"] .linha-urgente td{background:#2E1A1D}
@media (max-width:980px){.mon-grade,.mot-grade{grid-template-columns:1fr}}
@media (max-width:820px){
  .mot-saudacao h1{font-size:22px}
  .mot-viagem{border-radius:18px;padding:18px;margin-left:-4px;margin-right:-4px}
  .mot-rota{font-size:19px}
  .mot-acoes{grid-template-columns:1fr 1fr;gap:10px}
  .mot-acao{padding:14px;border-radius:16px}
  .mot-acao.mot-principal{grid-column:1 / -1;flex-direction:row;align-items:center;gap:12px}
  .mot-acao.mot-principal .ico{margin:0}
  .mon-mapa{height:280px}
  .st-op{padding:12px}
  /* barra inferior do motorista: botão central de novo registro */
  body[data-perfil="motorista"] .menu-mobile{overflow:visible;gap:2px}
  body[data-perfil="motorista"] .menu-mobile button{flex:1 1 0;min-width:0;padding:6px 2px;font-size:11px}
  body[data-perfil="motorista"] .menu-mobile button[data-rota="novo"]{background:var(--azul);color:#fff;border-radius:18px;transform:translateY(-12px);box-shadow:0 8px 20px rgba(21,101,192,.35);padding:10px 14px}
  body[data-perfil="motorista"] .menu-mobile button[data-rota="novo"].ativo{background:var(--azul-700);color:#fff}
  /* login no celular: marca compacta, formulário em destaque */
  .login-marca{padding:26px 22px 54px}
  .login-texto h1{font-size:26px;margin:14px 0 0}
  .login-texto p,.login-stats{display:none}
  .login-form-area{padding:0 14px 28px;margin-top:-34px;position:relative;z-index:2}
  .card-login{padding:28px 22px;border-radius:22px}
  .card-login .campo input{height:54px;font-size:16px}
  .card-login .btn-primario{min-height:54px;font-size:16px}
}
/* ===== v40.1: menu lateral em grupos + gaveta no celular ===== */
.menu-lateral{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;gap:3px;transition:width .25s ease,flex-basis .25s ease;flex:0 0 240px}
.conteudo{min-width:0}
.menu-lateral .m-item,.menu-lateral .m-grupo-cab{width:100%}
.m-grupo{display:flex;flex-direction:column}
.menu-lateral .m-grupo-cab{color:rgba(255,255,255,.72)}
.m-grupo.contem-ativo > .m-grupo-cab{color:#fff}
.m-seta{margin-left:auto;display:grid;place-items:center;transition:transform .25s}
.m-seta .ico{width:16px;height:16px}
.m-grupo.aberto .m-seta{transform:rotate(180deg)}
.m-sub{display:none;flex-direction:column;gap:2px;margin:2px 0 8px 22px;padding-left:10px;border-left:1px solid rgba(255,255,255,.14)}
.m-grupo.aberto .m-sub{display:flex}
.menu-lateral .m-sub-item{padding:9px 12px;font-size:13.5px;width:100%}
.menu-lateral .m-sub-item .ico-wrap{width:28px;height:28px}
.menu-lateral .m-sub-item .ico{width:16px;height:16px}
.m-grupo-cab{position:relative}
.m-grupo.tem-aviso:not(.aberto) > .m-grupo-cab::after{content:'';position:absolute;left:34px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--vermelho);box-shadow:0 0 0 2px var(--azul-900)}
.m-rodape{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
.menu-lateral .m-recolher{margin-top:8px;color:rgba(255,255,255,.5);font-size:12.5px;padding:8px 14px}
.m-recolher .ico{transform:rotate(90deg);transition:transform .25s}
body:not([data-perfil="motorista"]) .m-rodape + .m-recolher{margin-top:8px}
body[data-perfil="motorista"] .m-recolher{margin-top:auto}
/* menu recolhido (só ícones) */
body.menu-recolhido .menu-lateral{flex-basis:78px;width:78px;padding-left:12px;padding-right:12px}
body.menu-recolhido .m-rot,body.menu-recolhido .m-seta,body.menu-recolhido .menu-lateral .aviso-aba{display:none}
body.menu-recolhido .m-grupo-cab{display:none!important}
body.menu-recolhido .m-sub{display:flex;margin:6px 0;padding:6px 0 0;border-left:0;border-top:1px solid rgba(255,255,255,.12)}
body.menu-recolhido .menu-lateral button{justify-content:center;padding:10px 0}
body.menu-recolhido .m-recolher .ico{transform:rotate(-90deg)}
/* botão ☰ */
.btn-gaveta{display:none;flex-direction:column;justify-content:center;gap:4px;width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.12);padding:0 11px;cursor:pointer;flex-shrink:0}
.btn-gaveta span{display:block;height:2px;border-radius:2px;background:#fff;transition:transform .25s,opacity .2s}
body.gaveta-aberta .btn-gaveta span:nth-child(1){transform:translateY(6px) rotate(45deg)}
body.gaveta-aberta .btn-gaveta span:nth-child(2){opacity:0}
body.gaveta-aberta .btn-gaveta span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.gaveta-fundo{display:none}
@media (max-width:820px){
  body:not([data-perfil="motorista"]) .btn-gaveta{display:flex}
  body:not([data-perfil="motorista"]) .menu-lateral{display:flex;position:fixed;top:0;left:0;bottom:0;height:auto;width:min(84vw,300px);z-index:90;transform:translateX(-105%);transition:transform .28s ease;padding-top:22px;box-shadow:12px 0 40px rgba(5,15,30,.35)}
  body.gaveta-aberta .menu-lateral{transform:none}
  body.gaveta-aberta .gaveta-fundo{display:block;position:fixed;inset:0;background:rgba(5,15,30,.5);z-index:85;animation:fadeIn .2s}
  body:not([data-perfil="motorista"]) .menu-mobile{display:none}
  body:not([data-perfil="motorista"]) .conteudo{padding-bottom:40px}
  .menu-lateral .m-recolher{display:none}
  body.menu-recolhido .menu-lateral{width:min(84vw,300px);flex-basis:auto}
}
/* ===== v42.1: menu lateral com rolagem própria; tela de trás travada ===== */
.menu-lateral{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
@media (min-width:821px){
  .menu-lateral{top:var(--topo-h,72px);height:calc(100vh - var(--topo-h,72px));height:calc(100dvh - var(--topo-h,72px))}
}
body.rolagem-travada{position:fixed;left:0;right:0;width:100%;overflow:hidden}
@media (max-width:820px){
  body:not([data-perfil="motorista"]) .menu-lateral{align-self:auto;height:100vh;height:100dvh;max-height:100dvh;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .gaveta-fundo{touch-action:none}
  .menu-lateral button:hover{transform:none}
  .menu-lateral .m-grupo-cab:not(.ativo):hover{background:transparent}
}
@media (hover:none){
  .menu-lateral button:hover{transform:none}
  .menu-lateral button:not(.ativo):hover{background:transparent;color:rgba(255,255,255,.8)}
  .menu-lateral button:not(.ativo):hover .ico,.menu-lateral button:hover .ico-wrap{transform:none}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* cabeçalho no celular: ☰ + logo à esquerda, ícones à direita na mesma linha */
@media (max-width:820px){
  #tela-app .topo{column-gap:8px}
  #tela-app .btn-gaveta{order:0}
  #tela-app .topo .logo{order:1;margin-right:auto;min-width:0}
  #tela-app .topo-direita{order:2;gap:6px}
}
@media (max-width:440px){
  #tela-app .topo{padding-left:12px;padding-right:12px}
  #tela-app .topo .logo-img-topo{height:28px}
  #tela-app .topo .sair{font-size:0;padding:0 10px;min-width:40px;gap:0}
}
/* ===== v41: Central do gestor ===== */
.g-abas{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:6px;background:var(--branco);border-radius:16px;box-shadow:0 4px 14px rgba(11,42,74,.05)}
.g-abas button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--texto-suave);font:inherit;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:12px;cursor:pointer}
.g-abas button .ico{width:16px;height:16px}
.g-abas button:hover{background:var(--cinza)}
.g-abas button.ativo{background:var(--azul);color:#fff}
.g-cont{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--vermelho);color:#fff;font-size:11px;display:grid;place-items:center}
.g-pend{border-left:4px solid var(--azul)}
.g-pend.g-alta{border-left-color:var(--vermelho)}.g-pend.g-media{border-left-color:#E0A100}
.g-pend-topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.g-pend h2{margin:0;display:flex;align-items:center;gap:8px}
.g-qtd{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--cinza);font-size:13px;display:grid;place-items:center}
.g-alta .g-qtd{background:var(--vermelho);color:#fff}.g-media .g-qtd{background:#FFF4D6;color:#8A6200}
.g-lista{margin:10px 0 0;padding:0;list-style:none}
.g-lista li{padding:8px 0;border-top:1px solid var(--cinza-borda);font-size:13.5px}
.g-link{color:var(--azul);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.g-verm{color:var(--vermelho)}
.g-linha{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--cinza-borda)}
.g-total{font-size:15px}
.g-var{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--cinza);white-space:nowrap}
.g-sobe{background:var(--vermelho-claro);color:var(--vermelho)}.g-desce{background:var(--verde-claro);color:var(--verde)}
.g-barra-linha{display:grid;grid-template-columns:170px 1fr 190px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--cinza-borda);font-size:13.5px}
.g-barras{display:flex;flex-direction:column;gap:3px}
.g-barra{height:12px;border-radius:6px;background:var(--azul);min-width:2px;transition:width .4s}
.g-barra-ant{height:6px;background:#B9CCE6}
.g-barra-val{text-align:right}
.g-alerta{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:3px}
.g-grav1{background:var(--cinza);color:var(--texto-suave)}.g-grav2{background:#FFF4D6;color:#8A6200}.g-grav3{background:var(--vermelho-claro);color:var(--vermelho)}
.g-feed{list-style:none;margin:0;padding:0}
.g-feed li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--cinza-borda);font-size:13.5px}
.g-feed li:first-child{border-top:0}
.g-hora{font-weight:800;color:var(--azul)}
.g-feed-status .g-hora{color:var(--verde)}
.g-check{list-style:none;margin:6px 0 0;padding:0}
.g-check li{padding:7px 0;font-weight:700}
.g-check li.ok{color:var(--verde)}.g-check li.pend{color:#B26A00}
.g-fech-ok{border-left:4px solid var(--verde)}.g-fech-pend{border-left:4px solid #E0A100}
.g-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;margin:0 0 18px;border-radius:16px;background:#FFF4D6;color:#6B4C00;cursor:pointer;transition:transform .15s}
.g-banner:hover{transform:translateY(-2px)}
.g-banner .ico{width:22px;height:22px;flex-shrink:0}
.g-banner > .ico:last-child{margin-left:auto;transform:rotate(-90deg)}
.g-banner-alta{background:var(--vermelho-claro);color:var(--vermelho)}
.g-banner-ok{background:var(--verde-claro);color:var(--verde)}
[data-tema="escuro"] .g-abas{background:#172339}
[data-tema="escuro"] .g-abas button:hover,[data-tema="escuro"] .g-qtd,[data-tema="escuro"] .g-var{background:#1B2A42}
@media (max-width:820px){
  .g-abas{flex-wrap:nowrap;overflow-x:auto}
  .g-abas button{flex:0 0 auto}
  .g-barra-linha{grid-template-columns:1fr;gap:4px}
  .g-barra-val{text-align:left}
}
/* ===== v41: frota com UF em destaque ===== */
.uf-badge{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 7px;border-radius:7px;font-size:11.5px;font-weight:900;letter-spacing:.6px;color:#fff;vertical-align:middle;box-shadow:0 2px 6px rgba(11,42,74,.18)}
.uf-MA{background:linear-gradient(135deg,#1565C0,#0B2A4A)}
.uf-PA{background:linear-gradient(135deg,#1E9E52,#13693A)}
.uf-TO{background:linear-gradient(135deg,#F2A51A,#C77700)}
.cam-base{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tag-posse{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.tag-posse.particular{background:var(--azul-claro);color:var(--azul)}
.tag-posse.aluguel{background:#FFF4D6;color:#8A6200}
.cam-ufs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:0 0 14px}
.cam-uf-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:var(--branco);box-shadow:0 4px 14px rgba(11,42,74,.06);cursor:pointer;font:inherit;color:var(--azul-900);text-align:left;transition:transform .15s,border-color .15s}
.cam-uf-card:hover{transform:translateY(-2px)}
.cam-uf-card.ativo{border-color:var(--azul)}
.cam-uf-card .uf-badge{min-width:46px;height:34px;font-size:16px;border-radius:10px}
.cam-uf-card strong{display:block;font-size:15px}.cam-uf-card div span{font-size:12.5px;color:var(--texto-suave)}
.cam-uf-card .uf-badge{color:#fff}
[data-tema="escuro"] .cam-uf-card{background:#172339;color:#E6EDF7}
.link-esqueci{display:block;margin:14px auto 0;background:none;border:0;color:var(--azul);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link-esqueci:hover{opacity:.8}
.ok-msg{background:#E7F5EC;color:#1B5E20;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;margin-bottom:14px}
.primeiro-acesso{margin-top:18px;padding-top:16px;border-top:1px dashed var(--cinza-borda);display:grid;gap:8px;text-align:center}
.forca{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.forca span{height:5px;border-radius:9px;background:var(--cinza-borda);transition:background .25s}
.forca .n1{background:var(--vermelho)}.forca .n2{background:#E0A100}.forca .n3,.forca .n4{background:var(--verde)}

/* ===== Layout interno ===== */
#tela-app{min-height:100%}
.topo{background:linear-gradient(160deg,var(--azul-900),var(--azul));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topo .logo{font-size:14px}
.topo-direita{display:flex;align-items:center;gap:14px}
.usuario-badge{display:flex;align-items:center;gap:10px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:13px}
.sair{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600}
.corpo{display:flex;min-height:calc(100vh - 70px)}
.menu-lateral{width:240px;background:var(--azul-900);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.menu-lateral button{background:transparent;border:0;color:rgba(255,255,255,.8);text-align:left;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.menu-lateral button.ativo,.menu-lateral button:hover{background:var(--azul);color:#fff}
.conteudo{flex:1;padding:28px 32px;min-width:0}
.cabecalho-pagina{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cabecalho-pagina h1{margin:0;font-size:26px}
.cabecalho-pagina p{margin:4px 0 0;color:var(--texto-suave)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--branco);border-radius:var(--raio);padding:20px;box-shadow:var(--sombra)}
.card .rotulo{font-size:13px;color:var(--texto-suave)}
.card .valor{font-size:26px;font-weight:800;margin-top:6px}
.card.azul{border-left:4px solid var(--azul)}
.card.vermelho{border-left:4px solid var(--vermelho)}
.card.verde{border-left:4px solid var(--verde)}
.painel-bloco{background:var(--branco);border-radius:var(--raio);padding:22px;box-shadow:var(--sombra);margin-bottom:22px}
.painel-bloco h2{margin:0 0 14px;font-size:17px}
.acoes-rapidas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tabela-wrap{overflow-x:auto;background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--texto-suave);font-size:12px;letter-spacing:.5px;padding:14px 12px;background:#FAFBFD;font-weight:600;white-space:nowrap}
td{padding:14px 12px;border-top:1px solid var(--cinza-borda);vertical-align:middle}
td.num{white-space:nowrap;font-weight:600}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.aguardando{background:var(--azul-claro);color:var(--azul)}
.tag.aprovado{background:var(--verde-claro);color:var(--verde)}
.tag.rejeitado{background:var(--vermelho-claro);color:var(--vermelho)}
.filtros{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.filtros input,.filtros select{height:42px;border:1.5px solid #D5DEE8;border-radius:12px;padding:0 14px;background:var(--branco);min-width:160px}
.vazio{padding:32px;text-align:center;color:var(--texto-suave)}
.grade-form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grade-form .inteiro{grid-column:1/-1}
.aviso-demo{font-size:12px;color:var(--texto-suave);margin-top:14px}
.mini{font-size:13px;color:var(--texto-suave)}
.linha-acoes{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Ícones e animações ===== */
.ico{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.ico-wrap{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.08);flex-shrink:0;transition:background .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.menu-lateral button{display:flex;align-items:center;gap:12px;transition:background .25s,transform .3s cubic-bezier(.34,1.56,.64,1),color .2s}
.menu-lateral button:hover{transform:translateX(5px)}
.menu-lateral button:active{transform:scale(.97)}
.menu-lateral button:hover .ico,.menu-lateral button.ativo .ico{transform:scale(1.15) rotate(-8deg)}
.menu-lateral button:hover .ico-wrap{background:rgba(255,255,255,.2);transform:rotate(-4deg)}
.menu-mobile button{transition:background .25s,color .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.menu-mobile button:hover .ico{transform:translateY(-3px) scale(1.12)}
.menu-mobile button:active{transform:scale(.92)}
.menu-mobile button.ativo .ico{animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.card{transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px rgba(11,42,74,.16)}
.card .rotulo{display:flex;align-items:center;gap:10px}
.ico-card{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--azul-claro);color:var(--azul);flex-shrink:0;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,color .3s}
.ico-card .ico{width:17px;height:17px}
.card:hover .ico-card{transform:rotate(-10deg) scale(1.12);background:var(--azul);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,box-shadow .25s,filter .25s}
.btn .ico{width:18px;height:18px}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 28px rgba(11,42,74,.18)}
.btn:hover .ico{transform:translateX(3px) rotate(-6deg)}
.sair{display:inline-flex;align-items:center;gap:8px;transition:background .25s,transform .25s}
.sair .ico{width:17px;height:17px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sair:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.sair:hover .ico{transform:translateX(3px)}
.logo-img{height:74px;width:auto;display:block;transition:transform .45s cubic-bezier(.34,1.56,.64,1),filter .3s}
.logo-img-topo{height:50px}
.logo:hover .logo-img{transform:scale(1.06) rotate(-2deg)}
.avatar{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.avatar:hover{transform:scale(1.12)}
tbody tr{transition:background .2s}
tbody tr:hover{background:#F7FAFE}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.linha-clicavel{cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(11,42,74,.45);display:flex;z-index:60;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay>.modal{margin:auto}
.modal{background:var(--branco);border-radius:20px;padding:26px;width:100%;max-width:520px;box-shadow:0 30px 60px rgba(11,42,74,.25)}
.modal-topo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dados{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;margin:18px 0 0}
.dados dt{color:var(--texto-suave);font-size:13px}
.dados dd{margin:0;font-weight:600}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.galeria img{width:100%;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--cinza-borda);cursor:zoom-in;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.galeria img:hover{transform:scale(1.05);box-shadow:0 12px 24px rgba(11,42,74,.18)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:70;cursor:zoom-out;padding:20px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:14px}

.fotos-botoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grade-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.foto-item{background:var(--branco);border:1px solid var(--cinza-borda);border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(11,42,74,.06)}
.foto-item img{width:100%;height:120px;object-fit:cover;display:block}
.foto-acoes{display:flex;gap:6px;padding:8px}
.foto-acoes .btn{flex:1;height:34px;font-size:12px;padding:0 8px}
.modal-editor{max-width:680px;max-height:92vh;overflow:auto}
.previa{display:grid;place-items:center;background:var(--azul-900);border-radius:14px;padding:10px;margin:14px 0;min-height:200px}
.previa canvas{max-width:100%;max-height:50vh;width:auto;height:auto;border-radius:8px}
.ferramentas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.controles{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.controles label{display:grid;gap:4px;font-size:13px;font-weight:600}
.controles input[type=range]{width:100%;accent-color:var(--azul)}
.rodape-editor{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
@media (max-width:820px){.controles{grid-template-columns:1fr}}

.sino{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,transform .25s}
.sino:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.sino .ico{width:20px;height:20px;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sino:hover .ico{transform:rotate(-14deg) scale(1.1)}
.sino-n{position:absolute;top:-5px;right:-5px;background:var(--vermelho);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--azul-900)}
.sino-n[hidden]{display:none}
.ordenavel{cursor:pointer;user-select:none;white-space:nowrap}
.ordenavel:hover{color:var(--azul)}
.paginacao{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.grade-graficos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.grade-graficos canvas{max-height:260px}
@media (max-width:820px){
  .grade-graficos{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}
  .cabecalho-pagina{flex-direction:column;align-items:flex-start}
  .filtros input,.filtros select{min-width:0;flex:1 1 140px}
}

.avatar{border:0;padding:0;cursor:pointer;color:#fff;font-family:inherit;font-weight:700;font-size:13px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar:focus-visible{outline:3px solid rgba(255,255,255,.6);outline-offset:2px}
.avatar-grande{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--azul-900));color:#fff;display:grid;place-items:center;font-weight:800;font-size:30px;overflow:hidden;box-shadow:0 10px 24px rgba(11,42,74,.25)}
.avatar-grande img{width:100%;height:100%;object-fit:cover}
.perfil-foto{display:grid;justify-items:center;gap:12px}
.modal-perfil{max-width:520px}

.contatos{display:flex;flex-wrap:wrap;gap:8px}
.contato-link{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--azul-claro);color:var(--azul);font-weight:600;font-size:13px;text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.contato-link:hover{transform:translateY(-2px);background:var(--azul);color:#fff}
.contato-link .ico{width:16px;height:16px}
.contato-link[href^="https://wa.me"]{background:#E6F4EA;color:#1E7B3A}
.contato-link[href^="https://wa.me"]:hover{background:#1E7B3A;color:#fff}

.linha-em-viagem td{background:#E6F4EA}
.linha-em-viagem td:first-child{box-shadow:inset 4px 0 0 #1E7B3A}
.tag.disponivel{background:#EEF2F6;color:#5B6B7F}
.legenda{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--texto-suave);margin:-8px 0 14px}
.bolinha{width:12px;height:12px;border-radius:50%;background:#D5DEE8;display:inline-block}
.bolinha.verde{background:#1E7B3A}


@keyframes piscar{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes piscar-lento{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes anel{0%{box-shadow:0 0 0 0 rgba(30,123,58,.55)}70%{box-shadow:0 0 0 9px rgba(30,123,58,0)}100%{box-shadow:0 0 0 0 rgba(30,123,58,0)}}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entrar{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes fundo-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sino-balanca{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(0)}}
@keyframes pulso-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes brilho-card{0%,100%{box-shadow:0 0 0 0 rgba(30,123,58,0)}50%{box-shadow:0 0 0 6px rgba(30,123,58,.12)}}

.status-vivo{display:inline-flex;align-items:center;gap:7px;color:var(--verde);font-weight:800;letter-spacing:.5px}
.status-vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde);animation:piscar 1.2s infinite,anel 1.8s infinite}
.bolinha.verde{background:#1E7B3A;animation:anel 1.8s infinite,piscar 1.8s infinite}
.linha-em-viagem .tag.aprovado{animation:piscar-lento 2.4s infinite}
.linha-em-viagem td:first-child{animation:brilho-card 2.4s infinite}
.viagem-ativa{animation:brilho-card 2.4s infinite}
.tag.aguardando{animation:piscar-lento 3s infinite}
.sino-n:not([hidden]){animation:pulso-badge 1s 3}

.conteudo > *{animation:subir .5s both}

.cards > .card:nth-child(4){animation-delay:0.15s}

.tabela-wrap tbody tr:nth-child(3){animation-delay:0.08s}
.tabela-wrap tbody tr:nth-child(4){animation-delay:0.12s}
.tabela-wrap tbody tr:nth-child(5){animation-delay:0.16s}
.tabela-wrap tbody tr:nth-child(6){animation-delay:0.20s}

.tabela-wrap tbody tr:nth-child(8){animation-delay:0.28s}

.overlay > .modal{animation:modal-in .35s cubic-bezier(.34,1.56,.64,1) both}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:99;display:grid;gap:8px;width:max-content;max-width:92vw;pointer-events:none}
.toast{padding:14px 20px;border-radius:14px;color:#fff;font-weight:600;font-size:14px;background:var(--verde);box-shadow:0 12px 30px rgba(11,42,74,.25);animation:toastEntrar .35s cubic-bezier(.34,1.56,.64,1) both}
.toast.toast-erro{background:var(--vermelho)}
.toast.saindo{animation:toastSair .35s both}
@keyframes toastEntrar{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastSair{to{opacity:0;transform:translateY(10px)}}
.card-login{animation:subir .6s both}
.login-texto h1{animation:subir .7s .1s both}
.grade-graficos canvas{animation:fundo-in .8s both}


body{background:radial-gradient(1200px 600px at 110% -10%,rgba(21,101,192,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(211,47,47,.07),transparent 55%),var(--cinza)}
.topo{box-shadow:0 10px 30px rgba(11,42,74,.25)}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--vermelho),rgba(211,47,47,0) 70%)}
.card,.painel-bloco,.tabela-wrap{border:1px solid rgba(21,101,192,.08);box-shadow:0 18px 40px rgba(11,42,74,.08)}
.card{border-radius:22px}
.painel-bloco{border-radius:22px}
.cabecalho-pagina h1{font-size:30px;letter-spacing:-.6px}
.menu-lateral button.ativo{box-shadow:inset 3px 0 0 var(--vermelho)}
.card .valor{letter-spacing:-.4px}
.menu-mobile{overflow-x:auto;justify-content:flex-start;gap:4px}
.menu-mobile button{flex:0 0 auto;min-width:72px}

  .tabela-wrap thead{display:none}
  .tabela-wrap tr{background:var(--branco);border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow:0 12px 26px rgba(11,42,74,.08);border:1px solid var(--cinza-borda)}
  .tabela-wrap td{border:0;padding:5px 0;text-align:left}
  .tabela-wrap td[data-label]::before{content:attr(data-label);display:block;font-size:11px;letter-spacing:.5px;color:var(--texto-suave);font-weight:600;margin-bottom:2px}
  .tabela-wrap td[colspan]{padding:12px}
  .linha-acoes{margin-top:8px}
  .topo .logo-img-topo{height:36px}
}

.rotulo-tema{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.seletor-tema{display:flex;gap:10px}
.opcao-tema{flex:1;height:46px;border-radius:14px;border:1.5px solid #D5DEE8;background:#FFFFFF;color:var(--azul-900);font-weight:700;font-size:14px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .25s,background .25s}
.opcao-tema:hover{transform:translateY(-2px)}
.opcao-tema.ativo{border-color:var(--azul);background:var(--azul-claro);color:var(--azul);box-shadow:0 8px 18px rgba(21,101,192,.18)}

/* Tema escuro */
[data-tema="escuro"]{color-scheme:dark;--branco:#172339;--cinza:#0B1220;--cinza-borda:#24324A;--texto-suave:#9AA9BF;--azul-claro:#1E3354}
[data-tema="escuro"] body{color:#E6EEF9}
[data-tema="escuro"] input,[data-tema="escuro"] select,[data-tema="escuro"] textarea{background:#0F1A2D;color:#E6EEF9;border-color:#2C3E5C}
[data-tema="escuro"] th{background:#101C30}
[data-tema="escuro"] tbody tr:hover{background:#1A2A44}
[data-tema="escuro"] .btn-contorno{background:#1B2B44;color:#8FC1FF;border-color:#2F6FD6}
[data-tema="escuro"] .opcao-tema{background:#0F1A2D;border-color:#2C3E5C;color:#E6EEF9}
[data-tema="escuro"] .opcao-tema.ativo{background:#1E3354;color:#8FC1FF;border-color:#2F6FD6}
[data-tema="escuro"] .linha-em-viagem td{background:rgba(30,123,58,.22)}
[data-tema="escuro"] .card-login h2,[data-tema="escuro"] .cabecalho-pagina h1{color:#F2F6FC}
[data-tema="escuro"] .topo{box-shadow:0 10px 30px rgba(0,0,0,.5)}
[data-tema="escuro"] .menu-mobile{background:#172339;border-color:#24324A}
[data-tema="escuro"] .menu-mobile button{color:#9AA9BF}
[data-tema="escuro"] .menu-mobile button.ativo{color:#8FC1FF;background:#1E3354}

.aviso-aba{margin-left:auto;width:20px;height:20px;border-radius:50%;background:var(--vermelho);color:#fff;font-weight:900;font-size:13px;line-height:1;display:grid;place-items:center;flex-shrink:0;box-shadow:0 0 0 2px var(--azul-900),0 6px 14px rgba(211,47,47,.45);animation:pulso-badge 1s 3}
@media (max-width:820px){
  .menu-mobile button{position:relative}
  .menu-mobile .aviso-aba{position:absolute;top:2px;right:8px;width:16px;height:16px;font-size:11px;margin:0;box-shadow:0 0 0 2px var(--branco)}
}

.painel-avisos{position:fixed;top:72px;right:16px;width:300px;max-width:calc(100vw - 32px);background:var(--branco);border-radius:20px;box-shadow:0 24px 50px rgba(11,42,74,.25);padding:14px;z-index:90;animation:modal-in .3s cubic-bezier(.34,1.56,.64,1) both;border:1px solid var(--cinza-borda)}
.painel-avisos-topo{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;border-bottom:1px solid var(--cinza-borda);margin-bottom:6px}
.aviso-item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer;text-align:left;transition:background .2s,transform .2s}
.aviso-item:hover{background:var(--azul-claro);transform:translateX(3px)}
.aviso-contagem{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--vermelho);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}

/* Responsivo */
.menu-mobile{display:none}
@media (max-width:820px){
  #tela-login{grid-template-columns:1fr}
  .login-marca{padding:36px 24px;min-height:auto}
  .login-texto h1{font-size:34px}
  .login-stats{gap:20px}
  .corpo{flex-direction:column}
  .menu-lateral{display:none}
  .menu-mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--branco);border-top:1px solid var(--cinza-borda);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .menu-mobile button{background:transparent;border:0;color:var(--texto-suave);font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .menu-mobile button.ativo{color:var(--azul);background:var(--azul-claro)}
  .conteudo{padding:20px 16px 110px}
  .grade-form{grid-template-columns:1fr}
  .usuario-badge .nome{display:none}
  .topo{padding:14px 16px}
}

/* ===== v27: situação "Em rota" + animações de situação em todas as abas ===== */
@keyframes tag-pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
@keyframes rodar-caminhao{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes estrada{from{background-position:0 0}to{background-position:24px 0}}
@keyframes disponivel-respira{0%,100%{box-shadow:0 0 0 0 rgba(91,107,127,0)}50%{box-shadow:0 0 0 4px rgba(91,107,127,.14)}}
@keyframes check-desenha{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes linha-flash{0%{background:rgba(30,123,58,.28)}100%{background:transparent}}

.tag{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both}
.tag.aguardando{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,piscar-lento 3s .5s infinite}
.tag.aprovado{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both}
.tag.rejeitado{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,tremer .5s .45s 1}
.tag.disponivel{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,disponivel-respira 3.2s .5s infinite}
.tag.em-rota{display:inline-flex;align-items:center;gap:7px;background:var(--verde-claro);color:var(--verde);position:relative;overflow:hidden;
  animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,anel 1.8s .5s infinite}
.tag.em-rota .ico{width:15px;height:15px;animation:rodar-caminhao .9s ease-in-out infinite}
.tag.em-rota::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:repeating-linear-gradient(90deg,var(--verde) 0 8px,transparent 8px 16px);opacity:.55;animation:estrada .8s linear infinite}
.linha-em-viagem .tag.aprovado,.linha-em-viagem .tag.em-rota{animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,anel 1.8s .5s infinite}
.linha-em-viagem td{animation:linha-flash 1.2s .1s both}
.linha-em-viagem td:first-child{animation:linha-flash 1.2s .1s both,brilho-card 2.4s 1.3s infinite}
.cards > .card .valor{animation:subir .6s .15s both}
.menu-lateral button,.menu-mobile button{transition:background .25s,color .25s,transform .25s,box-shadow .25s}
.menu-lateral button:hover{transform:translateX(4px)}
.menu-lateral button.ativo{animation:entrar .35s both}
.campo select option:disabled{color:#9AA9BF}
[data-tema="escuro"] .tag.em-rota{background:rgba(30,123,58,.28);color:#7BE0A0}
[data-tema="escuro"] .tag.disponivel{background:#22324D;color:#9AA9BF}

/* ===== v28: reservas, duplicidade, lote, conversa, comparativo e busca ===== */
@keyframes alerta-pisca{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,0)}50%{box-shadow:0 0 0 4px rgba(211,47,47,.18)}}
@keyframes barra-cresce{from{transform:scaleX(0)}to{transform:none}}
@keyframes destaque-busca{0%,100%{box-shadow:inset 0 0 0 0 rgba(21,101,192,0)}50%{box-shadow:inset 0 0 0 3px rgba(21,101,192,.55)}}
@keyframes descer{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tag.agendada{display:inline-flex;align-items:center;gap:6px;background:var(--azul-claro);color:var(--azul);animation:tag-pop .45s cubic-bezier(.34,1.56,.64,1) both,piscar-lento 3s .5s infinite}
.tag.agendada .ico{width:14px;height:14px}
.reserva{display:flex;align-items:center;gap:5px;color:var(--azul);margin-top:5px;font-weight:600;animation:entrar .4s both}
.reserva .ico{width:13px;height:13px;flex-shrink:0}
.chip-dup{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 9px;border-radius:999px;background:var(--vermelho-claro);color:var(--vermelho);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;animation:tag-pop .45s both,alerta-pisca 2s .5s infinite}
.chip-dup .ico{width:13px;height:13px}
.chip-chat{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--azul-claro);color:var(--azul);font-size:11px;font-weight:800;vertical-align:middle}
.chip-chat .ico{width:12px;height:12px}
.alerta-dup{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--vermelho-claro);color:var(--vermelho);animation:tremer .5s both}
.alerta-dup .ico{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.alerta-dup .mini{color:var(--azul-900)}
.alerta-dup a{color:var(--vermelho);font-weight:800}
.col-sel{width:40px;text-align:center}
.col-sel input,#sel-todos{width:18px;height:18px;accent-color:var(--azul);cursor:pointer}
.linha-sel td{background:var(--azul-claro)!important}
.barra-lote{position:sticky;top:84px;z-index:15;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--azul-claro);border:1px solid rgba(21,101,192,.25);box-shadow:0 10px 24px rgba(11,42,74,.12);animation:descer .3s both}
.lote-aviso{display:inline-flex;align-items:center;gap:6px;color:var(--vermelho);font-weight:700;font-size:13px}
.lote-aviso .ico{width:15px;height:15px}
.lote-botoes{display:flex;gap:8px}
.chat{display:grid;gap:8px;max-height:260px;overflow:auto;padding:4px 2px}
.bolha{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;word-break:break-word;animation:subir .3s both}
.bolha-topo{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:11px;opacity:.85;margin-bottom:3px}
.bolha.minha{justify-self:end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
.bolha.outra{justify-self:start;background:var(--cinza);border:1px solid var(--cinza-borda);border-bottom-left-radius:4px}
.chat-envio{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.chat-envio textarea{flex:1;border:1.5px solid #D5DEE8;border-radius:12px;padding:8px 12px;resize:none;background:#F9FBFD;color:var(--azul-900)}
.chat-envio textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(21,101,192,.15)}
.rota-topo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rota-topo h2{margin:0}
.cmp-celula{display:flex;flex-direction:column;gap:5px;min-width:150px}
.cmp-barra{position:relative;height:10px;border-radius:999px;background:var(--cinza-borda)}
.cmp-barra span{display:block;height:100%;border-radius:999px;background:var(--azul);transform-origin:left;animation:barra-cresce .8s both}
.cmp-barra.alerta span{background:var(--vermelho)}
.cmp-barra i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--azul-900);border-radius:2px}
.desvio{font-weight:800}
.desvio.alto{color:var(--vermelho)}
.desvio.baixo{color:var(--verde)}
.linha-desvio td{background:rgba(211,47,47,.06)}
.destaque-busca td{animation:destaque-busca 1s 3!important}
.busca-global{position:relative;flex:1;max-width:460px;margin:0 16px}
.busca-global input{width:100%;height:40px;border:1.5px solid rgba(255,255,255,.28);border-radius:12px;padding:0 40px 0 38px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;transition:background .25s,border-color .25s,box-shadow .25s}
.busca-global input::placeholder{color:rgba(255,255,255,.7)}
.busca-global input:focus{outline:none;background:rgba(255,255,255,.2);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.busca-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:grid;place-items:center;color:#fff;pointer-events:none}
.busca-ico .ico{width:18px;height:18px}
.busca-atalho{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 11px/1 'Inter',sans-serif;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 7px;pointer-events:none}
.busca-global input:focus ~ .busca-atalho{opacity:0}
.busca-res{position:absolute;left:0;right:0;top:calc(100% + 8px);min-width:340px;max-height:70vh;overflow:auto;background:var(--branco);color:var(--azul-900);border:1px solid var(--cinza-borda);border-radius:16px;box-shadow:0 24px 50px rgba(11,42,74,.3);padding:8px;animation:descer .2s both;z-index:95}
.busca-grupo{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--texto-suave)}
.busca-grupo span{background:var(--azul-claro);color:var(--azul);border-radius:999px;padding:1px 8px}
.busca-item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:inherit;padding:9px 10px;border-radius:12px;transition:background .15s,transform .15s}
.busca-item:hover,.busca-item.ativo{background:var(--azul-claro);transform:translateX(3px)}
.busca-item .ico{width:20px;height:20px;flex-shrink:0;color:var(--azul)}
.bi-txt{display:grid;min-width:0}
.bi-txt strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.busca-mais,.busca-vazio{padding:10px;font-size:13px;color:var(--texto-suave)}
@media (max-width:820px){
  .topo{flex-wrap:wrap}
  .busca-global{order:3;flex:1 0 100%;max-width:none;margin:8px 0 0}
  .busca-res{min-width:0}
  .barra-lote{top:118px}
}
[data-tema="escuro"] .busca-res{color:#E6EEF9}
[data-tema="escuro"] .bolha.outra{background:#101C30}
[data-tema="escuro"] .chat-envio textarea{background:#0F1A2D;color:#E6EEF9;border-color:#2C3E5C}
[data-tema="escuro"] .alerta-dup .mini{color:#E6EEF9}
[data-tema="escuro"] .linha-sel td{background:rgba(21,101,192,.28)!important}
[data-tema="escuro"] .linha-desvio td{background:rgba(211,47,47,.14)}

/* ===== Dúvidas (chat com opções clicáveis) ===== */
.dv-chat{display:grid;gap:12px;align-content:start;min-height:260px;max-height:50vh;overflow-y:auto;padding:6px 4px 10px;scroll-behavior:smooth}
.dv-linha{display:flex;gap:10px;align-items:flex-end;animation:subir .35s both}
.dv-linha.usuario{flex-direction:row-reverse}
.dv-av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--azul),var(--azul-900));color:#fff}
.dv-av .ico{width:18px;height:18px}
.dv-bolha{max-width:min(82%,640px);padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.55}
.dv-linha.bot .dv-bolha{background:var(--cinza);border:1px solid var(--cinza-borda);border-bottom-left-radius:4px}
.dv-linha.usuario .dv-bolha{background:var(--azul);color:#fff;border-bottom-right-radius:4px}
.dv-quem{display:block;font-size:11px;opacity:.75;margin-bottom:2px;font-weight:600}
.dv-digitando{display:inline-flex;gap:5px;padding:4px 2px}
.dv-digitando i{width:7px;height:7px;border-radius:50%;background:var(--texto-suave);opacity:.55;animation:dvPulso 1s infinite}
.dv-digitando i:nth-child(2){animation-delay:.15s}.dv-digitando i:nth-child(3){animation-delay:.3s}
@keyframes dvPulso{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}
.dv-opcoes{margin-top:14px;padding-top:14px;border-top:1px solid var(--cinza-borda)}
.dv-titulo-op{font-size:13px;font-weight:700;color:var(--texto-suave);margin:0 0 10px}
.dv-temas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dv-tema{border:1.5px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;transition:border-color .2s,background .2s}
.dv-tema.ativo{background:var(--azul-claro);border-color:var(--azul);color:var(--azul-700)}
.dv-lista{display:grid;gap:8px}
.dv-perg{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;width:100%;border:1.5px solid var(--cinza-borda);background:var(--branco);color:var(--azul-900);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;transition:border-color .2s,background .2s,transform .2s}
.dv-perg:hover{border-color:var(--azul);background:var(--azul-claro);transform:translateY(-1px)}
.dv-perg:disabled{opacity:.6;cursor:wait;transform:none}
.dv-perg .dv-vista{flex:0 0 auto;color:var(--verde);display:none}
.dv-perg.vista .dv-vista{display:inline-grid}
.dv-perg .dv-vista .ico{width:16px;height:16px}
.dv-rodape{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
[data-tema="escuro"] .dv-tema,[data-tema="escuro"] .dv-perg{color:#E6EEF9}
[data-tema="escuro"] .dv-tema.ativo{color:#8FC1FF}
[data-tema="escuro"] .dv-linha.bot .dv-bolha{background:#101C30}
[data-tema="escuro"] .dv-perg:hover{background:#1A2A44}
@media (max-width:820px){.dv-bolha{max-width:88%}.dv-chat{max-height:46vh}}
/* ===== Avatar do Assistente ROFE (animado) ===== */
.av-cv{display:block;width:100%;height:100%;border-radius:50%;background:#000A3A}
.ico-wrap.av{border-radius:50%;overflow:hidden;padding:0;background:linear-gradient(135deg,var(--azul),var(--azul-900));box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.menu-lateral button.ativo .ico-wrap.av{box-shadow:0 0 0 2px #fff}
.av-mini{display:block;width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 2px rgba(21,101,192,.4)}
.menu-mobile button.ativo .av-mini{box-shadow:0 0 0 2px var(--azul)}
.dv-av{flex:0 0 42px;width:42px;height:42px;overflow:hidden;padding:0;background:radial-gradient(circle at 50% 42%,#fff,#CFE0F6);box-shadow:0 0 0 2px var(--azul)}
.dv-av img{width:100%;height:100%;object-fit:cover;display:block}
.dv-assist{display:flex;align-items:center;gap:16px;padding:2px 4px 14px;margin-bottom:8px;border-bottom:1px solid var(--cinza-borda)}
.dv-assist-av{flex:0 0 auto;width:132px;height:132px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--azul),var(--azul-900));box-shadow:0 10px 28px rgba(11,42,74,.25)}
.dv-assist-av.falando{animation:dvAnel 1.3s ease-out infinite}
@keyframes dvAnel{0%{box-shadow:0 10px 28px rgba(11,42,74,.25),0 0 0 0 rgba(21,101,192,.5)}100%{box-shadow:0 10px 28px rgba(11,42,74,.25),0 0 0 18px rgba(21,101,192,0)}}
.dv-assist-txt{display:grid;gap:3px}
.dv-assist-txt strong{font-size:17px;color:var(--azul-900)}
.dv-assist-txt .mini{display:flex;align-items:center;gap:7px}
.dv-assist-txt .mini::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde);flex:0 0 auto}
[data-tema="escuro"] .dv-assist{border-color:#24324A}
[data-tema="escuro"] .dv-assist-txt strong{color:#E6EEF9}
@media (max-width:820px){.dv-assist-av{width:96px;height:96px}.dv-assist{gap:12px}}

/* ===== v32: conferência do cartão de combustível ===== */
.tag.cc-ok,.tag.cc-div,.tag.cc-falta,.tag.cc-base{animation:none}
.tag.cc-ok{background:var(--verde-claro);color:var(--verde)}
.tag.cc-div{background:#FFF1D6;color:#9A5B00}
.tag.cc-falta{background:var(--vermelho-claro);color:var(--vermelho)}
.tag.cc-base{background:#EEF2F6;color:var(--texto-suave)}
[data-tema="escuro"] .tag.cc-ok{background:rgba(30,123,58,.28);color:#7BE0A0}
[data-tema="escuro"] .tag.cc-div{background:rgba(255,170,40,.2);color:#FFC46B}
[data-tema="escuro"] .tag.cc-falta{background:rgba(211,47,47,.25);color:#FF9A9A}
[data-tema="escuro"] .tag.cc-base{background:#22324D;color:#9AA9BF}
.card .mini{margin-top:2px}

/* ===== v39/v40: banco em tempo real, fila offline e atualização ao vivo ===== */
.sync{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;cursor:default;transition:background .3s}
.sync i{width:8px;height:8px;border-radius:50%;background:#7BE0A0;flex-shrink:0}
.sync-ok i{animation:anel 2.4s infinite}
.sync-sync i{background:#FFC46B;animation:piscar .9s infinite}
.sync-off{background:rgba(211,47,47,.4)}
.sync-off i{background:#FFB3B3}
@media (max-width:820px){.sync{padding:0 11px;height:30px}.sync span{display:none}}
@keyframes novo-flash{0%,35%{background:rgba(21,101,192,.22)}100%{background:transparent}}
tr.pisca-novo td{animation:novo-flash 2.8s ease-out both!important}
.pisca-novo:not(tr){animation:novo-flash 2.8s ease-out both}
#conteudo.render-suave > *,#conteudo.render-suave .cards > .card,#conteudo.render-suave .card .valor,#conteudo.render-suave .tabela-wrap tbody tr,#conteudo.render-suave .grade-graficos canvas{animation:none}
.foto-carregando{height:120px;border-radius:12px;background:linear-gradient(90deg,var(--cinza) 0%,var(--cinza-borda) 50%,var(--cinza) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.fila-bloco{border-left:4px solid #E0A100}
.fila-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fila-topo h2{display:flex;align-items:center;gap:8px;margin:0}
.fila-topo h2 .ico{color:#E0A100}
.fila-item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--cinza-borda)}

/* ===== v42: SOU MOTORISTA, cadastros, viagem do motorista ===== */
.erro.erro-info{background:var(--azul-claro);color:var(--azul-700)}
.ou-sep{display:flex;align-items:center;gap:12px;color:var(--texto-suave);font-size:12.5px;font-weight:600;margin:18px 0 14px;text-transform:uppercase;letter-spacing:.06em}
.ou-sep::before,.ou-sep::after{content:"";flex:1;height:1px;background:var(--cinza-borda)}
#btn-sou-motorista{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;border:2px solid var(--azul);background:var(--azul-claro);color:var(--azul-700);font:700 15px 'Inter',sans-serif;letter-spacing:.04em;cursor:pointer;transition:.15s}
#btn-sou-motorista:hover{background:var(--azul);color:#fff}
#btn-sou-motorista svg{width:22px;height:22px}
#btn-sou-motorista>span{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.25}
#btn-sou-motorista strong{font-size:16px}#btn-sou-motorista small{font-weight:500;font-size:12.5px;letter-spacing:0;opacity:.85}
#btn-sou-motorista svg{width:28px;height:28px;flex:none}
.link-voltar{background:none;border:0;color:var(--azul);font:600 14px 'Inter',sans-serif;cursor:pointer;padding:0;margin:0 0 14px;display:inline-flex;align-items:center;gap:6px}
.link-voltar svg{width:16px;height:16px;transform:rotate(180deg)}
.card-login h2 svg{width:24px;height:24px;vertical-align:-3px;color:var(--azul)}
.abas-login{display:flex;gap:4px;background:var(--cinza);padding:4px;border-radius:12px;margin:14px 0 18px}
.abas-login button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font:600 14px 'Inter',sans-serif;color:var(--texto-suave);cursor:pointer}
.abas-login button.ativo{background:#fff;color:var(--azul-900);box-shadow:0 2px 6px rgba(11,42,74,.10)}
.cad-ok{text-align:center;padding:10px 0}
.cad-ok-ico{width:64px;height:64px;border-radius:50%;background:var(--verde-claro);color:var(--verde);display:grid;place-items:center;margin:0 auto 14px}
.cad-ok-ico svg{width:32px;height:32px}
.cad-pend{border:2px solid #F2C14E;background:#FFF8E6;border-radius:16px;padding:14px 16px;margin-bottom:16px}
.cad-pend h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.cad-item{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(0,0,0,.06)}
.cad-item:first-of-type{border-top:0}
.cad-info{min-width:200px;flex:1}.cad-info strong{display:block}
.cad-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cad-acoes select{padding:8px 10px;border-radius:10px;border:1px solid var(--cinza-borda);font:inherit;font-size:13.5px;max-width:260px}
.mot-jornada{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--azul-claro);color:var(--azul-900);font-size:14px;margin:10px 0}
.mot-jornada svg{width:20px;height:20px;flex:none}
.mot-jornada.jor-amarelo{background:#FFF4D6;color:#7A5300}
.mot-jornada.jor-vermelho{background:var(--vermelho-claro);color:var(--vermelho);animation:pulsaJor 1.6s ease-in-out infinite}
.mot-jornada.jor-verde{background:var(--verde-claro);color:var(--verde)}
@keyframes pulsaJor{50%{box-shadow:0 0 0 4px rgba(211,47,47,.18)}}
.mot-check-pend{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 12px;padding:11px 12px;border-radius:12px;background:#FFF4D6;color:#7A5300;border:2px dashed #E0A800;font:700 13.5px 'Inter',sans-serif;cursor:pointer;text-align:left}
.mot-check-pend .ico{width:18px;height:18px;flex:none}
.mot-btn-encerrar{width:100%;justify-content:center;margin-top:8px;background:transparent !important;color:#fff !important;border:1.5px solid rgba(255,255,255,.55) !important}
.mot-viagem.mot-pronta{background:linear-gradient(150deg,#0F3D22,#1E7B3A)}
.mot-alerta{display:flex;gap:10px;align-items:center;background:var(--vermelho-claro);color:var(--vermelho);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.mot-alerta svg{width:20px;height:20px;flex:none}
.mot-resumo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.mot-resumo>div{background:var(--branco);border:1px solid var(--cinza-borda);border-radius:16px;padding:14px 16px}
.mot-resumo h3{margin:0 0 8px;font-size:14px;color:var(--texto-suave);font-weight:600}
.mot-res-linha{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.mot-res-linha strong{font-variant-numeric:tabular-nums}
.mot-cam{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mot-cam strong{font-size:17px;letter-spacing:.04em}
.mot-emerg .mot-emerg-grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mot-emerg-grade a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;background:var(--vermelho-claro);color:var(--vermelho);text-decoration:none;font-size:12.5px;font-weight:600;text-align:center}
.mot-emerg-grade a strong{font-size:20px}
.ck-lista{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
.ck-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--cinza-borda);border-radius:12px;font-size:14px}
.ck-item.ck-prob{border-color:var(--vermelho);background:var(--vermelho-claro)}
.ck-opc{display:flex;gap:6px;flex:none}
.ck-opc button{border:1px solid var(--cinza-borda);background:#fff;border-radius:9px;padding:7px 12px;font:600 13px 'Inter',sans-serif;cursor:pointer;color:var(--texto-suave)}
.ck-opc button[data-v="ok"].sel{background:var(--verde);border-color:var(--verde);color:#fff}
.ck-opc button[data-v="prob"].sel{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.ck-resumo{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--verde-claro);color:var(--verde);font-size:13.5px}
.ck-resumo.ck-resumo-prob{background:#FFF4D6;color:#7A5300}
[data-tema="escuro"] .abas-login{background:#0F1A2C}[data-tema="escuro"] .abas-login button.ativo{background:#24324A;color:#E6EDF7}
[data-tema="escuro"] .mot-resumo>div,[data-tema="escuro"] .ck-opc button{background:#172339;border-color:#24324A;color:#E6EDF7}
[data-tema="escuro"] .ck-item{border-color:#24324A}
[data-tema="escuro"] .cad-pend{background:#2A2614;border-color:#7A5E14}
[data-tema="escuro"] .cad-acoes select{background:#172339;color:#E6EDF7;border-color:#24324A}
@media (max-width:640px){
  .mot-resumo{grid-template-columns:1fr}
  .mot-emerg .mot-emerg-grade{grid-template-columns:repeat(2,1fr)}
  .ck-item{flex-direction:column;align-items:stretch}.ck-opc button{flex:1;padding:10px}
}

/* ===== v42.2: botão Sair em vermelho + confirmação ===== */
#tela-app .topo .sair{background:var(--vermelho);border-color:var(--vermelho);color:#fff;box-shadow:0 4px 14px rgba(211,47,47,.35)}
#tela-app .topo .sair:hover{background:#B71C1C;border-color:#B71C1C}
.modal-sair{max-width:400px;text-align:center}
.modal-sair h2{margin:0 0 8px;font-size:20px}
.sair-ico{width:60px;height:60px;border-radius:50%;background:var(--vermelho-claro);color:var(--vermelho);display:grid;place-items:center;margin:0 auto 14px}
.sair-ico .ico,.sair-ico svg{width:28px;height:28px}
.sair-aviso{background:#FFF4D6;color:#7A5300;border-radius:12px;padding:10px 12px;font-size:14px}
.sair-botoes{display:flex;gap:10px;margin-top:18px}
.sair-botoes .btn{flex:1;justify-content:center;min-height:48px;font-size:15px}
.btn-sair-sim{background:var(--vermelho);color:#fff;border:0}
.btn-sair-sim:hover{background:#B71C1C}
@media (max-width:440px){#tela-app .topo .sair{height:40px;min-width:44px;border-radius:12px;justify-content:center}#tela-app .topo .sair .ico{width:19px;height:19px}}

/* ===== Féria (SOHA) ===== */
.mon-mapa-cab{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.mon-mapa-cab h2{margin:0}
.mon-mapa-cab a.btn,.feria-topo a.btn{text-decoration:none}
.btn-feria{background:var(--azul);color:#fff;border:0}
.btn-feria:hover{background:var(--azul-700)}
.feria-painel{position:fixed;inset:0;z-index:1200;background:rgba(6,18,36,.6);display:flex;padding:16px}
.feria-painel.oculto{display:none}
.feria-caixa{background:var(--branco);border-radius:18px;flex:1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35);max-width:1600px;margin:0 auto;width:100%}
.feria-topo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--cinza-borda)}
.feria-topo h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.feria-topo h2 .ico{width:22px;height:22px;color:var(--azul)}
.feria-corpo{position:relative;flex:1;background:var(--cinza)}
.feria-corpo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.feria-carregando{position:absolute;inset:0;display:grid;place-items:center;color:var(--texto-suave);font-weight:600;z-index:1;pointer-events:none}
.feria-dica{display:flex;gap:8px;align-items:center;padding:8px 16px;font-size:12.5px;color:var(--texto-suave);border-top:1px solid var(--cinza-borda)}
.feria-dica .ico{width:16px;height:16px;flex:none}
[data-tema="escuro"] .feria-caixa{background:#101B2E}
@media (max-width:640px){
  .feria-painel{padding:0}.feria-caixa{border-radius:0}
  .feria-topo .btn span{display:none}.feria-topo .btn{padding:8px 10px}
  .feria-topo [data-feria-fechar] span,.feria-topo [data-feria-fechar]{display:inline-flex}
}

/* ===== Dúvidas v42.3 ===== */
.dv-conta{font-size:12px;color:var(--texto-suave)}
.dv-publico{display:flex;gap:4px;background:var(--cinza);padding:4px;border-radius:12px;margin:4px 0 12px}
.dv-publico button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:10px;border-radius:9px;font:600 14px 'Inter',sans-serif;color:var(--texto-suave);cursor:pointer}
.dv-publico button .ico{width:18px;height:18px}
.dv-publico button.ativo{background:#fff;color:var(--azul-900);box-shadow:0 2px 6px rgba(11,42,74,.10)}
.dv-aviso-pub{background:#FFF4D6;color:#7A5300;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:10px}
.dv-perguntar{display:flex;gap:8px;margin-top:12px}
.dv-perguntar input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1.5px solid var(--cinza-borda);font:inherit;font-size:15px;background:var(--branco);color:inherit}
.dv-perguntar input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(21,101,192,.15)}
.dv-perguntar .btn{border-radius:14px;padding:0 18px}
.dv-exemplos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.dv-exemplos button{border:1px dashed var(--cinza-borda);background:transparent;border-radius:999px;padding:5px 11px;font:500 12.5px 'Inter',sans-serif;color:var(--texto-suave);cursor:pointer}
.dv-exemplos button:hover{border-color:var(--azul);color:var(--azul)}
.dv-exemplos button::before{content:"“"}.dv-exemplos button::after{content:"”"}
.dv-tema b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--cinza);font-size:11px;margin-left:4px}
.dv-tema.ativo b{background:var(--azul);color:#fff}
.dv-achei{font-weight:700;margin:0 0 6px;color:var(--azul-900)}
.dv-ir{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:0;background:var(--azul);color:#fff;border-radius:10px;padding:8px 12px;font:600 13px 'Inter',sans-serif;cursor:pointer}
.dv-ir .ico{width:15px;height:15px;transform:rotate(-90deg)}
.dv-rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.dv-rel .mini{width:100%}
.dv-rel button{border:1.5px solid var(--azul);background:var(--branco);color:var(--azul-700);border-radius:12px;padding:6px 10px;font:600 12.5px 'Inter',sans-serif;text-align:left;cursor:pointer}
.dv-rel button:hover{background:var(--azul-claro)}
.dv-util{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.dv-util button{border:1px solid var(--cinza-borda);background:var(--branco);border-radius:999px;width:34px;height:30px;cursor:pointer;font-size:15px}
.dv-util button.sel{border-color:var(--azul);background:var(--azul-claro)}
.dv-contato{margin-top:10px;display:grid;gap:6px}
.dv-esperando{visibility:hidden}
[data-tema="escuro"] .dv-publico{background:#0F1A2C}[data-tema="escuro"] .dv-publico button.ativo{background:#24324A;color:#E6EDF7}
[data-tema="escuro"] .dv-rel button,[data-tema="escuro"] .dv-util button,[data-tema="escuro"] .dv-perguntar input{background:#172339;border-color:#24324A;color:#E6EDF7}
[data-tema="escuro"] .dv-achei{color:#8FC1FF}
@media (max-width:640px){
  .dv-assist-av{width:96px;height:96px}

  .dv-publico button{font-size:13px;padding:9px 6px}
}

/* ===== comprovantes obrigatórios (foto ou PDF) ===== */
.obrig{color:var(--vermelho);font-weight:700;font-size:12px;margin-left:4px}
.anexo-regra{margin:8px 0 4px}
#area-fotos.anexo-faltando{outline:2px dashed var(--vermelho);outline-offset:6px;border-radius:12px;animation:pisca-anexo 1s ease 2}
#area-fotos.anexo-faltando .anexo-vazio,#area-fotos.anexo-faltando .anexo-regra{color:var(--vermelho);font-weight:600}
@keyframes pisca-anexo{50%{outline-color:transparent}}
.pdf-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:12px 8px;min-height:120px;border-radius:12px;background:var(--vermelho-claro);color:var(--vermelho);border:1px solid rgba(211,47,47,.25);font:inherit;width:100%}
.pdf-tile .ico{width:30px;height:30px}
.pdf-tile strong{font-size:15px}

/* ===== Olho em qualquer campo de senha/PIN (mostrar e ocultar) ===== */
const OLHO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OLHO_CORTADO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a18.7 18.7 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>';
function ligarOlhos(raiz){
  (raiz || document).querySelectorAll('input[type="password"]:not([data-olho])').forEach(inp => {
    inp.dataset.olho = '1';
    let caixa = inp.parentElement;
    if(!caixa.classList.contains('campo-senha')){
      caixa = document.createElement('div');
      caixa.className = 'campo-senha';
      inp.parentElement.insertBefore(caixa, inp);
      caixa.appendChild(inp);
    }
    if(caixa.querySelector('.btn-olho')) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn-olho'; b.innerHTML = OLHO_SVG;
    b.setAttribute('aria-label', 'Mostrar senha'); b.title = 'Mostrar senha';
    b.addEventListener('click', () => {
      const mostrar = inp.type === 'password';
      inp.type = mostrar ? 'text' : 'password';
      b.innerHTML = mostrar ? OLHO_CORTADO_SVG : OLHO_SVG;
      const r = mostrar ? 'Ocultar' : 'Mostrar senha';
      b.setAttribute('aria-label', r); b.title = r;
      inp.focus();
    });
    caixa.appendChild(b);
  });
}
new MutationObserver(() => ligarOlhos()).observe(document.body, { childList: true, subtree: true });

function forcaSenha(s){
  let p = 0;
  if(s.length >= 8) p++; if(s.length >= 12) p++;
  if(/[a-z]/.test(s) && /[A-Z]/.test(s)) p++;
  if(/\d/.test(s)) p++; if(/[^A-Za-z0-9]/.test(s)) p++;
  return Math.min(4, p);
}

function mesclarMotoristas(docs){
  cadastrosPendentes = docs.filter(d => d.cadastroStatus === 'pendente').sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  docs.filter(d => !['pendente', 'recusado', 'substituido'].includes(d.cadastroStatus)).forEach(d => {
    let u = USUARIOS.find(x => (d.idApp && x.id === d.idApp) || x.uid === d.uid);
    if(!u){
      u = { id: d.idApp || d.uid, usuario: d.login || d.nome, perfil: d.perfil || 'motorista', nome: d.nome, ativo: true };
      USUARIOS.push(u);
    }
    u.uid = d.uid;
    if(d.perfil) u.perfil = d.perfil;
    u.nome = d.nome || u.nome;
    u.ativo = d.ativo !== false;
    ['telefone','email','foto','tema','cadastroFeito','cargo','setor','empresa','categoria','cnhCategoria','cnhValidade','baseCidade','emergenciaNome','emergenciaTelefone','loginTelefone','cadastroStatus','origem','criadoEm'].forEach(k => { if(d[k] !== undefined && d[k] !== '') u[k] = d[k]; });
  });
}
window.rofeAbrirSessao = async function(uid, email, perfilDoc){
  if(usuarioAtual && usuarioAtual.uid === uid) return;
  /* liga o usuário do Firebase ao cadastro em memória (campo idApp) enquanto os dados não migram para o Firestore */
  let u = USUARIOS.find(x => x.id === perfilDoc.idApp);
  if(!u){
    u = { id: perfilDoc.idApp || uid, usuario: email, perfil: perfilDoc.perfil, nome: perfilDoc.nome || email, ativo: true };
    USUARIOS.push(u);
  }
  u.uid = uid;
  if(window.RofeAuth && window.RofeAuth.ehLoginTelefone(email)){ u.usuario = perfilDoc.telefone || u.usuario; u.loginPorTelefone = true; }
  else u.email = u.email || email;
  if(perfilDoc.nome) u.nome = perfilDoc.nome;   /* nome do cadastro no Firestore vale mais que o padrão do código */
  if(perfilDoc.perfil) u.perfil = perfilDoc.perfil;
  /* campos de perfil salvos no Firestore */
  ['telefone','email','foto','tema','cadastroFeito','cargo','setor','empresa','categoria','cnhCategoria','cnhValidade','baseCidade','emergenciaNome','emergenciaTelefone','loginTelefone','cadastroStatus','origem','criadoEm'].forEach(k => { if(perfilDoc[k] !== undefined && perfilDoc[k] !== '') u[k] = perfilDoc[k]; });
  usuarioAtual = u;
  iniciarSincronizacao();
  entrar();
};

  const fechar = () => { ov.remove(); document.removeEventListener('keydown', tecla); };
